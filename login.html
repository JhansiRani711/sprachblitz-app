<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprachblitz - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
            padding: 40px;
        }
        h1 { color: #333; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        input:focus { outline: none; border-color: #667eea; }
        button { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-bottom: 10px;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-google { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
        .btn-google:hover { background: #e8e8e8; }
        .btn-anon { background: #27ae60; color: white; }
        .btn-anon:hover { background: #229954; }
        .divider { text-align: center; color: #999; margin: 20px 0; }
        .error { color: #e74c3c; font-size: 12px; margin-top: 5px; }
        .toggle-link { text-align: center; margin-top: 20px; }
        .toggle-link a { color: #667eea; cursor: pointer; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇩🇪 Sprachblitz</h1>
        <p class="subtitle">Learn German A1 to B2</p>

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="emailLogin()">Sign In</button>
            <div id="emailError" class="error"></div>

            <div class="divider">OR</div>

            <button class="btn-google" onclick="googleLogin()">Sign In with Google</button>
            <button class="btn-anon" onclick="anonLogin()">Continue Anonymously (10 min trial)</button>

            <div class="toggle-link">
                New user? <a onclick="toggleForm()">Create Account</a>
            </div>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupForm" style="display:none;">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPass" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="emailSignup()">Create Account</button>
            <div id="signupError" class="error"></div>

            <div class="toggle-link">
                Already have account? <a onclick="toggleForm()">Sign In</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { 
            auth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInAnonymously, 
            signInWithPopup, 
            GoogleAuthProvider 
        } from './sb-auth.js';

        window.emailLogin = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'index.html';
            } catch (error) {
                document.getElementById('emailError').textContent = error.message;
            }
        }

        window.emailSignup = async () => {
            const email = document.getElementById('signupEmail').value;
            const pass = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('confirmPass').value;
            if (pass !== confirm) {
                document.getElementById('signupError').textContent = 'Passwords do not match!';
                return;
            }
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                window.location.href = 'index.html';
            } catch (error) {
                document.getElementById('signupError').textContent = error.message;
            }
        }

        window.googleLogin = async () => {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                window.location.href = 'index.html';
            } catch (error) {
                alert('Google sign-in failed: ' + error.message);
            }
        }

        window.anonLogin = async () => {
            try {
                await signInAnonymously(auth);
                window.location.href = 'index.html';
            } catch (error) {
                alert('Anonymous login failed: ' + error.message);
            }
        }

        window.toggleForm = () => {
            document.getElementById('loginForm').style.display = 
                document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
            document.getElementById('signupForm').style.display = 
                document.getElementById('signupForm').style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
