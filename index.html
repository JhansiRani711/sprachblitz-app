    let activeGrammarIndex = 0;

    // Pro-Level Sequential State Managers for Skills Matrix Array Layout Processing
    let skillsActiveSection = 'listening';
    let skillsItemIndexMap = { listening: 0, reading: 0, writing: 0, speaking: 0 };
    let skillsSelectedAnswerCache = null;
    let skillsEvaluationFeedbackFlag = null;

    // Mini-Games Core Playground State Models
    let activeGameMode = 'none';
    let matchGamePairs = [];
    let matchSelectedGermanIdx = null;
    let matchSelectedEnglishIdx = null;
    let matchSuccessCount = 0;
    let genderGameActiveItem = null;
    let genderGameFeedback = null;


    // Real-Time Testing Engine Operational State Models
    let selectedActiveExamIndex = 0;
    let activeExamRunningMode = false;
    let currentExamQuestionIndex = 0;
    let activeExamUserAnswersCollected = [];
    let processingExamEvaluationFeedbackMode = false;

    // Audio Execution Wrappers explicitly optimized for mobile user gesture loops
    function playDirectMobileVoice(txt) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let cleanText = txt.split('(')[0].split('-')[0].trim();
        let utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'de-DE';
        utterance.rate = 0.75;
        window.speechSynthesis.speak(utterance);
      }
    }


    function rewardXP(amt) {
      totalXPAmount += amt;
      localStorage.setItem('sb_total_xp', totalXPAmount);
      document.getElementById('xp-amount-val').innerText = totalXPAmount;
      updateRankTelemetry();
    }

    function updateRankTelemetry() {
      const display = document.getElementById('player-rank-display');
      if (totalXPAmount >= 500) display.innerText = "Lv.4 Imperial Language Architect";
      else if (totalXPAmount >= 250) display.innerText = "Lv.3 Master Competitor";
      else if (totalXPAmount >= 100) display.innerText = "Lv.2 Experienced Challenger";
      else display.innerText = "Lv.1 Arena Novice";
    }

    function switchTab(tabId) {
      activeTab = tabId;
      isVocabCardFlipped = false;
      activeGameMode = 'none';

      activeExamRunningMode = false;
      skillsSelectedAnswerCache = null;
      skillsEvaluationFeedbackFlag = null;
      renderActiveTabModule();
    }

    // --- GAME ENGINE PROCESSORS ---
    function initWordMatchGame() {
      activeGameMode = 'match';
      matchSuccessCount = 0;
      matchSelectedGermanIdx = null;
      matchSelectedEnglishIdx = null;
      const pool = [...a1VocabularyDatabase["Family & People"], ...a1VocabularyDatabase["Body Parts (Körperteile)"]];
      const shuffled = pool.sort(() => 0.5 - Math.random()).slice(0, 4);
      const germans = shuffled.map((x, i) => ({ text: x.german, id: i, matched: false }));
      const english = shuffled.map((x, i) => ({ text: x.english, id: i, matched: false }));
      matchGamePairs = { germans: germans.sort(() => 0.5 - Math.random()), english: english.sort(() => 0.5 - Math.random()) };
      renderActiveTabModule();
    }


    function handleMatchSelection(type, idx) {
      if (type === 'ger') {
        if (matchGamePairs.germans[idx].matched) return;
        matchSelectedGermanIdx = idx;
      } else {
        if (matchGamePairs.english[idx].matched) return;
        matchSelectedEnglishIdx = idx;
      }
      if (matchSelectedGermanIdx !== null && matchSelectedEnglishIdx !== null) {
        const gerItem = matchGamePairs.germans[matchSelectedGermanIdx];
        const engItem = matchGamePairs.english[matchSelectedEnglishIdx];
        if (gerItem.id === engItem.id) {
          gerItem.matched = true;
          engItem.matched = true;
          matchSuccessCount++;
          rewardXP(5);
        }
        matchSelectedGermanIdx = null;
        matchSelectedEnglishIdx = null;

      }
      renderActiveTabModule();
    }

    function initGenderBlitzGame() {
      activeGameMode = 'gender';
      genderGameFeedback = null;
      const pool = [...a1VocabularyDatabase["Family & People"], ...a1VocabularyDatabase["Body Parts (Körperteile)"]].filter(x => ['masculine', 'feminine', 'neuter'].includes(x.gender));
      genderGameActiveItem = pool[Math.floor(Math.random() * pool.length)];
      renderActiveTabModule();
    }

    function submitGenderStrikeAnswer(chosenGender) {
      if (genderGameFeedback !== null) return;
      genderGameFeedback = (genderGameActiveItem.gender === chosenGender) ? 'correct' : 'wrong';
      if (genderGameFeedback === 'correct') rewardXP(5);
      renderActiveTabModule();
    }


    // --- MAIN VIEW CENTER DISPATCHER ---
    function renderActiveTabModule() {
      const container = document.getElementById('main-scroll-view');
      const tabs = ['dashboard', 'vocabulary', 'grammar', 'skills', 'exams'];
      
      // Sync footer highlights
      tabs.forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        if (el) el.className = `flex-1 flex flex-col items-center justify-center transition-colors ${t === activeTab ? 'text-indigo-400' : 'text-slate-500'}`;
      });

      if (activeTab === 'dashboard') {
        if (activeGameMode === 'match') {
          let leftColHTML = '', rightColHTML = '';
          matchGamePairs.germans.forEach((g, i) => {
            let activeStyle = g.matched ? 'bg-emerald-950/40 border-emerald-500 text-emerald-400 opacity-60' : (matchSelectedGermanIdx === i ? 'border-indigo-500 bg-indigo-950/40 text-indigo-300' : 'bg-slate-800 border-slate-700');
            leftColHTML += `<button onclick="handleMatchSelection('ger', ${i})" class="w-full p-3 border rounded-xl font-bold text-xs text-center ${activeStyle}">${g.text}</button>`;
          });
          matchGamePairs.english.forEach((e, i) => {

            let activeStyle = e.matched ? 'bg-emerald-950/40 border-emerald-500 text-emerald-400 opacity-60' : (matchSelectedEnglishIdx === i ? 'border-indigo-500 bg-indigo-950/40 text-indigo-300' : 'bg-slate-800 border-slate-700');
            rightColHTML += `<button onclick="handleMatchSelection('eng', ${i})" class="w-full p-3 border rounded-xl font-bold text-xs text-center ${activeStyle}">${e.text}</button>`;
          });
          container.innerHTML = `
            <div class="space-y-4">
              <div class="flex justify-between items-center"><h3 class="text-xs font-black uppercase text-indigo-400 tracking-wider">Match Matrix</h3><button onclick="activeGameMode='none'; renderActiveTabModule();" class="text-[10px] bg-slate-800 px-2 py-1 rounded border border-slate-700">✕ Exit</button></div>
              <div class="grid grid-cols-2 gap-3 pt-2"><div class="space-y-2">${leftColHTML}</div><div class="space-y-2">${rightColHTML}</div></div>
              ${matchSuccessCount === 4 ? `<div class="p-3 bg-slate-950 border border-emerald-800 rounded-xl text-center text-xs font-bold text-emerald-400">🎉 Matrix Cleared! Match success registered.</div>` : ''}
            </div>`;
          return;
        }

        if (activeGameMode === 'gender') {
          let cleanNoun = genderGameActiveItem.german.replace(/^(der|die|das)\s+/i, '');
          container.innerHTML = `
            <div class="space-y-4">
              <div class="flex justify-between items-center"><h3 class="text-xs font-black uppercase text-indigo-400 tracking-wider">Gender Striker</h3><button onclick="activeGameMode='none'; renderActiveTabModule();" class="text-[10px] bg-slate-800 px-2 py-1 rounded border border-slate-700">✕ Exit</button></div>
              <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl text-center"><span class="text-2xl font-black text-amber-400">${cleanNoun}</span></div>
              <div class="grid grid-cols-3 gap-2">

                <button onclick="submitGenderStrikeAnswer('masculine')" class="p-3 bg-blue-950/40 border border-blue-800 text-blue-400 font-bold text-xs rounded-xl">DER</button>
                <button onclick="submitGenderStrikeAnswer('feminine')" class="p-3 bg-pink-950/40 border border-pink-800 text-pink-400 font-bold text-xs rounded-xl">DIE</button>
                <button onclick="submitGenderStrikeAnswer('neuter')" class="p-3 bg-amber-950/40 border border-amber-800 text-amber-400 font-bold text-xs rounded-xl">DAS</button>
              </div>
              ${genderGameFeedback !== null ? `<div class="p-3 bg-slate-950 text-center text-xs rounded-xl border ${genderGameFeedback==='correct'?'border-emerald-800 text-emerald-400':'border-rose-800 text-rose-400'}">Full Form: ${genderGameActiveItem.german}</div>` : ''}
            </div>`;
          return;
        }

        container.innerHTML = `
          <div class="space-y-5">
            <div class="p-5 rounded-2xl bg-gradient-to-br from-indigo-600 to-fuchsia-600 text-white shadow-xl">
              <h2 class="text-lg font-extrabold">Welcome Leute ⚡</h2>
              <p class="text-xs text-indigo-100 mt-1 leading-relaxed">Master Goethe A1 full spectrum curricular frameworks using integrated mobile game layers cleanly.</p>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl space-y-3">
              <h3 class="text-xs font-black text-amber-400 uppercase tracking-wider">⚡ Vocabulary Memory Labs</h3>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="initWordMatchGame()" class="p-3 bg-slate-950 border border-indigo-900 rounded-xl text-left font-bold text-xs text-indigo-300">Word Match Matrix</button>

                <button onclick="initGenderBlitzGame()" class="p-3 bg-slate-950 border border-fuchsia-900 rounded-xl text-left font-bold text-xs text-fuchsia-300">Gender Striker</button>
              </div>
            </div>
          </div>`;
      }

      else if (activeTab === 'vocabulary') {
        const categories = Object.keys(a1VocabularyDatabase);
        const activeList = a1VocabularyDatabase[selectedVocabCategory];
        const card = activeList[activeVocabCardIndex];
        container.innerHTML = `
          <div class="space-y-4">
            <select onchange="selectedVocabCategory=this.value; activeVocabCardIndex=0; isVocabCardFlipped=false; renderActiveTabModule();" class="w-full bg-slate-950 border border-slate-800 p-2.5 text-xs font-bold rounded-xl text-slate-200 outline-none">
              ${categories.map(cat => `<option value="${cat}" ${cat===selectedVocabCategory?'selected':''}>${cat}</option>`).join('')}
            </select>
            <div class="flashcard-wrapper w-full h-48 cursor-pointer ${isVocabCardFlipped?'flipped':''}" onclick="this.classList.toggle('flipped'); isVocabCardFlipped=!isVocabCardFlipped;">
              <div class="flashcard-inner">
                <div class="flashcard-front bg-slate-800 border border-slate-700 text-slate-100 shadow-xl">
                  <span class="text-[9px] uppercase tracking-widest font-black text-indigo-400">${card.gender}</span>

                  <span class="text-xl font-black block my-auto">${card.german}</span>
                  <button onclick="event.stopPropagation(); playDirectMobileVoice(\`${card.german}\`);" class="mx-auto px-3 py-1.5 bg-indigo-600 text-white font-extrabold text-[10px] rounded-lg">🔊 Listen Audio</button>
                </div>
                <div class="flashcard-back bg-indigo-950 border border-indigo-800 text-indigo-200 shadow-xl">
                  <span class="text-[9px] uppercase font-black tracking-wider text-indigo-300">English Meaning</span>
                  <span class="text-lg font-extrabold block my-auto">${card.english}</span>
                  <span class="text-[10px] text-slate-400 italic">${card.hint}</span>
                </div>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="activeVocabCardIndex=(activeVocabCardIndex===0)?${activeList.length-1}:activeVocabCardIndex-1; isVocabCardFlipped=false; renderActiveTabModule();" class="p-2 bg-slate-800 text-xs font-bold rounded-xl">← Prev</button>
              <button onclick="activeVocabCardIndex=(activeVocabCardIndex===${activeList.length-1})?0:activeVocabCardIndex+1; isVocabCardFlipped=false; renderActiveTabModule();" class="p-2 bg-slate-800 text-xs font-bold rounded-xl">Next →</button>
            </div>
          </div>`;
      }

      else if (activeTab === 'grammar') {
        container.innerHTML = `

          <div class="space-y-2">
            ${a1GrammarDatabase.map((item, idx) => `
              <div class="border border-slate-800 rounded-xl overflow-hidden bg-slate-950/40">
                <button onclick="activeGrammarIndex=${idx}; renderActiveTabModule();" class="w-full text-left p-3.5 text-xs font-black flex justify-between items-center bg-slate-950 text-slate-200">
                  <span>${item.title}</span><span>${idx===activeGrammarIndex?'▼':'▶'}</span>
                </button>
                ${idx===activeGrammarIndex?`<div class="p-4 space-y-2 bg-slate-900/40"><p class="text-xs text-slate-300">${item.rules}</p><div class="p-2 bg-slate-950 text-emerald-400 font-mono text-xs rounded-lg">${item.example}</div></div>`:''}
              </div>
            `).join('')}
          </div>`;
      }

      else if (activeTab === 'skills') {
        const currentItemIndex = skillsItemIndexMap[skillsActiveSection];
        const dataset = a1SkillsDatabase[skillsActiveSection];
        const activeItem = dataset[currentItemIndex];
        
        let dynamicSectionContentHTML = '';
        if (skillsActiveSection === 'listening') {

          dynamicSectionContentHTML = `
            <div class="space-y-3">
              <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 flex flex-col items-center gap-2">
                <span class="text-[10px] uppercase font-black tracking-wider text-slate-400">Audio System Stream</span>
                <button onclick="playDirectMobileVoice(\`${activeItem.transcript}\`)" class="px-4 py-2 bg-emerald-600 font-black text-xs text-white rounded-xl shadow-lg flex items-center gap-1">🔊 Play Dialogue Announcement</button>
              </div>
              <p class="text-xs font-bold py-1">${activeItem.question}</p>
              <div class="space-y-2">
                ${activeItem.options.map((o, oIdx) => `
                  <button onclick="submitSkillChoice(${oIdx}, ${activeItem.correct})" class="w-full text-left p-3 border text-xs font-bold rounded-xl ${skillsSelectedAnswerCache===oIdx?'border-indigo-500 bg-indigo-950/40':'border-slate-700 bg-slate-900'}" ${skillsEvaluationFeedbackFlag!==null?'disabled':''}>${o}</button>
                `).join('')}
              </div>
            </div>`;
        } else if (skillsActiveSection === 'reading') {
          dynamicSectionContentHTML = `
            <div class="space-y-3">
              <div class="p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-mono leading-relaxed text-slate-300 italic">${activeItem.body}</div>
              <p class="text-xs font-bold py-1">${activeItem.question}</p>
              <div class="space-y-2">

                ${activeItem.options.map((o, oIdx) => `
                  <button onclick="submitSkillChoice(${oIdx}, ${activeItem.correct})" class="w-full text-left p-3 border text-xs font-bold rounded-xl ${skillsSelectedAnswerCache===oIdx?'border-indigo-500 bg-indigo-950/40':'border-slate-700 bg-slate-900'}" ${skillsEvaluationFeedbackFlag!==null?'disabled':''}>${o}</button>
                `).join('')}
              </div>
            </div>`;
        } else if (skillsActiveSection === 'writing') {
          dynamicSectionContentHTML = `
            <div class="space-y-3">
              <div class="p-3 bg-slate-950 border border-slate-800 font-mono text-xs text-center rounded-xl text-indigo-300">${activeItem.text}</div>
              <div class="grid grid-cols-2 gap-2">
                ${activeItem.options.map((o, oIdx) => `
                  <button onclick="submitSkillChoice(${oIdx}, ${activeItem.correct})" class="p-2.5 border text-xs font-mono font-bold text-center rounded-xl ${skillsSelectedAnswerCache===oIdx?'border-indigo-500 bg-indigo-950/40':'border-slate-700 bg-slate-900'}" ${skillsEvaluationFeedbackFlag!==null?'disabled':''}>[ ${o} ]</button>
                `).join('')}
              </div>
            </div>`;
        } else if (skillsActiveSection === 'speaking') {
          dynamicSectionContentHTML = `
            <div class="space-y-4 text-center py-2">
              <p class="text-base font-black text-indigo-300">"${activeItem.speechText}"</p>

              <div class="p-2.5 bg-slate-950 text-left border border-slate-800 rounded-lg">
                <span class="text-[9px] uppercase font-black block text-slate-500 tracking-wider">Phonetic Calibrator Guide Map</span>
                <p class="text-xs text-amber-400 font-mono font-bold mt-0.5">${activeItem.guide}</p>
              </div>
              <div class="flex gap-2">
                <button onclick="playDirectMobileVoice(\`${activeItem.speechText}\`)" class="flex-1 p-2.5 bg-slate-800 text-xs font-bold border border-slate-700 rounded-xl">🔊 Listen Guide Voice</button>
                <button onclick="submitSpeakingPass()" class="flex-1 p-2.5 bg-indigo-600 font-black text-xs text-white rounded-xl shadow-md" ${skillsEvaluationFeedbackFlag!==null?'disabled':''}>🎤 I Spated Aloud</button>
              </div>
            </div>`;
        }

        container.innerHTML = `
          <div class="space-y-4">
            <div class="grid grid-cols-4 gap-1">
              ${['listening', 'reading', 'writing', 'speaking'].map(sec => `
                <button onclick="skillsActiveSection='${sec}'; skillsSelectedAnswerCache=null; skillsEvaluationFeedbackFlag=null; renderActiveTabModule();" class="py-2 rounded-xl text-[10px] font-black uppercase tracking-tight border text-center ${skillsActiveSection===sec?'bg-indigo-600 border-indigo-500 text-white':'bg-slate-800 border-slate-700 text-slate-400'}">${sec}</button>
              `).join('')}
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl space-y-3">

              <div class="flex justify-between items-center text-[10px] font-mono text-slate-400">
                <span>ITEM ${currentItemIndex + 1} OF ${dataset.length}</span>
                <span class="text-indigo-400 font-bold uppercase">${skillsActiveSection} Arena Matrix</span>
              </div>
              ${dynamicSectionContentHTML}
              ${skillsEvaluationFeedbackFlag !== null ? `
                <div class="p-2.5 text-xs font-bold rounded-xl text-center bg-slate-950 ${skillsEvaluationFeedbackFlag==='pass'?'text-emerald-400 border border-emerald-950':'text-rose-400 border border-rose-950'}">
                  ${skillsEvaluationFeedbackFlag==='pass'?'✓ Correct Match registered! (+15 XP)':'✗ Mismatched selection. Read matrix parameters again.'}
                </div>
                <button onclick="advanceSkillItemStep(${dataset.length})" class="w-full p-2.5 bg-slate-950 border border-slate-700 text-xs font-bold rounded-xl">Advance Assessment Pipeline →</button>
              ` : ''}
            </div>
          </div>`;
      }

      else if (activeTab === 'exams') {
        if (!activeExamRunningMode) {
          container.innerHTML = `
            <div class="space-y-3">

              ${mockExamsDatabase.map((ex, idx) => `
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex flex-col justify-between space-y-3">
                  <div>
                    <h4 class="text-xs font-black text-white">${ex.title}</h4>
                    <p class="text-[10px] text-slate-400 mt-0.5">CEFR Pro Assessment Block Framework • ${ex.questions.length} Sequential Items</p>
                  </div>
                  <button onclick="startMockExamSuite(${idx})" class="w-full py-2 bg-slate-950 border border-indigo-900 text-indigo-400 font-extrabold text-[11px] rounded-lg">Launch Simulation Module</button>
                </div>
              `).join('')}
            </div>`;
        } else {
          const exam = mockExamsDatabase[selectedActiveExamIndex];
          if (currentExamQuestionIndex >= exam.questions.length) {
            let hits = 0;
            exam.questions.forEach((q, i) => { if(activeExamUserAnswersCollected[i] === q.c) hits++; });
            const passed = hits >= exam.passingScore;
            if (passed) setTimeout(() => { rewardXP(50); }, 50);
            container.innerHTML = `
              <div class="text-center p-6 bg-slate-950 border border-slate-800 rounded-2xl space-y-4">

                <span class="text-4xl block">${passed?'🏆':'⏳'}</span>
                <h3 class="text-sm font-black text-white">${passed?'Simulation Clearance Passed!':'Remediation Cycle Triggered'}</h3>
                <p class="text-xs text-slate-400">Score Telemetry Matrix Metrics Checked: <br><span class="text-sm font-black ${passed?'text-emerald-400':'text-rose-400'}">${hits} / ${exam.questions.length} Correct Answers</span></p>
                <button onclick="activeExamRunningMode=false; renderActiveTabModule();" class="w-full p-2.5 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-bold text-xs text-white rounded-xl">Return to Exam Selection Shell</button>
              </div>`;
            return;
          }
          const activeQuestion = exam.questions[currentExamQuestionIndex];
          container.innerHTML = `
            <div class="space-y-4">
              <div class="flex justify-between items-center text-[10px] font-mono text-slate-400">
                <span>ITEM ${currentExamQuestionIndex + 1} OF ${exam.questions.length}</span>
                <span class="text-rose-400 font-bold tracking-wider">LIVE ASSESS ROUTING</span>
              </div>
              <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl"><p class="text-xs font-bold leading-relaxed text-slate-200">${activeQuestion.q}</p></div>
              <div class="space-y-2">
                ${activeQuestion.o.map((opt, oIdx) => {
                  let optStyle = "bg-slate-800 border-slate-700 text-slate-300";
                  if (processingExamEvaluationFeedbackMode) {

                    if (oIdx === activeQuestion.c) optStyle = "bg-emerald-950 border-emerald-500 text-emerald-200 font-black";
                    else if (oIdx === activeExamUserAnswersCollected[currentExamQuestionIndex]) optStyle = "bg-rose-950 border-rose-500 text-rose-200";
                    else optStyle = "bg-slate-900 border-slate-800 opacity-40";
                  }
                  return `<button onclick="submitExamAnswer(${oIdx})" ${processingExamEvaluationFeedbackMode?'disabled':''} class="w-full text-left p-3 border text-xs font-bold rounded-xl transition-all ${optStyle}">${opt}</button>`;
                }).join('')}
              </div>
              ${processingExamEvaluationFeedbackMode ? `
                <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1.5">
                  <span class="text-[9px] uppercase font-black text-slate-500 block">Grammar Analytics Verification</span>
                  <p class="text-[11px] text-slate-300">${activeQuestion.exp}</p>
                  <button onclick="advanceExamQuestionPipeline()" class="w-full mt-1 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl">Next Assessment Step →</button>
                </div>` : ''}
            </div>`;
        }
      }
    }

    // --- PRO PIPELINE AUXILIARY INTERACTION CONTROLLERS ---

    function submitSkillChoice(idx, correctIdx) {
      if (skillsEvaluationFeedbackFlag !== null) return;
      skillsSelectedAnswerCache = idx;
      skillsEvaluationFeedbackFlag = (idx === correctIdx) ? 'pass' : 'fail';
      if (skillsEvaluationFeedbackFlag === 'pass') rewardXP(15);
      renderActiveTabModule();
    }
    function submitSpeakingPass() {
      if (skillsEvaluationFeedbackFlag !== null) return;
      skillsEvaluationFeedbackFlag = 'pass';
      rewardXP(15);
      renderActiveTabModule();
    }
    function advanceSkillItemStep(totalLength) {
      let currentIdx = skillsItemIndexMap[skillsActiveSection];
      skillsItemIndexMap[skillsActiveSection] = (currentIdx === totalLength - 1) ? 0 : currentIdx + 1;
      skillsSelectedAnswerCache = null;
      skillsEvaluationFeedbackFlag = null;
      renderActiveTabModule();

    }
    function startMockExamSuite(idx) {
      selectedActiveExamIndex = idx;
      activeExamRunningMode = true;
      currentExamQuestionIndex = 0;
      activeExamUserAnswersCollected = [];
      processingExamEvaluationFeedbackMode = false;
      renderActiveTabModule();
    }
    function submitExamAnswer(ansIdx) {
      if (processingExamEvaluationFeedbackMode) return;
      activeExamUserAnswersCollected[currentExamQuestionIndex] = ansIdx;
      processingExamEvaluationFeedbackMode = true;
      renderActiveTabModule();
    }
    function advanceExamQuestionPipeline() {
      processingExamEvaluationFeedbackMode = false;
      currentExamQuestionIndex++;
      renderActiveTabModule();

    }
  </script>
</body>
</html>
