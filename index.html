    <!-- TIMER SCRIPT WITH BLOCKING -->
    <script type="module">
        import { auth, sbAuthReady } from './sb-auth.js';
        window.sbAuthReady = sbAuthReady;
        
        const TRIAL_DURATION = 10 * 60 * 1000; // 10 minutes
        let alertShown = false;
        let isExpired = false;
        
        function startTrialTimer() {
            const startTime = Date.now();
            const endTime = startTime + TRIAL_DURATION;
            
            localStorage.setItem('trialStartTime', startTime);
            localStorage.setItem('trialEndTime', endTime);
            
            updateTimer();
        }
        
        function updateTimer() {
            const endTime = parseInt(localStorage.getItem('trialEndTime')) || Date.now() + TRIAL_DURATION;
            const now = Date.now();
            const timeLeft = endTime - now;
            
            const minutes = Math.floor(timeLeft / 1000 / 60);
            const seconds = Math.floor((timeLeft / 1000) % 60);
            const timeDisplay = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                // TRIAL EXPIRED
                isExpired = true;
                showWarning('🔒 Trial EXPIRED! Login to continue →');
                blockApp(); // BLOCK THE APP
                
                // Show alert ONCE
                if (!alertShown) {
                    alert('⏱️ Your 10-minute trial has ended!\n\nPlease LOGIN to continue learning and save your progress.');
                    alertShown = true;
                }
                return;
            }
            
            // Show countdown
            if (timeLeft <= 5 * 60 * 1000) {
                showWarning(`⏱️ ${timeDisplay} left - Login to save! ⚠️`);
            } else {
                showWarning(`⏱️ Trial: ${timeDisplay}`);
            }
            
            setTimeout(updateTimer, 1000);
        }
        
        function blockApp() {
            // Create blocking overlay
            if (!document.getElementById('trialBlocker')) {
                const blocker = document.createElement('div');
                blocker.id = 'trialBlocker';
                blocker.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: rgba(0, 0, 0, 0.8);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 9998;
                `;
                
                blocker.innerHTML = `
                    <div style="
                        background: white;
                        padding: 30px;
                        border-radius: 10px;
                        text-align: center;
                        max-width: 400px;
                    ">
                        <h2 style="color: #333; margin-bottom: 15px;">⏱️ Trial Expired</h2>
                        <p style="color: #666; margin-bottom: 20px;">
                            Your 10-minute free trial
