    // Falling snow / petals / leaves, drawn as SVG so no images are needed
    function seasonParticles(sp) {
      if (typeof reduceMotion !== 'undefined' && reduceMotion) return '';
      if (sp.particle === 'none') return '';
      const n = sp.particle === 'snow' ? 16 : 10;
      let out = '';
      for (let i = 0; i < n; i++) {
        const x = 6 + (i * 37) % 388;
        const dur = (6 + (i % 5) * 1.6).toFixed(1);
        const delay = ((i * 0.7) % 6).toFixed(1);
        const r = sp.particle === 'snow' ? 2.2 : 3.2;
        const shape = sp.particle === 'snow'
          ? `<circle r="${r}" fill="#ffffff" opacity=".85"/>`
          : `<ellipse rx="${r}" ry="${r*0.6}" fill="${sp.leaf}" opacity=".85"/>`;
        out += `<g transform="translate(${x},-10)">${shape}
          <animateTransform attributeName="transform" type="translate" additive="sum"
            values="0,-10; ${(i%2?14:-14)},300" dur="${dur}s" begin="${delay}s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="rotate" additive="sum"
            values="0;360" dur="${dur}s" begin="${delay}s" repeatCount="indefinite"/>
        </g>`;
      }
      return `<g pointer-events="none">${out}</g>`;
    }

    // Bruno's spot in the room: {left%, bottom%, height%, pose}

    function brunoInRoom() {
      const t = timeOfDay();
      const learnedToday = dailyXP >= 20;
      // Bruno stands centre-stage on the rug. Only the night pose moves him
      // over to the bed, because that is where sleeping makes sense.
      if (t === 'night')   return { pose:'bear-sleep', x:700, y:250, h:92 };
      if (learnedToday)    return { pose:'bear-dance', x:404, y:268, h:132 };
      if (t === 'morning') return { pose:'bear-stand', x:412, y:262, h:138 };
      if (t === 'day')     return { pose:'bear-sit',   x:410, y:282, h:118 };
      return { pose:'bear-think', x:412, y:262, h:138 };
    }

      if (t === 'morning') return 'bear-wave';

              ${row('German audio', 'Bruno speaks words and sentences aloud', toggle(soundOn, 'setSoundOn(' + (!soundOn) + ')'))}
              ${row('Speaking speed', 'Slower is easier to copy',
                `<div class="flex items-center gap-2">
                   <input type="range" min="0.5" max="1.2" step="0.05" value="${speechRate}"
                          oninput="setSpeechRate(this.value)" class="w-28">
                   <span id="rate-label" class="text-[11px] font-black od-muted w-10 text-right">${speechRate.toFixed(2)}\u00d7</span>
                 </div>`)}
              ${row('Reduce motion', 'Turns off falling leaves, snow and drifting effects', toggle(reduceMotion, 'setReduceMotion(' + (!reduceMotion) + ')'))}
            </div>

            <div class="rounded-2xl px-4 divide-y divide-slate-800" style="background:#1e293b">
              ${row('Current level', 'Changes the scene and the lessons on the Path',
                `<div class="flex gap-1">${['A1','A2','B1','B2'].map(lv =>
                  `<button onclick="setLevel('${lv}'); closeSettings()" class="btn3d px-2.5 py-1.5 rounded-lg text-[11px] font-black text-white"
                     style="background:${activeLevel === lv ? '#4f46e5' : '#334155'}">${lv}</button>`).join('')}</div>`)}
              ${row('Theme', 'How the app looks',
                `<select onchange="applyThemeProfile(this.value); localStorage.setItem('sb_theme_profile', this.value)"
                         class="bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-[11px] font-bold text-white outline-none">
                   ${Object.keys(systemThemeProfiles).map(k =>
                     `<option value="${k}" ${k === currentThemeProfile ? 'selected' : ''}>${k.replace(/-/g, ' ')}</option>`).join('')}
                 </select>`)}
            </div>

            ${sbAccountBlockHTML()}

            <div class="rounded-2xl p-4 space-y-2" style="background:#1e293b">
              <p class="text-[10px] font-black uppercase tracking-wider od-muted">Your progress</p>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="exportProgress()" class="btn3d py-2.5 rounded-xl text-[11px] font-black text-white" style="background:#334155">Export to file</button>
                <label class="btn3d py-2.5 rounded-xl text-[11px] font-black text-white text-center cursor-pointer" style="background:#334155">
                  Import file
                  <input type="file" accept="application/json" onchange="importProgress(this)" class="hidden">
                </label>
              </div>
              <button onclick="resetProgress()" class="btn3d w-full py-2.5 rounded-xl text-[11px] font-black text-white" style="background:#7f1d1d">Delete all progress</button>
              <p class="text-[10px] font-bold od-dim">Sprachblitz ${APP_BUILD} \u00b7 ${totalXPAmount} XP \u00b7 ${daysLearned} ${daysLearned === 1 ? 'Tag' : 'Tage'} gelernt</p>
            </div>
          </div>
        </div>`;
    }

    // ===================== Profile, settings, Daily Blitz =====================
    // There is no server behind this app, so there is no account and no password.
    // "Profile" means a name and an avatar stored on this device only, and the
    // settings sheet is where a learner changes how the app behaves.
    let settingsOpen = false;
    let learnerName   = localStorage.getItem('sb_name') || '';
    let learnerAvatar = localStorage.getItem('sb_avatar') || '🐻';
    let soundOn       = localStorage.getItem('sb_sound') !== '0';
    let speechRate    = parseFloat(localStorage.getItem('sb_speech_rate')) || 0.85;
    let reduceMotion  = localStorage.getItem('sb_reduce_motion') === '1';

    const AVATAR_CHOICES = ['🐻','🦊','🦉','🐼','🐨','🦁','🐧','🐢'];

    function openSettings()  { settingsOpen = true;  renderActiveTabModule(); }
    function closeSettings() { settingsOpen = false; renderActiveTabModule(); }

    function saveLearnerName(v) {
      learnerName = String(v || '').slice(0, 24);
      localStorage.setItem('sb_name', learnerName);
      updateDashboardTelemetry();
    }
    function setAvatar(a) {
      learnerAvatar = a;
      localStorage.setItem('sb_avatar', a);
      const node = document.getElementById('header-avatar');
      if (node) node.innerText = a;
      renderActiveTabModule();
    }
    function setSoundOn(v) {
      soundOn = !!v;
      localStorage.setItem('sb_sound', soundOn ? '1' : '0');
      if (!soundOn && 'speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
      renderActiveTabModule();
    }
    function setSpeechRate(v) {
      speechRate = Math.min(1.2, Math.max(0.5, parseFloat(v) || 0.85));
      localStorage.setItem('sb_speech_rate', speechRate);
      const lab = document.getElementById('rate-label');
      if (lab) lab.innerText = speechRate.toFixed(2) + '\u00d7';
    }
    function setReduceMotion(v) {
      reduceMotion = !!v;
      localStorage.setItem('sb_reduce_motion', reduceMotion ? '1' : '0');
      renderActiveTabModule();
    }

    // Everything the app knows about this learner, as a file they can keep.
    function exportProgress() {
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf('sb_') === 0) data[k] = localStorage.getItem(k);
      }
      const payload = { app: 'Sprachblitz', build: APP_BUILD, exported: new Date().toISOString(), data };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sprachblitz-progress.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }

    function importProgress(input) {
      const file = input && input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed || !parsed.data) throw new Error('not a Sprachblitz file');
          Object.entries(parsed.data).forEach(([k, v]) => {
            if (k.indexOf('sb_') === 0) localStorage.setItem(k, v);
          });
          location.reload();
        } catch (e) {
          alert('That file could not be read as Sprachblitz progress.');
        }
      };
      reader.readAsText(file);
    }

    function resetProgress() {
      if (!confirm('Delete all progress on this device? This cannot be undone.')) return;
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf('sb_') === 0) keys.push(k);
      }
      keys.forEach(k => localStorage.removeItem(k));
      location.reload();
    }

    // ---- Daily Blitz: one obvious thing to do, five questions, once a day ----
    let blitzQuestions = [], blitzIndex = 0, blitzPicked = null, blitzCorrect = 0, blitzDone = false;
    let blitzCombo = 0, blitzBestCombo = 0, blitzSessionXP = 0, blitzEarned = [], blitzFeedbackClass = '';
    const BLITZ_LENGTH = 5;

    function blitzDoneToday() {
      return localStorage.getItem('sb_blitz_date') === new Date().toDateString();
    }
    function blitzStreak() {
      return parseInt(localStorage.getItem('sb_blitz_streak'), 10) || 0;
    }

    // Mixes vocabulary from the active level with grammar drills already unlocked,
    // so the Blitz always reviews what this learner has actually met.
    function buildBlitzQuestions() {
      const out = [];
      const dbForLevel = { A1: a1VocabularyDatabase, A2: a2VocabularyDatabase, B1: b1VocabularyDatabase, B2: b2VocabularyDatabase };
      const pool = Object.values(dbForLevel[activeLevel] || a1VocabularyDatabase).flat();
      shuffle(pool).slice(0, 3).forEach(w => {
        // Two words in a level can share an English gloss, which would put the
        // same option in the list twice - so distractors are deduplicated.
        const seen = new Set([w.english]);
        const wrong = [];
        shuffle(pool).forEach(x => {
          if (wrong.length >= 3 || seen.has(x.english)) return;
          seen.add(x.english); wrong.push(x);
        });
        const opts = shuffle([w.english].concat(wrong.map(x => x.english)));
        out.push({
          kind: 'vocab',
          prompt: cleanPrompt(w.german),
          speak: w.german,
          ask: 'What does this mean?',
          options: opts,
          correct: opts.indexOf(w.english),
          explain: w.hint || ''
        });
      });
      // One question is audio-only: nothing to read, you have to listen.
      const heard = shuffle(pool).find(w => w.german && w.german.length < 26);
      if (heard) {
        const seenG = new Set([heard.german]);
        const distract = [];
        shuffle(pool).forEach(x => {
          if (distract.length >= 3 || seenG.has(x.german)) return;
          seenG.add(x.german); distract.push(x);
        });
        const opts = shuffle([heard.german].concat(distract.map(x => x.german)));
        out.push({
          kind: 'listen', prompt: '\ud83c\udfa7', speak: heard.german,
          ask: 'Listen \u2014 which word is it?',
          options: opts, correct: opts.indexOf(heard.german),
          explain: heard.english ? heard.german + ' = ' + heard.english : ''
        });
      }

      const gids = curriculumUnits
        .filter(u => u.level === activeLevel)
        .flatMap(u => u.lessons.filter(l => l.type === 'grammar').map(l => l.gid))
        .filter(g => grammarExercises[g]);
      shuffle(gids).slice(0, BLITZ_LENGTH - out.length).forEach(g => {
        const q = grammarExercises[g][Math.floor(Math.random() * grammarExercises[g].length)];
        out.push({
          kind: 'grammar', prompt: q.prompt, speak: null, ask: q.ask,
          options: q.options, correct: q.correct, explain: q.explain
        });
      });
      return shuffle(out).slice(0, BLITZ_LENGTH);
    }

    function startDailyBlitz() {
      blitzQuestions = buildBlitzQuestions();
      if (!blitzQuestions.length) return;
      blitzIndex = 0; blitzPicked = null; blitzCorrect = 0; blitzDone = false;
      blitzCombo = 0; blitzBestCombo = 0; blitzSessionXP = 0; blitzEarned = []; blitzFeedbackClass = '';
      activeGameMode = 'blitz';
      renderActiveTabModule();
      speakBlitzPromptIfNeeded();
    }

    // Audio questions play themselves; written ones stay silent.
    function speakBlitzPromptIfNeeded() {
      const q = blitzQuestions[blitzIndex];
      if (q && q.kind === 'listen' && q.speak) setTimeout(() => speakGerman(q.speak, true), 260);
    }

    // Answering correctly in a row is worth more: 4 XP, rising to 8 on a run.
    function blitzXPFor(combo) { return Math.min(8, 4 + Math.max(0, combo - 1)); }

    function answerBlitz(i) {
      if (blitzPicked !== null) return;
      blitzPicked = i;
      const q = blitzQuestions[blitzIndex];
      if (i === q.correct) {
        blitzCorrect++;
        blitzCombo++;
        blitzBestCombo = Math.max(blitzBestCombo, blitzCombo);
        const gain = blitzXPFor(blitzCombo);
        blitzSessionXP += gain;
        blitzFeedbackClass = 'sb-pop';
        rewardXP(gain);
        if (q.kind === 'listen') {
          listeningHits++;
          localStorage.setItem('sb_listen_hits', listeningHits);
        }
        blitzEarned = blitzEarned.concat(checkAchievements({ combo: blitzCombo }));
      } else {
        blitzCombo = 0;
        blitzFeedbackClass = 'sb-shake';
        // Hearing the right answer matters more than reading it.
        if (q.speak) setTimeout(() => speakGerman(q.speak, true), 200);
      }
      renderActiveTabModule();
    }

    function nextBlitz() {
      if (blitzIndex < blitzQuestions.length - 1) {
        blitzIndex++; blitzPicked = null; blitzFeedbackClass = '';
        renderActiveTabModule();
        speakBlitzPromptIfNeeded();
        return;
      }
      blitzDone = true;
      const today = new Date().toDateString();
      if (localStorage.getItem('sb_blitz_date') !== today) {
        const yest = new Date(Date.now() - 864e5).toDateString();
        const run = localStorage.getItem('sb_blitz_date') === yest ? blitzStreak() + 1 : 1;
        localStorage.setItem('sb_blitz_streak', run);
        localStorage.setItem('sb_blitz_date', today);
        // Completion bonus grows with the run, capped so a long streak
        // stays a reward rather than a reason not to miss a day.
        const bonus = 10 + Math.min(run, 7) * 2;
        blitzSessionXP += bonus;
        rewardXP(bonus);
      }
      const perfect = blitzCorrect === blitzQuestions.length;
      blitzEarned = blitzEarned.concat(checkAchievements({
        blitzFinished: true, perfect: perfect, combo: blitzBestCombo
      }));
      renderActiveTabModule();
    }

    // ---- Achievements shelf, opened from the dashboard level bar ----
    let achievementsOpen = false;
    function openAchievements() { achievementsOpen = true; renderActiveTabModule(); }
    function closeAchievements() { achievementsOpen = false; renderActiveTabModule(); }

    function achievementsSheetHTML() {
      if (!achievementsOpen) return '';
      const rank = xpRank(totalXPAmount);
      return `
        <div onclick="closeAchievements()" style="position:fixed;inset:0;background:rgba(2,6,23,.72);z-index:9997"></div>
        <div class="sb-rise" style="position:fixed;left:0;right:0;bottom:0;z-index:9998;max-height:78vh;overflow-y:auto;
             background:#0f172a;border-top:1px solid #1e293b;border-radius:22px 22px 0 0;padding:18px">
          <div class="flex items-center justify-between mb-3">
            <div>
              <p class="text-sm font-black text-white">Level ${rank.level} \u00b7 <span translate="no" lang="de">${rank.title}</span></p>
              <p class="text-[11px] font-bold text-slate-400">${totalXPAmount} XP total${rank.next ? ' \u00b7 ' + (rank.next.at - totalXPAmount) + ' XP to ' + rank.next.title : ''}</p>
            </div>
            <button onclick="closeAchievements()" class="text-slate-500 text-xl font-black">\u2715</button>
          </div>
          <div class="h-2 rounded-full overflow-hidden mb-4" style="background:#1e293b">
            <div class="h-full rounded-full sb-bar" style="width:${rank.pct}%; background:linear-gradient(90deg,#4f46e5,#c026d3)"></div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            ${ACHIEVEMENTS.map(a => {
              const got = hasAchievement(a.id);
              return `<div class="rounded-xl p-3" style="background:${got ? '#1e1b4b' : '#0b1220'};border:1px solid ${got ? '#4338ca' : '#1e293b'};opacity:${got ? 1 : .55}">
                <p class="text-xl">${got ? a.icon : '\ud83d\udd12'}</p>
                <p class="text-[11px] font-black text-white mt-1">${a.label}</p>
                <p class="text-[10px] font-bold text-slate-400">${a.desc}</p>
              </div>`;
            }).join('')}
          </div>
        </div>`;
    }

    // ---- A1 -> A2 -> B1 -> B2: suggest the next level once this one is mostly done ----
    const LEVEL_ORDER = ['A1', 'A2', 'B1', 'B2'];
    function levelCompletion(lv) {
      const lessons = curriculumUnits.filter(u => u.level === lv).flatMap(u => u.lessons);
      if (!lessons.length) return 0;
      const done = lessons.filter(l => lessonProgress[l.id]).length;
      return done / lessons.length;
    }
    function nextLevelSuggestion() {
      const i = LEVEL_ORDER.indexOf(activeLevel);
      const next = LEVEL_ORDER[i + 1];
      if (!next) return null;
      const pct = levelCompletion(activeLevel);
      if (pct < 0.8) return null;
      if (localStorage.getItem('sb_level_prompt_' + next) === 'seen') return null;
      return { next: next, pct: Math.round(pct * 100) };
    }
    function acceptNextLevel(lv) {
      localStorage.setItem('sb_level_prompt_' + lv, 'seen');
      setLevel(lv);
      showToast('\ud83d\uddfa\ufe0f', lv + ' freigeschaltet', 'Ein neuer Ort wartet auf dich.');
    }
    function dismissNextLevel(lv) {
      localStorage.setItem('sb_level_prompt_' + lv, 'seen');
      renderActiveTabModule();
    }

    function journalUnlockedCount() {
      const learned = sceneObjects().filter(o => objProgress(o).frac === 1).length;
      return journalEntries.filter(e => e.need <= learned).length;
    }

    // Full grammatical picture for a vocabulary entry: article, indefinite
    // form, and a plain-language note on what kind of word it is.
    const genderInfo = {
      masculine: { def:'der', indef:'ein',  label:'masculine', colour:'#60a5fa' },
      feminine:  { def:'die', indef:'eine', label:'feminine',  colour:'#f472b6' },
      neuter:    { def:'das', indef:'ein',  label:'neuter',    colour:'#fbbf24' },
      plural:    { def:'die', indef:'\u2014', label:'plural',  colour:'#a78bfa' }
    };

    const kindNotes = {
      letter:'Letter of the alphabet', umlaut:'Umlaut sound', ligature:'Special letter',
      phonics:'Pronunciation rule', number:'Number', day:'Day of the week', month:'Month',
      season:'Season', daypart:'Part of the day', colour:'Colour (adjective)',
      hobby:'Activity', greeting:'Greeting phrase', departure:'Farewell phrase',
      query:'Question word', 'informal time':'Time phrase', dialogue:'Useful sentence',
      routine:'Everyday sentence', split:'Has a male and a female form',
      expression:'Expression'
    };

    function bareNoun(item) {
      return String(item.german).replace(/^(der|die|das)\s+/i, '').trim();
    }

    function wordGrammar(item) {
      const gi = genderInfo[item.gender];
      if (gi) {
        const noun = bareNoun(item);
        return {
          isNoun: true, colour: gi.colour, label: gi.label,
          definite: gi.def + ' ' + noun,
          indefinite: gi.indef === '\u2014' ? '\u2014' : gi.indef + ' ' + noun,
          note: item.gender === 'plural'
            ? 'Plural nouns take die and have no indefinite article.'
            : 'Nouns are always capitalised in German.'
        };
      }
      return { isNoun:false, colour:'#94a3b8', label:item.gender,
               note: kindNotes[item.gender] || 'Not a noun \u2014 no article needed.' };
    }

    // Compact card used by both the flashcard and the postcard
    // every German form inside the chips is marked so Chrome leaves it alone
    function grammarChips(item) {
      const g = wordGrammar(item);
      if (!g.isNoun) {
        return `<div class="mt-2 p-2.5 rounded-xl text-left" style="background:rgba(148,163,184,.12)">
          <p class="text-[9px] font-black uppercase tracking-wider" style="color:${g.colour}">${g.label}</p>
          <p class="text-[11px] font-bold text-slate-300 mt-0.5">${g.note}</p>
        </div>`;
      }
      return `<div class="mt-2 p-2.5 rounded-xl text-left space-y-1" style="background:rgba(148,163,184,.12)">
        <p class="text-[9px] font-black uppercase tracking-wider" style="color:${g.colour}">${g.label}</p>
        <div class="grid grid-cols-2 gap-1.5">
          <div>
            <p class="text-[9px] font-bold text-slate-500 uppercase">Definite</p>
            <p class="text-xs font-black text-slate-100" translate="no" lang="de">${g.definite}</p>
          </div>
          <div>
            <p class="text-[9px] font-bold text-slate-500 uppercase">Indefinite</p>
            <p class="text-xs font-black text-slate-100" translate="no" lang="de">${g.indefinite}</p>
          </div>
        </div>
        <p class="text-[10px] font-bold text-slate-400">${g.note}</p>
      </div>`;
    }

    function wordOfTheDay() {
      const all = [];
      Object.keys(allVocabularyDatabase).forEach(c => allVocabularyDatabase[c].forEach(i => all.push(i)));
      const day = Math.floor(Date.now() / 86400000);
      return all[day % all.length];
    }

    function toggleRoomObject(id) {
      if (showCoachmark) clearCoachmark();
      openRoomObject = (openRoomObject === id) ? null : id;
      renderActiveTabModule();
    }

    function objOpacity(obj) {
      const f = objProgress(obj).frac;
      return f === 0 ? 0.32 : (f < 1 ? 0.74 : 1);
    }

    function renderBearRoom(conf) {
      const SCENE = sceneObjects();
      const O = {}; SCENE.forEach(o => O[o.id] = o);
      const pal = roomPalettes[timeOfDay()];
      const wotd = wordOfTheDay();
      const season = seasonNow();
      const sp = seasonProfiles[season];
      const moment = momentOfTheDay();
      const showMoment = !momentSeenToday();
      const totalDone = SCENE.filter(o => objProgress(o).frac === 1).length;
      const suggest = suggestedObjectId();

      // Outlines first: an unlearned object is a clear line drawing, not a ghost.
      // Learning fills it with colour and finally writes its German name on it.
      // Outline colour must contrast with the wall, which changes with the hour.
      // A dark brown line vanishes on the night-time wall, so it lightens.
      const dark = timeOfDay() === 'night';
      const INK = dark ? '#d9c5aa' : '#7c5a3f';
      const ZONE = dark ? '#8b83a6' : '#bda583';
      const st = (id) => {
        const f = objProgress(O[id]).frac;
        return { f, stroke: f === 1 ? 'none' : INK, sw: f === 1 ? 0 : 2.4 };
      };
      const fill = (id, colour) => {
        const f = objProgress(O[id]).frac;
        if (f === 1) return colour;
        if (f > 0)   return colour;
        return 'none';
      };
      // A small tap button sits on every item so nothing has to be hunted for.
      // Amber = not started, half-ring = in progress, green tick = finished.
      const PIN_TOWN = {
        newsstand:[122,282], tower:[300,110], bank:[452,168],
        townhall:[622,130], square:[452,392], theatre:[806,192]
      };
      const PIN_STREET = {
        station:[112,150], shop:[268,196], cafe:[404,196], office:[540,150],
        flat:[676,132], clinic:[806,196], work:[196,300], school:[458,300],
        bench:[628,404], park:[812,330]
      };
      const PIN_DISTRICT = {
        uni:[140,180], newsroom:[336,236], court:[540,168],
        hq:[736,132], clinicb2:[250,384], congress:[640,392]
      };
      const PIN = activeLevel === 'B2' ? PIN_DISTRICT : activeLevel === 'B1' ? PIN_TOWN : activeLevel === 'A2' ? PIN_STREET : {
        fridge:[104,188], cupboard:[252,180], stove:[254,262], ktable:[200,382],
        door:[646,134], calendar:[750,88], mirror:[842,96], coatrack:[302,132],
        shelf:[430,198], desk:[500,278], window:[500,72], rug:[592,424],
        bed:[866,266], clock:[664,312]
      };
      // After the welcome, a single arrow points at the first thing to tap.
      // It disappears the moment any corner is opened.
      const coachmark = () => {
        if (!hasBeenWelcomed() || !showCoachmark || !suggest) return '';
        const c = PIN[suggest]; if (!c) return '';
        return `<g pointer-events="none">
          <path d="M${c[0]} ${c[1]-30} l-9 -16 h18 z" fill="#4f46e5">
            <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="1.2s" repeatCount="indefinite"/>
          </path>
          <rect x="${c[0]-46}" y="${c[1]-76}" width="92" height="24" rx="12" fill="#4f46e5"/>
          <text x="${c[0]}" y="${c[1]-59}" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif"
                font-size="12" font-weight="800" fill="#ffffff">Hier tippen</text>
        </g>`;
      };

      const pins = () => SCENE.map(o => {
        const c = PIN[o.id]; if (!c) return '';
        const p = objProgress(o);
        const done = p.frac === 1;
        const bg = done ? '#22c55e' : (p.frac > 0 ? '#f59e0b' : '#4f46e5');
        const glow = suggest === o.id ? `<circle cx="${c[0]}" cy="${c[1]}" r="20" fill="${bg}" opacity=".28">
            <animate attributeName="r" values="15;23;15" dur="2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".35;0;.35" dur="2s" repeatCount="indefinite"/></circle>` : '';
        return `<g class="room-pin" onclick="toggleRoomObject('${o.id}')" role="button" tabindex="0" aria-label="Open ${o.en}">

              <button onclick="closeGame()" class="text-slate-500 text-lg font-black">\u2715</button>
            </div>
            <p class="text-[11px] text-slate-400">Tap a German word, then tap its English meaning.</p>
            <div class="grid grid-cols-2 gap-3 pt-2">
              <div class="space-y-2">${leftColHTML}</div>
              <div class="space-y-2">${rightColHTML}</div>
            </div>
            ${matchSuccessCount === 4 ? `
              <div class="p-4 ${conf.cardBg} border rounded-xl text-center space-y-3">
                <img src="./bears/bear-dance.png" alt="" class="h-24 w-auto mx-auto">
                <p class="text-sm font-black text-emerald-400">All matched! +30 XP</p>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="initWordMatchGame()" class="btn3d py-3 bg-indigo-600 text-white font-black text-xs rounded-xl">Play again</button>
                  <button onclick="closeGame()" class="btn3d py-3 bg-slate-700 text-white font-black text-xs rounded-xl">Done</button>
                </div>
              </div>` : ''}
          </div>`;
        return;
      }

      if (activeGameMode === 'grammar') {
        const q = grammarBlitzItem;
        const picked = grammarBlitzPicked;
        container.innerHTML = `
          <div class="space-y-4">
            <div class="flex justify-between items-center px-1">
              <h3 class="text-sm font-black text-white">Grammatik-Blitz \u00b7 ${practiceLevel === 'both' ? 'A1 + A2' : practiceLevel}</h3>
              <button onclick="closeGame()" class="text-slate-500 text-lg font-black">\u2715</button>
            </div>
            <p class="text-[11px] text-slate-400">${q.ask}</p>
            <div class="${conf.cardBg} border p-6 rounded-2xl text-center">
              <p class="text-xl font-black text-white" translate="no" lang="de">${q.prompt}</p>
            </div>
            <div class="space-y-2">
              ${q.options.map((o, i) => {
                let stl = 'bg-slate-800 text-slate-200';
                if (picked !== null) {
                  if (i === q.correct) stl = 'bg-emerald-600 text-white';
                  else if (i === picked) stl = 'bg-rose-600 text-white';
                  else stl = 'bg-slate-900 text-slate-600 opacity-50';
                }
                return `<button onclick="answerGrammarBlitz(${i})" ${picked !== null ? 'disabled' : ''} class="btn3d w-full text-left p-3.5 rounded-xl text-sm font-bold ${stl}" translate="no" lang="de">${o}</button>`;
              }).join('')}
            </div>
            ${picked !== null ? `
              <div class="p-3 rounded-xl text-[11px] font-bold flex items-center gap-2 ${picked === q.correct ? 'bg-emerald-950/50 text-emerald-300' : 'bg-amber-950/50 text-amber-300'}">
                <img src="./bears/${picked === q.correct ? 'bear-hug' : 'bear-think'}.png" alt="" class="h-12 w-auto shrink-0" onerror="this.style.display='none'">
                <span class="flex-1">${q.explain || ''}</span>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="initGrammarBlitz()" class="btn3d py-3 bg-indigo-600 text-white font-black text-xs rounded-xl">Next</button>
                <button onclick="closeGame()" class="btn3d py-3 bg-slate-700 text-white font-black text-xs rounded-xl">Done</button>
              </div>` : ''}
          </div>`;
        return;
      }

      if (activeGameMode === 'gender') {
        let raw = genderGameActiveItem ? genderGameActiveItem.german : '';
        let noun = raw.replace(/^(der|die|das)\s+/i, '');
        noun = noun.charAt(0).toUpperCase() + noun.slice(1);
        container.innerHTML = `
          <div class="space-y-4">
            <div class="flex justify-between items-center px-1">
              <h3 class="text-sm font-black text-white">Gender blitz</h3>
              <button onclick="closeGame()" class="text-slate-500 text-lg font-black">\u2715</button>
            </div>
            <p class="text-[11px] text-slate-400">Choose the right article for the noun.</p>
            <div class="${conf.cardBg} border p-8 rounded-2xl text-center space-y-2">
              <span class="text-2xl font-black text-amber-400 block">${noun}</span>
              <span class="text-xs text-slate-400">${genderGameActiveItem ? genderGameActiveItem.english : ''}</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="submitGenderStrikeAnswer('masculine')" class="btn3d p-4 bg-blue-600 text-white font-black text-sm rounded-xl">der</button>
              <button onclick="submitGenderStrikeAnswer('feminine')" class="btn3d p-4 bg-pink-600 text-white font-black text-sm rounded-xl">die</button>
              <button onclick="submitGenderStrikeAnswer('neuter')" class="btn3d p-4 bg-amber-600 text-white font-black text-sm rounded-xl">das</button>
            </div>
            ${genderGameFeedback !== null ? `
              <div class="p-4 ${conf.cardBg} border rounded-xl text-center space-y-3">
                <img src="./bears/${genderGameFeedback === 'correct' ? 'bear-run' : 'bear-think'}.png" alt="" class="h-20 w-auto mx-auto">
                <p class="text-xs font-black ${genderGameFeedback === 'correct' ? 'text-emerald-400' : 'text-rose-400'}">
                  ${genderGameFeedback === 'correct' ? '\u2713 Correct! +5 XP' : '\u2717 Not quite.'}
                </p>
                <p class="text-[11px] text-slate-400">Full form: <strong class="text-slate-200">${genderGameActiveItem.german}</strong></p>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="initGenderBlitzGame()" class="btn3d py-3 bg-indigo-600 text-white font-black text-xs rounded-xl">Next word</button>
                  <button onclick="closeGame()" class="btn3d py-3 bg-slate-700 text-white font-black text-xs rounded-xl">Done</button>
                </div>
              </div>` : ''}
          </div>`;
      }
    }

    function closeGame() { activeGameMode = 'none'; renderActiveTabModule(); }

    // Bruno reacts to the answer instead of a bare tick or cross.
    // Bruno reacts to how the round is going, not just to right/wrong.
    function blitzBearPose(right, combo) {
      if (!right) return 'bear-think';
      if (combo >= 5) return 'bear-dance';
      if (combo >= 3) return 'bear-jump';
      return 'bear-hug';
    }
    function blitzBearLine(right, combo, q) {
      if (!right) return 'Fast! Die richtige Antwort: ' + q.options[q.correct];
      if (combo >= 5) return '\ud83d\udd25 ' + combo + 'er-Serie! Unglaublich!';
      if (combo >= 3) return '\ud83d\udd25 ' + combo + ' richtig hintereinander!';
      return '\ud83c\udf89 Richtig!';
    }

    function blitzOverlayHTML(conf) {
      if (blitzDone) {
        const all = blitzCorrect === blitzQuestions.length;
        const rank = xpRank(totalXPAmount);
        const badges = blitzEarned.map(id => ACHIEVEMENTS.find(a => a.id === id)).filter(Boolean);
        return `
          <div class="space-y-4 text-center sb-rise">
            <img src="./bears/${all ? 'bear-dance' : blitzCorrect >= 3 ? 'bear-jump' : 'bear-think'}.png" alt="" class="h-40 w-auto mx-auto sb-pop" onerror="this.style.display='none'">
            <p class="text-xl font-black text-white" translate="no" lang="de">${
              all ? 'Fantastisch!' : blitzCorrect >= 3 ? 'Sehr gut!' : 'Gut ge\u00fcbt!'}</p>

            <div class="flex justify-center gap-2">
              ${blitzQuestions.map((_, i) => `<span style="width:10px;height:10px;border-radius:999px;display:inline-block;background:${i < blitzCorrect ? '#22c55e' : '#334155'}"></span>`).join('')}
            </div>
            <p class="text-sm font-bold text-slate-300">${blitzCorrect} of ${blitzQuestions.length} correct \u00b7 +${blitzSessionXP} XP</p>
            ${blitzBestCombo >= 3 ? `<p class="text-xs font-black text-amber-400">\ud83d\udd25 Best run: ${blitzBestCombo} in a row</p>` : ''}
            ${blitzStreak() > 1 ? `<p class="text-xs font-black text-amber-400">\ud83d\udcc5 ${blitzStreak()} days in a row</p>` : ''}

            <div class="rounded-2xl p-3 text-left" style="background:#111827">
              <div class="flex items-center justify-between mb-1">
                <p class="text-[11px] font-black text-white">Level ${rank.level} \u00b7 <span translate="no" lang="de">${rank.title}</span></p>
                <p class="text-[10px] font-bold text-slate-400">${rank.next ? rank.into + '/' + rank.span + ' XP' : 'max'}</p>
              </div>
              <div class="h-2 rounded-full overflow-hidden" style="background:#1e293b">
                <div class="h-full rounded-full sb-bar" style="width:${rank.pct}%; background:linear-gradient(90deg,#4f46e5,#c026d3)"></div>
              </div>
              ${rank.next ? `<p class="text-[10px] font-bold text-slate-500 mt-1">Next: <span translate="no" lang="de">${rank.next.title}</span></p>` : ''}
            </div>

            ${badges.length ? `<div class="space-y-1.5">
              ${badges.map(a => `<div class="rounded-xl p-2.5 flex items-center gap-2 text-left sb-rise" style="background:#1e1b4b;border:1px solid #4338ca">
                <span class="text-xl">${a.icon}</span>
                <span class="flex-1 min-w-0"><b class="text-[11px] text-white block">${a.label}</b>
                <span class="text-[10px] text-indigo-300">${a.desc}</span></span>
              </div>`).join('')}
            </div>` : ''}

            <div class="grid grid-cols-2 gap-2 pt-1">
              <button onclick="startDailyBlitz()" class="btn3d py-3.5 rounded-xl font-black text-xs text-white sb-combo" style="background:linear-gradient(135deg,#4f46e5,#c026d3)">\u26a1 One more Blitz</button>
              <button onclick="closeGame()" class="btn3d py-3.5 rounded-xl font-black text-xs text-white" style="background:#334155">Done</button>
            </div>
          </div>`;
      }
      const q = blitzQuestions[blitzIndex];
      const answered = blitzPicked !== null;
      const right = answered && blitzPicked === q.correct;
      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between px-1">
            <h3 class="text-sm font-black text-white">\u26a1 Daily Blitz \u00b7 ${blitzIndex + 1}/${blitzQuestions.length}</h3>
            <div class="flex items-center gap-2">
              ${blitzCombo >= 2 ? `<span class="px-2 py-0.5 rounded-lg text-[10px] font-black text-white sb-combo" style="background:#b45309">\ud83d\udd25 ${blitzCombo}\u00d7</span>` : ''}
              <button onclick="closeGame()" class="text-slate-500 text-lg font-black">\u2715</button>
            </div>
          </div>
          <div class="h-1.5 rounded-full overflow-hidden" style="background:#1e293b">
            <div class="h-full rounded-full sb-bar" style="width:${Math.round(((blitzIndex + (answered ? 1 : 0)) / blitzQuestions.length) * 100)}%; background:linear-gradient(90deg,#4f46e5,#c026d3)"></div>
          </div>
          <div class="${conf.cardBg} border rounded-2xl p-5 text-center space-y-2 ${blitzFeedbackClass}">
            <p class="text-[10px] font-black uppercase tracking-wider text-indigo-400">${q.ask}</p>
            <p class="${q.kind === 'listen' ? 'text-5xl' : 'text-2xl'} font-black text-white" translate="no" lang="de">${
              q.kind === 'listen' && !answered ? '\ud83c\udfa7' : q.prompt}</p>
            ${q.speak ? `<button onclick='speakGerman(${safeOnclickArg(q.speak)}, true)' class="btn3d px-4 py-2 rounded-xl text-xs font-black text-white" style="background:#4f46e5">\ud83d\udd0a ${q.kind === 'listen' ? 'Nochmal h\u00f6ren' : ''}</button>` : ''}
          </div>
          <div class="space-y-2">
            ${q.options.map((o, i) => {
              let bg = '#1e293b';
              if (answered && i === q.correct) bg = '#15803d';
              else if (answered && i === blitzPicked) bg = '#7f1d1d';
              return `<button onclick="answerBlitz(${i})" class="btn3d w-full p-3.5 rounded-xl text-sm font-bold text-white text-left" style="background:${bg}">${o}</button>`;
            }).join('')}
          </div>
          ${answered ? `
            <div class="rounded-xl p-3 flex items-center gap-2 sb-rise" style="background:${right ? 'rgba(21,128,61,.25)' : 'rgba(180,83,9,.25)'}">
              <img src="./bears/${blitzBearPose(right, blitzCombo)}.png" alt="" class="h-14 w-auto shrink-0 ${right ? 'sb-pop' : ''}" onerror="this.style.display='none'">
              <div class="flex-1 min-w-0">
                <p class="text-xs font-black ${right ? 'text-emerald-300' : 'text-amber-300'}" translate="no" lang="de">${
                  blitzBearLine(right, blitzCombo, q)}${right ? ' +' + blitzXPFor(blitzCombo) + ' XP' : ''}</p>
                ${q.explain ? `<p class="text-[11px] font-bold text-slate-300 mt-0.5">${q.explain}</p>` : ''}
              </div>
            </div>
            <button onclick="nextBlitz()" class="btn3d w-full py-3.5 rounded-xl font-black text-sm text-white" style="background:#4f46e5">
              ${blitzIndex < blitzQuestions.length - 1 ? 'Continue' : 'Finish'}
            </button>` : ''}
        </div>`;
    }

    // View Route Processing Center Hub
    function renderActiveTabModule() {
      const container = document.getElementById('main-scroll-view');
      const ov = document.getElementById('sb-overlay');
      if (ov && !(activeTab === 'dashboard' && activeGameMode === 'none' && !activeExamRunningMode)) ov.innerHTML = '';
      // Settings sits above everything and is reachable from any tab
      const settingsNode = document.getElementById('sb-settings');
      if (settingsNode) settingsNode.innerHTML = settingsSheetHTML();
      const achNode = document.getElementById('sb-achievements');
      if (achNode) achNode.innerHTML = achievementsSheetHTML();
      const avatarNode = document.getElementById('header-avatar');
      if (avatarNode) avatarNode.innerText = learnerAvatar || '\u2699\ufe0f';
      const conf = systemThemeProfiles[currentThemeProfile] || systemThemeProfiles['midnight-slate'];

      // Games open as an overlay from either the Path or the Practice tab
      if (activeGameMode !== 'none') { renderGameOverlay(container, conf); return; }

      if (activeTab === 'dashboard') {

        // ---- Lesson quiz overlay ----
        if (quizActive) {
          if (quizFinished) {
            const passed = quizCorrect >= Math.min(4, quizQuestions.length);
            container.innerHTML = `
              <div class="text-center p-6 ${conf.cardBg} border rounded-2xl shadow-xl space-y-4">
                <img src="./bears/${passed ? 'bear-jump' : 'bear-think'}.png" alt="" class="h-28 w-auto mx-auto" onerror="this.style.display='none'">
                ${passed ? '<p class="text-2xl tracking-widest">\ud83c\udf89 \u2b50 \ud83c\udf6f</p>' : ''}
                <h3 class="text-base font-black text-white">${passed ? 'Geschafft!' : 'Fast geschafft'}</h3>
                <p class="text-[11px] font-bold text-slate-400 italic">${passed
                  ? '\u201eSuper gemacht! Ich bin stolz auf dich.\u201c \u2014 Bruno'
                  : '\u201eKein Problem. Wir versuchen es noch einmal!\u201c \u2014 Bruno'}</p>
                <p class="text-xs text-slate-400">${quizCorrect} of ${quizQuestions.length} correct${passed ? ' \u00b7 +10 XP' : ''}</p>
                <p class="text-[11px] text-slate-500">${passed ? 'The next lesson is unlocked.' : 'You need 4 correct to unlock the next lesson.'}</p>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="retryQuiz()" class="btn3d py-3 bg-slate-700 text-white font-black text-xs rounded-xl">Try again</button>
                  <button onclick="exitQuiz()" class="btn3d py-3 bg-indigo-600 text-white font-black text-xs rounded-xl">Back to path</button>
                </div>
              </div>`;
            return;
          }
          const q = quizQuestions[quizIndex];
          container.innerHTML = `
            <div class="space-y-4">
              <div class="flex items-center gap-3">
                <button onclick="exitQuiz()" class="text-slate-500 text-lg font-black">\u2715</button>
                <div class="flex-1 h-3 bg-slate-800 rounded-full overflow-hidden">
                  <div class="h-full bg-emerald-500 rounded-full transition-all" style="width:${Math.round((quizIndex/quizQuestions.length)*100)}%"></div>
                </div>
                <span class="text-[11px] font-black text-slate-400">${quizIndex+1}/${quizQuestions.length}</span>
              </div>
              <p class="text-[11px] font-black uppercase tracking-wider text-slate-400">${q.ask}</p>
              <div class="${conf.cardBg} border p-6 rounded-2xl text-center space-y-2">
                ${q.prompt ? `<p class="text-2xl font-black text-white" translate="no" lang="de">${q.prompt}</p>` : `<p class="text-4xl">\ud83d\udc42</p>`}
                ${q.hint ? `<p class="text-xs font-mono text-indigo-300">[ ${q.hint} ]</p>` : ''}
                ${q.speak ? `<button onclick='speakGerman(${safeOnclickArg(q.speak)}, true)' class="btn3d mt-1 ${q.prompt ? 'px-4 py-2 text-[11px]' : 'px-6 py-3 text-sm'} bg-indigo-600 text-white font-black rounded-xl">\ud83d\udd0a ${q.prompt ? 'Listen' : 'Abspielen'}</button>` : ''}
              </div>
              <div class="space-y-2">
                ${q.options.map((o,i) => {
                  let st = 'bg-slate-800 text-slate-200';
                  if (quizPicked !== null) {
                    if (i === q.correct) st = 'bg-emerald-600 text-white';
                    else if (i === quizPicked) st = 'bg-rose-600 text-white';
                    else st = 'bg-slate-900 text-slate-600 opacity-50';
                  }
                  return `<button onclick="answerQuiz(${i})" ${quizPicked!==null?'disabled':''} class="btn3d w-full text-left p-3.5 rounded-xl text-sm font-bold ${st}">${o}</button>`;
                }).join('')}
              </div>
              ${quizPicked !== null ? `
                ${q.explain ? `<div class="p-3 rounded-xl ${quizPicked === q.correct ? 'bg-emerald-950/50 text-emerald-300' : 'bg-amber-950/50 text-amber-300'} text-[11px] font-bold flex items-center gap-2">
                  <img src="./bears/${quizPicked === q.correct ? 'bear-hug' : 'bear-think'}.png" alt="" class="h-12 w-auto shrink-0">
                  <span class="flex-1">${q.explain}</span>
                </div>` : ''}
                <button onclick="nextQuizStep()" class="btn3d w-full py-3.5 bg-indigo-600 text-white font-black text-sm rounded-xl">
                  ${quizIndex < quizQuestions.length-1 ? 'Continue' : 'Finish'}
                </button>` : ''}
            </div>`;
          return;
        }

        if (activeGameMode === 'none' && !activeExamRunningMode) {
          container.innerHTML = renderBearRoom(conf);
          return;
        }
      }

      else if (activeTab === 'vocabulary') {
        const categories = Object.keys(allVocabularyDatabase);
        const activeList = allVocabularyDatabase[selectedVocabCategory];
        const card = activeList ? activeList[activeVocabCardIndex] : null;

        const allCategories = categories.concat(['DYNAM_NUMBERS']);
        const labelFor = (c) => c === 'DYNAM_NUMBERS' ? 'Numbers 0-100 Million' : c;
        const iconFor = (c) => vocabCategoryIcons[c] || '\ud83d\udcd8';
        const countFor = (c) => c === 'DYNAM_NUMBERS' ? '\u221e' : (allVocabularyDatabase[c] ? allVocabularyDatabase[c].length + ' cards' : '');

        let categoryButtonsHTML = '';
        allCategories.forEach(cat => {
          const on = cat === selectedVocabCategory;
          categoryButtonsHTML += `
            <button onclick='selectVocabCategory(${safeOnclickArg(cat)})' class="p-3 rounded-2xl border text-left flex flex-col gap-1 transition-all active:scale-95 ${on ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-200'}">
              <span class="text-lg leading-none">${iconFor(cat)}</span>
              <span class="text-[11px] font-black leading-tight">${labelFor(cat)}</span>
              <span class="text-[9px] font-bold ${on ? 'text-indigo-100' : 'text-slate-500'}">${countFor(cat)}</span>
            </button>`;
        });

        let coreDisplayBodyHTML = '';

        if (selectedVocabCategory === "DYNAM_NUMBERS") {
          coreDisplayBodyHTML = `
            <div class="${conf.cardBg} border p-4 rounded-2xl w-full space-y-3">
              <h3 class="text-xs font-black text-indigo-400 uppercase tracking-wider">Algorithmic 100M Numbers Engine</h3>
              <p class="text-[11px] text-slate-400">Type any number between 0 and 100,000,000 to see its exact written grammatical German compilation string framework.</p>
              <input type="number" id="numerical-matrix-input" min="0" max="100000000" placeholder="Type integer... (e.g. 984520)" oninput="runLiveIntegerConversionCheck()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-mono font-bold text-amber-400 outline-none" />
              <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl min-h-[50px] flex items-center justify-center">
                <p id="numerical-matrix-output-string" class="text-xs font-bold text-emerald-400 font-mono text-center">null</p>
              </div>
            </div>
          `;
        } else if (card) {
          coreDisplayBodyHTML = `
            <div class="w-full flex justify-between items-center text-[11px] font-bold text-slate-400 px-1">
              <span>Card ${activeVocabCardIndex + 1} of ${activeList.length}</span>
              <span class="text-indigo-400 font-extrabold uppercase">${vocabLevelOf(selectedVocabCategory)} Vocabulary</span>
            </div>

            <div class="flashcard-wrapper w-full h-72 md:h-80 cursor-pointer ${isVocabCardFlipped ? 'flipped' : ''}" onclick="this.classList.toggle('flipped'); isVocabCardFlipped=!isVocabCardFlipped;">
              <div class="flashcard-inner">
                <div class="flashcard-front ${conf.cardBg} border shadow-xl">
                  <div class="w-full flex justify-between items-center">
                    <span class="text-[9px] uppercase tracking-widest font-black px-2 py-0.5 rounded bg-slate-950/50 text-indigo-400">${card.gender}</span>
                    <span class="text-[9px] font-mono text-amber-400/80 font-bold bg-slate-950/40 px-1.5 py-0.5 rounded">📄 Front</span>
                  </div>
                  <div class="flex flex-col my-auto items-center">
                    <span class="text-2xl font-black tracking-tight select-none" translate="no" lang="de">${card.german}</span>
                    <span class="text-xs font-mono font-bold text-indigo-300 mt-2 bg-indigo-950/40 px-2 py-1 rounded border border-indigo-900/40">🗣️ [ ${card.pronunciation || 'N/A'} ]</span>
                    
                    <button onclick='event.stopPropagation(); triggerSpeechSynthesis(${safeOnclickArg(card.german)});' class="mt-3 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-[10px] rounded-lg shadow-md flex items-center gap-1 transition-transform active:scale-95">
                      🔊 Listen Audio
                    </button>
                  </div>
                  <span class="text-[10px] text-slate-400 font-medium italic">💡 Tap card background area to flip</span>
                </div>
                <div class="flashcard-back ${conf.cardBackBg} border shadow-xl overflow-y-auto">
                  <span class="text-[9px] uppercase tracking-widest font-black self-start text-indigo-300">Meaning &amp; grammar</span>
                  <span class="text-xl font-extrabold tracking-tight select-none">${card.english}</span>
                  ${grammarChips(card)}
                  <p class="text-[11px] text-indigo-200/80 mt-1">${card.hint}</p>
                </div>
              </div>
            </div>

                <span class="text-4xl block">✅</span>
                <h3 class="text-base font-black text-white">${skillKey === 'hoeren' ? 'Hören' : 'Lesen'} abgeschlossen</h3>
                <p class="text-xs text-slate-400 font-semibold">Ergebnis: <span class="text-emerald-400 font-black">${correct} / ${list.length}</span> richtig</p>
                <button onclick="advanceExamSection()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu ${skillKey === 'hoeren' ? 'Lesen' : 'Schreiben'} →</button>
              </div>
            </div>
          `;
          return;
        }

        const q = list[currentExamQuestionIndex];
        container.innerHTML = `
          <div class="space-y-4">${progressHTML}
            <div class="flex justify-between items-center px-1">
              <span class="text-[10px] font-black text-slate-400">Teil ${q.teil} • Frage ${currentExamQuestionIndex + 1} von ${list.length}</span>
            </div>
            ${skillKey === 'hoeren' ? `
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-3">
                <button onclick='speakGerman(${safeOnclickArg(q.audioText)})' class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs rounded-xl flex items-center justify-center gap-2">🔊 Audio abspielen</button>
                <p class="text-xs font-bold leading-relaxed text-slate-200">${q.question}</p>
              </div>
            ` : `
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-2">
                <p class="text-[9px] uppercase font-black text-slate-500 tracking-wider">Lesetext</p>
                <p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed">${q.readingText}</p>
                <p class="text-xs font-bold text-slate-100 mt-2">${q.question}</p>
              </div>
            `}
            <div class="space-y-2">
              ${q.options.map((opt, oIdx) => {
                let optStyle = "bg-slate-800 border-slate-700 text-slate-300";
                if (processingExamEvaluationFeedbackMode) {
                  if (oIdx === q.c) optStyle = "bg-emerald-950 border-emerald-500 text-emerald-200 font-black";
                  else if (oIdx === activeExamUserAnswersCollected[skillKey][currentExamQuestionIndex]) optStyle = "bg-rose-950 border-rose-500 text-rose-200";
                  else optStyle = "bg-slate-900 border-slate-800 opacity-40 text-slate-600";
                }
                return `<button onclick="submitActiveExamOptionAnswer(${oIdx})" ${processingExamEvaluationFeedbackMode ? 'disabled' : ''} class="w-full text-left p-3.5 border rounded-xl text-xs font-bold transition-all ${optStyle}">${opt}</button>`;
              }).join('')}
            </div>
            ${processingExamEvaluationFeedbackMode ? `
              <button onclick="advanceActiveExamQuestionStep()" class="w-full mt-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl">Nächste Frage →</button>
            ` : ''}
          </div>
        `;
        return;
      }

      // --- Schreiben (writing practice with self-check model answers) ---
      if (activeExamSectionIndex === 2) {
        const sw = exam.schreiben;
        const tasks = schreibenTasks(exam);
        const task = tasks[Math.min(schreibenTaskIndex, tasks.length - 1)];
        const isLastTask = schreibenTaskIndex >= tasks.length - 1;
        const nextTaskLabel = isLastTask ? 'Weiter zu Sprechen →' : `Weiter zu Teil ${schreibenTaskIndex + 2} →`;
        const nextTaskAction = isLastTask ? 'advanceExamSection()' : 'advanceSchreibenTask()';
        if (task.type === 'form') {
          const f = task;
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-3">
                <h4 class="text-xs font-black text-white">${f.title}</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${f.scenario}</p>
                <div class="space-y-2 pt-2">
                  ${f.fields.map(field => `
                    <div>
                      <label class="text-[10px] font-bold text-slate-400">${field}</label>
                      <input type="text" class="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200" placeholder="${field}...">
                    </div>
                  `).join('')}
                </div>
                ${f.fieldSolutions ? `
                  <button onclick="toggleSchreibenFormSolutions()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold text-[11px] rounded-lg">${schreibenFormShowSolutions ? 'Lösungen ausblenden' : 'Lösungen anzeigen'}</button>
                  ${schreibenFormShowSolutions ? `
                    <div class="p-3 bg-indigo-950/40 border border-indigo-900 rounded-lg text-xs text-indigo-200 space-y-1">
                      ${f.fields.map((field, i) => `<p><span class="font-black">${field}:</span> ${f.fieldSolutions[i]}</p>`).join('')}
                    </div>
                  ` : ''}
                ` : ''}
              </div>
              <button onclick="${nextTaskAction}" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">${nextTaskLabel}</button>
            </div>
          `;
        } else {
          const m = task;
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-3">
                <h4 class="text-xs font-black text-white">${m.title}</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${m.instructions}</p>
                <ul class="text-xs text-slate-400 list-disc list-inside space-y-1">
                  ${m.points.map(p => `<li>${p}</li>`).join('')}
                </ul>
                <textarea rows="4" class="w-full mt-2 p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200" placeholder="Schreiben Sie hier Ihre Nachricht..."></textarea>
                <button onclick="toggleSchreibenSample(${schreibenTaskIndex})" class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold text-[11px] rounded-lg">${schreibenShowSample[schreibenTaskIndex] ? 'Musterantwort ausblenden' : 'Musterantwort anzeigen'}</button>
                ${schreibenShowSample[schreibenTaskIndex] ? `<div class="p-3 bg-indigo-950/40 border border-indigo-900 rounded-lg text-xs text-indigo-200 leading-relaxed">${m.sample}</div>` : ''}
              </div>
              <button onclick="${nextTaskAction}" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">${nextTaskLabel}</button>
            </div>
          `;
        }
        return;
      }

      // --- Sprechen (speaking practice with TTS model answers + self-check) ---
      if (activeExamSectionIndex === 3) {
        const sp = exam.sprechen;
        if (sprechenPartIndex === 0) {
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-3">
                <h4 class="text-xs font-black text-white">${sp.intro.title}</h4>
                <p class="text-[10px] text-slate-400">Sprechen Sie frei über sich selbst. Nutzen Sie diese Stichwörter:</p>
                <div class="flex flex-wrap gap-1.5">
                  ${sp.intro.keywords.map(k => `<span class="text-[10px] font-bold bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-1 rounded-lg">${k}</span>`).join('')}
                </div>
                <button onclick='speakGerman(${safeOnclickArg(sp.intro.sample)})' class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-[11px] rounded-lg">🔊 Beispielantwort anhören</button>
                <p class="text-xs text-slate-300 italic leading-relaxed">"${sp.intro.sample}"</p>
                <label class="flex items-center gap-2 text-[11px] text-slate-300 font-bold pt-1">
                  <input type="checkbox" ${sprechenChecklist.intro ? 'checked' : ''} onchange="toggleSprechenChecklistItem('intro')"> Ich habe das geübt
                </label>
              </div>
              <button onclick="advanceSprechenPart()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu Teil 2 →</button>
            </div>
          `;
        } else if (sprechenPartIndex === 1) {
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <h4 class="text-xs font-black text-white px-1">${sp.qaTitle || 'Teil 2: Fragen und Antworten'}</h4>
              <div class="space-y-3">
                ${sp.qa.map((item, idx) => `
                  <div class="${conf.cardBg} border p-4 rounded-xl space-y-2">
                    <span class="text-[9px] uppercase font-black text-indigo-400 tracking-wider">${item.keyword}</span>
                    <p class="text-xs font-bold text-slate-200">${item.sampleQ}</p>
                    <button onclick='speakGerman(${safeOnclickArg(item.sampleA)})' class="text-[10px] font-bold text-indigo-400">🔊 Beispielantwort anhören</button>
                    <p class="text-xs text-slate-400 italic">"${item.sampleA}"</p>
                    <label class="flex items-center gap-2 text-[10px] text-slate-300 font-bold pt-1">
                      <input type="checkbox" ${sprechenChecklist.qa[idx] ? 'checked' : ''} onchange="toggleSprechenChecklistItem('qa', ${idx})"> Geübt
                    </label>
                  </div>
                `).join('')}
              </div>
              <button onclick="advanceSprechenPart()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu Teil 3 →</button>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <h4 class="text-xs font-black text-white px-1">${sp.requestsTitle || 'Teil 3: Bitten formulieren'}</h4>
              <div class="space-y-3">
                ${sp.requests.map((item, idx) => `
                  <div class="${conf.cardBg} border p-4 rounded-xl space-y-2">
                    <p class="text-xs font-bold text-slate-200">${item.prompt}</p>
                    <button onclick='speakGerman(${safeOnclickArg(item.sample)})' class="text-[10px] font-bold text-indigo-400">🔊 Beispiel anhören</button>
                    <p class="text-xs text-slate-400 italic">"${item.sample}"</p>
                    <label class="flex items-center gap-2 text-[10px] text-slate-300 font-bold pt-1">
                      <input type="checkbox" ${sprechenChecklist.requests[idx] ? 'checked' : ''} onchange="toggleSprechenChecklistItem('requests', ${idx})"> Geübt
                    </label>
                  </div>
                `).join('')}
              </div>
              <button onclick="finishMockExam()" class="w-full p-3 bg-gradient-to-r from-emerald-500 to-indigo-500 font-black text-xs text-white rounded-xl">Prüfung abschließen ✓</button>
            </div>
          `;
        }
        return;
      }

      // --- Results screen ---
      if (activeExamSectionIndex === 4) {
        const correctHoeren = exam.hoeren.filter((q, i) => activeExamUserAnswersCollected.hoeren[i] === q.c).length;
        const correctLesen = exam.lesen.filter((q, i) => activeExamUserAnswersCollected.lesen[i] === q.c).length;
        const totalRight = correctHoeren + correctLesen;
        const totalQ = exam.hoeren.length + exam.lesen.length;
        const pct = Math.round((totalRight / totalQ) * 100);
        const passed = pct >= 60;
        const sprechenDone = sprechenChecklist.intro && sprechenChecklist.qa.every(x => x) && sprechenChecklist.requests.every(x => x);

        container.innerHTML = `
          <div class="text-center p-6 ${conf.cardBg} border rounded-2xl shadow-2xl space-y-4">
            <span class="text-5xl block">${passed ? '🏆' : '⏳'}</span>
            <h3 class="text-lg font-black text-white">${passed ? 'Prüfung bestanden!' : 'Bitte weiter üben'}</h3>
            <p class="text-xs text-slate-400 font-semibold">${exam.title}</p>
            <div class="text-left bg-slate-950 p-4 rounded-lg border border-slate-800 text-[11px] space-y-2 text-slate-300">
              <div class="flex justify-between"><span>Hören</span><span class="font-black text-white">${correctHoeren} / ${exam.hoeren.length}</span></div>
              <div class="flex justify-between"><span>Lesen</span><span class="font-black text-white">${correctLesen} / ${exam.lesen.length}</span></div>
              <div class="flex justify-between border-t border-slate-800 pt-2"><span>Gesamt (Hören + Lesen)</span><span class="font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}">${pct}%</span></div>
              <div class="flex justify-between"><span>Schreiben</span><span class="font-black text-indigo-400">Übung abgeschlossen</span></div>
              <div class="flex justify-between"><span>Sprechen</span><span class="font-black ${sprechenDone ? 'text-emerald-400' : 'text-amber-400'}">${sprechenDone ? 'Alle Teile geübt' : 'Teilweise geübt'}</span></div>
            </div>
            <p class="text-[10px] text-slate-500 leading-relaxed">Hinweis: Schreiben und Sprechen werden in der echten Prüfung von einem Prüfer bewertet. Vergleichen Sie Ihre Antworten mit den Musterlösungen, um sich selbst einzuschätzen.</p>
            <p class="text-xs text-slate-400">${passed ? '+50 XP Meilenstein erreicht!' : 'Bestehensgrenze: 60% in Hören + Lesen.'}</p>
            <button onclick="exitMockExam()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Zurück zur Prüfungsauswahl</button>
          </div>
        `;
        return;
      }
    }

    // Exam State Handler Methods
    function startSpecificMockExamSuite(idx) {
      selectedActiveExamIndex = idx;
      activeExamRunningMode = true;
      activeExamSectionIndex = 0;
      currentExamQuestionIndex = 0;
      activeExamUserAnswersCollected = { hoeren: [], lesen: [] };
      processingExamEvaluationFeedbackMode = false;
      schreibenTaskIndex = 0;
      schreibenShowSample = [false, false, false, false];
      schreibenFormShowSolutions = false;
      sprechenPartIndex = 0;
      sprechenSubIndex = 0;
      const sp = mockExamsDatabase[idx].sprechen;
      sprechenChecklist = {
        intro: false,
        qa: new Array((sp.qa || []).length).fill(false),
        requests: new Array((sp.requests || []).length).fill(false)
      };
      renderActiveTabModule();
    }

    // Normalises both exam shapes: A1 stores { form, message }, A2 stores { tasks: [...] }.
    function schreibenTasks(exam) {
      const sw = exam.schreiben || {};
      if (Array.isArray(sw.tasks)) return sw.tasks;
      const out = [];
      if (sw.form) out.push(Object.assign({ type: 'form' }, sw.form));
      if (sw.message) out.push(Object.assign({ type: 'message' }, sw.message));
      return out;
    }

    function exitMockExam() {
      activeExamRunningMode = false;
      renderActiveTabModule();
    }

    function submitActiveExamOptionAnswer(ansIdx) {
      if (processingExamEvaluationFeedbackMode) return;
      const skillKey = activeExamSectionIndex === 0 ? 'hoeren' : 'lesen';
      activeExamUserAnswersCollected[skillKey][currentExamQuestionIndex] = ansIdx;
      processingExamEvaluationFeedbackMode = true;
      renderActiveTabModule();
    }

    function advanceActiveExamQuestionStep() {
      processingExamEvaluationFeedbackMode = false;
      currentExamQuestionIndex++;
      renderActiveTabModule();
    }

    function advanceExamSection() {
      activeExamSectionIndex++;
      currentExamQuestionIndex = 0;
      processingExamEvaluationFeedbackMode = false;
      renderActiveTabModule();
    }

    function toggleSchreibenSample(idx) {
      schreibenShowSample[idx] = !schreibenShowSample[idx];
      renderActiveTabModule();
    }

    function toggleSchreibenFormSolutions() {
      schreibenFormShowSolutions = !schreibenFormShowSolutions;
      renderActiveTabModule();
    }

    function advanceSchreibenTask() {
      const tasks = schreibenTasks(mockExamsDatabase[selectedActiveExamIndex]);
      if (schreibenTaskIndex >= tasks.length - 1) { advanceExamSection(); return; }
      schreibenTaskIndex++;
      renderActiveTabModule();
    }

    function toggleSprechenChecklistItem(part, idx) {
      if (part === 'intro') sprechenChecklist.intro = !sprechenChecklist.intro;
      else if (part === 'qa') sprechenChecklist.qa[idx] = !sprechenChecklist.qa[idx];
      else if (part === 'requests') sprechenChecklist.requests[idx] = !sprechenChecklist.requests[idx];
      renderActiveTabModule();
    }

    function advanceSprechenPart() {
      sprechenPartIndex++;
      renderActiveTabModule();
    }

    function finishMockExam() {
      const exam = mockExamsDatabase[selectedActiveExamIndex];
      const correctHoeren = exam.hoeren.filter((q, i) => activeExamUserAnswersCollected.hoeren[i] === q.c).length;
      const correctLesen = exam.lesen.filter((q, i) => activeExamUserAnswersCollected.lesen[i] === q.c).length;
      const totalRight = correctHoeren + correctLesen;
      const totalQ = exam.hoeren.length + exam.lesen.length;
      const pct = Math.round((totalRight / totalQ) * 100);
      if (pct >= 60) setTimeout(() => { rewardXP(50); }, 100);
      activeExamSectionIndex = 4;
      renderActiveTabModule();
    }

    // The first tap anywhere unlocks speech for the rest of the session on iOS
    // (speech no longer needs priming - see primeSpeech)

    // Preload speech synthesis voices so German audio is ready on first play
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
  <script>
    // ---- Installable app (PWA) ----
    // Android/desktop Chrome fire beforeinstallprompt; we stash it and show
    // our own button. iOS has no such event, so we detect Safari instead and
    // explain the Share -> Add to Home Screen route.
    let sbInstallPrompt = null;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err =>
          console.warn('Service worker registration failed:', err));
      });
    }

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      sbInstallPrompt = e;
      if (typeof renderActiveTabModule === 'function') renderActiveTabModule();
    });

    window.addEventListener('appinstalled', () => {
      sbInstallPrompt = null;
      localStorage.setItem('sb_installed', '1');
      if (typeof renderActiveTabModule === 'function') renderActiveTabModule();
    });

    function sbIsStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true
          || localStorage.getItem('sb_installed') === '1';
    }

    async function sbTriggerInstall() {
      if (!sbInstallPrompt) return;
      sbInstallPrompt.prompt();
      await sbInstallPrompt.userChoice;
      sbInstallPrompt = null;
      if (typeof renderActiveTabModule === 'function') renderActiveTabModule();
    }

    // iOS gets a short how-to instead of a button, because Apple gives
    // web apps no programmatic install path.
    function sbInstallCardHTML() {
      if (sbIsStandalone()) return '';
      if (sbInstallPrompt) {
        return `
          <button onclick="sbTriggerInstall()" class="btn3d w-full rounded-2xl p-4 text-left flex items-center gap-3"
                  style="background:#1e293b; box-shadow:0 4px 0 rgba(0,0,0,.35)">
            <span class="text-2xl leading-none shrink-0">\u2b07\ufe0f</span>
            <span class="flex-1 min-w-0">
              <span class="block text-sm font-black text-white">Install Sprachblitz</span>
              <span class="block text-[11px] font-bold text-slate-400">Works offline, opens like a normal app</span>
            </span>
          </button>`;
      }
      if (isAppleMobile) {
        return `
          <div class="rounded-2xl p-4" style="background:#1e293b">
            <p class="text-sm font-black text-white">\ud83d\udcf1 Add to your Home Screen</p>
            <p class="text-[11px] font-bold text-slate-400 mt-0.5">
              Tap the Share button in Safari, then \u201eAdd to Home Screen\u201c. Sprachblitz then opens
              full screen and works without internet.</p>
          </div>`;
      }
      return '';
    }
  </script>
  <script type="module" src="./sb-auth.js"></script>
</body>
</html>
