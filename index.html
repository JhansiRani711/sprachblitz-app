  <style>
    /* German content must never be machine-translated - Chrome would turn
       "der Trainer" into "the coach" and quietly break every lesson. */
    .de { }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .flashcard-wrapper { perspective: 1000px; }
    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.5s;
      transform-style: preserve-3d;
    }
    .flashcard-wrapper.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .flashcard-back { transform: rotateY(180deg); }
    .theme-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .room-obj { cursor: pointer; outline: none; }
    .room-obj:focus-visible { filter: drop-shadow(0 0 6px rgba(99,102,241,.9)); }
    .room-pin { cursor: pointer; outline: none; transition: transform .1s ease; transform-box: fill-box; transform-origin: center; }
    .room-pin:active { transform: scale(.86); }
    .room-pin:focus-visible { filter: drop-shadow(0 0 6px rgba(99,102,241,.95)); }

    /* Splash screen shown on first paint, faded out by window.onload */
    #splash-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: #0f172a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      opacity: 1; transition: opacity .45s ease;
    }
    #splash-screen.hide { opacity: 0; pointer-events: none; }
    #splash-screen img { animation: splash-pop .6s cubic-bezier(.34,1.56,.64,1); }
    #splash-screen h1 { font-size: 27px; font-weight: 800; color: #f1f5f9; margin: 0; letter-spacing: -.02em; }
    #splash-screen p { font-size: 13px; color: #818cf8; margin: 0; font-weight: 600; }
    @keyframes splash-pop { from { transform: scale(.65); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { #splash-screen img { animation: none } }

    /* Respect the iPhone notch and home indicator */
    /* Pressable 3D buttons - a solid bottom edge instead of a border */
    .stone {
      width: 68px; height: 68px; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; line-height: 1; cursor: pointer;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .stone.done    { background:#22c55e; box-shadow: 0 5px 0 #15803d; }
    .stone.current { background:#4f46e5; box-shadow: 0 5px 0 #3730a3, 0 0 0 6px rgba(99,102,241,.22); width:76px; height:76px; font-size:30px; }
    .stone.locked  { background:#1e293b; box-shadow: none; opacity:.55; cursor: not-allowed; }
    .stone.done:active, .stone.current:active { transform: translateY(5px); box-shadow: 0 0 0 #15803d; }
    .chest { width:56px; height:56px; border-radius:14px; border:none; display:flex; align-items:center; justify-content:center; font-size:26px; }
    .btn3d { border:none !important; box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s; }
    .btn3d:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,.35); }

    .room-obj { cursor: pointer; transition: opacity .25s ease, transform .18s ease; }
    .room-obj:active { transform: translateY(2px); }
    .room-suggest { animation: room-pulse 2.6s ease-in-out infinite; }
    @keyframes room-pulse {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(255,214,120,0)); }
      50%      { filter: drop-shadow(0 0 14px rgba(255,214,120,.95)); }
    }
    @media (prefers-reduced-motion: reduce) { .room-suggest { animation: none } }

    .tab-icon {
      font-size: 25px; line-height: 1; padding: 7px 10px; border-radius: 14px;
      border: 2px solid transparent; display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s;
    }
    .tab-active .tab-icon { border-color:#38bdf8; background: rgba(56,189,248,.12); }

    #app-header-nav { padding-top: max(1rem, env(safe-area-inset-top)); }
    #app-footer-nav { padding-bottom: env(safe-area-inset-bottom); height: auto; min-height: 4rem; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 2px; }

    /* Light Mode override layer — remaps the app's dark-palette utility
       classes to light equivalents wherever #app-shell-container carries
       data-theme="light". Scoped this way so Slate/Neon modes (data-theme

      { id: "g_sein", title: "3. Irregular Sein (To Be) Forms", rules: "The foundation auxiliary verb 'sein' shifts conjugation fields dynamically: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind.", example: "Wir sind in der Arena. Ihr seid klug." },
      { id: "g_conj", title: "4. Regular Verb Conjugation Suffixes", rules: "Drop infinitive tail (-en) and apply standardized pronoun terminations: -e, -st, -t, -en, -t, -en.", example: "Ich spiele, du spielst, er spielt, wir spielen." },
      { id: "g_poss", title: "5. Possessive Articles", rules: "Indicate ownership. Base items follow pronoun structures: mein (my), dein (your), sein (his), ihr (her/their), unser (our), euer (your pl). Appends '-e' if item is feminine/plural.", example: "Das ist mein Tisch. Wo ist meine Jacke?" },
      { id: "g_mod", title: "6. Modal Verbs Structure", rules: "Verbs like 'können' (can), 'müssen' (must), 'wollen' (want) conjugate irregularly in singular positions and push main infinitive companion verbs to the sentence tail.", example: "Ich kann Deutsch sprechen. (Infinitive 'sprechen' anchors at the extreme tail position.)" },
      { id: "g_tren", title: "7. Trennbar (Separable) Verbs", rules: "Prefix particles split off active base stems during simple sentence layouts, anchoring directly at the terminal punctuation boundary.", example: "aufstehen -> Ich stehe um 6:00 Uhr auf. ('auf' detaches to the tail window completely.)" },
      { id: "g_imp", title: "8. Imperativ Commands Formulation", rules: "Used to declare instructions/requests. The 'du' command strips away both the pronoun 'du' and the tail standard '-st' suffix tracking.", example: "Komm hierher! (Infinitive 'kommen' drops pronoun and suffix constraints entirely.)" },
      { id: "g_comp", title: "9. Degrees of Comparison Adjectives", rules: "Modifiers escalate structural attributes using baseline rules, adding '-er' for comparative forms and 'am ...-sten' for superlative declarations.", example: "klein -> kleiner -> am kleinsten. alt -> älter -> am ältesten." },
      { id: "g_perf", title: "10. Present Perfect Past Construction", rules: "Form past statements using auxiliary helpers ('haben' or 'sein' based on motion rules) at position 2, placing a 'Partizip II' particle component at sentence tail.", example: "Ich habe Deutsch gelernt. Wir sind nach Berlin gefahren." },
      { id: "g_habs", title: "11. Past Tense Haben & Sein (Präteritum)", rules: "Simple past framework constants used universally for auxiliary assets. Haben -> hatte. Sein -> war. Conjugates via standardized rules.", example: "Ich hatte ein Haus. Gestern war ich müde." },
      { id: "g_case", title: "12. Akkusativ vs Dativ Case Tracking", rules: "Akkusativ targets direct action receivers (Masculine den/einen). Dativ models indirect benefit targets (dem/der/dem/den).", example: "Ich gebe dem Mann (Dativ indirect object) den Ball (Akkusativ direct item asset)." },
      { id: "g_mail", title: "13. Formal Email Writing Blueprints", rules: "Structured communications require strict CEFR protocols: Greeting ('Sehr geehrte Damen und Herren,'), body block content, and formal signoff lines ('Mit freundlichen Grüßen').", example: "Sehr geehrte Frau Müller, ... Mit freundlichen Grüßen, Jhansi." }

    let lessonProgress = JSON.parse(localStorage.getItem('sb_lesson_progress') || '{}');

    // ===== Prüfungsplan: exam date + four-skill readiness =====
    let examDate = localStorage.getItem('sb_exam_date') || '';
    let skillHits = JSON.parse(localStorage.getItem('sb_skill_hits') || '{}');

    function recordSkillHit(skill, correct) {
      if (!skillHits[skill]) skillHits[skill] = { done: 0, right: 0 };
      skillHits[skill].done++;
      if (correct) skillHits[skill].right++;
      localStorage.setItem('sb_skill_hits', JSON.stringify(skillHits));
    }

    function daysUntilExam() {
      if (!examDate) return null;
      const d = Math.ceil((new Date(examDate + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
      return isNaN(d) ? null : d;
    }

    // Readiness blends how much of a skill you have practised with how
    // accurate you were, so it cannot be inflated by volume alone.
    function skillReadiness(skill) {
      const target = { listening: 25, reading: 25, writing: 10, speaking: 25 }[skill] || 20;
      const h = skillHits[skill] || { done: 0, right: 0 };
      const coverage = Math.min(1, h.done / target);
      const accuracy = h.done ? h.right / h.done : 0;
      return Math.round(coverage * (0.15 + 0.85 * accuracy) * 100);
    }

    function overallReadiness() {
      const lessons = flatLessons();
      const lessonPart = lessons.filter(l => isLessonDone(l.id)).length / lessons.length;
      const skills = ['listening','reading','writing','speaking'].map(skillReadiness);
      const skillPart = skills.reduce((a,b) => a+b, 0) / 400;
      return Math.round((lessonPart * 0.5 + skillPart * 0.5) * 100);
    }

      return out;
    }
    function isLessonDone(id) { return !!lessonProgress[id]; }
    function firstUnlockedIndex() {
      const all = flatLessons();
      for (let i = 0; i < all.length; i++) if (!isLessonDone(all[i].id)) return i;
      return all.length - 1;

    function updateGoalRing() {
      const arc = document.getElementById('goal-arc');
      const lab = document.getElementById('goal-label');
      if (!arc || !lab) return; // ring removed - kept as a no-op
      const pct = Math.min(1, dailyXP / DAILY_GOAL_XP);
      arc.setAttribute('stroke-dashoffset', (94.2 * (1 - pct)).toFixed(1));
      lab.innerText = pct >= 1 ? '\u2713' : Math.round(pct * 100) + '%';
      arc.setAttribute('stroke', pct >= 1 ? '#22c55e' : '#f59e0b');
      lab.className = 'absolute inset-0 flex items-center justify-center text-[8px] font-black ' + (pct >= 1 ? 'text-emerald-400' : 'text-amber-400');

    const audioOnlyTopics = ["Alphabet (Alphabet)", "Umlauts & Sound Rules"];

    // Remove a parenthetical so the prompt never shows its own answer
    function cleanPrompt(str) {
      const base = String(str).split('(')[0].trim();
      return base || String(str);
    }

    function shuffle(arr) { return arr.slice().sort(() => 0.5 - Math.random()); }

    // True when the German prompt would reveal its own English answer
    function isCognate(item) {
      const strip = (t) => String(t).toLowerCase()
        .replace(/^(der|die|das)\s+/, '')
        .replace(/[^a-z\u00e4\u00f6\u00fc\u00df]/g, '');
      const g = strip(cleanPrompt(item.german));
      const e = strip(item.english);
      if (!g || !e) return false;
      return g.indexOf(e) !== -1 || e.indexOf(g) !== -1;
    }

    function buildVocabQuestions(cat) {
      const pool = (a1VocabularyDatabase[cat] || []).slice();
      if (pool.length < 4) return [];
      const topicByEar = audioOnlyTopics.indexOf(cat) !== -1;
      const picked = shuffle(pool).slice(0, Math.min(5, pool.length));
      return picked.map(item => {
        const wrong = shuffle(pool.filter(x => x.id !== item.id)).slice(0, 3).map(x => x.english);
        const opts = shuffle(wrong.concat([item.english]));
        // Cognates (Januar/January, Manager/Manager) would give the answer away
        // if shown as text, so they are asked by ear instead.
        const byEar = topicByEar || isCognate(item);
        return {
          prompt: byEar ? null : cleanPrompt(item.german),
          hint: byEar ? null : item.pronunciation,
          speak: item.german,
          ask: byEar ? 'Listen and choose what you hear' : 'What does this mean?',
          options: opts,
          correct: opts.indexOf(item.english)
        };
      });
    }

    // Article drills are generated live from any noun already tagged with a gender
    function buildArticleQuestions() {
      const genderWord = { masculine: 'der', feminine: 'die', neuter: 'das' };
      let pool = [];
      Object.keys(a1VocabularyDatabase).forEach(cat => {
        a1VocabularyDatabase[cat].forEach(item => {
          if (genderWord[item.gender]) {
            const noun = item.german.replace(/^(der|die|das)\s+/i, '').trim();
            if (noun && noun.indexOf(' ') === -1) pool.push({ noun, g: item.gender, en: item.english });
          }
        });
      });
      if (pool.length < 5) return [];
      return shuffle(pool).slice(0, 5).map(item => {
        const opts = ['der', 'die', 'das'];
        return {
          prompt: '___ ' + item.noun,
          hint: item.en,
          speak: genderWord[item.g] + ' ' + item.noun,
          ask: 'Choose the right article',
          options: opts,
          correct: opts.indexOf(genderWord[item.g]),
          explain: genderWord[item.g] + ' ' + item.noun + ' (' + item.en + ')'
        };
      });
    }

        prompt: q.prompt, hint: null, speak: null, ask: q.ask,
        options: q.options, correct: q.correct, explain: q.explain
      }));

    function startLesson(id) {
      const lesson = flatLessons().find(l => l.id === id);
      if (!lesson) return;
      if (lesson.type === 'vocab' || lesson.type === 'grammar') {
        quizQuestions = lesson.type === 'vocab' ? buildVocabQuestions(lesson.cat) : buildGrammarQuestions(lesson.gid);
        if (!quizQuestions.length) {
          if (lesson.type === 'vocab') { selectedVocabCategory = lesson.cat; switchTab('vocabulary'); }
          else { activeGrammarIndex = lesson.idx || 0; switchTab('grammar'); }
          return;
        }
        quizActive = true; quizLesson = lesson; quizIndex = 0; quizCorrect = 0; quizPicked = null; quizFinished = false;
        renderActiveTabModule(); maybeAutoPlayQuiz();
      } else if (lesson.type === 'game') {
        markLessonDone(lesson.id); initGenderBlitzGame();
      } else if (lesson.type === 'skill') {
        markLessonDone(lesson.id); activeSkillSection = lesson.skill; activeSkillQuestionIndex = 0; resetSkillProgress(); switchTab('skills');
      } else if (lesson.type === 'exam') {

    function speakGerman(text, stripParens) {
      if (!('speechSynthesis' in window)) return;
      const synth = window.speechSynthesis;
      const clean = stripParens ? String(text).split('(')[0].trim() : String(text);
      if (synth.speaking || synth.pending) synth.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'de-DE';
      u.rate = 0.85;
      u.volume = 1;
      const voices = synth.getVoices();
      const de = voices.find(v => v.lang === 'de-DE') || voices.find(v => v.lang && v.lang.startsWith('de'));
      if (de) u.voice = de;
      u.onerror = (e) => console.error('Speech synthesis error:', e.error);
      synth.speak(u);
    }

    // Algorithmic Large-Scale Number Generator Engine Method (0 to 100 Million converter rule matrix)
    function generateGermanNumberStringFormula(num) {
      if (num === 0) return "null";
      
      const units = ["", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun"];
      const teens = ["zehn", "elf", "zwölf", "dreizehn", "vierzehn", "fünfzehn", "sechzehn", "siebzehn", "achtzehn", "neunzehn"];
      const tens = ["", "zehn", "zwanzig", "dreißig", "vierzig", "fünfzig", "sechzig", "siebzig", "achtzig", "neunzig"];

      function convertSubHundreds(val) {
        if (val < 10) return units[val];
        if (val < 20) return teens[val - 10];
        const u = val % 10;
        const t = Math.floor(val / 10);
        if (u === 0) return tens[t];
        return (u === 1 ? "ein" : units[u]) + "und" + tens[t];
      }

      function convertSubThousands(val) {
        const h = Math.floor(val / 100);
        const rem = val % 100;
        let res = "";
        if (h > 0) res += (h === 1 ? "ein" : units[h]) + "hundert";
        if (rem > 0) res += convertSubHundreds(rem);
        return res;
      }

      let outputText = "";
      let remainingValue = num;

      if (remainingValue >= 1000000) {
        const mill = Math.floor(remainingValue / 1000000);
        remainingValue %= 1000000;
        if (mill === 1) outputText += "eine Million";
        else outputText += convertSubThousands(mill) + " Millionen";
      }

      if (remainingValue >= 1000) {
        const thous = Math.floor(remainingValue / 1000);
        remainingValue %= 1000;
        if (thous === 1) outputText += "eintausend";
        else outputText += convertSubThousands(thous) + "tausend";
      }

      if (remainingValue > 0) {
        outputText += convertSubThousands(remainingValue);
      }

      if (outputText.endsWith("eins") && num > 1) {
        outputText = outputText.slice(0, -4) + "eins";
      }
      return outputText;
    }

    // --- A1 E-Mail Writing Auto-Checker (heuristic grammar/content/style feedback) ---
    function checkEmailWriting() {
      const wData = a1SkillsDatabase.writing[activeSkillQuestionIndex % a1SkillsDatabase.writing.length];
      const text = writingUserText.trim();
      const lower = text.toLowerCase();
      const words = text.split(/\s+/).filter(Boolean);
      const wordCount = words.length;

      const salutations = ['liebe ', 'lieber ', 'hallo', 'sehr geehrte', 'sehr geehrter', 'guten morgen', 'guten tag'];
      const first60 = lower.slice(0, 60);
      const hasSalutation = salutations.some(s => first60.includes(s));

      const closings = ['viele grüße', 'liebe grüße', 'beste grüße', 'herzliche grüße', 'freundliche grüße', 'mit freundlichen grüßen', 'lg ', 'bis bald', 'dein ', 'deine '];
      const last80 = lower.slice(-80);
      const hasClosing = closings.some(s => last80.includes(s));

      const pointsCovered = wData.pointKeywords.map(variants => variants.some(v => lower.includes(v)));
      const coveredCount = pointsCovered.filter(Boolean).length;

      const hasEndPunctuation = /[.!?]\s*$/.test(text);
      const doubleSpace = / {2,}/.test(text);
      const missingSpaceAfterPunct = /[.,!?][A-Za-zÄÖÜäöü]/.test(text);

      const grammarRules = [
        { p: /\bich haben\b/i, tip: "Nach 'ich' heißt es 'ich habe', nicht 'ich haben'." },
        { p: /\bich (sind|seid)\b/i, tip: "Nach 'ich' heißt es 'ich bin'." },
        { p: /\bdu (habe|hat|habt|haben)\b/i, tip: "Nach 'du' heißt es 'du hast'." },
        { p: /\bdu (bin|ist|sind|seid)\b/i, tip: "Nach 'du' heißt es 'du bist'." },
        { p: /\ber (habe|hast|habt|haben)\b/i, tip: "Nach 'er/sie/es' heißt es 'er/sie/es hat'." },
        { p: /\bwir (bin|bist|ist|seid)\b/i, tip: "Nach 'wir' heißt es 'wir sind'." },
        { p: /\bwir (habe|hast|hat|habt)\b/i, tip: "Nach 'wir' heißt es 'wir haben'." },
        { p: /\bich kannst\b/i, tip: "Nach 'ich' heißt es 'ich kann', nicht 'ich kannst'." },
        { p: /\bich möchtest\b/i, tip: "Nach 'ich' heißt es 'ich möchte', nicht 'ich möchtest'." },
        { p: /\bich wollen\b/i, tip: "Nach 'ich' heißt es 'ich will', nicht 'ich wollen'." }
      ];
      const grammarIssues = grammarRules.filter(r => r.p.test(text)).map(r => r.tip);

      let score = 0;
      score += coveredCount * 20;
      if (hasSalutation) score += 15;
      if (hasClosing) score += 15;
      if (wordCount >= wData.minWords && wordCount <= wData.maxWords) score += 10;
      else if (wordCount >= Math.max(5, wData.minWords - 5)) score += 5;
      score -= grammarIssues.length * 5;
      if (doubleSpace) score -= 3;
      if (missingSpaceAfterPunct) score -= 3;
      if (!hasEndPunctuation) score -= 5;
      score = Math.max(0, Math.min(100, score));

      writingCheckResult = {
        wordCount, hasSalutation, hasClosing, pointsCovered, coveredCount,
        hasEndPunctuation, doubleSpace, missingSpaceAfterPunct, grammarIssues, score
      };

      if (!writingSubmitted) {
        writingSubmitted = true;
        recordSkillHit('writing', score >= 70);
        let xp = 3;
        if (score >= 70) xp = 15;
        else if (score >= 40) xp = 8;
        rewardXP(xp);
        writingCheckResult.xpAwarded = xp;
      }

      renderActiveTabModule();
    }

    // --- Speaking Pronunciation Check via Browser Microphone (Web Speech API) ---
    function normalizeGermanForMatch(str) {
      return String(str).toLowerCase()
        .replace(/[.,!?;:"'„“]/g, '')
        .replace(/ß/g, 'ss')
        .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function computeSpeechMatchScore(target, spoken) {
      const t = normalizeGermanForMatch(target).split(' ').filter(Boolean);
      const s = normalizeGermanForMatch(spoken).split(' ').filter(Boolean);
      if (t.length === 0) return 0;
      const sCopy = s.slice();
      let matched = 0;
      t.forEach(word => {
        const idx = sCopy.indexOf(word);
        if (idx !== -1) { matched++; sCopy.splice(idx, 1); }
      });
      return matched / t.length;
    }

    function getSpeechRecognitionAPI() {
      return window.SpeechRecognition || window.webkitSpeechRecognition || null;
    }

    function isSpeechRecognitionSupported() {
      // iOS/iPadOS browsers (Safari, and every other browser on iOS, since
      // they all run on WebKit under Apple's rules) do not implement the
      // SpeechRecognition Web API at all, regardless of vendor prefix checks.
      const ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Macintosh') && typeof navigator !== 'undefined' && navigator.maxTouchPoints > 1);
      return !!getSpeechRecognitionAPI() && !isIOS;
    }

    function runSpeechRecognitionPass(sData) {
      const SpeechRecognitionAPI = getSpeechRecognitionAPI();
      const recognition = new SpeechRecognitionAPI();
      recognition.lang = 'de-DE';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      let settled = false;

      recognition.onresult = (event) => {
        settled = true;
        const transcript = event.results[0][0].transcript;
        speakingRecognizedText = transcript;
        const score = computeSpeechMatchScore(sData.text, transcript);
        if (score >= 0.75) speakingFeedback = 'correct';
        else if (score >= 0.4) speakingFeedback = 'partial';
        else speakingFeedback = 'incorrect';

        recordSkillHit('speaking', speakingFeedback === 'correct');
        if (speakingFeedback === 'correct' && !speakingXPAwarded) {
          speakingXPAwarded = true;
          rewardXP(10);
        }
        speakingRecognitionActive = false;
        renderActiveTabModule();
      };

      recognition.onerror = (event) => {
        settled = true;
        speakingRecognitionActive = false;
        if (event.error === 'no-speech') {
          speakingErrorMessage = 'Es wurde keine Sprache erkannt. Bitte versuchen Sie es noch einmal und sprechen Sie direkt nach dem Antippen des Knopfes.';
        } else if (event.error === 'not-allowed' || event.error === 'audio-capture' || event.error === 'service-not-allowed') {
          speakingErrorMessage = 'Kein Zugriff auf das Mikrofon. Bitte erlauben Sie den Mikrofonzugriff in den Browser-Einstellungen für diese Seite und laden Sie die Seite neu.';
        } else if (event.error === 'network') {
          speakingErrorMessage = 'Netzwerkfehler bei der Spracherkennung. Bitte prüfen Sie Ihre Internetverbindung.';
        } else {
          speakingErrorMessage = 'Fehler bei der Spracherkennung (' + event.error + '). Bitte versuchen Sie es erneut.';
        }
        renderActiveTabModule();
      };

      recognition.onend = () => {
        if (!settled && speakingRecognitionActive) {
          // Recognition ended without ever firing onresult/onerror
          speakingRecognitionActive = false;
          speakingErrorMessage = 'Es wurde nichts aufgenommen. Bitte versuchen Sie es erneut und sprechen Sie deutlich in das Mikrofon.';
          renderActiveTabModule();
        }
      };

      try {
        recognition.start();
      } catch (e) {
        speakingRecognitionActive = false;
        speakingErrorMessage = 'Spracherkennung konnte nicht gestartet werden: ' + e.message;
        renderActiveTabModule();
      }
    }

    function startSpeakingRecognition() {
      speakingErrorMessage = null;

      if (!isSpeechRecognitionSupported()) {
        speakingErrorMessage = getSpeechRecognitionAPI()
          ? 'Ihr Gerät unterstützt leider keine Spracherkennung im Browser (iOS/iPadOS schränkt diese Funktion für alle Browser ein). Bitte probieren Sie diese Übung auf einem Android-Gerät oder einem Desktop-Computer mit Chrome oder Edge.'
          : 'Ihr Browser unterstützt keine Spracherkennung. Bitte verwenden Sie Chrome oder Edge auf einem Android-Gerät oder Desktop-Computer.';
        renderActiveTabModule();
        return;
      }

      const sData = a1SkillsDatabase.speaking[activeSkillQuestionIndex % a1SkillsDatabase.speaking.length];
      speakingRecognitionActive = true;
      speakingRecognizedText = null;
      speakingFeedback = null;
      renderActiveTabModule();

      // Explicitly request microphone permission first so we get a clear,
      // reliable prompt and error reason, then run the recognition pass.
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then((stream) => {
            stream.getTracks().forEach(t => t.stop());
            runSpeechRecognitionPass(sData);
          })
          .catch((err) => {
            speakingRecognitionActive = false;
            const name = err && err.name;
            if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
              speakingErrorMessage = 'Der Mikrofonzugriff ist für diese Seite blockiert. Tippen Sie auf das Schloss-/Info-Symbol links neben der Adresse, öffnen Sie "Berechtigungen" bzw. "Website-Einstellungen" und stellen Sie Mikrofon auf "Zulassen". Prüfen Sie zusätzlich unter Android-Einstellungen → Apps → Chrome → Berechtigungen, ob Mikrofon dort erlaubt ist. Laden Sie die Seite danach neu.';
            } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
              speakingErrorMessage = 'Es wurde kein Mikrofon gefunden.';
            } else if (name === 'NotReadableError' || name === 'TrackStartError') {
              speakingErrorMessage = 'Das Mikrofon wird gerade von einer anderen App verwendet. Bitte schließen Sie andere Apps, die das Mikrofon nutzen, und versuchen Sie es erneut.';
            } else {
              speakingErrorMessage = 'Kein Zugriff auf das Mikrofon (' + (name || 'unbekannter Fehler') + '). Bitte prüfen Sie die Mikrofon-Berechtigung für diese Seite und laden Sie die Seite neu.';
            }
            renderActiveTabModule();
          });
      } else {
        runSpeechRecognitionPass(sData);
      }
    }

    // --- Fallback: Record & Self-Check (for Safari on iPhone/iPad/Mac and
    // any other browser without SpeechRecognition support). Uses
    // MediaRecorder, which Safari DOES support, unlike SpeechRecognition. ---
    function hasMediaRecorderSupport() {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    }

    function startFallbackRecording() {
      speakingErrorMessage = null;
      if (!hasMediaRecorderSupport()) {
        speakingErrorMessage = 'Aufnahme wird auf diesem Gerät nicht unterstützt.';
        renderActiveTabModule();
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then((stream) => {
          fallbackMediaStreamObj = stream;
          fallbackAudioChunks = [];
          const recorder = new MediaRecorder(stream);
          fallbackMediaRecorderObj = recorder;

          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) fallbackAudioChunks.push(e.data);
          };
          recorder.onstop = () => {
            const blob = new Blob(fallbackAudioChunks, { type: fallbackAudioChunks[0] && fallbackAudioChunks[0].type ? fallbackAudioChunks[0].type : 'audio/webm' });
            if (fallbackAudioUrl) { try { URL.revokeObjectURL(fallbackAudioUrl); } catch (e) {} }
            fallbackAudioUrl = URL.createObjectURL(blob);
            fallbackRecordingActive = false;
            if (fallbackMediaStreamObj) {
              fallbackMediaStreamObj.getTracks().forEach(t => t.stop());
              fallbackMediaStreamObj = null;
            }
            renderActiveTabModule();
          };

          recorder.start();
          fallbackRecordingActive = true;
          fallbackAudioUrl = null;
          fallbackSelfAssessed = false;
          renderActiveTabModule();
        })
        .catch((err) => {
          const name = err && err.name;
          if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
            speakingErrorMessage = 'Der Mikrofonzugriff ist blockiert. Bitte erlauben Sie den Mikrofonzugriff für diese Seite in den Browser-Einstellungen und laden Sie die Seite neu.';
          } else {
            speakingErrorMessage = 'Kein Zugriff auf das Mikrofon (' + (name || 'unbekannter Fehler') + ').';
          }
          renderActiveTabModule();
        });
    }

    function stopFallbackRecording() {
      if (fallbackMediaRecorderObj && fallbackMediaRecorderObj.state !== 'inactive') {
        fallbackMediaRecorderObj.stop();
      }
    }

      if (sp.particle === 'none') return '';
      const n = sp.particle === 'snow' ? 16 : 10;
      let out = '';
      for (let i = 0; i < n; i++) {
        const x = 6 + (i * 37) % 388;
        const dur = (6 + (i % 5) * 1.6).toFixed(1);
        const delay = ((i * 0.7) % 6).toFixed(1);
        const r = sp.particle === 'snow' ? 2.2 : 3.2;
        const shape = sp.particle === 'snow'
          ? `<circle r="${r}" fill="#ffffff" opacity=".85"/>`
          : `<ellipse rx="${r}" ry="${r*0.6}" fill="${sp.leaf}" opacity=".85"/>`;
        out += `<g transform="translate(${x},-10)">${shape}
          <animateTransform attributeName="transform" type="translate" additive="sum"
            values="0,-10; ${(i%2?14:-14)},300" dur="${dur}s" begin="${delay}s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="rotate" additive="sum"
            values="0;360" dur="${dur}s" begin="${delay}s" repeatCount="indefinite"/>
        </g>`;
      }
      return `<g pointer-events="none">${out}</g>`;

      const learned = roomObjects.filter(o => objProgress(o).frac === 1).length;
      return journalEntries.filter(e => e.need <= learned).length;
    }

    // Full grammatical picture for a vocabulary entry: article, indefinite
    // form, and a plain-language note on what kind of word it is.
    const genderInfo = {
      masculine: { def:'der', indef:'ein',  label:'masculine', colour:'#60a5fa' },
      feminine:  { def:'die', indef:'eine', label:'feminine',  colour:'#f472b6' },
      neuter:    { def:'das', indef:'ein',  label:'neuter',    colour:'#fbbf24' },
      plural:    { def:'die', indef:'\u2014', label:'plural',  colour:'#a78bfa' }
    };

    const kindNotes = {
      letter:'Letter of the alphabet', umlaut:'Umlaut sound', ligature:'Special letter',
      phonics:'Pronunciation rule', number:'Number', day:'Day of the week', month:'Month',
      season:'Season', daypart:'Part of the day', colour:'Colour (adjective)',
      hobby:'Activity', greeting:'Greeting phrase', departure:'Farewell phrase',
      query:'Question word', 'informal time':'Time phrase', dialogue:'Useful sentence',
      routine:'Everyday sentence', split:'Has a male and a female form',
      expression:'Expression'
    };

    function bareNoun(item) {
      return String(item.german).replace(/^(der|die|das)\s+/i, '').trim();
    }

    function wordGrammar(item) {
      const gi = genderInfo[item.gender];
      if (gi) {
        const noun = bareNoun(item);
        return {
          isNoun: true, colour: gi.colour, label: gi.label,
          definite: gi.def + ' ' + noun,
          indefinite: gi.indef === '\u2014' ? '\u2014' : gi.indef + ' ' + noun,
          note: item.gender === 'plural'
            ? 'Plural nouns take die and have no indefinite article.'
            : 'Nouns are always capitalised in German.'
        };
      }
      return { isNoun:false, colour:'#94a3b8', label:item.gender,
               note: kindNotes[item.gender] || 'Not a noun \u2014 no article needed.' };
    }

    // Compact card used by both the flashcard and the postcard
    // every German form inside the chips is marked so Chrome leaves it alone
    function grammarChips(item) {
      const g = wordGrammar(item);
      if (!g.isNoun) {
        return `<div class="mt-2 p-2.5 rounded-xl text-left" style="background:rgba(148,163,184,.12)">
          <p class="text-[9px] font-black uppercase tracking-wider" style="color:${g.colour}">${g.label}</p>
          <p class="text-[11px] font-bold text-slate-300 mt-0.5">${g.note}</p>
        </div>`;
      }
      return `<div class="mt-2 p-2.5 rounded-xl text-left space-y-1" style="background:rgba(148,163,184,.12)">
        <p class="text-[9px] font-black uppercase tracking-wider" style="color:${g.colour}">${g.label}</p>

            <p class="text-xs font-black text-slate-100" translate="no" lang="de">${g.indefinite}</p>
          </div>
        </div>
        <p class="text-[10px] font-bold text-slate-400">${g.note}</p>

      const all = [];
      Object.keys(a1VocabularyDatabase).forEach(c => a1VocabularyDatabase[c].forEach(i => all.push(i)));

      return all[day % all.length];

            <button onclick="toggleJournal()" class="btn3d shrink-0 px-3 py-2 rounded-2xl text-center" style="background:#3f3a5c">
              <span class="text-base leading-none block">\ud83d\udcd3</span>
              <span class="text-[9px] font-black text-slate-300">${journalUnlockedCount()}/${journalEntries.length}</span>
            </button>
          </div>

          ${showMoment ? `
            <div class="on-dark rounded-3xl p-3 flex items-center gap-3" style="background:#2a2440; box-shadow:0 4px 0 #1c1830">

                <div class="flex gap-2 mt-2">
                  <button onclick="dismissMoment(); toggleRoomObject('${moment.obj}')" class="btn3d px-3 py-1.5 rounded-xl text-[10px] font-black" style="background:#4f46e5">Help Bruno</button>
                  <button onclick="dismissMoment()" class="btn3d px-3 py-1.5 rounded-xl text-[10px] font-black" style="background:#334155">Later</button>
                </div>

              </div>
              <button onclick='speakGerman(${safeOnclickArg(wotd.german)}, true)' class="btn3d px-3 py-2 text-white font-black text-[11px] rounded-xl shrink-0" style="background:#4f46e5">\ud83d\udd0a</button>

    // Games render as a full-screen overlay from any tab
    function renderGameOverlay(container, conf) {
      if (activeGameMode === 'match') {
        let leftColHTML = '', rightColHTML = '';
        matchGamePairs.germans.forEach((g, i) => {
          const st = g.matched ? 'bg-emerald-600 text-white' : (matchSelectedGermanIdx === i ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-200');
          leftColHTML += `<button onclick="handleMatchSelection('ger', ${i})" class="btn3d w-full p-3 rounded-xl font-bold text-xs text-center ${st}">${g.text}</button>`;
        });
        matchGamePairs.english.forEach((e, i) => {
          const st = e.matched ? 'bg-emerald-600 text-white' : (matchSelectedEnglishIdx === i ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-200');
          rightColHTML += `<button onclick="handleMatchSelection('eng', ${i})" class="btn3d w-full p-3 rounded-xl font-bold text-xs text-center ${st}">${e.text}</button>`;
        });
        container.innerHTML = `
          <div class="space-y-4">
            <div class="flex justify-between items-center px-1">
              <h3 class="text-sm font-black text-white">Word match</h3>
              <button onclick="closeGame()" class="text-slate-500 text-lg font-black">\u2715</button>
            </div>
            <p class="text-[11px] text-slate-400">Tap a German word, then tap its English meaning.</p>
            <div class="grid grid-cols-2 gap-3 pt-2">
              <div class="space-y-2">${leftColHTML}</div>
              <div class="space-y-2">${rightColHTML}</div>
            </div>
            ${matchSuccessCount === 4 ? `
              <div class="p-4 ${conf.cardBg} border rounded-xl text-center space-y-3">
                <img src="./bears/bear-dance.png" alt="" class="h-24 w-auto mx-auto">
                <p class="text-sm font-black text-emerald-400">All matched! +30 XP</p>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="initWordMatchGame()" class="btn3d py-3 bg-indigo-600 text-white font-black text-xs rounded-xl">Play again</button>
                  <button onclick="closeGame()" class="btn3d py-3 bg-slate-700 text-white font-black text-xs rounded-xl">Done</button>
                </div>
              </div>` : ''}
          </div>`;
        return;
      }

      if (activeGameMode === 'gender') {
        let raw = genderGameActiveItem ? genderGameActiveItem.german : '';
        let noun = raw.replace(/^(der|die|das)\s+/i, '');
        noun = noun.charAt(0).toUpperCase() + noun.slice(1);
        container.innerHTML = `
          <div class="space-y-4">
            <div class="flex justify-between items-center px-1">
              <h3 class="text-sm font-black text-white">Gender blitz</h3>
              <button onclick="closeGame()" class="text-slate-500 text-lg font-black">\u2715</button>
            </div>
            <p class="text-[11px] text-slate-400">Choose the right article for the noun.</p>
            <div class="${conf.cardBg} border p-8 rounded-2xl text-center space-y-2">
              <span class="text-2xl font-black text-amber-400 block">${noun}</span>
              <span class="text-xs text-slate-400">${genderGameActiveItem ? genderGameActiveItem.english : ''}</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="submitGenderStrikeAnswer('masculine')" class="btn3d p-4 bg-blue-600 text-white font-black text-sm rounded-xl">der</button>
              <button onclick="submitGenderStrikeAnswer('feminine')" class="btn3d p-4 bg-pink-600 text-white font-black text-sm rounded-xl">die</button>
              <button onclick="submitGenderStrikeAnswer('neuter')" class="btn3d p-4 bg-amber-600 text-white font-black text-sm rounded-xl">das</button>
            </div>
            ${genderGameFeedback !== null ? `
              <div class="p-4 ${conf.cardBg} border rounded-xl text-center space-y-3">
                <img src="./bears/${genderGameFeedback === 'correct' ? 'bear-run' : 'bear-think'}.png" alt="" class="h-20 w-auto mx-auto">
                <p class="text-xs font-black ${genderGameFeedback === 'correct' ? 'text-emerald-400' : 'text-rose-400'}">
                  ${genderGameFeedback === 'correct' ? '\u2713 Correct! +5 XP' : '\u2717 Not quite.'}
                </p>
                <p class="text-[11px] text-slate-400">Full form: <strong class="text-slate-200">${genderGameActiveItem.german}</strong></p>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="initGenderBlitzGame()" class="btn3d py-3 bg-indigo-600 text-white font-black text-xs rounded-xl">Next word</button>
                  <button onclick="closeGame()" class="btn3d py-3 bg-slate-700 text-white font-black text-xs rounded-xl">Done</button>
                </div>
              </div>` : ''}
          </div>`;
      }
    }

    function closeGame() { activeGameMode = 'none'; renderActiveTabModule(); }

    // View Route Processing Center Hub
    function renderActiveTabModule() {
      const container = document.getElementById('main-scroll-view');
      const ov = document.getElementById('sb-overlay');
      if (ov && !(activeTab === 'dashboard' && activeGameMode === 'none' && !activeExamRunningMode)) ov.innerHTML = '';
      const conf = systemThemeProfiles[currentThemeProfile] || systemThemeProfiles['midnight-slate'];

      // Games open as an overlay from either the Path or the Practice tab
      if (activeGameMode !== 'none') { renderGameOverlay(container, conf); return; }

      if (activeTab === 'dashboard') {

        // ---- Lesson quiz overlay ----
        if (quizActive) {
          if (quizFinished) {
            const passed = quizCorrect >= Math.min(4, quizQuestions.length);
            container.innerHTML = `
              <div class="text-center p-6 ${conf.cardBg} border rounded-2xl shadow-xl space-y-4">
                <img src="./bears/${passed ? 'bear-jump' : 'bear-think'}.png" alt="" class="h-28 w-auto mx-auto" onerror="this.style.display='none'">
                ${passed ? '<p class="text-2xl tracking-widest">\ud83c\udf89 \u2b50 \ud83c\udf6f</p>' : ''}

                <p class="text-[11px] font-bold text-slate-400 italic">${passed
                  ? '\u201eSuper gemacht! Ich bin stolz auf dich.\u201c \u2014 Bruno'

                </div>

          const q = quizQuestions[quizIndex];
          container.innerHTML = `

              <p class="text-[11px] font-black uppercase tracking-wider text-slate-400">${q.ask}</p>
              <div class="${conf.cardBg} border p-6 rounded-2xl text-center space-y-2">
                ${q.prompt ? `<p class="text-2xl font-black text-white" translate="no" lang="de">${q.prompt}</p>` : `<p class="text-4xl">\ud83d\udc42</p>`}

                ${q.speak ? `<button onclick='speakGerman(${safeOnclickArg(q.speak)}, true)' class="btn3d mt-1 px-4 py-2 bg-indigo-600 text-white font-black text-[11px] rounded-xl">\ud83d\udd0a ${q.prompt ? 'Listen' : 'Play again'}</button>` : ''}

              <div class="space-y-2">
                ${q.options.map((o,i) => {
                  let st = 'bg-slate-800 text-slate-200';

                    else if (i === quizPicked) st = 'bg-rose-600 text-white';
                    else st = 'bg-slate-900 text-slate-600 opacity-50';

                  return `<button onclick="answerQuiz(${i})" ${quizPicked!==null?'disabled':''} class="btn3d w-full text-left p-3.5 rounded-xl text-sm font-bold ${st}">${o}</button>`;
                }).join('')}
              </div>
              ${quizPicked !== null ? `
                ${q.explain ? `<div class="p-3 rounded-xl ${quizPicked === q.correct ? 'bg-emerald-950/50 text-emerald-300' : 'bg-amber-950/50 text-amber-300'} text-[11px] font-bold flex items-center gap-2">
                  <img src="./bears/${quizPicked === q.correct ? 'bear-hug' : 'bear-think'}.png" alt="" class="h-12 w-auto shrink-0">
                  <span class="flex-1">${q.explain}</span>
                </div>` : ''}
                <button onclick="nextQuizStep()" class="btn3d w-full py-3.5 bg-indigo-600 text-white font-black text-sm rounded-xl">
                  ${quizIndex < quizQuestions.length-1 ? 'Continue' : 'Finish'}

          return;

          container.innerHTML = renderBearRoom(conf);

        }

      else if (activeTab === 'vocabulary') {

            </div>

            <div class="flashcard-wrapper w-full h-72 md:h-80 cursor-pointer ${isVocabCardFlipped ? 'flipped' : ''}" onclick="this.classList.toggle('flipped'); isVocabCardFlipped=!isVocabCardFlipped;">
              <div class="flashcard-inner">

                    <button onclick='event.stopPropagation(); triggerSpeechSynthesis(${safeOnclickArg(card.german)});' class="mt-3 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-[10px] rounded-lg shadow-md flex items-center gap-1 transition-transform active:scale-95">

            </div>
          `;
        }

        container.innerHTML = `

    // ===================== Goethe/Telc A1 Mock Exam Engine =====================
    function renderExamsTab(container, conf) {
      if (!activeExamRunningMode) {
        let rows = '';
        mockExamsDatabase.forEach((ex, idx) => {
          rows += `
            <div class="${conf.cardBg} border p-4 rounded-xl flex flex-col justify-between space-y-3">

            </div>
          `;
        });
        container.innerHTML = `
          <div class="space-y-4">
            <div class="px-1">
              <h3 class="text-sm font-black tracking-tight text-white">Goethe / Telc A1 Modellprüfungen</h3>
              <p class="text-[11px] text-slate-400 font-medium">Vollständige Prüfungen mit allen vier Teilen: Hören, Lesen, Schreiben, Sprechen.</p>
            </div>
            <div class="space-y-3">${rows}</div>
          </div>
        `;
        return;
      }

      const exam = mockExamsDatabase[selectedActiveExamIndex];
      const sectionLabels = ['Hören', 'Lesen', 'Schreiben', 'Sprechen'];

      const progressHTML = `
        <div class="flex justify-between items-center px-1 mb-3">
          <span class="text-[10px] font-black uppercase text-slate-400 tracking-wider">${exam.title}</span>
          <button onclick="exitMockExam()" class="text-[10px] bg-slate-800 px-2 py-1 rounded font-bold border border-slate-700">✕ Verlassen</button>
        </div>
        <div class="flex gap-1 mb-4 px-1">
          ${sectionLabels.map((lbl, i) => `<div class="flex-1 text-center text-[9px] font-black py-1.5 rounded-lg border ${i === activeExamSectionIndex ? 'bg-indigo-600 border-indigo-500 text-white' : (i < activeExamSectionIndex ? 'bg-emerald-950 border-emerald-800 text-emerald-400' : 'bg-slate-900 border-slate-800 text-slate-600')}">${lbl}</div>`).join('')}
        </div>
      `;

      // --- Hören / Lesen (auto-graded multiple choice flow) ---
      if (activeExamSectionIndex === 0 || activeExamSectionIndex === 1) {
        const skillKey = activeExamSectionIndex === 0 ? 'hoeren' : 'lesen';
        const list = exam[skillKey];

        if (currentExamQuestionIndex >= list.length) {
          const correct = list.filter((q, i) => activeExamUserAnswersCollected[skillKey][i] === q.c).length;
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <div class="text-center p-6 ${conf.cardBg} border rounded-2xl shadow-xl space-y-3">
                <span class="text-4xl block">✅</span>
                <h3 class="text-base font-black text-white">${skillKey === 'hoeren' ? 'Hören' : 'Lesen'} abgeschlossen</h3>
                <p class="text-xs text-slate-400 font-semibold">Ergebnis: <span class="text-emerald-400 font-black">${correct} / ${list.length}</span> richtig</p>
                <button onclick="advanceExamSection()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu ${skillKey === 'hoeren' ? 'Lesen' : 'Schreiben'} →</button>
              </div>
            </div>
          `;
          return;
        }

        const q = list[currentExamQuestionIndex];
        container.innerHTML = `
          <div class="space-y-4">${progressHTML}
            <div class="flex justify-between items-center px-1">
              <span class="text-[10px] font-black text-slate-400">Teil ${q.teil} • Frage ${currentExamQuestionIndex + 1} von ${list.length}</span>
            </div>
            ${skillKey === 'hoeren' ? `
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-3">
                <button onclick='speakGerman(${safeOnclickArg(q.audioText)})' class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs rounded-xl flex items-center justify-center gap-2">🔊 Audio abspielen</button>
                <p class="text-xs font-bold leading-relaxed text-slate-200">${q.question}</p>
              </div>
            ` : `
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-2">
                <p class="text-[9px] uppercase font-black text-slate-500 tracking-wider">Lesetext</p>
                <p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed">${q.readingText}</p>
                <p class="text-xs font-bold text-slate-100 mt-2">${q.question}</p>
              </div>
            `}
            <div class="space-y-2">
              ${q.options.map((opt, oIdx) => {
                let optStyle = "bg-slate-800 border-slate-700 text-slate-300";
                if (processingExamEvaluationFeedbackMode) {
                  if (oIdx === q.c) optStyle = "bg-emerald-950 border-emerald-500 text-emerald-200 font-black";
                  else if (oIdx === activeExamUserAnswersCollected[skillKey][currentExamQuestionIndex]) optStyle = "bg-rose-950 border-rose-500 text-rose-200";
                  else optStyle = "bg-slate-900 border-slate-800 opacity-40 text-slate-600";
                }
                return `<button onclick="submitActiveExamOptionAnswer(${oIdx})" ${processingExamEvaluationFeedbackMode ? 'disabled' : ''} class="w-full text-left p-3.5 border rounded-xl text-xs font-bold transition-all ${optStyle}">${opt}</button>`;
              }).join('')}
            </div>
            ${processingExamEvaluationFeedbackMode ? `
              <button onclick="advanceActiveExamQuestionStep()" class="w-full mt-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl">Nächste Frage →</button>
            ` : ''}
          </div>
        `;
        return;
      }

      // --- Schreiben (writing practice with self-check model answers) ---
      if (activeExamSectionIndex === 2) {
        const sw = exam.schreiben;
        if (schreibenTaskIndex === 0) {
          const f = sw.form;
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-3">
                <h4 class="text-xs font-black text-white">${f.title}</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${f.scenario}</p>
                <div class="space-y-2 pt-2">
                  ${f.fields.map(field => `
                    <div>
                      <label class="text-[10px] font-bold text-slate-400">${field}</label>
                      <input type="text" class="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200" placeholder="${field}...">
                    </div>
                  `).join('')}
                </div>
                ${f.fieldSolutions ? `
                  <button onclick="toggleSchreibenFormSolutions()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold text-[11px] rounded-lg">${schreibenFormShowSolutions ? 'Lösungen ausblenden' : 'Lösungen anzeigen'}</button>
                  ${schreibenFormShowSolutions ? `
                    <div class="p-3 bg-indigo-950/40 border border-indigo-900 rounded-lg text-xs text-indigo-200 space-y-1">
                      ${f.fields.map((field, i) => `<p><span class="font-black">${field}:</span> ${f.fieldSolutions[i]}</p>`).join('')}
                    </div>
                  ` : ''}
                ` : ''}
              </div>
              <button onclick="advanceSchreibenTask()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu Teil 2 →</button>
            </div>
          `;
        } else {
          const m = sw.message;
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-3">
                <h4 class="text-xs font-black text-white">${m.title}</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${m.instructions}</p>
                <ul class="text-xs text-slate-400 list-disc list-inside space-y-1">
                  ${m.points.map(p => `<li>${p}</li>`).join('')}
                </ul>
                <textarea rows="4" class="w-full mt-2 p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200" placeholder="Schreiben Sie hier Ihre Nachricht..."></textarea>
                <button onclick="toggleSchreibenSample(1)" class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold text-[11px] rounded-lg">${schreibenShowSample[1] ? 'Musterantwort ausblenden' : 'Musterantwort anzeigen'}</button>
                ${schreibenShowSample[1] ? `<div class="p-3 bg-indigo-950/40 border border-indigo-900 rounded-lg text-xs text-indigo-200 leading-relaxed">${m.sample}</div>` : ''}
              </div>
              <button onclick="advanceExamSection()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu Sprechen →</button>
            </div>
          `;
        }
        return;
      }

      // --- Sprechen (speaking practice with TTS model answers + self-check) ---
      if (activeExamSectionIndex === 3) {
        const sp = exam.sprechen;
        if (sprechenPartIndex === 0) {
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-3">
                <h4 class="text-xs font-black text-white">${sp.intro.title}</h4>
                <p class="text-[10px] text-slate-400">Sprechen Sie frei über sich selbst. Nutzen Sie diese Stichwörter:</p>
                <div class="flex flex-wrap gap-1.5">
                  ${sp.intro.keywords.map(k => `<span class="text-[10px] font-bold bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-1 rounded-lg">${k}</span>`).join('')}
                </div>
                <button onclick='speakGerman(${safeOnclickArg(sp.intro.sample)})' class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-[11px] rounded-lg">🔊 Beispielantwort anhören</button>
                <p class="text-xs text-slate-300 italic leading-relaxed">"${sp.intro.sample}"</p>
                <label class="flex items-center gap-2 text-[11px] text-slate-300 font-bold pt-1">
                  <input type="checkbox" ${sprechenChecklist.intro ? 'checked' : ''} onchange="toggleSprechenChecklistItem('intro')"> Ich habe das geübt
                </label>
              </div>
              <button onclick="advanceSprechenPart()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu Teil 2 →</button>
            </div>
          `;
        } else if (sprechenPartIndex === 1) {
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <h4 class="text-xs font-black text-white px-1">Teil 2: Fragen und Antworten</h4>
              <div class="space-y-3">
                ${sp.qa.map((item, idx) => `
                  <div class="${conf.cardBg} border p-4 rounded-xl space-y-2">
                    <span class="text-[9px] uppercase font-black text-indigo-400 tracking-wider">${item.keyword}</span>
                    <p class="text-xs font-bold text-slate-200">${item.sampleQ}</p>
                    <button onclick='speakGerman(${safeOnclickArg(item.sampleA)})' class="text-[10px] font-bold text-indigo-400">🔊 Beispielantwort anhören</button>
                    <p class="text-xs text-slate-400 italic">"${item.sampleA}"</p>
                    <label class="flex items-center gap-2 text-[10px] text-slate-300 font-bold pt-1">
                      <input type="checkbox" ${sprechenChecklist.qa[idx] ? 'checked' : ''} onchange="toggleSprechenChecklistItem('qa', ${idx})"> Geübt
                    </label>
                  </div>
                `).join('')}
              </div>
              <button onclick="advanceSprechenPart()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu Teil 3 →</button>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <h4 class="text-xs font-black text-white px-1">Teil 3: Bitten formulieren</h4>
              <div class="space-y-3">
                ${sp.requests.map((item, idx) => `
                  <div class="${conf.cardBg} border p-4 rounded-xl space-y-2">
                    <p class="text-xs font-bold text-slate-200">${item.prompt}</p>
                    <button onclick='speakGerman(${safeOnclickArg(item.sample)})' class="text-[10px] font-bold text-indigo-400">🔊 Beispiel anhören</button>
                    <p class="text-xs text-slate-400 italic">"${item.sample}"</p>
                    <label class="flex items-center gap-2 text-[10px] text-slate-300 font-bold pt-1">
                      <input type="checkbox" ${sprechenChecklist.requests[idx] ? 'checked' : ''} onchange="toggleSprechenChecklistItem('requests', ${idx})"> Geübt
                    </label>
                  </div>
                `).join('')}
              </div>
              <button onclick="finishMockExam()" class="w-full p-3 bg-gradient-to-r from-emerald-500 to-indigo-500 font-black text-xs text-white rounded-xl">Prüfung abschließen ✓</button>
            </div>
          `;
        }
        return;
      }

      // --- Results screen ---
      if (activeExamSectionIndex === 4) {
        const correctHoeren = exam.hoeren.filter((q, i) => activeExamUserAnswersCollected.hoeren[i] === q.c).length;
        const correctLesen = exam.lesen.filter((q, i) => activeExamUserAnswersCollected.lesen[i] === q.c).length;
        const totalRight = correctHoeren + correctLesen;
        const totalQ = exam.hoeren.length + exam.lesen.length;
        const pct = Math.round((totalRight / totalQ) * 100);
        const passed = pct >= 60;
        const sprechenDone = sprechenChecklist.intro && sprechenChecklist.qa.every(x => x) && sprechenChecklist.requests.every(x => x);

        container.innerHTML = `
          <div class="text-center p-6 ${conf.cardBg} border rounded-2xl shadow-2xl space-y-4">
            <span class="text-5xl block">${passed ? '🏆' : '⏳'}</span>
            <h3 class="text-lg font-black text-white">${passed ? 'Prüfung bestanden!' : 'Bitte weiter üben'}</h3>
            <p class="text-xs text-slate-400 font-semibold">${exam.title}</p>
            <div class="text-left bg-slate-950 p-4 rounded-lg border border-slate-800 text-[11px] space-y-2 text-slate-300">
              <div class="flex justify-between"><span>Hören</span><span class="font-black text-white">${correctHoeren} / ${exam.hoeren.length}</span></div>
              <div class="flex justify-between"><span>Lesen</span><span class="font-black text-white">${correctLesen} / ${exam.lesen.length}</span></div>
              <div class="flex justify-between border-t border-slate-800 pt-2"><span>Gesamt (Hören + Lesen)</span><span class="font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}">${pct}%</span></div>
              <div class="flex justify-between"><span>Schreiben</span><span class="font-black text-indigo-400">Übung abgeschlossen</span></div>
              <div class="flex justify-between"><span>Sprechen</span><span class="font-black ${sprechenDone ? 'text-emerald-400' : 'text-amber-400'}">${sprechenDone ? 'Alle Teile geübt' : 'Teilweise geübt'}</span></div>
            </div>
            <p class="text-[10px] text-slate-500 leading-relaxed">Hinweis: Schreiben und Sprechen werden in der echten Prüfung von einem Prüfer bewertet. Vergleichen Sie Ihre Antworten mit den Musterlösungen, um sich selbst einzuschätzen.</p>
            <p class="text-xs text-slate-400">${passed ? '+50 XP Meilenstein erreicht!' : 'Bestehensgrenze: 60% in Hören + Lesen.'}</p>
            <button onclick="exitMockExam()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Zurück zur Prüfungsauswahl</button>
          </div>
        `;
        return;
      }
    }

    // Exam State Handler Methods
    function startSpecificMockExamSuite(idx) {
      selectedActiveExamIndex = idx;
      activeExamRunningMode = true;
      activeExamSectionIndex = 0;
      currentExamQuestionIndex = 0;
      activeExamUserAnswersCollected = { hoeren: [], lesen: [] };
      processingExamEvaluationFeedbackMode = false;
      schreibenTaskIndex = 0;
      schreibenShowSample = [false, false];
      schreibenFormShowSolutions = false;
      sprechenPartIndex = 0;
      sprechenSubIndex = 0;
      sprechenChecklist = { intro: false, qa: [false, false, false, false], requests: [false, false, false] };
      renderActiveTabModule();
    }

    function exitMockExam() {
      activeExamRunningMode = false;
      renderActiveTabModule();
    }

    function submitActiveExamOptionAnswer(ansIdx) {
      if (processingExamEvaluationFeedbackMode) return;
      const skillKey = activeExamSectionIndex === 0 ? 'hoeren' : 'lesen';
      activeExamUserAnswersCollected[skillKey][currentExamQuestionIndex] = ansIdx;
      processingExamEvaluationFeedbackMode = true;
      renderActiveTabModule();
    }

    function advanceActiveExamQuestionStep() {
      processingExamEvaluationFeedbackMode = false;
      currentExamQuestionIndex++;
      renderActiveTabModule();
    }

    function advanceExamSection() {
      activeExamSectionIndex++;
      currentExamQuestionIndex = 0;
      processingExamEvaluationFeedbackMode = false;
      renderActiveTabModule();
    }

    function toggleSchreibenSample(idx) {
      schreibenShowSample[idx] = !schreibenShowSample[idx];
      renderActiveTabModule();
    }

    function toggleSchreibenFormSolutions() {
      schreibenFormShowSolutions = !schreibenFormShowSolutions;
      renderActiveTabModule();
    }

    function advanceSchreibenTask() {
      schreibenTaskIndex++;
      renderActiveTabModule();
    }

    function toggleSprechenChecklistItem(part, idx) {
      if (part === 'intro') sprechenChecklist.intro = !sprechenChecklist.intro;
      else if (part === 'qa') sprechenChecklist.qa[idx] = !sprechenChecklist.qa[idx];
      else if (part === 'requests') sprechenChecklist.requests[idx] = !sprechenChecklist.requests[idx];
      renderActiveTabModule();
    }

    function advanceSprechenPart() {
      sprechenPartIndex++;
      renderActiveTabModule();
    }

    function finishMockExam() {
      const exam = mockExamsDatabase[selectedActiveExamIndex];
      const correctHoeren = exam.hoeren.filter((q, i) => activeExamUserAnswersCollected.hoeren[i] === q.c).length;
      const correctLesen = exam.lesen.filter((q, i) => activeExamUserAnswersCollected.lesen[i] === q.c).length;
      const totalRight = correctHoeren + correctLesen;
      const totalQ = exam.hoeren.length + exam.lesen.length;
      const pct = Math.round((totalRight / totalQ) * 100);
      if (pct >= 60) setTimeout(() => { rewardXP(50); }, 100);
      activeExamSectionIndex = 4;
      renderActiveTabModule();
    }

    // Preload speech synthesis voices so German audio is ready on first play
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
