    // Algorithmic Large-Scale Number Generator Engine Method (0 to 100 Million converter rule matrix)
    function generateGermanNumberStringFormula(num) {
      if (num === 0) return "null";
      
      const units = ["", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun"];
      const teens = ["zehn", "elf", "zwölf", "dreizehn", "vierzehn", "fünfzehn", "sechzehn", "siebzehn", "achtzehn", "neunzehn"];
      const tens = ["", "zehn", "zwanzig", "dreißig", "vierzig", "fünfzig", "sechzig", "siebzig", "achtzig", "neunzig"];

      function convertSubHundreds(val) {
        if (val < 10) return units[val];
        if (val < 20) return teens[val - 10];
        const u = val % 10;
        const t = Math.floor(val / 10);
        if (u === 0) return tens[t];
        return (u === 1 ? "ein" : units[u]) + "und" + tens[t];
      }


      function convertSubThousands(val) {
        const h = Math.floor(val / 100);
        const rem = val % 100;
        let res = "";
        if (h > 0) res += (h === 1 ? "ein" : units[h]) + "hundert";
        if (rem > 0) res += convertSubHundreds(rem);
        return res;
      }

      let outputText = "";
      let remainingValue = num;

      if (remainingValue >= 1000000) {
        const mill = Math.floor(remainingValue / 1000000);
        remainingValue %= 1000000;
        if (mill === 1) outputText += "eine Million";
        else outputText += convertSubThousands(mill) + " Millionen";
      }


      if (remainingValue >= 1000) {
        const thous = Math.floor(remainingValue / 1000);
        remainingValue %= 1000;
        if (thous === 1) outputText += "eintausend";
        else outputText += convertSubThousands(thous) + "tausend";
      }

      if (remainingValue > 0) {
        outputText += convertSubThousands(remainingValue);
      }

      if (outputText.endsWith("eins") && num > 1) {
        outputText = outputText.slice(0, -4) + "eins";
      }
      return outputText;
    }

              <div class="flashcard-inner">
                <div class="flashcard-front ${conf.cardBg} border shadow-xl">
                  <span class="text-[9px] uppercase tracking-widest font-black px-2 py-0.5 rounded bg-slate-950/50 self-start text-indigo-400">${card.gender}</span>
                  <span class="text-xl font-black tracking-tight my-auto select-none">${card.german}</span>
                  <span class="text-[10px] text-slate-400 font-medium italic">💡 Tap to reveal English context</span>
                </div>
                <div class="flashcard-back ${conf.cardBackBg} border shadow-xl">
                  <span class="text-[9px] uppercase tracking-widest font-black self-start text-indigo-300">English Translation Mapping</span>
                  <span class="text-xl font-extrabold tracking-tight my-auto select-none">${card.english}</span>
                  <p class="text-xs text-indigo-200/80 px-4">${card.hint}</p>
                </div>
              </div>
            </div>

            <div class="w-full grid grid-cols-2 gap-2">

              <button onclick="activeVocabCardIndex = (activeVocabCardIndex === 0) ? ${activeList.length - 1} : activeVocabCardIndex - 1; isVocabCardFlipped=false; renderActiveTabModule();" class="p-3 bg-slate-800 border border-slate-700 text-xs font-bold rounded-xl active:scale-95 transition-transform">← Prev</button>
              <button onclick="activeVocabCardIndex = (activeVocabCardIndex === ${activeList.length - 1}) ? 0 : activeVocabCardIndex + 1; isVocabCardFlipped=false; renderActiveTabModule();" class="p-3 bg-slate-800 border border-slate-700 text-xs font-bold rounded-xl active:scale-95 transition-transform">Next →</button>
            </div>
          `;
        }

        container.innerHTML = `
          <div class="space-y-4 flex flex-col items-center">
            <div class="w-full">
              <label for="lexicon-category-selector" class="text-[10px] uppercase font-black tracking-wider text-slate-400 block mb-1">Lexicon Category Matrix</label>
              <select id="lexicon-category-selector" onchange="selectedVocabCategory=this.value; activeVocabCardIndex=0; isVocabCardFlipped=false; renderActiveTabModule();" class="w-full bg-slate-950 border border-slate-800 p-2.5 text-xs font-bold rounded-xl text-slate-200 outline-none">
                ${selectOptionsHTML}
              </select>
            </div>
            ${coreDisplayBodyHTML}
          </div>
        `;
      }


      else if (activeTab === 'grammar') {
        let structuralAccordionHTML = '';
        a1GrammarDatabase.forEach((item, idx) => {
          const isOpen = (idx === activeGrammarIndex);
          structuralAccordionHTML += `
            <div class="border border-slate-800 rounded-xl overflow-hidden ${isOpen ? 'bg-slate-950/40' : 'bg-slate-950/10'}">
              <button onclick="activeGrammarIndex=${idx}; renderActiveTabModule();" class="w-full text-left p-3.5 text-xs font-black flex justify-between items-center transition-colors bg-slate-950 border-b border-slate-800/60 text-slate-200">
                <span>${item.title}</span>
                <span>${isOpen ? '▼' : '▶'}</span>
              </button>
              ${isOpen ? `
                <div class="p-4 space-y-3 bg-slate-900/40 animate-fadeIn">
                  <div>
                    <span class="text-[9px] uppercase tracking-wider font-extrabold text-indigo-400 block mb-0.5">Core Syntax Rules Directives</span>
                    <p class="text-xs font-medium leading-relaxed text-slate-300">${item.rules}</p>
                  </div>
                  <div class="p-3 rounded-xl bg-slate-950 border border-slate-800/80">
                    <span class="text-[9px] uppercase tracking-wider font-extrabold text-emerald-400 block mb-0.5">Contextual Formulation Usage Template</span>
                    <p class="text-xs font-mono font-bold text-emerald-300 leading-snug">${item.example}</p>

                  </div>
                </div>
              ` : ''}
            </div>
          `;
        });

        container.innerHTML = `
          <div class="space-y-3">
            <div class="px-1">
              <h3 class="text-sm font-black text-white">Goethe A1 Unified Grammar Curriculum Matrix</h3>
              <p class="text-[10px] text-slate-400 mt-0.5">13 Essential morphological tracking nodes formatted for direct mobile deployment view.</p>
            </div>
            <div class="space-y-2">${structuralAccordionHTML}</div>
          </div>
        `;
      }

      else if (activeTab === 'skills') {

        let skillsHTML = `<div class="space-y-4">
          <div class="grid grid-cols-4 gap-1.5">
            ${['listening', 'reading', 'writing', 'speaking'].map(s => `
              <button onclick="activeSkillSection='${s}'; skillSelectedAnswer=null; renderActiveTabModule();" class="py-2 px-1 rounded-xl text-[10px] font-black uppercase tracking-tight border text-center transition-all ${activeSkillSection === s ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}" >${s}</button>
            `).join('')}
          </div>
          <div class="${conf.cardBg} border p-4 rounded-2xl space-y-3">
            <h3 class="text-xs font-black uppercase tracking-wider text-indigo-400">${activeSkillSection.toUpperCase()} LAB IMMERSION</h3>`;

        if (activeSkillSection === 'listening') {
          const lData = a1SkillsDatabase.listening[0];
          skillsHTML += `
            <div class="space-y-3">
              <p class="text-xs text-slate-400 font-mono italic">Audio simulation text: "${lData.transcript}"</p>
              <p class="text-xs font-bold">${lData.question}</p>
              <div class="space-y-2">
                ${lData.options.map((o, idx) => `
                  <button onclick="skillSelectedAnswer=${idx}; renderActiveTabModule();" class="w-full text-left p-2.5 border rounded-xl text-xs font-bold ${skillSelectedAnswer === idx ? 'border-indigo-500 bg-indigo-950/40' : 'border-slate-700 bg-slate-900'}" >${o}</button>
                `).join('')}

              </div>
              ${skillSelectedAnswer !== null ? `
                <div class="p-2 text-xs rounded bg-slate-950 text-center font-bold ${skillSelectedAnswer === lData.correct ? 'text-emerald-400' : 'text-rose-400'}" >
                  ${skillSelectedAnswer === lData.correct ? '✓ Correct! (+10 XP)' : '✗ Incorrect! Try listening again.'}
                </div>
              ` : ''}
            </div>`;
        } else if (activeSkillSection === 'reading') {
          const rData = a1SkillsDatabase.reading[0];
          skillsHTML += `
            <div class="space-y-3">
              <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl font-mono text-xs leading-relaxed italic text-slate-300">"${rData.body}"</div>
              <p class="text-xs font-bold">${rData.question}</p>
              <div class="space-y-2">
                ${rData.options.map((o, idx) => `
                  <button onclick="skillSelectedAnswer=${idx}; renderActiveTabModule();" class="w-full text-left p-2.5 border rounded-xl text-xs font-bold ${skillSelectedAnswer === idx ? 'border-indigo-500 bg-indigo-950/40' : 'border-slate-700 bg-slate-900'}" >${o}</button>
                `).join('')}
              </div>
              ${skillSelectedAnswer !== null ? `

                <div class="p-2 text-xs rounded bg-slate-950 text-center font-bold ${skillSelectedAnswer === rData.correct ? 'text-emerald-400' : 'text-rose-400'}" >
                  ${skillSelectedAnswer === rData.correct ? '✓ Correct! (+10 XP)' : '✗ Incorrect. Look for closure timestamps.'}
                </div>
              ` : ''}
            </div>`;
        } else if (activeSkillSection === 'writing') {
          const wData = a1SkillsDatabase.writing[0];
          skillsHTML += `
            <div class="space-y-3">
              <p class="text-xs font-medium leading-relaxed">${wData.context}</p>
              <div class="p-3 bg-slate-950 border border-slate-800 font-mono text-xs rounded-xl">${wData.text}</div>
              <div class="grid grid-cols-2 gap-2">
                ${wData.options.map((o, idx) => `
                  <button onclick="skillSelectedAnswer=${idx}; renderActiveTabModule();" class="p-2.5 border rounded-xl text-xs font-mono font-bold text-center ${skillSelectedAnswer === idx ? 'border-indigo-500 bg-indigo-950/40' : 'border-slate-700 bg-slate-900'}" >${o}</button>
                `).join('')}
              </div>
              ${skillSelectedAnswer !== null ? `
                <div class="p-2 text-xs rounded bg-slate-950 text-center font-bold ${skillSelectedAnswer === wData.correct ? 'text-emerald-400' : 'text-rose-400'}" >
                  ${skillSelectedAnswer === wData.correct ? '✓ Success Matrix Match (+15 XP)' : '✗ Case grammar mismatches identified.'}

                </div>
              ` : ''}
            </div>`;
        } else if (activeSkillSection === 'speaking') {
          const sData = a1SkillsDatabase.speaking[0];
          skillsHTML += `
            <div class="space-y-3 text-center py-2">
              <p class="text-xs font-bold text-slate-300">Target Statement Structure Challenge</p>
              <p class="text-xl font-black text-indigo-300">"${sData.text}"</p>
              <div class="p-2.5 bg-slate-950 text-left border border-slate-800 rounded-lg">
                <span class="text-[9px] uppercase font-black block text-slate-400 tracking-wider">Phonetics Suffix Guide Map</span>
                <p class="text-xs text-amber-400 font-mono font-bold mt-0.5">${sData.guide}</p>
              </div>
              <button onclick="rewardXP(5);" class="w-full mt-2 p-3 bg-indigo-600 font-black text-xs text-white rounded-xl shadow-md active:scale-95 transition-all">🎤 Verify Speaking Pronunciation</button>
            </div>`;
        }

        skillsHTML += `</div></div>`;
        container.innerHTML = skillsHTML;

      }

      else if (activeTab === 'exams') {
        if (!activeExamRunningMode) {
          let selectionRowsHTML = '';
          mockExamsDatabase.forEach((ex, idx) => {
            selectionRowsHTML += `
              <div class="${conf.cardBg} border p-4 rounded-xl flex flex-col justify-between space-y-3">
                <div>
                  <h4 class="text-xs font-black text-white">${ex.title}</h4>
                  <p class="text-[10px] text-slate-400 mt-0.5">Comprehensive Standard Assessment Block • ${ex.questions.length} Questions</p>
                </div>
                <button onclick="startSpecificMockExamSuite(${idx})" class="w-full py-2 bg-slate-950 hover:bg-slate-900 border border-indigo-900 text-indigo-400 font-extrabold text-[11px] rounded-lg transition-transform active:scale-95" >Launch Simulation</button>
              </div>
            `;
          });

          container.innerHTML = `
            <div class="space-y-4">

              <div class="px-1">
                <h3 class="text-sm font-black tracking-tight text-white">Goethe / Telc A1 Mock Exam Arena</h3>
                <p class="text-[11px] text-slate-400 font-medium">Verify your cross-dimension capabilities using full runtime testing models.</p>
              </div>
              <div class="space-y-3">${selectionRowsHTML}</div>
            </div>
          `;
        } else {
          const exam = mockExamsDatabase[selectedActiveExamIndex];
          
          if (currentExamQuestionIndex >= exam.questions.length) {
            let correctCounter = 0;
            exam.questions.forEach((q, idx) => {
              if (activeExamUserAnswersCollected[idx] === q.c) correctCounter++;
            });
            const passed = correctCounter >= exam.passingScore;
            if (passed) setTimeout(() => { rewardXP(50); }, 100);

            container.innerHTML = `

              <div class="text-center p-6 bg-slate-950 border border-slate-800 rounded-2xl space-y-4 shadow-2xl">
                <span class="text-5xl block">${passed ? '🏆' : '⏳'}</span>
                <h3 class="text-lg font-black text-white">${passed ? 'Examination Passed!' : 'Requires Review'}</h3>
                <p class="text-xs text-slate-400 font-semibold leading-relaxed">Performance Output Score metrics tracking evaluated: <br><span class="text-base font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}">${correctCounter} / ${exam.questions.length} Correct</span></p>
                <div class="text-left bg-slate-900 p-3 rounded-lg border border-slate-800 text-[11px] space-y-1 text-slate-300">
                  <p><strong>Passing Constraint Target:</strong> ${exam.passingScore} Correct options</p>
                  <p><strong>Rewards Awarded:</strong> ${passed ? '+50 XP Milestone Achieved!' : '0 XP. Please run remediation rules.'}</p>
                </div>
                <button onclick="activeExamRunningMode=false; renderActiveTabModule();" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl" >Return to Exam Selection Shell</button>
              </div>
            `;
            return;
          }

          const activeQuestion = exam.questions[currentExamQuestionIndex];
          container.innerHTML = `
            <div class="space-y-4">
              <div class="flex justify-between items-center px-1">
                <span class="text-xs font-black text-slate-400">Exam Question ${currentExamQuestionIndex + 1} of ${exam.questions.length}</span>

                <span class="text-[10px] font-mono bg-rose-950 border border-rose-800 px-2 py-0.5 text-rose-400 rounded-md font-bold">LIVE ASSESS MODE</span>
              </div>

              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl">
                <p class="text-xs font-bold leading-relaxed text-slate-200">${activeQuestion.q}</p>
              </div>

              <div class="space-y-2">
                ${activeQuestion.o.map((opt, oIdx) => {
                  let optStyle = "bg-slate-800 border-slate-700 text-slate-300";
                  if (processingExamEvaluationFeedbackMode) {
                    if (oIdx === activeQuestion.c) optStyle = "bg-emerald-950 border-emerald-500 text-emerald-200 font-black";
                    else if (oIdx === activeExamUserAnswersCollected[currentExamQuestionIndex]) optStyle = "bg-rose-950 border-rose-500 text-rose-200";
                    else optStyle = "bg-slate-900 border-slate-800 opacity-40 text-slate-600";
                  }
                  return `
                    <button onclick="submitActiveExamOptionAnswer(${oIdx})" ${processingExamEvaluationFeedbackMode ? 'disabled' : ''} class="w-full text-left p-3.5 border rounded-xl text-xs font-bold transition-all ${optStyle}" >${opt}</button>
                  `;
                }).join('')}

              </div>

              ${processingExamEvaluationFeedbackMode ? `
                <div class="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                  <span class="text-[9px] uppercase font-black text-slate-400 tracking-wider">Grammar Logic Correction Analysis</span>
                  <p class="text-xs text-slate-300 font-medium">${activeQuestion.exp}</p>
                  <button onclick="advanceActiveExamQuestionStep()" class="w-full mt-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl" >Next Question →</button>
                </div>
              ` : ''}
            </div>
          `;
        }
      }
    }

    // Exam State Handler Methods
    function startSpecificMockExamSuite(idx) {
      selectedActiveExamIndex = idx;
      activeExamRunningMode = true;

      currentExamQuestionIndex = 0;
      activeExamUserAnswersCollected = [];
      processingExamEvaluationFeedbackMode = false;
      renderActiveTabModule();
    }

    function submitActiveExamOptionAnswer(ansIdx) {
      if (processingExamEvaluationFeedbackMode) return;
      activeExamUserAnswersCollected[currentExamQuestionIndex] = ansIdx;
      processingExamEvaluationFeedbackMode = true;
      renderActiveTabModule();
    }

    function advanceActiveExamQuestionStep() {
      processingExamEvaluationFeedbackMode = false;
      currentExamQuestionIndex++;
      renderActiveTabModule();
    }
  </script>
</body>
</html>
