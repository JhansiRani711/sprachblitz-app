      {
        id: 2, level: "B1", title: "Sprachblitz B1 – Modellprüfung 01 (Übungsmaterial im Goethe-B1-Format)",

        // ---------- HÖREN ----------
        hoeren: [
          // Teil 1: fünf kurze Texte, je eine Richtig/Falsch- und eine Auswahlaufgabe
          { teil: 1, audioText: "Hallo Frau Özdemir, hier ist Kramer von der Hausverwaltung. Der Handwerker kommt am Donnerstag doch nicht um neun, sondern erst am Nachmittag gegen fünfzehn Uhr. Falls Ihnen das nicht passt, melden Sie sich bitte bis Mittwochmittag, dann suchen wir einen anderen Termin.", question: "Der Handwerkertermin wurde auf den Nachmittag verschoben.", options: ["Richtig", "Falsch"], c: 0 },
          { teil: 1, audioText: "Hallo Frau Özdemir, hier ist Kramer von der Hausverwaltung. Der Handwerker kommt am Donnerstag doch nicht um neun, sondern erst am Nachmittag gegen fünfzehn Uhr. Falls Ihnen das nicht passt, melden Sie sich bitte bis Mittwochmittag, dann suchen wir einen anderen Termin.", question: "Was soll Frau Özdemir tun, wenn ihr der Termin nicht passt?", options: ["Den Handwerker direkt anrufen.", "Sich bis Mittwochmittag melden.", "Am Donnerstag zu Hause bleiben."], c: 1 },

          { teil: 1, audioText: "Achtung, eine Information für alle Fahrgäste: Wegen Bauarbeiten fährt die Straßenbahnlinie 4 heute nur bis zur Haltestelle Südpark. Zwischen Südpark und Hauptbahnhof setzen wir Busse ein. Diese fahren direkt vor dem Ausgang ab. Bitte rechnen Sie mit etwa zehn Minuten längerer Fahrzeit.", question: "Die Linie 4 fällt heute vollständig aus.", options: ["Richtig", "Falsch"], c: 1 },
          { teil: 1, audioText: "Achtung, eine Information für alle Fahrgäste: Wegen Bauarbeiten fährt die Straßenbahnlinie 4 heute nur bis zur Haltestelle Südpark. Zwischen Südpark und Hauptbahnhof setzen wir Busse ein. Diese fahren direkt vor dem Ausgang ab. Bitte rechnen Sie mit etwa zehn Minuten längerer Fahrzeit.", question: "Womit müssen die Fahrgäste rechnen?", options: ["Mit höheren Fahrpreisen.", "Mit einer längeren Fahrzeit.", "Mit einem Ausfall am Wochenende."], c: 1 },

          { teil: 1, audioText: "Guten Tag, hier ist die Sprachschule Lingua, Abteilung Anmeldung. Ihr Einstufungstest hat ergeben, dass Sie den B1-Kurs besuchen können. Der Kurs beginnt am 12. September. Bitte überweisen Sie die Kursgebühr bis spätestens eine Woche vor Kursbeginn, sonst können wir den Platz leider nicht reservieren.", question: "Der Kursplatz ist erst nach der Zahlung sicher.", options: ["Richtig", "Falsch"], c: 0 },
          { teil: 1, audioText: "Guten Tag, hier ist die Sprachschule Lingua, Abteilung Anmeldung. Ihr Einstufungstest hat ergeben, dass Sie den B1-Kurs besuchen können. Der Kurs beginnt am 12. September. Bitte überweisen Sie die Kursgebühr bis spätestens eine Woche vor Kursbeginn, sonst können wir den Platz leider nicht reservieren.", question: "Bis wann muss die Gebühr bezahlt werden?", options: ["Am ersten Kurstag.", "Eine Woche vor Kursbeginn.", "Bis zum 12. September."], c: 1 },

          { teil: 1, audioText: "Und nun zum Wetter: Der Freitag beginnt im Norden freundlich, im Süden dagegen fällt zeitweise Regen. Am Nachmittag ziehen von Westen dichte Wolken auf, örtlich sind kräftige Gewitter möglich. Die Höchstwerte liegen zwischen achtzehn und dreiundzwanzig Grad, dazu weht ein mäßiger Wind.", question: "Am Freitagnachmittag kann es Gewitter geben.", options: ["Richtig", "Falsch"], c: 0 },
          { teil: 1, audioText: "Und nun zum Wetter: Der Freitag beginnt im Norden freundlich, im Süden dagegen fällt zeitweise Regen. Am Nachmittag ziehen von Westen dichte Wolken auf, örtlich sind kräftige Gewitter möglich. Die Höchstwerte liegen zwischen achtzehn und dreiundzwanzig Grad, dazu weht ein mäßiger Wind.", question: "Wie hoch werden die Temperaturen?", options: ["Höchstens 15 Grad.", "Zwischen 18 und 23 Grad.", "Über 25 Grad."], c: 1 },

          // Teil 2: ein längerer Text, fünf Auswahlaufgaben
          { teil: 2, audioText: "Herzlich willkommen zu unserer Führung durch das Stadtarchiv. Mein Name ist Robert Halm. Bevor wir beginnen, drei Hinweise: Fotografieren ist im Lesesaal nicht erlaubt, Taschen lassen Sie bitte in den Schließfächern im Erdgeschoss, und Getränke dürfen nur im Foyer stehen. Unser Rundgang dauert etwa neunzig Minuten. Wir beginnen im Keller, wo die ältesten Dokumente bei konstanter Temperatur gelagert werden.", question: "Was ist im Lesesaal verboten?", options: ["Sprechen.", "Fotografieren.", "Schreiben."], c: 1 },
          { teil: 2, audioText: "Wir beginnen im Keller. Dort liegen Urkunden aus dem 14. Jahrhundert. Viele Besucher wundern sich, dass es hier so kühl ist – genau das schützt aber das Papier. Danach gehen wir in den ersten Stock zur Sammlung der Stadtzeitungen. Wer selbst forschen möchte, zum Beispiel zur eigenen Familiengeschichte, kann anschließend im Lesesaal Material bestellen. Dafür brauchen Sie allerdings einen Leseausweis.", question: "Warum ist es im Keller kühl?", options: ["Weil geheizt wird gespart.", "Um das alte Papier zu schützen.", "Weil dort niemand arbeitet."], c: 1 },
          { teil: 2, audioText: "Wer selbst forschen möchte, kann im Lesesaal Material bestellen. Dafür brauchen Sie einen Leseausweis. Den bekommen Sie kostenlos an der Information, Sie müssen nur einen Ausweis mit Foto vorlegen. Die Bestellungen werden übrigens zweimal täglich bearbeitet, um zehn und um vierzehn Uhr. Wer also nachmittags kommt, sollte Material besser am Vortag bestellen.", question: "Was braucht man für den Leseausweis?", options: ["Ein Passfoto und 10 Euro.", "Einen Ausweis mit Foto.", "Eine Anmeldung im Internet."], c: 1 },
          { teil: 2, audioText: "Die Bestellungen werden zweimal täglich bearbeitet, um zehn und um vierzehn Uhr. Wer also nachmittags kommt, sollte Material besser am Vortag bestellen. Am Ende der Führung zeige ich Ihnen noch unsere digitale Datenbank. Dort sind inzwischen etwa zwanzig Prozent unserer Bestände erfasst, und Sie können bequem von zu Hause aus recherchieren.", question: "Was gilt für die Datenbank?", options: ["Sie enthält alle Bestände.", "Sie ist nur im Archiv nutzbar.", "Etwa ein Fünftel der Bestände ist erfasst."], c: 2 },
          { teil: 2, audioText: "Zum Schluss noch ein Tipp: Einmal im Monat, immer am ersten Samstag, bieten wir einen Workshop zur Familienforschung an. Er ist kostenlos, die Plätze sind aber schnell vergeben. Melden Sie sich am besten gleich heute an der Information an. Und nun folgen Sie mir bitte nach unten.", question: "Was empfiehlt der Archivmitarbeiter?", options: ["Sich früh für den Workshop anzumelden.", "Den Workshop online zu buchen.", "Zuerst die Datenbank zu nutzen."], c: 0 },

          // Teil 3: Alltagsgespräch, Richtig/Falsch
          { teil: 3, audioText: "Und, wie war dein erster Tag in der neuen Firma? – Anstrengend, ehrlich gesagt. Ich habe morgens zwei Stunden nur Formulare ausgefüllt. Aber die Kollegen sind wirklich nett, eine hat mich sogar mit in die Kantine genommen.", question: "Der Sprecher fand den ersten Arbeitstag anstrengend.", options: ["Richtig", "Falsch"], c: 0 },
          { teil: 3, audioText: "Die Kollegen sind wirklich nett, eine hat mich sogar mit in die Kantine genommen. Das Essen dort war allerdings eine Katastrophe. Ab morgen bringe ich mir wieder etwas von zu Hause mit.", question: "Das Kantinenessen hat ihm gut geschmeckt.", options: ["Richtig", "Falsch"], c: 1 },
          { teil: 3, audioText: "Und der Weg? Du wolltest doch mit dem Rad fahren. – Das habe ich auch versucht, aber es sind fast fünfzig Minuten. Nächste Woche probiere ich es mit der S-Bahn, dann kann ich unterwegs wenigstens lesen.", question: "Er will nächste Woche mit der S-Bahn fahren.", options: ["Richtig", "Falsch"], c: 0 },
          { teil: 3, audioText: "Hast du denn schon eigene Aufgaben bekommen? – Noch nicht richtig. Mein Chef meinte, in den ersten zwei Wochen soll ich vor allem zuschauen und Fragen stellen. Danach übernehme ich ein eigenes Projekt.", question: "Er leitet schon in der ersten Woche ein Projekt.", options: ["Richtig", "Falsch"], c: 1 },
          { teil: 3, audioText: "Danach übernehme ich ein eigenes Projekt. Ehrlich gesagt freue ich mich darauf, auch wenn ich ein bisschen nervös bin. – Das wird schon. Sollen wir am Freitag darauf anstoßen? – Gern, aber erst nach acht, ich habe vorher noch einen Sprachkurs.", question: "Am Freitag hat er vor acht Uhr noch einen Termin.", options: ["Richtig", "Falsch"], c: 0 },

          // Teil 4: Diskussion, Zuordnung
          { teil: 4, audioText: "Moderatorin: Frau Lorenz, Sie sind gegen Handys im Unterricht. – Frau Lorenz: Nicht grundsätzlich. Ich sage nur: Solange die Geräte auf dem Tisch liegen, sinkt die Konzentration messbar. Das erlebe ich in jeder Stunde.", question: "Wer sagt: Handys auf dem Tisch stören die Konzentration?", options: ["Die Moderatorin", "Frau Lorenz", "Herr Adler"], c: 1 },
          { teil: 4, audioText: "Herr Adler: Man kann Jugendlichen den Umgang mit Medien aber nicht beibringen, indem man ihnen die Geräte wegnimmt. Sie müssen lernen, selbst zu entscheiden, wann das Handy sinnvoll ist.", question: "Wer meint: Jugendliche müssen den Umgang selbst lernen?", options: ["Die Moderatorin", "Frau Lorenz", "Herr Adler"], c: 2 },
          { teil: 4, audioText: "Moderatorin: Beide Seiten sind sich also einig, dass es Regeln braucht – nur nicht, wie streng sie sein sollen. Habe ich das richtig zusammengefasst?", question: "Wer fasst die Positionen zusammen?", options: ["Die Moderatorin", "Frau Lorenz", "Herr Adler"], c: 0 },
          { teil: 4, audioText: "Frau Lorenz: An unserer Schule sammeln wir die Geräte morgens ein und geben sie mittags zurück. Seitdem ist es in den Pausen deutlich lauter geworden – im positiven Sinn. Die Kinder reden wieder miteinander.", question: "Wer berichtet von einer konkreten Regelung an einer Schule?", options: ["Die Moderatorin", "Frau Lorenz", "Herr Adler"], c: 1 },
          { teil: 4, audioText: "Herr Adler: In meinem Unterricht recherchieren die Schüler mit dem Handy, machen Fotos von Versuchen und schreiben damit sogar kleine Texte. Ein Verbot würde mir diese Möglichkeiten nehmen.", question: "Wer nutzt Handys aktiv im eigenen Unterricht?", options: ["Die Moderatorin", "Frau Lorenz", "Herr Adler"], c: 2 },
          { teil: 4, audioText: "Moderatorin: Eine letzte Frage an Sie beide: Was wünschen Sie sich von der Politik? – Frau Lorenz: Klare Vorgaben, damit nicht jede Schule allein entscheiden muss. – Herr Adler: Vor allem Geld für Fortbildungen.", question: "Wer wünscht sich einheitliche Vorgaben von der Politik?", options: ["Die Moderatorin", "Frau Lorenz", "Herr Adler"], c: 1 }
        ],

        // ---------- LESEN ----------
        lesen: [
          // Teil 1: Blogtext, Richtig/Falsch
          { teil: 1, readingText: "Mein Umzugstagebuch – Teil 3\n\nDrei Wochen ist es jetzt her, dass ich von Hamburg nach Jena gezogen bin. Der Job war der Grund, das war von Anfang an klar. Trotzdem hatte ich Angst davor, plötzlich niemanden mehr zu kennen.\nDie erste Woche war genau so, wie ich es befürchtet hatte: Kisten überall, kein Internet und abends Stille. Am dritten Tag klingelte dann meine Nachbarin und brachte Kuchen vorbei. Sie hat mir erklärt, wie die Mülltrennung im Haus funktioniert, und mich gleich zum Chorabend mitgenommen. Singen kann ich eigentlich nicht, aber ich bin trotzdem geblieben.\nWas mir bis heute fehlt, ist das Meer. Dafür brauche ich hier nur zwanzig Minuten bis in den Wald, und die Mieten sind so niedrig, dass ich zum ersten Mal ein Arbeitszimmer habe.\nWer auch gerade umzieht: Wartet nicht, bis euch jemand anspricht. Ich habe zwei Wochen gewartet – die hätte ich mir sparen können.", question: "Die Schreiberin ist wegen der Arbeit umgezogen.", options: ["Richtig", "Falsch"], c: 0 },

          { teil: 1, readingText: "Mein Umzugstagebuch – Teil 3\n\nDrei Wochen ist es jetzt her, dass ich von Hamburg nach Jena gezogen bin. Der Job war der Grund, das war von Anfang an klar. Trotzdem hatte ich Angst davor, plötzlich niemanden mehr zu kennen.\nDie erste Woche war genau so, wie ich es befürchtet hatte: Kisten überall, kein Internet und abends Stille. Am dritten Tag klingelte dann meine Nachbarin und brachte Kuchen vorbei. Sie hat mir erklärt, wie die Mülltrennung im Haus funktioniert, und mich gleich zum Chorabend mitgenommen. Singen kann ich eigentlich nicht, aber ich bin trotzdem geblieben.\nWas mir bis heute fehlt, ist das Meer. Dafür brauche ich hier nur zwanzig Minuten bis in den Wald, und die Mieten sind so niedrig, dass ich zum ersten Mal ein Arbeitszimmer habe.\nWer auch gerade umzieht: Wartet nicht, bis euch jemand anspricht. Ich habe zwei Wochen gewartet – die hätte ich mir sparen können.", question: "Sie rät anderen, selbst aktiv auf Menschen zuzugehen.", options: ["Richtig", "Falsch"], c: 0 },

          // Teil 2: Pressetexte, Mehrfachauswahl
          { teil: 2, readingText: "Ein Dorf teilt sich ein Auto\n\nIn Neuwalde, einem Ort mit knapp 600 Einwohnern, steht seit einem Jahr ein Elektroauto auf dem Dorfplatz. Es gehört keinem Einzelnen, sondern einem Verein, dem inzwischen 34 Haushalte angehören. Wer fahren möchte, bucht das Auto online und zahlt pro Stunde.\n„Am Anfang haben viele gelacht“, erzählt Vereinsgründerin Ute Brehm. „Auf dem Land besitzt fast jede Familie zwei Autos, das zweite steht aber die meiste Zeit nur herum.“ Genau darum ging es ihr: nicht darum, den Menschen das Auto wegzunehmen, sondern das zweite überflüssig zu machen.\nDie Bilanz nach einem Jahr überrascht selbst die Gründerin. Elf Familien haben ihren Zweitwagen tatsächlich abgeschafft. Probleme gibt es dennoch: An Wochenenden ist das Fahrzeug fast immer ausgebucht, werktags dagegen steht es oft still. Der Verein überlegt deshalb, ein zweites Auto anzuschaffen – und sucht dafür gerade nach Fördergeld.", question: "In diesem Text geht es vor allem um …", options: ["die Vorteile von Elektroautos.", "ein gemeinschaftliches Auto in einem Dorf.", "die Gründung eines neuen Vereins."], c: 1 },

          // Teil 4: Leserbriefe, für/gegen
          { teil: 4, readingText: "Leserbriefe zum Thema „Sollen Innenstädte autofrei werden?“\n\nHannes, 41: Wer den Verkehr aus der Innenstadt verbannt, verlagert ihn nur in die Wohngebiete drumherum. Dort wohnen auch Menschen. Solange es kein besseres Nahverkehrskonzept gibt, halte ich davon nichts.", question: "Ist Hannes für eine autofreie Innenstadt?", options: ["Ja", "Nein"], c: 1 },
          { teil: 4, readingText: "Leserbriefe zum Thema „Sollen Innenstädte autofrei werden?“\n\nSelma, 29: Ich bin letztes Jahr in eine Stadt gezogen, in der das Zentrum nur zu Fuß erreichbar ist. Die Luft ist besser, es ist leiser, und die Geschäfte laufen trotzdem gut. Ich verstehe die Aufregung nicht.", question: "Ist Selma für eine autofreie Innenstadt?", options: ["Ja", "Nein"], c: 0 },
          { teil: 4, readingText: "Leserbriefe zum Thema „Sollen Innenstädte autofrei werden?“\n\nDr. Weller, 63: Meine Praxis liegt mitten im Zentrum. Ältere Patienten mit Gehhilfe können nicht plötzlich fünfhundert Meter laufen. Bevor man so etwas beschließt, muss man an diese Menschen denken.", question: "Ist Dr. Weller für eine autofreie Innenstadt?", options: ["Ja", "Nein"], c: 1 },
          { teil: 4, readingText: "Leserbriefe zum Thema „Sollen Innenstädte autofrei werden?“\n\nJan, 22: Natürlich wird die Umstellung wehtun, das bestreitet niemand. Trotzdem führt kein Weg daran vorbei. Städte wurden jahrzehntelang für Autos gebaut, jetzt dürfen sie einmal für Menschen gebaut werden.", question: "Ist Jan für eine autofreie Innenstadt?", options: ["Ja", "Nein"], c: 0 },
          { teil: 4, readingText: "Leserbriefe zum Thema „Sollen Innenstädte autofrei werden?“\n\nPetra, 55: Ich betreibe seit zwanzig Jahren ein Blumengeschäft. Meine Lieferungen kommen morgens mit dem Transporter. Ein Verbot ohne Ausnahmen für Betriebe würde mich das Geschäft kosten.", question: "Ist Petra für eine autofreie Innenstadt?", options: ["Ja", "Nein"], c: 1 },

          // Teil 5: Anweisung / Hausordnung

        schreiben: {
          tasks: [
            {
              type: "message",
              title: "Teil 1: Persönliche E-Mail (circa 80 Wörter)",
              instructions: "Sie waren letzte Woche zum ersten Mal bei einem Sprachtandem-Treffen. Eine Freundin, Katrin, überlegt, auch hinzugehen, konnte aber nicht mitkommen. Schreiben Sie ihr eine E-Mail und gehen Sie auf alle drei Punkte ein. Achten Sie auf Anrede, Einleitung, Reihenfolge der Punkte und Schluss.",
              points: ["Beschreiben Sie: Wie war das Treffen?", "Begründen Sie: Was hat Ihnen besonders gefallen und warum?", "Machen Sie einen Vorschlag für das nächste Mal."],
              sample: "Liebe Katrin,\nschade, dass du am Donnerstag nicht dabei sein konntest! Das Treffen war viel entspannter, als ich erwartet hatte. Wir saßen zu acht im Café und haben abwechselnd eine halbe Stunde Deutsch und eine halbe Stunde Englisch gesprochen.\nAm besten gefallen hat mir, dass niemand Fehler korrigiert hat. Dadurch habe ich mich zum ersten Mal getraut, längere Sätze zu sagen.\nDas nächste Treffen ist am 14. Wollen wir vorher zusammen etwas essen und dann gemeinsam hingehen? Sag mir einfach Bescheid.\nLiebe Grüße\nDaniel"
            },
            {
              type: "message",
              title: "Teil 2: Diskussionsbeitrag (circa 80 Wörter)",
              instructions: "Im Online-Gästebuch einer Fernsehsendung lesen Sie folgende Meinung von Tanja: „Ich finde es falsch, dass immer mehr Firmen ihren Mitarbeitern erlauben, komplett von zu Hause zu arbeiten. Der persönliche Kontakt im Team geht dabei verloren.“ Schreiben Sie Ihre Meinung zum Thema. Nennen Sie Ihre Position, begründen Sie sie mit einem Beispiel und gehen Sie auf ein Gegenargument ein.",
              points: ["Nennen Sie Ihre Meinung klar.", "Begründen Sie sie mit einem Beispiel.", "Gehen Sie auf einen möglichen Einwand ein."],
              sample: "Meiner Meinung nach ist Tanjas Sorge berechtigt, aber ihre Schlussfolgerung geht mir zu weit. Ich arbeite selbst zwei Tage pro Woche zu Hause und schaffe dort Aufgaben, für die ich im Büro nie Ruhe finde.\nNatürlich stimmt es, dass spontane Gespräche fehlen und neue Kollegen es schwerer haben. Genau deshalb halte ich feste Bürotage für sinnvoll, an denen alle da sind.\nEine Mischung aus beidem ist also besser als ein Entweder-oder."
            },
            {
              type: "message",
              title: "Teil 3: Halbformelle E-Mail (circa 40 Wörter)",
              instructions: "Ihre Kursleiterin, Frau Berger, hat Sie zu einem Gespräch über Ihre Lernziele eingeladen. Zu diesem Termin können Sie nicht kommen. Schreiben Sie Frau Berger. Entschuldigen Sie sich höflich, nennen Sie den Grund und bitten Sie um einen neuen Termin. Vergessen Sie Anrede und Gruß nicht.",
              points: ["Entschuldigen Sie sich höflich.", "Nennen Sie den Grund.", "Bitten Sie um einen neuen Termin."],
              sample: "Sehr geehrte Frau Berger,\nvielen Dank für die Einladung. Leider kann ich am Mittwoch nicht kommen, weil ich an diesem Tag beruflich in Leipzig bin. Wäre ein Gespräch nächste Woche möglich? Ich bin dienstags und freitags ab 15 Uhr frei.\nMit freundlichen Grüßen\nSofia Marek"
            }
          ]
        },

        sprechen: {

            title: "Teil 1: Gemeinsam etwas planen",
            keywords: ["Wann treffen?", "Wo?", "Was mitbringen?", "Wer macht was?", "Wie hinkommen?"],
            sample: "Eine Kollegin aus dem Kurs zieht am Wochenende um und hat um Hilfe gebeten. Planen Sie gemeinsam: Wann helfen Sie? Wer bringt was mit? Wie kommen Sie hin? Beispiel: „Ich schlage vor, dass wir schon um neun anfangen, dann sind wir mittags fertig. Was hältst du davon?“"
          },
          qaTitle: "Teil 2: Ein Thema präsentieren",
          qa: [
            { keyword: "Folie 1 – Thema vorstellen", sampleQ: "Thema: „Brauchen Kinder ein eigenes Smartphone?“ Wie stellen Sie Ihre Präsentation vor?", sampleA: "Guten Tag. Ich möchte Ihnen heute das Thema „Brauchen Kinder ein eigenes Smartphone?“ vorstellen. Zuerst berichte ich von meinen eigenen Erfahrungen, danach von der Situation in meinem Heimatland. Anschließend nenne ich Vor- und Nachteile und sage meine Meinung dazu." },
            { keyword: "Folie 2 – Persönliche Erfahrung", sampleQ: "Welches Erlebnis verbinden Sie mit dem Thema?", sampleA: "Meine Nichte hat mit neun Jahren ihr erstes Handy bekommen. Am Anfang war meine Schwester froh, weil sie immer wusste, wo das Kind ist. Nach einigen Monaten gab es aber jeden Abend Streit über die Bildschirmzeit." },
            { keyword: "Folie 3 – Situation im Heimatland", sampleQ: "Wie ist die Situation in Ihrem Heimatland?", sampleA: "Bei uns bekommen die meisten Kinder das erste Handy zum Wechsel auf die weiterführende Schule, also mit ungefähr elf Jahren. In vielen Schulen müssen die Geräte während des Unterrichts in der Tasche bleiben." },
            { keyword: "Folie 4 – Vor- und Nachteile", sampleQ: "Welche Vor- und Nachteile sehen Sie?", sampleA: "Einerseits sind Kinder jederzeit erreichbar und lernen früh, mit digitalen Medien umzugehen. Andererseits fällt es ihnen schwer, selbst aufzuhören, und die Eltern müssen ständig kontrollieren. Meiner Ansicht nach kommt es weniger auf das Alter an als auf klare Regeln." },
            { keyword: "Folie 5 – Abschluss und Dank", sampleQ: "Wie beenden Sie Ihre Präsentation?", sampleA: "Zusammenfassend lässt sich sagen, dass ein eigenes Handy weder nur gut noch nur schlecht ist. Entscheidend sind gemeinsame Regeln. Vielen Dank für Ihre Aufmerksamkeit – gern beantworte ich jetzt Ihre Fragen." }
          ],
          requestsTitle: "Teil 3: Über ein Thema sprechen",
          requests: [
            { prompt: "Geben Sie Ihrem Partner / Ihrer Partnerin eine Rückmeldung zur Präsentation.", sample: "Deine Präsentation hat mir gut gefallen, besonders das Beispiel aus deiner Familie. Neu war für mich, dass die Regeln an den Schulen so unterschiedlich sind." },
            { prompt: "Stellen Sie eine Frage zur Präsentation Ihres Partners / Ihrer Partnerin.", sample: "Du hast von klaren Regeln gesprochen. Welche Regel würdest du selbst als Erstes einführen?" },

          ]

          // Teil 1: kurze Gespräche, Richtig/Falsch + Mehrfachauswahl

          { teil: 1, audioText: "Wir haben die Umfrage im Frühjahr wiederholt. Grundsätzlich bestätigen die Zahlen den Trend aus dem Vorjahr. Auffällig ist allerdings, dass die Zustimmung bei den unter Dreißigjährigen deutlich zurückgegangen ist, während sie bei den älteren Befragten praktisch unverändert blieb.", question: "Die Zustimmung ist in allen Altersgruppen gesunken.", options: ["Richtig", "Falsch"], c: 1 },

          { teil: 1, audioText: "Guten Tag, Rechtsabteilung, Sander am Apparat. Ich habe Ihren Entwurf gelesen. Inhaltlich ist er in Ordnung, sprachlich müssten wir aber nachbessern. Formulierungen wie „möglichst zeitnah“ sind rechtlich nicht belastbar. Setzen Sie bitte überall konkrete Fristen ein.", question: "Der Entwurf muss inhaltlich vollständig neu geschrieben werden.", options: ["Richtig", "Falsch"], c: 1 },
          { teil: 1, audioText: "Guten Tag, Rechtsabteilung, Sander am Apparat. Ich habe Ihren Entwurf gelesen. Inhaltlich ist er in Ordnung, sprachlich müssten wir aber nachbessern. Formulierungen wie „möglichst zeitnah“ sind rechtlich nicht belastbar. Setzen Sie bitte überall konkrete Fristen ein.", question: "Was soll geändert werden?", options: ["Vage Formulierungen durch konkrete Fristen.", "Die Reihenfolge der Abschnitte.", "Die Anrede und der Schlusssatz."], c: 0 },

          { teil: 1, audioText: "Ich verstehe die Kritik an dem Bauprojekt durchaus. Nur wird in der Debatte selten erwähnt, dass die Alternative eben nicht der jetzige Zustand wäre, sondern jahrelanger Stillstand. Man muss die Nachteile also mit dem vergleichen, was realistisch passieren würde – nicht mit einem Idealzustand.", question: "Der Sprecher weist die Kritik vollständig zurück.", options: ["Richtig", "Falsch"], c: 1 },
          { teil: 1, audioText: "Ich verstehe die Kritik an dem Bauprojekt durchaus. Nur wird in der Debatte selten erwähnt, dass die Alternative eben nicht der jetzige Zustand wäre, sondern jahrelanger Stillstand. Man muss die Nachteile also mit dem vergleichen, was realistisch passieren würde – nicht mit einem Idealzustand.", question: "Was fordert der Sprecher?", options: ["Einen Vergleich mit der realistischen Alternative.", "Einen sofortigen Baustopp.", "Eine neue Bürgerbefragung."], c: 0 },

          // Teil 2: Vortrag / Radiobeitrag, Mehrfachauswahl
          { teil: 2, audioText: "Willkommen zu unserem Beitrag über die Vier-Tage-Woche. Vorweg eine Einschränkung: Wenn Studien von Erfolgen berichten, stammen die Daten meist aus wissensintensiven Branchen. Auf Schichtbetriebe mit festen Besetzungsvorgaben lassen sich diese Ergebnisse nicht ohne Weiteres übertragen.", question: "Welche Einschränkung nennt der Beitrag gleich zu Beginn?", options: ["Die Studien sind zu alt.", "Die Ergebnisse stammen überwiegend aus einer Branchengruppe.", "Es gibt bisher gar keine Studien."], c: 1 },
          { teil: 2, audioText: "In den untersuchten Betrieben blieb die Produktivität weitgehend stabil. Das lag jedoch weniger an motivierteren Beschäftigten, wie oft behauptet wird, als daran, dass Besprechungen radikal gekürzt wurden. Wer weniger Zeit hat, sortiert eben zuerst das aus, was ohnehin niemandem nutzt.", question: "Worauf führt der Beitrag die stabile Produktivität zurück?", options: ["Auf höhere Motivation.", "Auf zusätzliche Technik.", "Auf deutlich gekürzte Besprechungen."], c: 2 },
          { teil: 2, audioText: "Kritisch sehen Fachleute die Belastung. In mehreren Betrieben berichteten Beschäftigte, sie hätten dieselbe Arbeitsmenge nun in vier Tagen erledigen müssen. Die freie Zeit wurde also mit höherer Verdichtung erkauft. Ob das langfristig gesund ist, lässt sich derzeit nicht seriös beantworten.", question: "Was kritisieren Fachleute?", options: ["Die Arbeit wird auf weniger Tage verdichtet.", "Die Beschäftigten verdienen weniger.", "Die Kunden beschweren sich häufiger."], c: 0 },
          { teil: 2, audioText: "Interessant ist auch der Blick auf die Personalgewinnung. Betriebe, die das Modell anbieten, erhalten nach eigenen Angaben spürbar mehr Bewerbungen. Ob die Qualität der Bewerbungen ebenfalls steigt, ist damit allerdings noch nicht gesagt.", question: "Was ist über die Bewerbungen bekannt?", options: ["Zahl und Qualität steigen gleichermaßen.", "Die Zahl steigt, über die Qualität ist nichts belegt.", "Die Zahl bleibt unverändert."], c: 1 },
          { teil: 2, audioText: "Mein Fazit: Die Vier-Tage-Woche ist weder ein Allheilmittel noch eine Modeerscheinung. Sinnvoll erscheint sie dort, wo Arbeitszeit tatsächlich flexibel eingeteilt werden kann. Wo das nicht der Fall ist, sollte man ehrlicherweise über zusätzliches Personal sprechen statt über kürzere Wochen.", question: "Wie lautet das Fazit?", options: ["Das Modell passt überall.", "Das Modell ist eine kurzlebige Mode.", "Das Modell passt nur bei flexibel einteilbarer Arbeitszeit."], c: 2 },

          // Teil 3: Gespräch unter Muttersprachlern, Richtig/Falsch
          { teil: 3, audioText: "Sag mal, wie läuft es mit der Weiterbildung? – Besser als gedacht. Ich hatte befürchtet, dass alles sehr theoretisch wird, aber wir arbeiten fast durchgehend an echten Fällen aus den Betrieben der Teilnehmenden.", question: "Die Weiterbildung ist praxisnäher, als sie erwartet hatte.", options: ["Richtig", "Falsch"], c: 0 },
          { teil: 3, audioText: "Und die Doppelbelastung? – Die unterschätzt man wirklich. Freitagabend Unterricht, samstags Aufgaben, und montags sitze ich trotzdem wieder normal im Büro. Ohne die Rücksicht meiner Abteilung wäre das nicht machbar.", question: "Ihre Abteilung nimmt Rücksicht auf die Weiterbildung.", options: ["Richtig", "Falsch"], c: 0 },
          { teil: 3, audioText: "Zahlt die Firma denn etwas dazu? – Die Hälfte der Gebühren, allerdings unter einer Bedingung: Ich verpflichte mich, danach noch zwei Jahre zu bleiben. Darüber habe ich lange nachgedacht, ehrlich gesagt.", question: "Die Firma übernimmt die Gebühren vollständig und ohne Bedingungen.", options: ["Richtig", "Falsch"], c: 1 },
          { teil: 3, audioText: "Und danach? Strebst du eine Leitungsstelle an? – Das wird immer automatisch angenommen. Mir geht es eher darum, fachlich sicherer zu werden. Ob daraus eine Leitungsfunktion wird, lasse ich bewusst offen.", question: "Sie strebt eindeutig eine Leitungsstelle an.", options: ["Richtig", "Falsch"], c: 1 },
          { teil: 3, audioText: "Würdest du es weiterempfehlen? – Uneingeschränkt ja, aber nur, wenn man vorher mit der Familie spricht. Ein Jahr lang sind die Wochenenden praktisch verplant. Wer das nicht offen bespricht, bekommt spätestens im dritten Monat Ärger zu Hause.", question: "Sie rät, die Belastung vorher in der Familie zu besprechen.", options: ["Richtig", "Falsch"], c: 0 },

          // Teil 4: Diskussion, Zuordnung
          { teil: 4, audioText: "Moderator: Frau Reinhardt, Sie fordern strengere Regeln für Werbung in sozialen Medien. – Frau Reinhardt: Ich fordere vor allem Transparenz. Wenn ein Beitrag bezahlt ist, muss das auf den ersten Blick erkennbar sein, und zwar nicht in Kleinschrift am Ende.", question: "Wer fordert vor allem klar erkennbare Kennzeichnung?", options: ["Der Moderator", "Frau Reinhardt", "Herr Voss"], c: 1 },
          { teil: 4, audioText: "Herr Voss: Die Kennzeichnungspflicht gibt es doch längst. Das Problem ist nicht die Regel, sondern dass niemand sie kontrolliert. Bevor wir neue Gesetze schreiben, sollten wir die vorhandenen durchsetzen.", question: "Wer hält die bestehenden Regeln für ausreichend, aber schlecht durchgesetzt?", options: ["Der Moderator", "Frau Reinhardt", "Herr Voss"], c: 2 },
          { teil: 4, audioText: "Moderator: Sie sind sich also einig, dass es ein Vollzugsproblem gibt, streiten aber darüber, ob zusätzlich neue Vorschriften nötig sind. Fasse ich das richtig zusammen?", question: "Wer fasst den Stand der Diskussion zusammen?", options: ["Der Moderator", "Frau Reinhardt", "Herr Voss"], c: 0 },
          { teil: 4, audioText: "Frau Reinhardt: Man darf auch nicht vergessen, an wen sich diese Beiträge richten. Ein Zwölfjähriger unterscheidet Werbung und Empfehlung nicht zuverlässig. Genau deshalb reicht ein Hinweis in der dritten Zeile eben nicht.", question: "Wer verweist besonders auf jüngere Zielgruppen?", options: ["Der Moderator", "Frau Reinhardt", "Herr Voss"], c: 1 },
          { teil: 4, audioText: "Herr Voss: Was mich an der Debatte stört, ist die Einseitigkeit. Für viele kleine Betriebe ist diese Form der Werbung der einzige bezahlbare Zugang zu Kundschaft. Wer hier pauschal verschärft, trifft nicht die großen Anbieter, sondern die kleinen.", question: "Wer warnt vor Nachteilen für kleine Betriebe?", options: ["Der Moderator", "Frau Reinhardt", "Herr Voss"], c: 2 },
          { teil: 4, audioText: "Moderator: Zum Abschluss bitte je einen Satz. – Frau Reinhardt: Transparenz ist kein Eingriff, sondern eine Voraussetzung für freie Entscheidungen. – Herr Voss: Und Regeln, die nicht kontrolliert werden, schaden dem Vertrauen mehr als gar keine.", question: "Wer sagt, unkontrollierte Regeln schadeten dem Vertrauen?", options: ["Der Moderator", "Frau Reinhardt", "Herr Voss"], c: 2 }
        ],

        lesen: [
          // Teil 1: Kommentar / Meinungstext
          { teil: 1, readingText: "Kommentar: Vom Nutzen des Zweifels\n\nWer heute eine Studie zitiert, hat den Streit meist schon gewonnen. „Studien zeigen“ – zwei Wörter, und der Widerspruch verstummt. Genau darin liegt das Problem.\nEine Studie ist kein Urteil, sondern ein Versuch unter bestimmten Bedingungen. Wer sie ernst nimmt, fragt nach der Stichprobe, nach dem Zeitraum, nach der Finanzierung. Diese Fragen gelten schnell als Nörgelei, dabei sind sie das eigentliche Handwerk.\nHinzu kommt die Verwechslung von Zusammenhang und Ursache. Dass zwei Größen gemeinsam steigen, sagt zunächst nichts darüber, welche die andere antreibt – oder ob eine dritte beide erklärt.\nIch plädiere deshalb nicht für weniger Vertrauen in Forschung, sondern für mehr Genauigkeit im Umgang mit ihr. Wer Zweifel als Angriff versteht, hat nicht verstanden, wie Wissen entsteht.", question: "Der Autor kritisiert, dass Studien oft als endgültiger Beweis verwendet werden.", options: ["Richtig", "Falsch"], c: 0 },

          { teil: 1, readingText: "Kommentar: Vom Nutzen des Zweifels\n\nWer heute eine Studie zitiert, hat den Streit meist schon gewonnen. „Studien zeigen“ – zwei Wörter, und der Widerspruch verstummt. Genau darin liegt das Problem.\nEine Studie ist kein Urteil, sondern ein Versuch unter bestimmten Bedingungen. Wer sie ernst nimmt, fragt nach der Stichprobe, nach dem Zeitraum, nach der Finanzierung. Diese Fragen gelten schnell als Nörgelei, dabei sind sie das eigentliche Handwerk.\nHinzu kommt die Verwechslung von Zusammenhang und Ursache. Dass zwei Größen gemeinsam steigen, sagt zunächst nichts darüber, welche die andere antreibt – oder ob eine dritte beide erklärt.\nIch plädiere deshalb nicht für weniger Vertrauen in Forschung, sondern für mehr Genauigkeit im Umgang mit ihr. Wer Zweifel als Angriff versteht, hat nicht verstanden, wie Wissen entsteht.", question: "Zweifel gehört für den Autor zum Entstehen von Wissen dazu.", options: ["Richtig", "Falsch"], c: 0 },

          // Teil 2: Sachtext, Mehrfachauswahl
          { teil: 2, readingText: "Wenn Effizienz nichts spart\n\nSeit Jahren werden Geräte sparsamer. Kühlschränke, Autos, Beleuchtung – der Verbrauch pro Nutzung ist deutlich gesunken. Trotzdem steigt der Gesamtverbrauch in vielen Bereichen weiter. Fachleute sprechen vom Rebound-Effekt.\nDie Erklärung ist unspektakulär: Was billiger im Betrieb wird, wird häufiger genutzt. Wer ein sparsames Auto fährt, fährt im Schnitt mehr Kilometer. Wer LED-Lampen installiert, lässt sie länger brennen. Ein Teil der eingesparten Energie kehrt so zurück.\nUmstritten ist die Größe des Effekts. Die Schätzungen reichen von zehn bis über fünfzig Prozent der theoretischen Einsparung, je nach Bereich und Berechnungsweise. Einigkeit besteht allerdings darin, dass er selten null ist.\nDaraus folgt kein Argument gegen effizientere Technik. Es folgt lediglich, dass Effizienz allein nicht genügt: Ohne Regeln, die den Gesamtverbrauch begrenzen, verpufft ein erheblicher Teil des Fortschritts.", question: "Der Text erklärt vor allem, …", options: ["warum effizientere Geräte oft weniger sparen als erwartet.", "wie man Geräte technisch verbessert.", "warum Energie immer teurer wird."], c: 0 },
          { teil: 2, readingText: "Wenn Effizienz nichts spart\n\nSeit Jahren werden Geräte sparsamer. Kühlschränke, Autos, Beleuchtung – der Verbrauch pro Nutzung ist deutlich gesunken. Trotzdem steigt der Gesamtverbrauch in vielen Bereichen weiter. Fachleute sprechen vom Rebound-Effekt.\nDie Erklärung ist unspektakulär: Was billiger im Betrieb wird, wird häufiger genutzt. Wer ein sparsames Auto fährt, fährt im Schnitt mehr Kilometer. Wer LED-Lampen installiert, lässt sie länger brennen. Ein Teil der eingesparten Energie kehrt so zurück.\nUmstritten ist die Größe des Effekts. Die Schätzungen reichen von zehn bis über fünfzig Prozent der theoretischen Einsparung, je nach Bereich und Berechnungsweise. Einigkeit besteht allerdings darin, dass er selten null ist.\nDaraus folgt kein Argument gegen effizientere Technik. Es folgt lediglich, dass Effizienz allein nicht genügt: Ohne Regeln, die den Gesamtverbrauch begrenzen, verpufft ein erheblicher Teil des Fortschritts.", question: "Was ist unter Fachleuten umstritten?", options: ["Ob es den Effekt überhaupt gibt.", "Wie stark der Effekt ausfällt.", "Ob Technik besser geworden ist."], c: 1 },
          { teil: 2, readingText: "Wenn Effizienz nichts spart\n\nSeit Jahren werden Geräte sparsamer. Kühlschränke, Autos, Beleuchtung – der Verbrauch pro Nutzung ist deutlich gesunken. Trotzdem steigt der Gesamtverbrauch in vielen Bereichen weiter. Fachleute sprechen vom Rebound-Effekt.\nDie Erklärung ist unspektakulär: Was billiger im Betrieb wird, wird häufiger genutzt. Wer ein sparsames Auto fährt, fährt im Schnitt mehr Kilometer. Wer LED-Lampen installiert, lässt sie länger brennen. Ein Teil der eingesparten Energie kehrt so zurück.\nUmstritten ist die Größe des Effekts. Die Schätzungen reichen von zehn bis über fünfzig Prozent der theoretischen Einsparung, je nach Bereich und Berechnungsweise. Einigkeit besteht allerdings darin, dass er selten null ist.\nDaraus folgt kein Argument gegen effizientere Technik. Es folgt lediglich, dass Effizienz allein nicht genügt: Ohne Regeln, die den Gesamtverbrauch begrenzen, verpufft ein erheblicher Teil des Fortschritts.", question: "Welche Schlussfolgerung zieht der Text?", options: ["Effiziente Technik ist überflüssig.", "Effizienz muss durch Regeln zum Gesamtverbrauch ergänzt werden.", "Der Verbrauch lässt sich nicht beeinflussen."], c: 1 },

          // Teil 3: Meinungen zuordnen
          { teil: 3, readingText: "Vier Stimmen zur Frage: Soll die Anwesenheit im Büro verpflichtend sein?\n\nA) Marek, Teamleiter: Ich habe zwei Jahre lang alles remote geführt. Fachlich lief es, menschlich nicht. Neue Kolleginnen brauchen Monate, bis sie sich trauen zu fragen. Deshalb: zwei feste Bürotage, mehr nicht.\nB) Ilse, Sachbearbeiterin: Für mich ist es schlicht eine Rechenfrage. Zwei Stunden Pendeln täglich, für Aufgaben, die ich zu Hause störungsfreier erledige. Wer Anwesenheit verlangt, soll bitte begründen, was sie konkret bringt.\nC) Dr. Frank, Arbeitsmediziner: Beide Extreme sind ungünstig. Dauerhafte Isolation belastet ebenso wie ständige Großraumbüros. Entscheidend ist nicht die Zahl der Tage, sondern ob Beschäftigte mitbestimmen können.\nD) Nele, Berufseinsteigerin: Ich habe im ersten Jahr fast alles über Zufall gelernt – Gespräche in der Küche, Fragen über den Schreibtisch hinweg. Zu Hause hätte ich das nie mitbekommen.", question: "Wer begründet Bürotage vor allem mit der Einarbeitung neuer Kolleginnen und Kollegen?", options: ["Marek", "Ilse", "Dr. Frank", "Nele"], c: 0 },

          { teil: 3, readingText: "Vier Stimmen zur Frage: Soll die Anwesenheit im Büro verpflichtend sein?\n\nA) Marek, Teamleiter: Ich habe zwei Jahre lang alles remote geführt. Fachlich lief es, menschlich nicht. Neue Kolleginnen brauchen Monate, bis sie sich trauen zu fragen. Deshalb: zwei feste Bürotage, mehr nicht.\nB) Ilse, Sachbearbeiterin: Für mich ist es schlicht eine Rechenfrage. Zwei Stunden Pendeln täglich, für Aufgaben, die ich zu Hause störungsfreier erledige. Wer Anwesenheit verlangt, soll bitte begründen, was sie konkret bringt.\nC) Dr. Frank, Arbeitsmediziner: Beide Extreme sind ungünstig. Dauerhafte Isolation belastet ebenso wie ständige Großraumbüros. Entscheidend ist nicht die Zahl der Tage, sondern ob Beschäftigte mitbestimmen können.\nD) Nele, Berufseinsteigerin: Ich habe im ersten Jahr fast alles über Zufall gelernt – Gespräche in der Küche, Fragen über den Schreibtisch hinweg. Zu Hause hätte ich das nie mitbekommen.", question: "Wer hält die Mitbestimmung für wichtiger als die Zahl der Tage?", options: ["Marek", "Ilse", "Dr. Frank", "Nele"], c: 2 },
          { teil: 3, readingText: "Vier Stimmen zur Frage: Soll die Anwesenheit im Büro verpflichtend sein?\n\nA) Marek, Teamleiter: Ich habe zwei Jahre lang alles remote geführt. Fachlich lief es, menschlich nicht. Neue Kolleginnen brauchen Monate, bis sie sich trauen zu fragen. Deshalb: zwei feste Bürotage, mehr nicht.\nB) Ilse, Sachbearbeiterin: Für mich ist es schlicht eine Rechenfrage. Zwei Stunden Pendeln täglich, für Aufgaben, die ich zu Hause störungsfreier erledige. Wer Anwesenheit verlangt, soll bitte begründen, was sie konkret bringt.\nC) Dr. Frank, Arbeitsmediziner: Beide Extreme sind ungünstig. Dauerhafte Isolation belastet ebenso wie ständige Großraumbüros. Entscheidend ist nicht die Zahl der Tage, sondern ob Beschäftigte mitbestimmen können.\nD) Nele, Berufseinsteigerin: Ich habe im ersten Jahr fast alles über Zufall gelernt – Gespräche in der Küche, Fragen über den Schreibtisch hinweg. Zu Hause hätte ich das nie mitbekommen.", question: "Wer berichtet vom eigenen Lernen durch zufällige Gespräche?", options: ["Marek", "Ilse", "Dr. Frank", "Nele"], c: 3 },

          // Teil 4: Leserbriefe zu einem Artikel, Zustimmung ja/nein
          { teil: 4, readingText: "Leserbriefe zum Artikel „Kostenloser Nahverkehr für alle“\n\nBirgit, 47: Ein Nulltarif klingt großzügig, löst aber kein einziges Problem meiner Linie. Wenn der Bus zweimal am Tag fährt, hilft es mir wenig, dass er nichts kostet.", question: "Befürwortet Birgit den kostenlosen Nahverkehr?", options: ["Ja", "Nein"], c: 1 },
          { teil: 4, readingText: "Leserbriefe zum Artikel „Kostenloser Nahverkehr für alle“\n\nSami, 24: Ich habe in einer Stadt gelebt, in der es ihn gibt. Der Effekt war deutlich: mehr Fahrgäste, weniger Autos in der Innenstadt, und niemand musste mehr über Ticketpreise streiten. Ich wüsste nicht, was dagegen spricht.", question: "Befürwortet Sami den kostenlosen Nahverkehr?", options: ["Ja", "Nein"], c: 0 },
          { teil: 4, readingText: "Leserbriefe zum Artikel „Kostenloser Nahverkehr für alle“\n\nHerr Dr. Kunz, 58: Man sollte ehrlich sagen, wer zahlt. Die Kosten verschwinden ja nicht, sie wandern nur in den Haushalt – und damit zu Menschen, die den Bus nie benutzen. Mir wäre eine sozial gestaffelte Lösung lieber.", question: "Befürwortet Herr Dr. Kunz den kostenlosen Nahverkehr?", options: ["Ja", "Nein"], c: 1 },
          { teil: 4, readingText: "Leserbriefe zum Artikel „Kostenloser Nahverkehr für alle“\n\nLeyla, 35: Natürlich ist das teuer, und natürlich müsste parallel investiert werden. Trotzdem halte ich den Schritt für richtig: Mobilität ist Grundversorgung, so wie Schulen. Über deren Eintrittspreise diskutieren wir schließlich auch nicht.", question: "Befürwortet Leyla den kostenlosen Nahverkehr?", options: ["Ja", "Nein"], c: 0 },
          { teil: 4, readingText: "Leserbriefe zum Artikel „Kostenloser Nahverkehr für alle“\n\nOtto, 71: Wer heute schon keinen Sitzplatz findet, wird sich bedanken. Erst müsste das Angebot verdoppelt werden, dann kann man über den Preis reden – nicht umgekehrt.", question: "Befürwortet Otto den kostenlosen Nahverkehr?", options: ["Ja", "Nein"], c: 1 },

          { teil: 5, readingText: "AUSZUG AUS DER BENUTZUNGSORDNUNG DER UNIVERSITÄTSBIBLIOTHEK\n\n§3 Zulassung: Zur Nutzung berechtigt sind Angehörige der Universität sowie Externe ab 18 Jahren. Externe entrichten eine Jahresgebühr von 30 Euro; ein Nachweis über den Wohnsitz ist vorzulegen.\n§5 Ausleihe: Die Leihfrist beträgt vier Wochen. Sie verlängert sich auf Antrag zweimal um jeweils zwei Wochen, sofern keine Vormerkung vorliegt. Präsenzbestände sind von der Ausleihe ausgenommen.\n§7 Fristüberschreitung: Nach Ablauf der Leihfrist wird ohne weitere Mahnung eine Gebühr von 0,50 Euro pro Werk und Tag erhoben. Ab einem Betrag von 20 Euro ruht das Benutzungsrecht bis zum Ausgleich.\n§9 Arbeitsplätze: Reservierte Einzelarbeitsplätze verfallen nach einer Abwesenheit von mehr als 60 Minuten. Eine Rückgabe des Schlüssels bis Betriebsschluss ist verbindlich.\n§11 Hausrecht: Bei wiederholten Verstößen kann die Bibliotheksleitung die Zulassung befristet entziehen.", question: "Externe Nutzerinnen und Nutzer …", options: ["dürfen die Bibliothek nicht betreten.", "zahlen eine Jahresgebühr und weisen ihren Wohnsitz nach.", "brauchen die Empfehlung einer Lehrkraft."], c: 1 },

        schreiben: {
          tasks: [
            {
              type: "message",
              title: "Teil 1: Stellungnahme im Forum (circa 180 Wörter)",
              instructions: "In einem Online-Forum wird darüber diskutiert, ob Universitäten Anwesenheitspflicht in Seminaren einführen sollten. Schreiben Sie einen Beitrag: Nennen Sie Ihre Position, führen Sie mindestens zwei Argumente mit Beispiel an, gehen Sie auf ein Gegenargument ein und formulieren Sie ein Fazit.",
              points: ["Position klar benennen", "Zwei Argumente mit Begründung und Beispiel", "Auf ein Gegenargument eingehen und ein Fazit ziehen"],
              sample: "Meiner Ansicht nach ist eine allgemeine Anwesenheitspflicht der falsche Weg, auch wenn ich das Anliegen dahinter nachvollziehen kann.\nZum einen sagt körperliche Anwesenheit wenig über tatsächliche Beteiligung aus. In meinem eigenen Studium saßen in Pflichtveranstaltungen regelmäßig Menschen, die nebenbei für andere Fächer lernten. Gewonnen war damit niemand. Zum anderen trifft eine solche Regel vor allem diejenigen, die ohnehin unter Druck stehen: Studierende, die arbeiten müssen, oder Eltern mit Betreuungspflichten.\nZwar wird eingewendet, dass Seminare von Diskussionen leben und deshalb eine verlässliche Gruppe brauchen. Das stimmt, und für kleine Formate mit gemeinsamen Projekten halte ich eine Anwesenheitsregel auch für vertretbar.\nZusammenfassend lässt sich sagen: Statt einer pauschalen Pflicht wären verbindliche Regelungen für einzelne Veranstaltungsformen sinnvoller. Wer Beteiligung will, sollte die Lehre attraktiver machen, nicht die Kontrolle verschärfen."
            },
            {
              type: "message",
              title: "Teil 2: Formelle E-Mail (circa 100 Wörter)",
              instructions: "Sie haben für Ihr Unternehmen einen Seminarraum inklusive Technik und Verpflegung gebucht. Die Technik fiel zweimal aus, das Mittagessen kam eine Stunde zu spät. Schreiben Sie an den Anbieter: Schildern Sie den Sachverhalt sachlich, benennen Sie die Mängel und formulieren Sie eine konkrete Forderung mit Frist.",
              points: ["Sachverhalt sachlich schildern", "Konkrete Mängel benennen", "Forderung mit Frist formulieren"],
              sample: "Sehr geehrte Damen und Herren,\nam 14. März hatte ich bei Ihnen für unsere Jahrestagung den großen Seminarraum einschließlich Technik und Mittagsverpflegung gebucht (Buchungsnummer 20418).\nLeider entsprach die Leistung nicht der Vereinbarung. Die Präsentationstechnik fiel zweimal für jeweils rund zwanzig Minuten aus, sodass wir den Ablauf ändern mussten. Das zugesagte Mittagessen wurde erst mit einer Stunde Verspätung serviert.\nIch beanstande diese Mängel hiermit ausdrücklich und bitte um eine Minderung des Rechnungsbetrags um 30 Prozent. Für Ihre Rückmeldung habe ich mir den 5. April vorgemerkt.\nMit freundlichen Grüßen\nK. Renner"
            }
          ]
        },

          qa: [
            { keyword: "Aktuelle Bedeutung", sampleQ: "Warum ist das Thema derzeit aktuell?", sampleA: "Seit mobile Arbeit selbstverständlich geworden ist, verschwimmt die Grenze zwischen Arbeit und Freizeit. Eine Nachricht um 22 Uhr kostet den Absender nichts, erzeugt beim Empfänger aber Druck – und genau darüber wird inzwischen auch politisch diskutiert." },
            { keyword: "Aspekt 1 – Gesundheit", sampleQ: "Welche Rolle spielt die Gesundheit?", sampleA: "Ständige Erreichbarkeit verhindert Erholung, weil das Abschalten nie vollständig gelingt. Untersuchungen deuten darauf hin, dass gerade dieses gedankliche Weiterarbeiten die Belastung erhöht, nicht die Zahl der Stunden allein." },
            { keyword: "Aspekt 2 – Flexibilität", sampleQ: "Und die Gegenseite?", sampleA: "Betriebe verweisen zu Recht auf Flexibilität, etwa bei internationalen Teams oder in Notfällen. Eine starre Regel könnte dort mehr behindern als schützen." },
            { keyword: "Eigene Position", sampleQ: "Wie ist Ihre eigene Einschätzung?", sampleA: "Ich halte eine gesetzliche Regelung mit betrieblichen Ausnahmen für sinnvoll. Entscheidend ist weniger das Verbot einzelner Nachrichten als die klare Aussage, dass niemand außerhalb der Arbeitszeit antworten muss." },
            { keyword: "Fazit und Dank", sampleQ: "Wie schließen Sie ab?", sampleA: "Zusammenfassend lässt sich sagen, dass es weniger um Technik geht als um Erwartungen. Wer Erreichbarkeit voraussetzt, verlängert die Arbeitszeit stillschweigend. Vielen Dank für Ihre Aufmerksamkeit." }

      const out = [];
      unitsForLevel(lv).forEach(u => u.lessons.forEach(l => out.push(l.id)));

    function levelProgress(lv) {
      const ids = levelLessonIds(lv);
      const done = ids.filter(id => isLessonDone(id)).length;
      return { done, total: ids.length, frac: ids.length ? done / ids.length : 0 };

    let lessonProgress = JSON.parse(localStorage.getItem('sb_lesson_progress') || '{}');

    // ===== Prüfungsplan: exam date + four-skill readiness =====
    let examDate = localStorage.getItem('sb_exam_date') || '';
    let skillHits = JSON.parse(localStorage.getItem('sb_skill_hits') || '{}');

    function recordSkillHit(skill, correct) {
      if (!skillHits[skill]) skillHits[skill] = { done: 0, right: 0 };
      skillHits[skill].done++;
      if (correct) skillHits[skill].right++;
      localStorage.setItem('sb_skill_hits', JSON.stringify(skillHits));
    }

    function daysUntilExam() {
      if (!examDate) return null;
      const d = Math.ceil((new Date(examDate + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
      return isNaN(d) ? null : d;
    }

    // Readiness blends how much of a skill you have practised with how
    // accurate you were, so it cannot be inflated by volume alone.
    function skillReadiness(skill) {
      const target = { listening: 25, reading: 25, writing: 10, speaking: 25 }[skill] || 20;
      const h = skillHits[skill] || { done: 0, right: 0 };
      const coverage = Math.min(1, h.done / target);
      const accuracy = h.done ? h.right / h.done : 0;
      return Math.round(coverage * (0.15 + 0.85 * accuracy) * 100);
    }

    function overallReadiness() {
      const lessons = flatLessons();
      const lessonPart = lessons.filter(l => isLessonDone(l.id)).length / lessons.length;
      const skills = ['listening','reading','writing','speaking'].map(skillReadiness);
      const skillPart = skills.reduce((a,b) => a+b, 0) / 400;
      return Math.round((lessonPart * 0.5 + skillPart * 0.5) * 100);
    }

    function setExamDate(v) {
      examDate = v;
      localStorage.setItem('sb_exam_date', v);
      renderActiveTabModule();
    }
    const DAILY_GOAL_XP = 30;
    let dailyXP = 0;

    function flatLessons() {
      const out = [];
      curriculumUnits.forEach((u, ui) => u.lessons.forEach((l, li) => out.push({ ...l, ui, li, unit: u })));
      return out;
    }
    function isLessonDone(id) { return !!lessonProgress[id]; }
    function firstUnlockedIndex() {
      const all = flatLessons();
      for (let i = 0; i < all.length; i++) if (!isLessonDone(all[i].id)) return i;
      return all.length - 1;
    }
    function markLessonDone(id) {
      const wasComplete = allSceneObjects().filter(o => objProgress(o).frac === 1).length;
      lessonProgress[id] = true;
      localStorage.setItem('sb_lesson_progress', JSON.stringify(lessonProgress));
      // finishing the last lesson of a corner is worth a bonus
      const nowComplete = allSceneObjects().filter(o => objProgress(o).frac === 1).length;
      if (nowComplete > wasComplete) rewardXP(25);
    }

    // ===== Daily goal =====
    function loadDailyXP() {
      const today = new Date().toDateString();
      if (localStorage.getItem('sb_daily_date') !== today) {
        localStorage.setItem('sb_daily_date', today);
        localStorage.setItem('sb_daily_xp', '0');
        dailyXP = 0;
      } else {
        dailyXP = parseInt(localStorage.getItem('sb_daily_xp'), 10) || 0;
      }
    }
    function updateGoalRing() {
      const arc = document.getElementById('goal-arc');
      const lab = document.getElementById('goal-label');
      if (!arc || !lab) return; // ring removed - kept as a no-op
      const pct = Math.min(1, dailyXP / DAILY_GOAL_XP);
      arc.setAttribute('stroke-dashoffset', (94.2 * (1 - pct)).toFixed(1));
      lab.innerText = pct >= 1 ? '\u2713' : Math.round(pct * 100) + '%';
      arc.setAttribute('stroke', pct >= 1 ? '#22c55e' : '#f59e0b');
      lab.className = 'absolute inset-0 flex items-center justify-center text-[8px] font-black ' + (pct >= 1 ? 'text-emerald-400' : 'text-amber-400');
    }

    // ===== Lesson quiz: 5 questions from the topic, 4 to pass =====
    let quizActive = false;

    // Topics where the German side literally contains the English answer
    // ("B (Beh)" -> "B"). These are asked by ear instead of by sight.
    const audioOnlyTopics = ["Alphabet (Alphabet)", "Umlauts & Sound Rules"];

    // Remove a parenthetical so the prompt never shows its own answer
    function cleanPrompt(str) {
      const base = String(str).split('(')[0].trim();
      return base || String(str);
    }

    function shuffle(arr) { return arr.slice().sort(() => 0.5 - Math.random()); }

    // True when the German prompt would reveal its own English answer
    function isCognate(item) {
      const strip = (t) => String(t).toLowerCase()
        .replace(/^(der|die|das)\s+/, '')
        .replace(/[^a-z\u00e4\u00f6\u00fc\u00df]/g, '');
      const g = strip(cleanPrompt(item.german));
      const e = strip(item.english);
      if (!g || !e) return false;
      return g.indexOf(e) !== -1 || e.indexOf(g) !== -1;
    }

    function buildVocabQuestions(cat) {
      const pool = (allVocabularyDatabase[cat] || []).slice();
      if (pool.length < 4) return [];
      const topicByEar = audioOnlyTopics.indexOf(cat) !== -1;
      const picked = shuffle(pool).slice(0, Math.min(5, pool.length));
      return picked.map(item => {
        const wrong = shuffle(pool.filter(x => x.id !== item.id)).slice(0, 3).map(x => x.english);
        const opts = shuffle(wrong.concat([item.english]));
        // Cognates (Januar/January, Manager/Manager) would give the answer away
        // if shown as text, so they are asked by ear instead.
        const byEar = topicByEar || isCognate(item);
        return {
          prompt: byEar ? null : cleanPrompt(item.german),
          hint: byEar ? null : item.pronunciation,
          speak: item.german,
          ask: byEar ? 'Listen and choose what you hear' : 'What does this mean?',
          options: opts,
          correct: opts.indexOf(item.english)
        };
      });
    }

    // Article drills are generated live from any noun already tagged with a gender
    function buildArticleQuestions() {
      const genderWord = { masculine: 'der', feminine: 'die', neuter: 'das' };
      let pool = [];
      Object.keys(allVocabularyDatabase).forEach(cat => {
        allVocabularyDatabase[cat].forEach(item => {
          if (genderWord[item.gender]) {
            const noun = item.german.replace(/^(der|die|das)\s+/i, '').trim();
            if (noun && noun.indexOf(' ') === -1) pool.push({ noun, g: item.gender, en: item.english });
          }
        });
      });
      if (pool.length < 5) return [];
      return shuffle(pool).slice(0, 5).map(item => {
        const opts = ['der', 'die', 'das'];
        return {
          prompt: '___ ' + item.noun,
          hint: item.en,
          speak: genderWord[item.g] + ' ' + item.noun,
          ask: 'Choose the right article',
          options: opts,
          correct: opts.indexOf(genderWord[item.g]),
          explain: genderWord[item.g] + ' ' + item.noun + ' (' + item.en + ')'
        };
      });
    }

    function buildGrammarQuestions(gid) {
      if (gid === 'g_art') return buildArticleQuestions();
      const bank = grammarExercises[gid];
      if (!bank) return [];
      return shuffle(bank).slice(0, 5).map(q => ({
        prompt: q.prompt, hint: null, speak: null, ask: q.ask,
        options: q.options, correct: q.correct, explain: q.explain
      }));
    }

    function startLesson(id) {
      const lesson = flatLessons().find(l => l.id === id);
      if (!lesson) return;
      if (lesson.type === 'vocab' || lesson.type === 'grammar') {
        quizQuestions = lesson.type === 'vocab' ? buildVocabQuestions(lesson.cat) : buildGrammarQuestions(lesson.gid);
        if (!quizQuestions.length) {
          if (lesson.type === 'vocab') { selectedVocabCategory = lesson.cat; switchTab('vocabulary'); }
          else { activeGrammarIndex = lesson.idx || 0; switchTab('grammar'); }
          return;
        }
        quizActive = true; quizLesson = lesson; quizIndex = 0; quizCorrect = 0; quizPicked = null; quizFinished = false;
        renderActiveTabModule(); maybeAutoPlayQuiz();
      } else if (lesson.type === 'game') {
        markLessonDone(lesson.id); initGenderBlitzGame();
      } else if (lesson.type === 'skill') {
        markLessonDone(lesson.id); activeSkillSection = lesson.skill; activeSkillQuestionIndex = 0; resetSkillProgress(); switchTab('skills');
      } else if (lesson.type === 'exam') {
        markLessonDone(lesson.id); switchTab('exams');
      }
    }

    // Audio-only questions play themselves everywhere except Apple mobile,
    // where a delayed speak() is outside the user gesture and is dropped.
    // There, the learner taps the big Play button instead.
    function maybeAutoPlayQuiz() {
      const q = quizQuestions[quizIndex];
      if (!quizActive || !q || q.prompt || !q.speak) return;
      if (isAppleMobile) return;
      setTimeout(() => speakGerman(q.speak, true), 250);
    }

    function answerQuiz(i) {
      if (quizPicked !== null) return;
      quizPicked = i;
      if (i === quizQuestions[quizIndex].correct) { quizCorrect++; rewardXP(5); }
      renderActiveTabModule();
    }
    function nextQuizStep() {
      quizPicked = null;
      if (quizIndex < quizQuestions.length - 1) { quizIndex++; }
      else {
        quizFinished = true;
        if (quizCorrect >= Math.min(4, quizQuestions.length)) { markLessonDone(quizLesson.id); rewardXP(10); }
      }
      renderActiveTabModule(); maybeAutoPlayQuiz();
    }
    function exitQuiz() { quizActive = false; quizFinished = false; renderActiveTabModule(); }
    function retryQuiz() {
      quizQuestions = quizLesson.type === 'vocab' ? buildVocabQuestions(quizLesson.cat) : buildGrammarQuestions(quizLesson.gid);

      renderActiveTabModule();

    // Native Browser Audio Speech Synthesis Runner.
    // stripParens is used for flashcards only ("A (Aa)" should read as "A").
    // Full sentences (exam dialogues, sample answers) are spoken verbatim.
    // ===== Speech on iOS =====
    // iPhone and iPad impose four rules that desktop browsers do not:
    //   1. the very first speak() must happen inside a real user gesture,
    //   2. the queue silently pauses and has to be resume()d,
    //   3. cancel() immediately followed by speak() swallows the utterance,
    //   4. the ringer switch mutes speech entirely, with no error raised.
    // This layer handles 1-3 and warns the user about 4.
    const isAppleMobile = (function () {

          || (ua.includes('Macintosh') && typeof navigator !== 'undefined' && navigator.maxTouchPoints > 1);

    let speechPrimed = false;

    let speechFinished = false;

    // Deliberately a no-op. A silent priming utterance leaves the synth busy,

    function showSilentSwitchHint() {
      if (speechHintShown || speechEverStarted || !isAppleMobile) return;
      speechHintShown = true;
      const el = document.createElement('div');
      let vcount = 0, hasDe = false;
      try {
        const vs = window.speechSynthesis.getVoices() || [];

        hasDe = vs.some(v => v.lang && v.lang.toLowerCase().startsWith('de'));
      } catch (e) {}
      el.innerHTML = '\ud83d\udd07 <b>No sound?</b> Check the ringer switch is ON and turn the volume up '

        + 'color:#e2e8f0;font-size:12px;line-height:1.5;padding:12px 14px;border-radius:14px;'
        + 'box-shadow:0 8px 24px rgba(0,0,0,.45);border:1px solid #334155';

    function speakGerman(text, stripParens) {
      if (!('speechSynthesis' in window)) return;
      if (typeof soundOn !== 'undefined' && !soundOn) return;
      const synth = window.speechSynthesis;
      const clean = stripParens ? String(text).split('(')[0].trim() : String(text);
      if (!clean) return;

      // iOS parks the queue; resume() is required before anything will play
      try { synth.resume(); } catch (e) {}

      const fire = () => {
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = 'de-DE';
        u.rate = (typeof speechRate === 'number' ? speechRate : 0.85);
        u.volume = 1;
        const voices = synth.getVoices();
        const de = voices.find(v => v.lang === 'de-DE') || voices.find(v => v.lang && v.lang.startsWith('de'));
        if (de) u.voice = de;
        u.onstart = () => { speechEverStarted = true; speechFinished = false; };
        u.onend   = () => { speechEverStarted = true; speechFinished = true; };
        u.onerror = (e) => {
          if (e && e.error === 'interrupted' || e && e.error === 'canceled') return;
          showSilentSwitchHint();
        };
        synth.speak(u);
        // Only warn when the engine truly never engaged. iOS can take well over
        // a second to start the first utterance, and synth.speaking stays true
        // while it is working, so both are checked before showing anything.
        setTimeout(() => {
          const busy = synth.speaking || synth.pending;
          if (!speechEverStarted && !busy) showSilentSwitchHint();
        }, 2600);
      };

      if (isAppleMobile) {
        // Must stay inside the user gesture - no timers allowed here
        try { if (synth.speaking || synth.pending) synth.cancel(); } catch (e) {}
        fire();
      } else if (synth.speaking || synth.pending) {
        // Desktop WebKit loses an utterance if cancel() and speak() share a tick
        synth.cancel();
        setTimeout(fire, 40);
      } else {
        fire();
      }
    }

    // Safely embed a JS string as an argument inside a single-quoted HTML
    // onclick="'...'" attribute. JSON.stringify alone does NOT escape
    // apostrophes, so any exam text containing one (e.g. "ich bin's") would

    // Algorithmic Large-Scale Number Generator Engine Method (0 to 100 Million converter rule matrix)
    function generateGermanNumberStringFormula(num) {
      if (num === 0) return "null";
      
      const units = ["", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun"];
      const teens = ["zehn", "elf", "zwölf", "dreizehn", "vierzehn", "fünfzehn", "sechzehn", "siebzehn", "achtzehn", "neunzehn"];
      const tens = ["", "zehn", "zwanzig", "dreißig", "vierzig", "fünfzig", "sechzig", "siebzig", "achtzig", "neunzig"];

      function convertSubHundreds(val) {
        if (val < 10) return units[val];
        if (val < 20) return teens[val - 10];
        const u = val % 10;
        const t = Math.floor(val / 10);
        if (u === 0) return tens[t];
        return (u === 1 ? "ein" : units[u]) + "und" + tens[t];
      }

      function convertSubThousands(val) {
        const h = Math.floor(val / 100);
        const rem = val % 100;
        let res = "";
        if (h > 0) res += (h === 1 ? "ein" : units[h]) + "hundert";
        if (rem > 0) res += convertSubHundreds(rem);
        return res;
      }

      let outputText = "";
      let remainingValue = num;

      if (remainingValue >= 1000000) {
        const mill = Math.floor(remainingValue / 1000000);
        remainingValue %= 1000000;
        if (mill === 1) outputText += "eine Million";
        else outputText += convertSubThousands(mill) + " Millionen";
      }

      if (remainingValue >= 1000) {
        const thous = Math.floor(remainingValue / 1000);
        remainingValue %= 1000;
        if (thous === 1) outputText += "eintausend";
        else outputText += convertSubThousands(thous) + "tausend";
      }

      if (remainingValue > 0) {
        outputText += convertSubThousands(remainingValue);
      }

      if (outputText.endsWith("eins") && num > 1) {
        outputText = outputText.slice(0, -4) + "eins";
      }
      return outputText;
    }

      { at: 0,    title: 'Neuling' },      { at: 150,  title: 'Anf\u00e4nger' },

    function xpRank(xp) {
      let i = 0;
      while (i + 1 < XP_RANKS.length && xp >= XP_RANKS[i + 1].at) i++;
      const cur = XP_RANKS[i], next = XP_RANKS[i + 1] || null;
      const span = next ? next.at - cur.at : Math.max(1, xp - cur.at);
      return {
        level: i + 1, title: cur.title, next: next,
        into: next ? xp - cur.at : span, span: span,
        pct: next ? Math.min(100, Math.round(((xp - cur.at) / span) * 100)) : 100

      const germans = shuffled.map((x, i) => ({ text: x.german, id: i, matched: false }));
      const english = shuffled.map((x, i) => ({ text: x.english, id: i, matched: false }));

    function handleMatchSelection(type, idx) {
      if (type === 'ger') {
        if (matchGamePairs.germans[idx].matched) return;
        matchSelectedGermanIdx = idx;

        if (matchGamePairs.english[idx].matched) return;
        matchSelectedEnglishIdx = idx;
      }

      if (matchSelectedGermanIdx !== null && matchSelectedEnglishIdx !== null) {
        const gerItem = matchGamePairs.germans[matchSelectedGermanIdx];
        const engItem = matchGamePairs.english[matchSelectedEnglishIdx];
        
        if (gerItem.id === engItem.id) {
          gerItem.matched = true;
          engItem.matched = true;
          matchSuccessCount++;
          rewardXP(5);

      utterance.rate = 0.85;
      utterance.volume = 1;
      const voices = synth.getVoices();
      const germanVoice = voices.find(v => v.lang === 'de-DE') || voices.find(v => v.lang && v.lang.startsWith('de'));
      if (germanVoice) utterance.voice = germanVoice;
      utterance.onerror = (e) => {
        console.error('Speech synthesis error:', e.error);
        alert('Audio playback failed (' + e.error + '). Check your device volume/silent mode, or try opening this page directly in Chrome or Safari instead of an in-app browser.');
      };
      // Call speak() synchronously within the click handler - required by
      // Safari/iOS, which blocks speech that isn't directly tied to a tap.
      synth.speak(utterance);
    }

    // --- A1 E-Mail Writing Auto-Checker (heuristic grammar/content/style feedback) ---
    function checkEmailWriting() {
      const wData = currentSkills().writing[activeSkillQuestionIndex % currentSkills().writing.length];
      const text = writingUserText.trim();
      const lower = text.toLowerCase();
      const words = text.split(/\s+/).filter(Boolean);
      const wordCount = words.length;

      const salutations = ['liebe ', 'lieber ', 'hallo', 'sehr geehrte', 'sehr geehrter', 'guten morgen', 'guten tag'];
      const first60 = lower.slice(0, 60);
      const hasSalutation = salutations.some(s => first60.includes(s));

      const closings = ['viele grüße', 'liebe grüße', 'beste grüße', 'herzliche grüße', 'freundliche grüße', 'mit freundlichen grüßen', 'lg ', 'bis bald', 'dein ', 'deine '];
      const last80 = lower.slice(-80);
      const hasClosing = closings.some(s => last80.includes(s));

      const pointsCovered = wData.pointKeywords.map(variants => variants.some(v => lower.includes(v)));
      const coveredCount = pointsCovered.filter(Boolean).length;

      const hasEndPunctuation = /[.!?]\s*$/.test(text);
      const doubleSpace = / {2,}/.test(text);
      const missingSpaceAfterPunct = /[.,!?][A-Za-zÄÖÜäöü]/.test(text);

      const grammarRules = [
        { p: /\bich haben\b/i, tip: "Nach 'ich' heißt es 'ich habe', nicht 'ich haben'." },
        { p: /\bich (sind|seid)\b/i, tip: "Nach 'ich' heißt es 'ich bin'." },
        { p: /\bdu (habe|hat|habt|haben)\b/i, tip: "Nach 'du' heißt es 'du hast'." },
        { p: /\bdu (bin|ist|sind|seid)\b/i, tip: "Nach 'du' heißt es 'du bist'." },
        { p: /\ber (habe|hast|habt|haben)\b/i, tip: "Nach 'er/sie/es' heißt es 'er/sie/es hat'." },
        { p: /\bwir (bin|bist|ist|seid)\b/i, tip: "Nach 'wir' heißt es 'wir sind'." },
        { p: /\bwir (habe|hast|hat|habt)\b/i, tip: "Nach 'wir' heißt es 'wir haben'." },
        { p: /\bich kannst\b/i, tip: "Nach 'ich' heißt es 'ich kann', nicht 'ich kannst'." },
        { p: /\bich möchtest\b/i, tip: "Nach 'ich' heißt es 'ich möchte', nicht 'ich möchtest'." },
        { p: /\bich wollen\b/i, tip: "Nach 'ich' heißt es 'ich will', nicht 'ich wollen'." }
      ];
      const grammarIssues = grammarRules.filter(r => r.p.test(text)).map(r => r.tip);

      let score = 0;
      score += coveredCount * 20;
      if (hasSalutation) score += 15;
      if (hasClosing) score += 15;
      if (wordCount >= wData.minWords && wordCount <= wData.maxWords) score += 10;
      else if (wordCount >= Math.max(5, wData.minWords - 5)) score += 5;
      score -= grammarIssues.length * 5;
      if (doubleSpace) score -= 3;
      if (missingSpaceAfterPunct) score -= 3;
      if (!hasEndPunctuation) score -= 5;
      score = Math.max(0, Math.min(100, score));

      writingCheckResult = {
        wordCount, hasSalutation, hasClosing, pointsCovered, coveredCount,
        hasEndPunctuation, doubleSpace, missingSpaceAfterPunct, grammarIssues, score
      };

      if (!writingSubmitted) {
        writingSubmitted = true;
        recordSkillHit('writing', score >= 70);
        let xp = 3;
        if (score >= 70) xp = 15;
        else if (score >= 40) xp = 8;
        rewardXP(xp);
        writingCheckResult.xpAwarded = xp;
      }

      renderActiveTabModule();
    }

    // --- Speaking Pronunciation Check via Browser Microphone (Web Speech API) ---
    function normalizeGermanForMatch(str) {
      return String(str).toLowerCase()
        .replace(/[.,!?;:"'„“]/g, '')
        .replace(/ß/g, 'ss')
        .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function computeSpeechMatchScore(target, spoken) {
      const t = normalizeGermanForMatch(target).split(' ').filter(Boolean);
      const s = normalizeGermanForMatch(spoken).split(' ').filter(Boolean);
      if (t.length === 0) return 0;
      const sCopy = s.slice();
      let matched = 0;
      t.forEach(word => {
        const idx = sCopy.indexOf(word);
        if (idx !== -1) { matched++; sCopy.splice(idx, 1); }
      });
      return matched / t.length;
    }

    function getSpeechRecognitionAPI() {
      return window.SpeechRecognition || window.webkitSpeechRecognition || null;
    }

    function isSpeechRecognitionSupported() {
      // iOS/iPadOS browsers (Safari, and every other browser on iOS, since
      // they all run on WebKit under Apple's rules) do not implement the
      // SpeechRecognition Web API at all, regardless of vendor prefix checks.
      const ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Macintosh') && typeof navigator !== 'undefined' && navigator.maxTouchPoints > 1);
      return !!getSpeechRecognitionAPI() && !isIOS;
    }

    function runSpeechRecognitionPass(sData) {
      const SpeechRecognitionAPI = getSpeechRecognitionAPI();
      const recognition = new SpeechRecognitionAPI();
      recognition.lang = 'de-DE';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      let settled = false;

      recognition.onresult = (event) => {
        settled = true;
        const transcript = event.results[0][0].transcript;
        speakingRecognizedText = transcript;
        const score = computeSpeechMatchScore(sData.text, transcript);
        if (score >= 0.75) speakingFeedback = 'correct';
        else if (score >= 0.4) speakingFeedback = 'partial';
        else speakingFeedback = 'incorrect';

        recordSkillHit('speaking', speakingFeedback === 'correct');
        if (speakingFeedback === 'correct' && !speakingXPAwarded) {
          speakingXPAwarded = true;
          rewardXP(10);
        }
        speakingRecognitionActive = false;
        renderActiveTabModule();
      };

      recognition.onerror = (event) => {
        settled = true;
        speakingRecognitionActive = false;
        if (event.error === 'no-speech') {
          speakingErrorMessage = 'Es wurde keine Sprache erkannt. Bitte versuchen Sie es noch einmal und sprechen Sie direkt nach dem Antippen des Knopfes.';
        } else if (event.error === 'not-allowed' || event.error === 'audio-capture' || event.error === 'service-not-allowed') {
          speakingErrorMessage = 'Kein Zugriff auf das Mikrofon. Bitte erlauben Sie den Mikrofonzugriff in den Browser-Einstellungen für diese Seite und laden Sie die Seite neu.';
        } else if (event.error === 'network') {
          speakingErrorMessage = 'Netzwerkfehler bei der Spracherkennung. Bitte prüfen Sie Ihre Internetverbindung.';
        } else {
          speakingErrorMessage = 'Fehler bei der Spracherkennung (' + event.error + '). Bitte versuchen Sie es erneut.';
        }
        renderActiveTabModule();
      };

      recognition.onend = () => {
        if (!settled && speakingRecognitionActive) {
          // Recognition ended without ever firing onresult/onerror
          speakingRecognitionActive = false;
          speakingErrorMessage = 'Es wurde nichts aufgenommen. Bitte versuchen Sie es erneut und sprechen Sie deutlich in das Mikrofon.';
          renderActiveTabModule();
        }
      };

      try {
        recognition.start();
      } catch (e) {
        speakingRecognitionActive = false;
        speakingErrorMessage = 'Spracherkennung konnte nicht gestartet werden: ' + e.message;
        renderActiveTabModule();
      }
    }

    function startSpeakingRecognition() {
      speakingErrorMessage = null;

      if (!isSpeechRecognitionSupported()) {
        speakingErrorMessage = getSpeechRecognitionAPI()
          ? 'Ihr Gerät unterstützt leider keine Spracherkennung im Browser (iOS/iPadOS schränkt diese Funktion für alle Browser ein). Bitte probieren Sie diese Übung auf einem Android-Gerät oder einem Desktop-Computer mit Chrome oder Edge.'
          : 'Ihr Browser unterstützt keine Spracherkennung. Bitte verwenden Sie Chrome oder Edge auf einem Android-Gerät oder Desktop-Computer.';
        renderActiveTabModule();
        return;
      }

      const sData = currentSkills().speaking[activeSkillQuestionIndex % currentSkills().speaking.length];
      speakingRecognitionActive = true;
      speakingRecognizedText = null;
      speakingFeedback = null;
      renderActiveTabModule();

      // Explicitly request microphone permission first so we get a clear,
      // reliable prompt and error reason, then run the recognition pass.
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then((stream) => {
            stream.getTracks().forEach(t => t.stop());
            runSpeechRecognitionPass(sData);
          })
          .catch((err) => {
            speakingRecognitionActive = false;
            const name = err && err.name;
            if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
              speakingErrorMessage = 'Der Mikrofonzugriff ist für diese Seite blockiert. Tippen Sie auf das Schloss-/Info-Symbol links neben der Adresse, öffnen Sie "Berechtigungen" bzw. "Website-Einstellungen" und stellen Sie Mikrofon auf "Zulassen". Prüfen Sie zusätzlich unter Android-Einstellungen → Apps → Chrome → Berechtigungen, ob Mikrofon dort erlaubt ist. Laden Sie die Seite danach neu.';
            } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
              speakingErrorMessage = 'Es wurde kein Mikrofon gefunden.';
            } else if (name === 'NotReadableError' || name === 'TrackStartError') {
              speakingErrorMessage = 'Das Mikrofon wird gerade von einer anderen App verwendet. Bitte schließen Sie andere Apps, die das Mikrofon nutzen, und versuchen Sie es erneut.';
            } else {
              speakingErrorMessage = 'Kein Zugriff auf das Mikrofon (' + (name || 'unbekannter Fehler') + '). Bitte prüfen Sie die Mikrofon-Berechtigung für diese Seite und laden Sie die Seite neu.';
            }
            renderActiveTabModule();
          });
      } else {
        runSpeechRecognitionPass(sData);
      }
    }

    // --- Fallback: Record & Self-Check (for Safari on iPhone/iPad/Mac and
    // any other browser without SpeechRecognition support). Uses
    // MediaRecorder, which Safari DOES support, unlike SpeechRecognition. ---
    function hasMediaRecorderSupport() {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    }

    function startFallbackRecording() {
      speakingErrorMessage = null;
      if (!hasMediaRecorderSupport()) {
        speakingErrorMessage = 'Aufnahme wird auf diesem Gerät nicht unterstützt.';
        renderActiveTabModule();
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then((stream) => {
          fallbackMediaStreamObj = stream;
          fallbackAudioChunks = [];
          const recorder = new MediaRecorder(stream);
          fallbackMediaRecorderObj = recorder;

          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) fallbackAudioChunks.push(e.data);
          };
          recorder.onstop = () => {
            const blob = new Blob(fallbackAudioChunks, { type: fallbackAudioChunks[0] && fallbackAudioChunks[0].type ? fallbackAudioChunks[0].type : 'audio/webm' });
            if (fallbackAudioUrl) { try { URL.revokeObjectURL(fallbackAudioUrl); } catch (e) {} }
            fallbackAudioUrl = URL.createObjectURL(blob);
            fallbackRecordingActive = false;
            if (fallbackMediaStreamObj) {
              fallbackMediaStreamObj.getTracks().forEach(t => t.stop());
              fallbackMediaStreamObj = null;
            }
            renderActiveTabModule();
          };

          recorder.start();
          fallbackRecordingActive = true;
          fallbackAudioUrl = null;
          fallbackSelfAssessed = false;
          renderActiveTabModule();
        })
        .catch((err) => {
          const name = err && err.name;
          if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
            speakingErrorMessage = 'Der Mikrofonzugriff ist blockiert. Bitte erlauben Sie den Mikrofonzugriff für diese Seite in den Browser-Einstellungen und laden Sie die Seite neu.';
          } else {
            speakingErrorMessage = 'Kein Zugriff auf das Mikrofon (' + (name || 'unbekannter Fehler') + ').';
          }
          renderActiveTabModule();
        });
    }

    function stopFallbackRecording() {
      if (fallbackMediaRecorderObj && fallbackMediaRecorderObj.state !== 'inactive') {
        fallbackMediaRecorderObj.stop();
      }
    }
