  <style>
    /* German content must never be machine-translated - Chrome would turn
       "der Trainer" into "the coach" and quietly break every lesson. */
    .de { }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .flashcard-wrapper { perspective: 1000px; }
    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.5s;
      transform-style: preserve-3d;
    }
    .flashcard-wrapper.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .flashcard-back { transform: rotateY(180deg); }
    .theme-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .room-obj { cursor: pointer; outline: none; }
    .room-obj:focus-visible { filter: drop-shadow(0 0 6px rgba(99,102,241,.9)); }
    .room-pin { cursor: pointer; outline: none; transition: transform .1s ease; transform-box: fill-box; transform-origin: center; }
    .room-pin:active { transform: scale(.86); }
    .room-pin:focus-visible { filter: drop-shadow(0 0 6px rgba(99,102,241,.95)); }

    /* Splash screen shown on first paint, faded out by window.onload */
    #splash-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: #0f172a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      opacity: 1; transition: opacity .45s ease;
    }
    #splash-screen.hide { opacity: 0; pointer-events: none; }
    #splash-screen img { animation: splash-pop .6s cubic-bezier(.34,1.56,.64,1); }
    #splash-screen h1 { font-size: 27px; font-weight: 800; color: #f1f5f9; margin: 0; letter-spacing: -.02em; }
    #splash-screen p { font-size: 13px; color: #818cf8; margin: 0; font-weight: 600; }
    @keyframes splash-pop { from { transform: scale(.65); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { #splash-screen img { animation: none } }

    /* Respect the iPhone notch and home indicator */
    /* Pressable 3D buttons - a solid bottom edge instead of a border */
    .stone {
      width: 68px; height: 68px; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; line-height: 1; cursor: pointer;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .stone.done    { background:#22c55e; box-shadow: 0 5px 0 #15803d; }
    .stone.current { background:#4f46e5; box-shadow: 0 5px 0 #3730a3, 0 0 0 6px rgba(99,102,241,.22); width:76px; height:76px; font-size:30px; }
    .stone.locked  { background:#1e293b; box-shadow: none; opacity:.55; cursor: not-allowed; }
    .stone.done:active, .stone.current:active { transform: translateY(5px); box-shadow: 0 0 0 #15803d; }
    .chest { width:56px; height:56px; border-radius:14px; border:none; display:flex; align-items:center; justify-content:center; font-size:26px; }
    /* Answer feedback: a short pop for right, a short shake for wrong. */
    @keyframes sb-pop   { 0%{transform:scale(1)} 40%{transform:scale(1.06)} 100%{transform:scale(1)} }
    @keyframes sb-shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
    @keyframes sb-rise  { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
    @keyframes sb-glow  { 0%,100%{box-shadow:0 0 0 rgba(250,204,21,0)} 50%{box-shadow:0 0 18px rgba(250,204,21,.55)} }
    .sb-pop   { animation: sb-pop .34s ease; }
    .sb-shake { animation: sb-shake .38s ease; }
    .sb-rise  { animation: sb-rise .3s ease both; }
    .sb-combo { animation: sb-glow 1.1s ease-in-out infinite; }
    .sb-bar   { transition: width .45s cubic-bezier(.4,0,.2,1); }
    @media (prefers-reduced-motion: reduce) {
      .sb-pop, .sb-shake, .sb-rise, .sb-combo { animation: none !important; }
      .sb-bar { transition: none; }
    }

    .btn3d { border:none !important; box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s; }
    .btn3d:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,.35); }

    .room-obj { cursor: pointer; transition: opacity .25s ease, transform .18s ease; }
    .room-obj:active { transform: translateY(2px); }
    .room-suggest { animation: room-pulse 2.6s ease-in-out infinite; }
    @keyframes room-pulse {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(255,214,120,0)); }
      50%      { filter: drop-shadow(0 0 14px rgba(255,214,120,.95)); }
    }
    @media (prefers-reduced-motion: reduce) { .room-suggest { animation: none } }

    .tab-icon {
      font-size: 25px; line-height: 1; padding: 7px 10px; border-radius: 14px;
      border: 2px solid transparent; display: flex; align-items: center; justify-content: center;

    // Refactored Adjective / Conjugation / Article Grammar Database Array
    const a1GrammarDatabase = [
      { id: "g_art", title: "1. Definite & Indefinite Articles", rules: "German specifies noun sets through Masculine (der/ein), Feminine (die/eine), Neuter (das/ein). Plurals carry 'die' but no baseline indefinite article.", example: "Der Mann, eine Frau, das Kind." },
      { id: "g_pron", title: "2. Personal Pronouns Matrix", rules: "Subjects are tracked via personal handles: ich (I), du (you), er/sie/es (he/she/it), wir (us), ihr (you plural), sie/Sie (they/Formal You).", example: "Ich bin hier. Du lernst schnell." },
      { id: "g_sein", title: "3. Irregular Sein (To Be) Forms", rules: "The foundation auxiliary verb 'sein' shifts conjugation fields dynamically: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind.", example: "Wir sind in der Arena. Ihr seid klug." },
      { id: "g_conj", title: "4. Regular Verb Conjugation Suffixes", rules: "Drop infinitive tail (-en) and apply standardized pronoun terminations: -e, -st, -t, -en, -t, -en.", example: "Ich spiele, du spielst, er spielt, wir spielen." },
      { id: "g_poss", title: "5. Possessive Articles", rules: "Indicate ownership. Base items follow pronoun structures: mein (my), dein (your), sein (his), ihr (her/their), unser (our), euer (your pl). Appends '-e' if item is feminine/plural.", example: "Das ist mein Tisch. Wo ist meine Jacke?" },
      { id: "g_mod", title: "6. Modal Verbs Structure", rules: "Verbs like 'können' (can), 'müssen' (must), 'wollen' (want) conjugate irregularly in singular positions and push main infinitive companion verbs to the sentence tail.", example: "Ich kann Deutsch sprechen. (Infinitive 'sprechen' anchors at the extreme tail position.)" },
      { id: "g_tren", title: "7. Trennbar (Separable) Verbs", rules: "Prefix particles split off active base stems during simple sentence layouts, anchoring directly at the terminal punctuation boundary.", example: "aufstehen -> Ich stehe um 6:00 Uhr auf. ('auf' detaches to the tail window completely.)" },
      { id: "g_imp", title: "8. Imperativ Commands Formulation", rules: "Used to declare instructions/requests. The 'du' command strips away both the pronoun 'du' and the tail standard '-st' suffix tracking.", example: "Komm hierher! (Infinitive 'kommen' drops pronoun and suffix constraints entirely.)" },
      { id: "g_comp", title: "9. Degrees of Comparison Adjectives", rules: "Modifiers escalate structural attributes using baseline rules, adding '-er' for comparative forms and 'am ...-sten' for superlative declarations.", example: "klein -> kleiner -> am kleinsten. alt -> älter -> am ältesten." },
      { id: "g_perf", title: "10. Present Perfect Past Construction", rules: "Form past statements using auxiliary helpers ('haben' or 'sein' based on motion rules) at position 2, placing a 'Partizip II' particle component at sentence tail.", example: "Ich habe Deutsch gelernt. Wir sind nach Berlin gefahren." },
      { id: "g_habs", title: "11. Past Tense Haben & Sein (Präteritum)", rules: "Simple past framework constants used universally for auxiliary assets. Haben -> hatte. Sein -> war. Conjugates via standardized rules.", example: "Ich hatte ein Haus. Gestern war ich müde." },
      { id: "g_case", title: "12. Akkusativ vs Dativ Case Tracking", rules: "Akkusativ targets direct action receivers (Masculine den/einen). Dativ models indirect benefit targets (dem/der/dem/den).", example: "Ich gebe dem Mann (Dativ indirect object) den Ball (Akkusativ direct item asset)." },
      { id: "g_mail", title: "13. Formal Email Writing Blueprints", rules: "Structured communications require strict CEFR protocols: Greeting ('Sehr geehrte Damen und Herren,'), body block content, and formal signoff lines ('Mit freundlichen Grüßen').", example: "Sehr geehrte Frau Müller, ... Mit freundlichen Grüßen, Jhansi." },
      { id: "a2_weil", title: "A2.1 Nebensatz mit 'weil'", rules: "'weil' gives a reason and pushes the conjugated verb to the very end of its clause.", example: "Ich bleibe zu Hause, weil ich krank bin." },
      { id: "a2_dass", title: "A2.2 Nebensatz mit 'dass'", rules: "'dass' reports a thought or statement. As with 'weil', the verb moves to the end.", example: "Ich glaube, dass er heute kommt." },
      { id: "a2_wenn", title: "A2.3 Nebensatz mit 'wenn'", rules: "'wenn' means 'if' or 'whenever'. Verb last. If the wenn-clause comes first, the main clause starts with its verb.", example: "Wenn es regnet, bleibe ich zu Hause." },
      { id: "a2_praet", title: "A2.4 Perfekt oder Präteritum", rules: "Spoken German uses the Perfekt for the past. Written German, and the verbs sein, haben and the modals, prefer the Präteritum.", example: "Gestern war ich müde. Ich habe lange geschlafen." },
      { id: "a2_wechsel", title: "A2.5 Wechselpräpositionen", rules: "in, an, auf, über, unter, vor, hinter, neben, zwischen take the Akkusativ for movement (wohin?) and the Dativ for position (wo?).", example: "Ich gehe in die Küche. Ich bin in der Küche." },
      { id: "a2_reflex", title: "A2.6 Reflexive Verben", rules: "Reflexive verbs carry a pronoun that points back at the subject: mich, dich, sich, uns, euch, sich.", example: "Ich freue mich. Wir treffen uns um acht." },
      { id: "a2_adj", title: "A2.7 Adjektivendungen", rules: "After a definite article the adjective takes -e in the nominative singular and -en almost everywhere else.", example: "der große Mann, die kleine Frau, das alte Haus, den großen Mann" },
      { id: "a2_komp", title: "A2.8 Komparativ vor dem Nomen", rules: "A comparative before a noun still needs its adjective ending on top of the -er.", example: "Ich suche eine größere Wohnung. Das ist der bessere Weg." },
      { id: "a2_konj", title: "A2.9 Konjunktiv II: höfliche Bitten", rules: "würde, könnte, hätte and wäre make requests polite and express wishes.", example: "Könnten Sie mir bitte helfen? Ich hätte gern einen Kaffee." },
      { id: "a2_passiv", title: "A2.10 Passiv Präsens", rules: "The passive is formed with 'werden' plus the Partizip II. It puts the action, not the doer, in focus.", example: "Das Formular wird hier ausgefüllt. Die Tür wird geschlossen." },
      { id: "a2_genitiv", title: "A2.11 Genitiv", rules: "The Genitiv shows possession: des/eines + -s for masculine and neuter, der/einer for feminine and plural.", example: "das Auto des Mannes, die Farbe der Tür" },
      { id: "a2_verbprep", title: "A2.12 Verben mit Präposition", rules: "Many verbs are locked to one preposition and one case, and have to be learned as a pair.", example: "warten auf + Akk, sich freuen auf + Akk, helfen bei + Dat" },
      { id: "b1_rel", title: "B1.1 Relativsätze", rules: "A relative clause describes a noun. The relative pronoun takes its gender and number from that noun, but its case from its own clause. Verb goes last.", example: "Der Mann, der dort steht, ist mein Chef." },
      { id: "b1_konj2", title: "B1.2 Irreale Bedingungen", rules: "Konjunktiv II describes situations that are not real. Both halves usually shift: wenn + hätte/wäre/könnte, then würde in the main clause.", example: "Wenn ich Zeit hätte, würde ich mehr lesen." },
      { id: "b1_obwohl", title: "B1.3 obwohl, damit, um ... zu", rules: "obwohl concedes, damit gives a purpose with a new subject, um ... zu gives a purpose with the same subject.", example: "Ich gehe joggen, obwohl es regnet. Ich lerne, um die Prüfung zu bestehen." },
      { id: "b1_temp", title: "B1.4 als, wenn, während, bevor, nachdem", rules: "'als' for a single past event, 'wenn' for repeated or future ones. bevor, nachdem and während order two actions in time.", example: "Als ich Kind war, wohnte ich in Bonn. Nachdem ich gegessen hatte, ging ich los." },
      { id: "b1_plus", title: "B1.5 Plusquamperfekt", rules: "The past before the past: hatte or war plus Partizip II. It pairs naturally with 'nachdem'.", example: "Nachdem er angekommen war, rief er an." },
      { id: "b1_futur", title: "B1.6 Futur I", rules: "werden plus infinitive expresses a future plan or a firm assumption.", example: "Ich werde nächstes Jahr nach Wien ziehen." },
      { id: "b1_adjun", title: "B1.7 Adjektive ohne Artikel", rules: "With no article, the adjective itself carries the case signal: guter Kaffee, gute Milch, gutes Brot, guten Kaffee.", example: "Ich trinke gerne guten Kaffee mit frischer Milch." },
      { id: "b1_ndekl", title: "B1.8 n-Deklination", rules: "A group of masculine nouns adds -n or -en in every case except the nominative singular: Junge, Kollege, Student, Mensch, Herr, Nachbar.", example: "Ich kenne den Kollegen. Ich helfe dem Studenten." },
      { id: "b1_passiv2", title: "B1.9 Passiv in anderen Zeiten", rules: "Past passive uses wurde plus Partizip II. With a modal: muss ... werden.", example: "Das Haus wurde 1990 gebaut. Der Antrag muss unterschrieben werden." },
      { id: "b1_indir", title: "B1.10 Indirekte Fragen", rules: "An indirect question becomes a subordinate clause. Use the W-word, or 'ob' when there is no W-word. Verb last.", example: "Ich weiß nicht, wann er kommt. Er fragt, ob wir Zeit haben." },
      { id: "b1_partizip", title: "B1.11 Partizip als Adjektiv", rules: "Partizip I (-end) is active and ongoing; Partizip II is passive and finished. Both take normal adjective endings.", example: "das lachende Kind, das reparierte Auto" },
      { id: "b1_konnekt", title: "B1.12 deshalb, trotzdem, außerdem", rules: "These are adverbs, not conjunctions: they occupy position 1, so the verb still comes second and the subject moves after it.", example: "Es regnet. Deshalb bleibe ich zu Hause." },

      { id: "b2_konj1", title: "B2.1 Konjunktiv I – indirekte Rede", rules: "Reported speech in written German uses Konjunktiv I: er sagt, er sei / habe / komme. When the Konjunktiv I form looks identical to the present, German switches to Konjunktiv II (sie hätten instead of sie haben).", example: "Der Minister sagte, die Lage sei ernst und man habe bereits reagiert." },
      { id: "b2_passersatz", title: "B2.2 Passiversatzformen", rules: "Passive meaning without werden: sich lassen (das lässt sich reparieren), sein + zu + Infinitiv (das ist zu vermeiden), and adjectives in -bar (machbar, vermeidbar).", example: "Der Fehler lässt sich leicht beheben. = Der Fehler kann leicht behoben werden." },
      { id: "b2_nomstil", title: "B2.3 Nominalstil und Verbalstil", rules: "Formal German packs verbs into nouns: nach der Prüfung des Antrags instead of nachdem der Antrag geprüft worden ist. Being able to unpack the noun back into a clause is the B2 skill.", example: "Wegen der Verspätung des Zuges = Weil der Zug sich verspätet hat" },
      { id: "b2_partattr", title: "B2.4 Erweiterte Partizipialattribute", rules: "A participle with its own additions sits between article and noun: der gestern veröffentlichte Bericht. Unpack it as a relative clause: der Bericht, der gestern veröffentlicht wurde.", example: "die im letzten Jahr beschlossenen Maßnahmen" },
      { id: "b2_konnekt2", title: "B2.5 Zweiteilige Konnektoren", rules: "Paired connectors link two parts: sowohl … als auch, weder … noch, entweder … oder, nicht nur … sondern auch, je … desto. After je + comparative the verb goes last; after desto it comes second.", example: "Je länger die Debatte dauert, desto weniger hört man einander zu." },
      { id: "b2_konzessiv", title: "B2.6 Konzessive Verbindungen", rules: "Concession has three shapes: obwohl + verb last, zwar … aber (both main clauses), and trotzdem as an adverb in position 1 with the verb second.", example: "Zwar ist das Verfahren teuer, aber es ist sicher. Obwohl es teuer ist, wird es genutzt." },
      { id: "b2_final", title: "B2.7 Finalsätze: damit und um … zu", rules: "Purpose clauses: um … zu only when both clauses share a subject; damit whenever the subjects differ.", example: "Ich rufe an, um den Termin zu verschieben. Ich rufe an, damit du Bescheid weißt." },
      { id: "b2_modalsubj", title: "B2.8 Modalverben subjektiv", rules: "Modals also express how sure the speaker is: er muss krank sein (I am almost certain), er dürfte krank sein (probably), er könnte krank sein (possibly), er will krank gewesen sein (he claims).", example: "Sie müsste inzwischen angekommen sein." },
      { id: "b2_konj2verg", title: "B2.9 Konjunktiv II der Vergangenheit", rules: "For an unreal past, use hätte or wäre plus Partizip II. With a modal, the modal appears as an infinitive at the end: hätte kommen können.", example: "Wenn ich das gewusst hätte, hätte ich früher reagieren können." },
      { id: "b2_genprep", title: "B2.10 Präpositionen mit Genitiv", rules: "Formal registers use trotz, wegen, während, aufgrund, angesichts, innerhalb, anstatt with the genitive: trotz des Regens, aufgrund der Lage.", example: "Angesichts der hohen Kosten wurde das Projekt verschoben." },
      { id: "b2_nvv", title: "B2.11 Nomen-Verb-Verbindungen", rules: "Fixed noun plus verb pairs carry the meaning together: in Anspruch nehmen, zur Verfügung stehen, in Frage kommen, Rücksicht nehmen, eine Entscheidung treffen.", example: "Die Unterlagen stehen ab Montag zur Verfügung." },
      { id: "b2_relwas", title: "B2.12 Relativsätze mit was und wo(r)-", rules: "Use was after das, alles, nichts, etwas, viel and after a whole clause. With a preposition it becomes wo(r)-: worüber, wofür, womit.", example: "Das ist alles, was ich weiß. Er kam zu spät, was niemanden überraschte." }

        { id: "w5", title: "E-Mail: Geburtstagseinladung", scenario: "Sie machen eine Geburtstagsparty. Laden Sie Ihre Freundin Nora per E-Mail ein.", points: ["Sagen Sie, dass Sie Geburtstag haben", "Nennen Sie Datum und Uhrzeit der Party", "Bitten Sie Nora, etwas mitzubringen"], pointKeywords: [["geburtstag", "party", "feiere"], ["uhr", "samstag", "sonntag", "freitag"], ["mitbringen", "bring bitte", "bring mit"]], minWords: 20, maxWords: 40, sample: "Liebe Nora, ich habe am Samstag Geburtstag und feiere eine kleine Party um 18 Uhr bei mir zu Hause. Kannst du kommen? Bring bitte etwas zu trinken mit. Ich freue mich auf dich! Liebe Grüße, Mia" },

        { id: "a2w5", title: "SMS: Um einen Gefallen bitten", scenario: "Sie sind im Urlaub und brauchen Hilfe von Ihrem Nachbarn Herrn Klein.", points: ["Sagen Sie, wo Sie sind", "Bitten Sie um Hilfe (Blumen, Post)", "Sagen Sie, wann Sie zurückkommen"], pointKeywords: [["urlaub", "bin in", "verreist"], ["kannst du", "können sie", "bitte", "blumen", "post", "briefkasten"], ["zurück", "komme am", "wieder da", "sonntag"]], minWords: 25, maxWords: 45, sample: "Hallo Herr Klein, ich bin diese Woche im Urlaub in Österreich. Könnten Sie bitte die Blumen gießen und die Post aus dem Briefkasten nehmen? Ich komme am Sonntagabend zurück. Vielen Dank! Viele Grüße, Familie Sonnen" },
        { id: "a2w6", title: "E-Mail: Nach Informationen fragen", scenario: "Sie interessieren sich für ein Fitnessstudio in Ihrer Nähe. Schreiben Sie eine E-Mail.", points: ["Sagen Sie, warum Sie schreiben", "Fragen Sie nach Preis und Vertragslaufzeit", "Fragen Sie nach einem Probetraining"], pointKeywords: [["interesse", "möchte", "informationen", "mitgliedschaft"], ["preis", "kosten", "monat", "vertrag", "laufzeit"], ["probetraining", "ausprobieren", "einmal testen", "schnuppern"]], minWords: 30, maxWords: 55, sample: "Sehr geehrte Damen und Herren, ich interessiere mich für eine Mitgliedschaft in Ihrem Studio. Was kostet der Beitrag pro Monat, und wie lang ist die Vertragslaufzeit? Kann ich vorher ein Probetraining machen? Vielen Dank im Voraus. Mit freundlichen Grüßen, Tomás Silva" },
        { id: "a2w7", title: "E-Mail: Sich für Hilfe bedanken", scenario: "Ihre Kollegin Frau Roth hat Ihnen beim Umzug geholfen. Schreiben Sie ihr.", points: ["Bedanken Sie sich", "Sagen Sie, was besonders geholfen hat", "Laden Sie sie zu sich ein"], pointKeywords: [["danke", "vielen dank", "dankeschön"], ["geholfen", "kisten", "möbel", "auto", "hat mir sehr"], ["einladen", "besuch", "komm vorbei", "essen", "kaffee"]], minWords: 30, maxWords: 50, sample: "Liebe Frau Roth, vielen Dank für Ihre Hilfe am Samstag! Besonders mit dem Transport der Kisten haben Sie mir sehr geholfen. Kommen Sie doch bald zum Kaffee vorbei, dann zeige ich Ihnen die neue Wohnung. Herzliche Grüße, Marek" },
        { id: "a2w8", title: "E-Mail: Verspätung im Büro melden", scenario: "Ihr Zug hat Verspätung und Sie kommen zu spät zu einer Besprechung. Schreiben Sie Ihrem Chef.", points: ["Informieren Sie über die Verspätung", "Nennen Sie den Grund", "Sagen Sie, wann Sie ankommen"], pointKeywords: [["verspätung", "komme später", "zu spät"], ["zug", "bahn", "stau", "unfall", "ausgefallen"], ["gegen", "um", "in einer stunde", "voraussichtlich"]], minWords: 25, maxWords: 45, sample: "Guten Morgen Herr Lang, mein Zug hat 40 Minuten Verspätung, deshalb komme ich später zur Besprechung. Voraussichtlich bin ich gegen 10.30 Uhr im Büro. Können Sie bitte ohne mich anfangen? Mit freundlichen Grüßen, Aylin" }
      ],
      speaking: [
        { id: "a2s1", title: "Über den Arbeitstag erzählen", context: "Talk about how your day begins. Practise linking two sentences with 'dann'.", text: "Mein Tag beginnt um halb sieben. Zuerst trinke ich einen Kaffee, dann fahre ich mit dem Bus zur Arbeit.", guide: "Pronounce: Myn tahk beh-gint oom halp zee-ben. Tsoo-airst trin-keh eech eye-nen ka-fay, dan fah-reh eech mit dem boos tsoor ar-byt." },
        { id: "a2s2", title: "Einen Vorschlag machen", context: "Suggest a time to meet. Note the question word order.", text: "Wollen wir uns am Donnerstag nach der Arbeit treffen? Ich habe ab siebzehn Uhr Zeit.", guide: "Pronounce: Vol-len veer oons am don-ers-tahk nahkh dair ar-byt tref-fen? Eech hah-beh ap zeep-tsayn oor tsyt." },
        { id: "a2s3", title: "Höflich ablehnen und Alternative nennen", context: "Turn something down politely and offer another option.", text: "Das geht bei mir leider nicht. Können wir es stattdessen am Samstagvormittag machen?", guide: "Pronounce: Das gayt by meer ly-der neekht. Kur-nen veer es shtat-des-sen am zams-tahk-for-mit-tahk makh-en?" },
        { id: "a2s4", title: "Über die Vergangenheit sprechen", context: "Describe last weekend using the Perfekt.", text: "Am Wochenende habe ich meine Großeltern besucht und bin danach im Park spazieren gegangen.", guide: "Pronounce: Am vokh-en-en-deh hah-beh eech my-neh grohs-el-tern beh-zookht oont bin dah-nahkh im park shpa-tsee-ren geh-gang-en." },
        { id: "a2s5", title: "Sich beschweren", context: "Complain politely about a problem in your flat.", text: "Entschuldigung, die Heizung wird seit drei Tagen nicht mehr warm. Könnten Sie das bitte reparieren lassen?", guide: "Pronounce: Ent-shool-dee-goong, dee hy-tsoong veert zyt dry tah-gen neekht mair varm. Kurn-ten zee das bit-teh reh-pa-ree-ren las-sen?" },
        { id: "a2s6", title: "Nach dem Weg fragen (Details)", context: "Ask for directions and how long it takes.", text: "Wie komme ich am besten zum Rathaus, und wie lange dauert das zu Fuß?", guide: "Pronounce: Vee kom-meh eech am bes-ten tsoom raht-hows, oont vee lang-eh dow-ert das tsoo foos?" },
        { id: "a2s7", title: "Eine Meinung äußern", context: "Give a simple opinion with a reason using 'weil'.", text: "Ich finde die Idee gut, weil wir dann mehr Zeit haben.", guide: "Pronounce: Eech fin-deh dee ee-day goot, vyl veer dan mair tsyt hah-ben." },
        { id: "a2s8", title: "Im Restaurant reklamieren", context: "Point out politely that something is wrong with your order.", text: "Entschuldigung, ich hatte die Suppe bestellt, aber ich habe den Salat bekommen.", guide: "Pronounce: Ent-shool-dee-goong, eech hat-teh dee zoop-peh beh-shtelt, ah-ber eech hah-beh dayn za-laht beh-kom-men." },
        { id: "a2s9", title: "Über Pläne sprechen", context: "Talk about a plan for next month.", text: "Nächsten Monat möchte ich einen Computerkurs machen, weil ich das für meine Arbeit brauche.", guide: "Pronounce: Naikh-sten moh-naht murkh-teh eech eye-nen com-pyoo-ter-koors makh-en, vyl eech das fuer my-neh ar-byt brow-kheh." },
        { id: "a2s10", title: "Einen Termin vereinbaren", context: "Make an appointment on the phone and confirm it.", text: "Ich hätte gern einen Termin am Mittwochnachmittag. Passt es um vierzehn Uhr?", guide: "Pronounce: Eech het-teh gairn eye-nen ter-meen am mit-vokh-nahkh-mit-tahk. Past es oom feer-tsayn oor?" },
        { id: "a2s11", title: "Etwas vergleichen", context: "Compare two options using the comparative.", text: "Der Bus ist billiger als der Zug, aber der Zug ist viel schneller.", guide: "Pronounce: Dair boos ist bil-lee-ger als dair tsook, ah-ber dair tsook ist feel shnel-ler." },
        { id: "a2s12", title: "Sich auf etwas einigen", context: "Close a plan by naming place and time.", text: "Gut, dann treffen wir uns am Samstag um elf Uhr vor dem Kaufhaus.", guide: "Pronounce: Goot, dan tref-fen veer oons am zams-tahk oom elf oor for dem kowf-hows." }
      ]

    const b1SkillsDatabase = {
      listening: [
        { id: "b1l1", title: "Radiobeitrag: Homeoffice", context: "A short report on working from home. Listen for the main argument.", transcript: "Viele Beschäftigte arbeiten heute teilweise zu Hause. Studien zeigen: Die Produktivität bleibt gleich, aber der Kontakt zu den Kollegen leidet.", question: "What does the report say about working from home?", options: ["Alle wollen zurück ins Büro", "Die Produktivität bleibt gleich, der Kontakt leidet", "Es gibt keine Studien dazu", "Die Produktivität sinkt stark"], correct: 1 },
        { id: "b1l2", title: "Interview: Berufswechsel", context: "Someone explains why she changed careers.", transcript: "Nach zehn Jahren im Büro habe ich gekündigt. Ich wollte etwas machen, das man am Ende des Tages sehen kann. Heute bin ich Tischlerin.", question: "Why did she change jobs?", options: ["Die Firma hat geschlossen", "Sie ist umgezogen", "Sie wollte sichtbare Ergebnisse", "Wegen des Gehalts"], correct: 2 },
        { id: "b1l3", title: "Durchsage: Streik", context: "A transport announcement about a strike. Note what is recommended.", transcript: "Wegen eines Streiks fallen morgen die meisten Regionalzüge aus. Wir empfehlen, auf Fernbusse auszuweichen oder Fahrgemeinschaften zu bilden.", question: "What does the announcement recommend?", options: ["Später zu fahren", "Ein Taxi zu nehmen", "Zu Hause zu bleiben", "Fernbusse oder Fahrgemeinschaften"], correct: 3 },
        { id: "b1l4", title: "Gespräch: Mietvertrag", context: "A tenant discusses a contract clause.", transcript: "Im Vertrag steht, dass Sie drei Monate vorher kündigen müssen. Wenn Sie früher ausziehen wollen, brauchen wir einen Nachmieter.", question: "What is needed to move out early?", options: ["Nichts", "Eine höhere Miete", "Ein Nachmieter", "Eine schriftliche Erlaubnis der Nachbarn"], correct: 2 },
        { id: "b1l5", title: "Vortrag: Ehrenamt", context: "A speaker explains what volunteers gain.", transcript: "Wer sich ehrenamtlich engagiert, hilft nicht nur anderen. Viele berichten, dass sie neue Kontakte knüpfen und Fähigkeiten lernen, die im Beruf nützlich sind.", question: "What do volunteers gain according to the speaker?", options: ["Kostenlose Reisen", "Nur ein gutes Gefühl", "Kontakte und nützliche Fähigkeiten", "Ein höheres Gehalt"], correct: 2 },
        { id: "b1l6", title: "Telefonat: Reklamation", context: "A customer complains about a delivery.", transcript: "Der Schrank kam beschädigt an. Ich möchte kein neues Modell, sondern das Geld zurück. Die Rechnung habe ich noch.", question: "What does the customer want?", options: ["Eine Reparatur", "Das Geld zurück", "Ein Ersatzmodell", "Einen Gutschein"], correct: 1 },
        { id: "b1l7", title: "Diskussion: Auto in der Stadt", context: "Two speakers disagree about cars in city centres.", transcript: "Ich finde autofreie Innenstädte gut, die Luft wird besser. – Grundsätzlich ja, aber ohne guten Nahverkehr trifft das vor allem Menschen vom Land.", question: "What is the second speaker's position?", options: ["Er wohnt in der Stadt", "Er findet die Luft unwichtig", "Er stimmt zu, sieht aber ein Problem", "Er ist völlig dagegen"], correct: 2 },
        { id: "b1l8", title: "Nachricht: Praktikumsplatz", context: "A company leaves a message about an internship.", transcript: "Wir würden Ihnen den Platz gern anbieten, allerdings erst ab September statt ab Juli. Bitte sagen Sie uns bis Freitag Bescheid.", question: "What has changed?", options: ["Die Dauer", "Der Ort", "Die Bezahlung", "Der Starttermin"], correct: 3 },
        { id: "b1l9", title: "Bericht: Lebensmittel wegwerfen", context: "A report about food waste. Listen for the proposed solution.", transcript: "In Deutschland landen jährlich Millionen Tonnen Lebensmittel im Müll. Fachleute fordern, das Mindesthaltbarkeitsdatum verständlicher zu gestalten.", question: "What do experts demand?", options: ["Weniger Verpackung", "Niedrigere Preise", "Ein verständlicheres Haltbarkeitsdatum", "Mehr Supermärkte"], correct: 2 },
        { id: "b1l10", title: "Gespräch: Weiterbildung", context: "A colleague explains why she takes an evening course.", transcript: "Die Firma zahlt die Hälfte, den Rest trage ich selbst. Anstrengend ist es schon, aber ohne den Abschluss komme ich hier nicht weiter.", question: "Why does she do the course?", options: ["Der Kurs ist kostenlos", "Die Firma zwingt sie", "Sie hat viel Freizeit", "Ohne Abschluss kommt sie beruflich nicht weiter"], correct: 3 },
        { id: "b1l11", title: "Interview: Umzug aufs Land", context: "A family explains their move out of the city.", transcript: "Wir haben lange gezögert. Der Garten war das Hauptargument, auch wenn ich jetzt eine Stunde länger pendle.", question: "What was the main reason for moving?", options: ["Die Schule", "Die Arbeit", "Die günstige Miete", "Der Garten"], correct: 3 },
        { id: "b1l12", title: "Ansage: Kursänderung", context: "A course announcement changes the format.", transcript: "Der Kurs findet ab nächster Woche online statt. Die Uhrzeit bleibt gleich, den Link bekommen Sie am Vortag per E-Mail.", question: "What stays the same?", options: ["Der Ort", "Die Dozentin", "Der Preis", "Die Uhrzeit"], correct: 3 }
      ],
      reading: [
        { id: "b1r1", title: "Zeitungsartikel: Fahrradstadt", context: "Read the article extract and identify the main point.", body: "Seit die Stadt breitere Radwege gebaut hat, fahren 30 Prozent mehr Menschen mit dem Rad. Kritiker bemängeln allerdings, dass Lieferverkehr und Handwerksbetriebe kaum noch Parkplätze finden.", question: "What is the criticism mentioned?", options: ["Radwege sind zu teuer", "Zu wenige Menschen fahren Rad", "Lieferverkehr und Betriebe finden keine Parkplätze", "Die Radwege sind zu schmal"], correct: 2 },
        { id: "b1r2", title: "Leserbrief: Öffnungszeiten", context: "Read the reader's letter and identify the writer's position.", body: "Längere Öffnungszeiten klingen bequem. Aber wer denkt an die Beschäftigten? Wer sonntags arbeitet, hat kaum noch gemeinsame Zeit mit der Familie. Bequemlichkeit sollte nicht alles sein.", question: "What is the writer's view?", options: ["Er ist für Sonntagsöffnung", "Er arbeitet im Handel", "Er denkt an die Beschäftigten und ist dagegen", "Er findet Öffnungszeiten unwichtig"], correct: 2 },
        { id: "b1r3", title: "Ratgeber: Bewerbung", context: "Read the advice text and find the recommendation.", body: "Ein Anschreiben sollte keine Wiederholung des Lebenslaufs sein. Wählen Sie zwei Erfahrungen aus, die zur Stelle passen, und erklären Sie, was Sie daraus gelernt haben.", question: "What does the text advise?", options: ["Den Lebenslauf zu wiederholen", "Zwei passende Erfahrungen zu erklären", "Möglichst lang zu schreiben", "Auf ein Anschreiben zu verzichten"], correct: 1 },
        { id: "b1r4", title: "Vertragsauszug: Handyvertrag", context: "Read the contract extract and find what happens after 24 months.", body: "Die Mindestlaufzeit beträgt 24 Monate. Danach verlängert sich der Vertrag automatisch um einen Monat, sofern nicht mit einer Frist von vier Wochen gekündigt wird.", question: "What happens after the minimum term?", options: ["Man muss neu unterschreiben", "Der Vertrag endet automatisch", "Der Preis sinkt", "Er verlängert sich monatlich, wenn man nicht kündigt"], correct: 3 },
        { id: "b1r5", title: "Blogbeitrag: Sprachen lernen", context: "Read the blog post and find the author's main tip.", body: "Vokabellisten allein bringen wenig. Was bei mir funktioniert hat: jeden Tag zwanzig Minuten sprechen, auch wenn es fehlerhaft ist. Fehler sind Teil des Fortschritts, kein Beweis für Unfähigkeit.", question: "What is the author's main tip?", options: ["Nur mit Muttersprachlern üben", "Täglich sprechen, auch mit Fehlern", "Grammatik zuerst", "Mehr Vokabeln lernen"], correct: 1 },
        { id: "b1r6", title: "Aushang: Nachbarschaftsgarten", context: "Read the notice and find the condition for participation.", body: "Wer mitmachen möchte, verpflichtet sich, pro Monat mindestens vier Stunden im Garten zu helfen. Die Ernte wird gerecht unter allen Beteiligten aufgeteilt.", question: "What must participants do?", options: ["Täglich kommen", "Monatlich vier Stunden helfen", "Einen Beitrag zahlen", "Eigene Werkzeuge kaufen"], correct: 1 },
        { id: "b1r7", title: "Bericht: Fachkräftemangel", context: "Read the report and identify the proposed measure.", body: "In der Pflege fehlen tausende Fachkräfte. Neben besserer Bezahlung fordern Verbände vor allem verlässliche Dienstpläne, damit Beschäftigte Beruf und Familie planen können.", question: "Besides pay, what do associations demand?", options: ["Kürzere Ausbildung", "Neue Gebäude", "Verlässliche Dienstpläne", "Mehr Urlaub im Sommer"], correct: 2 },
        { id: "b1r8", title: "E-Mail: Projektverzug", context: "Read the internal email and identify what is being asked.", body: "Wir liegen zwei Wochen hinter dem Plan. Ich schlage vor, den Testlauf zu verschieben und stattdessen zuerst die Dokumentation abzuschließen. Bitte geben Sie mir bis Mittwoch eine Rückmeldung.", question: "What does the sender propose?", options: ["Mehr Personal einzustellen", "Den Testlauf zu verschieben", "Das Projekt abzubrechen", "Den Termin zu halten"], correct: 1 },
        { id: "b1r9", title: "Kommentar: Handys in der Schule", context: "Read the comment and identify the compromise suggested.", body: "Ein komplettes Verbot ist weltfremd, ein freier Umgang aber auch nicht sinnvoll. Sinnvoller wäre: Handys bleiben im Unterricht in der Tasche, in den Pausen entscheiden die Klassen selbst.", question: "What compromise is suggested?", options: ["Ein komplettes Verbot", "Handys nur für Lehrkräfte", "Handys immer erlaubt", "Handys im Unterricht weg, in Pausen erlaubt"], correct: 3 },
        { id: "b1r10", title: "Anzeige: Stellenausschreibung", context: "Read the job ad and find what is explicitly not required.", body: "Wir suchen eine Assistenz der Geschäftsführung. Erwartet werden gute Deutschkenntnisse und Organisationstalent. Ein Studium ist nicht erforderlich, Berufserfahrung ist willkommen.", question: "What is NOT required?", options: ["Deutschkenntnisse", "Organisationstalent", "Zuverlässigkeit", "Ein Studium"], correct: 3 },
        { id: "b1r11", title: "Reisebericht: Wandern", context: "Read the travel report and identify the writer's advice.", body: "Die Route ist landschaftlich großartig, aber unterschätzen Sie den Abstieg nicht. Wer erst mittags startet, läuft die letzte Stunde im Dunkeln. Brechen Sie früh auf.", question: "What does the writer advise?", options: ["Eine Lampe zu kaufen", "Die Route zu meiden", "Mittags zu starten", "Früh loszugehen"], correct: 3 },
        { id: "b1r12", title: "Hinweis: Versicherung", context: "Read the insurance note and find the deadline for reporting damage.", body: "Schäden sind innerhalb von sieben Tagen nach Bekanntwerden zu melden. Wird die Frist versäumt, kann die Versicherung die Zahlung kürzen oder ganz verweigern.", question: "What is the deadline for reporting damage?", options: ["Einen Monat", "Es gibt keine Frist", "24 Stunden", "Sieben Tage"], correct: 3 }
      ],
      writing: [
        { id: "b1w1", title: "Forumsbeitrag: Homeoffice", scenario: "In einem Online-Forum wird diskutiert: 'Sollten Firmen Homeoffice erlauben?' Schreiben Sie einen Beitrag.", points: ["Nennen Sie Ihre Meinung", "Nennen Sie zwei Argumente mit Beispiel", "Schreiben Sie eine Schlussfolgerung"], pointKeywords: [["meiner meinung nach", "ich finde", "ich denke", "ich bin der meinung"], ["erstens", "zum einen", "außerdem", "zum beispiel", "weil", "denn"], ["insgesamt", "zusammenfassend", "deshalb", "fazit", "abschließend"]], minWords: 60, maxWords: 110, sample: "Meiner Meinung nach sollten Firmen Homeoffice ermöglichen, aber nicht für jede Aufgabe. Zum einen sparen Beschäftigte Zeit: Ich selbst pendle täglich zwei Stunden, die mir sonst fehlen. Zum anderen leidet der Kontakt im Team, wenn niemand mehr ins Büro kommt. Deshalb halte ich eine Mischung für sinnvoll, zum Beispiel zwei feste Bürotage pro Woche. Insgesamt sollte die Entscheidung von der Aufgabe abhängen, nicht von Misstrauen." },
        { id: "b1w2", title: "Formelle E-Mail: Beschwerde", scenario: "Sie haben online einen Schreibtisch gekauft. Er kam beschädigt an. Schreiben Sie an den Kundenservice.", points: ["Beschreiben Sie Bestellung und Problem", "Erklären Sie, was Sie schon versucht haben", "Nennen Sie eine konkrete Forderung mit Frist"], pointKeywords: [["bestellt", "bestellnummer", "geliefert", "beschädigt", "kaputt"], ["angerufen", "geschrieben", "keine antwort", "bereits", "hotline"], ["erstattung", "geld zurück", "austausch", "bis zum", "innerhalb von", "frist"]], minWords: 60, maxWords: 110, sample: "Sehr geehrte Damen und Herren, am 3. April habe ich bei Ihnen einen Schreibtisch bestellt (Bestellnummer 44120). Bei der Lieferung war die Tischplatte deutlich beschädigt. Ich habe bereits zweimal bei Ihrer Hotline angerufen, bisher jedoch keine Rückmeldung erhalten. Ich bitte Sie daher, mir den Kaufpreis bis zum 30. April zu erstatten oder einen Termin für den Austausch zu nennen. Mit freundlichen Grüßen, Laura Fischer" },
        { id: "b1w3", title: "Persönlicher Brief: Rat geben", scenario: "Ihre Freundin überlegt, für ein Jahr im Ausland zu arbeiten, und fragt Sie um Rat. Antworten Sie.", points: ["Reagieren Sie auf ihre Nachricht", "Geben Sie einen Rat und begründen Sie ihn", "Bieten Sie konkrete Hilfe an"], pointKeywords: [["deine nachricht", "du schreibst", "freue mich", "verstehe"], ["ich würde", "an deiner stelle", "rate dir", "weil", "denn"], ["helfen", "ich kann", "melde dich", "besuche dich", "wohnung", "unterlagen"]], minWords: 60, maxWords: 110, sample: "Liebe Nadja, danke für deine Nachricht – ich verstehe gut, dass dich die Entscheidung beschäftigt. An deiner Stelle würde ich es machen, weil du so eine Chance selten wieder bekommst und deine Stelle hier ja nicht wegläuft. Wichtig wäre nur, vorher zu klären, wie es mit Versicherung und Wohnung aussieht. Wenn du möchtest, sehe ich mir die Unterlagen mit dir an, und deine Post kann ich auch übernehmen. Melde dich einfach! Liebe Grüße, Sonja" },
        { id: "b1w4", title: "Forumsbeitrag: Autofreie Innenstadt", scenario: "Ihre Stadt diskutiert eine autofreie Innenstadt. Schreiben Sie einen Beitrag im Stadtforum.", points: ["Beschreiben Sie kurz die Situation", "Nennen Sie Vor- und Nachteile", "Machen Sie einen Vorschlag"], pointKeywords: [["in unserer stadt", "die situation", "diskutiert", "geplant"], ["vorteil", "nachteil", "einerseits", "andererseits", "allerdings"], ["ich schlage vor", "man könnte", "mein vorschlag", "sinnvoll wäre"]], minWords: 60, maxWords: 110, sample: "In unserer Stadt wird gerade diskutiert, den Innenstadtring für Autos zu sperren. Einerseits würde das die Luft verbessern und die Straßen sicherer machen. Andererseits erreichen ältere Menschen und Handwerksbetriebe die Geschäfte dann schlechter. Ich schlage vor, die Sperrung zunächst nur samstags zu testen und gleichzeitig den Bustakt zu verdichten. Nach einem halben Jahr könnte man die Zahlen prüfen und dann entscheiden." },
        { id: "b1w5", title: "Formelle E-Mail: Kursbestätigung erbitten", scenario: "Sie haben einen Weiterbildungskurs besucht und brauchen eine Teilnahmebestätigung für Ihren Arbeitgeber.", points: ["Nennen Sie Kurs und Zeitraum", "Erklären Sie, wofür Sie die Bestätigung brauchen", "Bitten Sie um Zusendung bis zu einem Termin"], pointKeywords: [["kurs", "vom", "bis", "teilgenommen", "besucht"], ["arbeitgeber", "firma", "personalabteilung", "benötige", "für die"], ["senden", "schicken", "bis zum", "per e-mail", "post"]], minWords: 60, maxWords: 100, sample: "Sehr geehrte Frau Weiß, ich habe vom 4. bis 15. März an Ihrem Kurs 'Projektmanagement kompakt' teilgenommen. Meine Personalabteilung benötigt eine Teilnahmebestätigung, damit die Kosten erstattet werden können. Könnten Sie mir das Dokument bitte bis zum 5. April per E-Mail zusenden? Falls Sie weitere Angaben von mir brauchen, melde ich mich gern. Vielen Dank für Ihre Unterstützung. Mit freundlichen Grüßen, Ibrahim Yildiz" },
        { id: "b1w6", title: "Forumsbeitrag: Handys in der Schule", scenario: "Ein Elternforum diskutiert ein Handyverbot an Schulen. Schreiben Sie Ihre Position.", points: ["Nennen Sie Ihre Position", "Begründen Sie mit einem Beispiel", "Gehen Sie auf ein Gegenargument ein"], pointKeywords: [["ich bin", "meiner meinung nach", "ich halte"], ["zum beispiel", "beispielsweise", "bei uns", "meine tochter", "mein sohn", "weil"], ["natürlich", "zwar", "man könnte einwenden", "kritiker", "allerdings", "dagegen"]], minWords: 60, maxWords: 110, sample: "Ich halte ein komplettes Handyverbot für den falschen Weg. Kinder müssen lernen, mit Geräten umzugehen, und das gelingt nicht, wenn man sie nur wegschließt. Bei meinem Sohn hat es zum Beispiel gut funktioniert, dass die Klasse gemeinsam Regeln aufgestellt hat. Natürlich kann man einwenden, dass Handys im Unterricht stören – das stimmt. Deshalb wäre ich dafür, sie während der Stunden einzusammeln, in den Pausen aber zu erlauben." },
        { id: "b1w7", title: "Persönliche E-Mail: Absage mit Erklärung", scenario: "Sie können bei einem Umzug Ihrer Freundin doch nicht helfen. Schreiben Sie ihr.", points: ["Sagen Sie ab und entschuldigen Sie sich", "Erklären Sie den Grund genauer", "Bieten Sie eine Alternative an"], pointKeywords: [["leider", "tut mir leid", "kann nicht", "muss absagen"], ["weil", "denn", "dienstreise", "arbeit", "familie", "termin"], ["stattdessen", "dafür", "am sonntag", "später", "ich kann", "jemand anderes"]], minWords: 55, maxWords: 100, sample: "Liebe Kim, es tut mir wirklich leid, aber ich kann dir am Samstag doch nicht beim Umzug helfen. Mein Chef hat mich kurzfristig auf eine Dienstreise geschickt, die ich nicht verschieben kann. Dafür bin ich am Sonntag den ganzen Tag frei und könnte dir beim Auspacken und beim Aufbauen der Regale helfen. Außerdem hat mein Bruder ein Auto und würde am Samstag die schweren Kisten fahren. Sag mir einfach Bescheid! Liebe Grüße, Marc" },
        { id: "b1w8", title: "Formelle E-Mail: Vorschlag an den Arbeitgeber", scenario: "Sie möchten in Ihrer Firma eine Fahrradstellplatz-Lösung vorschlagen. Schreiben Sie an die Geschäftsführung.", points: ["Beschreiben Sie das Problem", "Machen Sie einen konkreten Vorschlag", "Nennen Sie den Nutzen für die Firma"], pointKeywords: [["problem", "zurzeit", "im moment", "keine", "zu wenige", "stellplätze"], ["ich schlage vor", "möglich wäre", "vorschlag", "überdachte", "abstellraum"], ["vorteil", "nutzen", "für die firma", "gesünder", "weniger", "image", "sparen"]], minWords: 60, maxWords: 110, sample: "Sehr geehrte Frau Berger, zurzeit gibt es auf dem Firmengelände nur sechs Fahrradstellplätze, die täglich belegt sind. Mehrere Kolleginnen und Kollegen stellen ihre Räder deshalb ungeschützt an den Zaun. Ich schlage vor, den ungenutzten Bereich neben der Halle 2 mit einem einfachen Dach und Bügeln auszustatten. Das wäre vergleichsweise günstig und würde mehr Beschäftigte zum Radfahren bewegen, was auch die Parkplatzsituation entspannt. Gern stelle ich den Vorschlag genauer vor. Mit freundlichen Grüßen, Petra Lang" }
      ],
      speaking: [
        { id: "b1s1", title: "Meinung äußern und begründen", context: "State an opinion and back it up in one connected sentence.", text: "Ich bin der Meinung, dass Homeoffice sinnvoll ist, solange das Team sich regelmäßig persönlich trifft.", guide: "Pronounce: Eech bin dair my-noong, das home-office zin-fol ist, zoh-lang-eh das team zeekh reh-geh-mai-seekh per-zurn-leekh trift." },
        { id: "b1s2", title: "Ein Gegenargument einräumen", context: "Concede a counterargument before making your own point.", text: "Natürlich kostet das mehr Geld, trotzdem halte ich die Investition langfristig für richtig.", guide: "Pronounce: Na-tuer-leekh kos-tet das mair gelt, trots-dem hal-teh eech dee in-ves-tee-tsee-ohn lang-fris-teekh fuer reekh-teekh." },
        { id: "b1s3", title: "Über Erfahrungen berichten", context: "Report a past experience and what you learned from it.", text: "Als ich im Ausland gearbeitet habe, habe ich gelernt, wie wichtig es ist, Fragen zu stellen.", guide: "Pronounce: Als eech im ows-lant geh-ar-by-tet hah-beh, hah-beh eech geh-lairnt, vee veekh-teekh es ist, frah-gen tsoo shtel-len." },
        { id: "b1s4", title: "Etwas höflich reklamieren", context: "Complain formally and state a clear request.", text: "Die Lieferung war beschädigt. Ich möchte Sie bitten, mir den Betrag zu erstatten.", guide: "Pronounce: Dee lee-feh-roong var beh-shay-deekht. Eech murkh-teh zee bit-ten, meer dayn beh-trahk tsoo air-shtat-ten." },
        { id: "b1s5", title: "Vermutungen ausdrücken", context: "Express an assumption with 'wahrscheinlich' and Konjunktiv II.", text: "Wahrscheinlich wäre es besser, wenn wir den Termin um eine Woche verschieben würden.", guide: "Pronounce: Vahr-shyn-leekh vai-reh es bes-ser, ven veer dayn ter-meen oom eye-neh vokh-eh fer-shee-ben vuer-den." },
        { id: "b1s6", title: "Ein Problem beschreiben", context: "Describe a problem precisely, including how long it has lasted.", text: "Seit etwa zwei Wochen funktioniert der Aufzug nicht zuverlässig, besonders morgens bleibt er oft stehen.", guide: "Pronounce: Zyt et-vah tsvy vokh-en foonk-tsee-oh-neert dair owf-tsook neekht tsoo-fair-les-seekh, beh-zon-ders mor-gens blypt air oft shtay-en." },
        { id: "b1s7", title: "Vor- und Nachteile abwägen", context: "Weigh up two sides in one sentence.", text: "Einerseits spart man Zeit, andererseits verliert man den Kontakt zu den Kollegen.", guide: "Pronounce: Eye-ner-zyts shpart man tsyt, an-der-er-zyts fer-leert man dayn kon-takt tsoo dayn kol-lay-gen." },
        { id: "b1s8", title: "Einen Vorschlag begründen", context: "Make a proposal and justify it with a purpose clause.", text: "Ich schlage vor, dass wir zuerst die Dokumentation abschließen, damit der Testlauf reibungslos läuft.", guide: "Pronounce: Eech shlah-geh for, das veer tsoo-airst dee do-koo-men-ta-tsee-ohn ap-shlee-sen, dah-mit dair test-lowf ry-boongs-lohs loyft." },
        { id: "b1s9", title: "Höflich widersprechen", context: "Disagree politely in a discussion.", text: "Da bin ich anderer Meinung. Aus meiner Sicht ist das Problem nicht die Technik, sondern die Organisation.", guide: "Pronounce: Dah bin eech an-der-er my-noong. Ows my-ner zeekht ist das prob-laym neekht dee tekh-nik, zon-dern dee or-ga-nee-za-tsee-ohn." },
        { id: "b1s10", title: "Über Zukunftspläne sprechen", context: "Talk about a plan and the condition attached to it.", text: "Wenn ich die Prüfung bestehe, möchte ich mich im Herbst für die Weiterbildung anmelden.", guide: "Pronounce: Ven eech dee pruef-oong beh-shtay-eh, murkh-teh eech meekh im hairpst fuer dee vy-ter-bil-doong an-mel-den." },
        { id: "b1s11", title: "Ein Gespräch zusammenfassen", context: "Summarise the result of a discussion.", text: "Wir haben uns also darauf geeinigt, den Vorschlag zunächst drei Monate zu testen.", guide: "Pronounce: Veer hah-ben oons al-zoh dah-rowf geh-eye-neekht, dayn for-shlahk tsoo-naikhst dry moh-nah-teh tsoo tes-ten." },
        { id: "b1s12", title: "Um Präzisierung bitten", context: "Ask someone to be more specific without sounding rude.", text: "Könnten Sie das bitte etwas genauer erklären? Ich bin mir nicht sicher, ob ich Sie richtig verstanden habe.", guide: "Pronounce: Kurn-ten zee das bit-teh et-vas geh-now-er air-klai-ren? Eech bin meer neekht zee-kher, op eech zee reekh-teekh fer-shtan-den hah-beh." }
      ]
    };

    // Skills lab content is keyed by level so the tab follows the level switcher.
    const b2SkillsDatabase = {
      listening: [
        { id: "b2l1", title: "Radiobeitrag: Homeoffice", context: "A radio feature reports a study result. Catch what the study actually found.", transcript: "Eine neue Studie zeigt: Beschäftigte im Homeoffice arbeiten im Schnitt nicht weniger, berichten aber häufiger, dass sie abends schlecht abschalten können.", question: "What does the study find?", options: ["People are more often ill", "People work less at home", "People prefer the office", "People work about the same but switch off less easily"], correct: 3 },
        { id: "b2l2", title: "Diskussion: Tempolimit", context: "Two speakers disagree. Identify the second speaker's objection.", transcript: "A: Ein Tempolimit würde den Ausstoß sofort senken. B: Das bestreite ich nicht, nur fällt der Effekt deutlich kleiner aus, als oft behauptet wird.", question: "What is B's position?", options: ["B denies any effect", "B wants a higher limit", "B accepts the effect but thinks it is smaller than claimed", "B agrees fully"], correct: 2 },
        { id: "b2l3", title: "Vortrag: Fachkräftemangel", context: "A lecture names a cause. Note which one.", transcript: "Der Mangel liegt weniger an fehlenden Bewerbungen als an langwierigen Anerkennungsverfahren für ausländische Abschlüsse.", question: "What does the speaker see as the main cause?", options: ["Low salaries", "Slow recognition of foreign qualifications", "Too few applications", "Poor training places"], correct: 1 },
        { id: "b2l4", title: "Interview: Ehrenamt", context: "An interviewee qualifies her own praise. Catch the reservation.", transcript: "Ehrenamtliche Arbeit ist wertvoll, keine Frage. Problematisch wird es erst, wenn der Staat sich darauf verlässt und eigene Aufgaben abgibt.", question: "What is her reservation?", options: ["Volunteers are badly trained", "The state should not offload its own duties onto volunteers", "Volunteering is not valuable", "There are too few volunteers"], correct: 1 },
        { id: "b2l5", title: "Nachricht: Betriebsversammlung", context: "A voicemail from a colleague. Note what is expected of you.", transcript: "Die Versammlung wurde auf Donnerstag verlegt. Wichtig: Wer eine Frage einreichen möchte, muss sie bis Mittwochmittag schriftlich beim Betriebsrat abgeben.", question: "What must you do to ask a question?", options: ["Ask on the day", "Nothing, questions are collected live", "Submit it in writing by Wednesday midday", "Email the manager"], correct: 2 },
        { id: "b2l6", title: "Podcast: Künstliche Intelligenz", context: "The speaker makes a careful prediction. Note how certain he is.", transcript: "Ganze Berufe werden kaum verschwinden. Wahrscheinlich verschieben sich eher einzelne Tätigkeiten innerhalb der Berufe.", question: "How confident is the speaker?", options: ["Certain that jobs will disappear", "He refuses to predict", "Certain nothing will change", "Cautious: single tasks will shift rather than whole jobs"], correct: 3 },
        { id: "b2l7", title: "Bericht: Mietmarkt", context: "A news item contrasts two figures. Catch the contrast.", transcript: "Die Zahl der Neubauten ist leicht gestiegen. Gleichzeitig sind die Mieten in den Innenstädten weiter kräftig geklettert.", question: "What is the contrast?", options: ["Rents fell despite building", "Both rose slightly", "Building rose slightly, rents still rose sharply", "Building fell, rents fell"], correct: 2 },
        { id: "b2l8", title: "Gespräch: Weiterbildung", context: "A manager makes a conditional offer. Note the condition.", transcript: "Die Firma übernimmt die Kursgebühren, vorausgesetzt, Sie bleiben danach mindestens zwei Jahre im Betrieb.", question: "What is the condition?", options: ["Passing an exam", "Working weekends", "Paying half yourself", "Staying at least two years afterwards"], correct: 3 },
        { id: "b2l9", title: "Kommentar: Datenschutz", context: "The commentator concedes before objecting. Catch the objection.", transcript: "Natürlich erleichtert die Datenweitergabe die Forschung. Trotzdem darf sie nicht ohne wirksame Kontrolle geschehen.", question: "What is the commentator's point?", options: ["Oversight already works well", "Research is unimportant", "Data sharing helps, but needs effective oversight", "Data sharing should stop"], correct: 2 },
        { id: "b2l10", title: "Durchsage: Streik", context: "A station announcement gives an exception. Catch it.", transcript: "Aufgrund des Streiks entfallen sämtliche Regionalzüge. Der Fernverkehr fährt nach Sonderfahrplan, allerdings ohne Halt in Kleinstädten.", question: "What still runs?", options: ["Nothing at all", "Long-distance trains on a special timetable, without small-town stops", "Only regional trains", "All trains, delayed"], correct: 1 },
        { id: "b2l11", title: "Vorstellungsgespräch: Rückfrage", context: "A candidate answers a difficult question. Note the strategy.", transcript: "Mit Konflikten gehe ich so um, dass ich zuerst die Sachfrage von der persönlichen Ebene trenne und dann eine gemeinsame Lösung vorschlage.", question: "What is the candidate's approach to conflict?", options: ["Avoid the conflict", "Escalate to the manager", "Wait until it resolves itself", "Separate the issue from the personal level, then propose a joint solution"], correct: 3 },
        { id: "b2l12", title: "Umfrage: Ehrenamt und Zeit", context: "A survey result is summarised. Catch the qualification.", transcript: "Zwei Drittel der Befragten wären grundsätzlich bereit, sich zu engagieren – allerdings nur, wenn der Zeitaufwand planbar bleibt.", question: "Under what condition would they volunteer?", options: ["If friends joined too", "If they were paid", "If it were online", "If the time commitment stays predictable"], correct: 3 }
      ],
      reading: [
        { id: "b2r1", title: "Kommentar: Vier-Tage-Woche", context: "Read the comment and identify the author's overall position.", body: "Wer die Vier-Tage-Woche pauschal als Produktivitätswunder verkauft, macht es sich zu leicht. In wissensintensiven Bereichen sind die Ergebnisse durchaus ermutigend; in Schichtbetrieben mit festen Besetzungsvorgaben lässt sich dieselbe Arbeit jedoch nicht in weniger Stunden erledigen.", question: "What is the author's position?", options: ["The evidence is entirely missing", "The four-day week always works", "It works in some sectors but not where staffing is fixed", "It never works"], correct: 2 },
        { id: "b2r2", title: "Studie: Lesekompetenz", context: "Read the summary and identify what the data do NOT show.", body: "Der Zusammenhang zwischen Bildschirmzeit und schwächerer Lesekompetenz ist statistisch belegt. Über die Richtung der Wirkung sagt die Studie allerdings nichts: Ebenso denkbar ist, dass Kinder mit Leseschwierigkeiten häufiger zum Bildschirm greifen.", question: "What does the study leave open?", options: ["How many children took part", "Which way the causal direction runs", "Whether reading matters", "Whether the correlation exists"], correct: 1 },
        { id: "b2r3", title: "Stellenanzeige: Projektleitung", context: "Read the posting and find what is required rather than merely welcome.", body: "Vorausgesetzt werden ein abgeschlossenes Studium sowie mehrjährige Projekterfahrung. Von Vorteil, aber nicht zwingend, sind Kenntnisse im Vergaberecht sowie Erfahrung mit internationalen Teams.", question: "Which is a firm requirement?", options: ["Knowledge of procurement law", "A completed degree and several years of project experience", "Experience with international teams", "A foreign language"], correct: 1 },
        { id: "b2r4", title: "Leserbrief: Innenstadt", context: "Read the letter and identify the concession the writer makes.", body: "Dass eine autofreie Innenstadt die Luft verbessert, will ich gar nicht bestreiten. Nur wird selten erwähnt, wie ältere Menschen aus den Randbezirken künftig ihre Arzttermine erreichen sollen.", question: "What does the writer concede?", options: ["That the suburbs are well connected", "That older people do not need appointments", "That cars are necessary everywhere", "That car-free centres improve air quality"], correct: 3 },
        { id: "b2r5", title: "Sachtext: Ehrenamt in Zahlen", context: "Read the passage and identify the trend described.", body: "Die Gesamtzahl der Engagierten ist stabil geblieben. Verändert hat sich die Form: Statt langfristiger Mitgliedschaften in Vereinen überwiegen heute projektbezogene, zeitlich begrenzte Einsätze.", question: "What has changed?", options: ["Volunteering has disappeared", "Fewer people volunteer", "Clubs have grown", "The form of volunteering, from long-term membership to short projects"], correct: 3 },
        { id: "b2r6", title: "Vertragstext: Kündigungsfrist", context: "Read the clause and work out the practical consequence.", body: "Das Arbeitsverhältnis kann von beiden Seiten mit einer Frist von drei Monaten zum Quartalsende gekündigt werden. Maßgeblich ist der Zugang der schriftlichen Kündigung.", question: "What matters for the deadline?", options: ["The start of the month", "A verbal announcement", "The date the written notice arrives", "The date the letter was written"], correct: 2 },
        { id: "b2r7", title: "Fachartikel: Rebound-Effekt", context: "Read the extract and identify the phenomenon described.", body: "Effizientere Geräte senken den Verbrauch pro Nutzung. Häufig steigt jedoch die Nutzung selbst, sodass die Einsparung teilweise oder ganz aufgezehrt wird.", question: "What is described?", options: ["Consumption always falls", "Prices rise with efficiency", "Efficiency gains are eaten up by increased use", "Devices break more often"], correct: 2 },
        { id: "b2r8", title: "Behördenschreiben: Widerspruch", context: "Read the letter and identify what you must do next.", body: "Gegen diesen Bescheid können Sie innerhalb eines Monats nach Bekanntgabe schriftlich Widerspruch einlegen. Ein per Telefon erklärter Widerspruch wahrt die Frist nicht.", question: "How must an objection be made?", options: ["In person at any time", "By phone within a month", "In writing within a month of notification", "There is no possibility of objection"], correct: 2 },
        { id: "b2r9", title: "Rezension: Ausstellung", context: "Read the review and identify the reviewer's mixed judgement.", body: "Die Auswahl der Exponate ist klug und überraschend. Umso bedauerlicher, dass die Beschriftungen so knapp ausfallen, dass Besucherinnen ohne Vorwissen kaum eine Einordnung finden.", question: "What is the reviewer's judgement?", options: ["Everything disappointing", "Selection poor, labelling good", "Everything excellent", "Selection good, labelling too brief"], correct: 3 },
        { id: "b2r10", title: "Ratgeber: Verhandlung", context: "Read the advice and identify the recommended tactic.", body: "Nennen Sie nicht als Erste eine Zahl, sondern fragen Sie nach dem vorgesehenen Rahmen. Wer zuerst eine Summe nennt, legt die Verhandlung häufig unnötig fest.", question: "What is advised?", options: ["Refuse to negotiate", "Name your figure first", "Ask about the intended range instead of naming a figure first", "Always accept the first offer"], correct: 2 },
        { id: "b2r11", title: "Bericht: Pendeln", context: "Read the report and identify the causal claim.", body: "Wer täglich mehr als eine Stunde pendelt, berichtet deutlich häufiger von Erschöpfung. Ob das Pendeln die Ursache ist oder lediglich mit anderen Belastungen zusammenfällt, bleibt offen.", question: "What does the report claim?", options: ["Commuting definitely causes exhaustion", "Commuting has no effect", "Exhaustion causes commuting", "There is an association, but the cause is not established"], correct: 3 },
        { id: "b2r12", title: "Positionspapier: Digitalisierung", context: "Read the demand and identify what is being asked for.", body: "Gefordert wird nicht mehr Technik, sondern klare Zuständigkeiten: Solange unklar bleibt, wer Daten pflegt und wer haftet, nützt auch die beste Software wenig.", question: "What is being demanded?", options: ["More software", "Clear responsibilities for data and liability", "Higher budgets only", "Fewer digital tools"], correct: 1 }
      ],
      writing: [
        { id: "b2w1", title: "Stellungnahme: Handyverbot an Schulen", scenario: "In einem Online-Forum wird diskutiert, ob Handys an Schulen verboten werden sollen. Schreiben Sie einen Forumsbeitrag.", points: ["Nennen Sie Ihre Position klar", "Führen Sie ein Argument mit Begründung und Beispiel an", "Gehen Sie auf einen möglichen Einwand ein"], pointKeywords: [["meiner ansicht nach", "ich bin der meinung", "ich halte", "meines erachtens"], ["weil", "denn", "zum beispiel", "beispielsweise", "dadurch"], ["allerdings", "zwar", "einwand", "kritiker", "man könnte einwenden", "andererseits"]], minWords: 80, maxWords: 140, sample: "Meiner Ansicht nach ist ein vollständiges Verbot der falsche Weg. Handys gehören inzwischen zum Alltag, und Schulen haben die Aufgabe, den Umgang damit zu vermitteln, statt ihn nur zu untersagen. In meiner alten Schule wurden Handys im Unterricht gezielt für Recherche eingesetzt, was die Stunden deutlich lebendiger gemacht hat. Zwar wird eingewendet, dass Geräte vom Lernen ablenken, und das trifft in vielen Fällen zu. Genau deshalb halte ich klare Regeln für einzelne Situationen für sinnvoller als ein pauschales Verbot, das ohnehin schwer zu kontrollieren wäre." },
        { id: "b2w2", title: "Beschwerde: Mangelhafte Leistung", scenario: "Sie haben für Ihre Firma einen Konferenzraum gemietet. Technik und Verpflegung waren mangelhaft. Schreiben Sie eine formelle Beschwerde an den Anbieter.", points: ["Schildern Sie den Sachverhalt sachlich", "Benennen Sie die konkreten Mängel", "Formulieren Sie eine klare Forderung mit Frist"], pointKeywords: [["am", "gebucht", "veranstaltung", "konferenzraum", "hiermit"], ["mangel", "funktionierte nicht", "defekt", "verspätet", "unvollständig", "beanstande"], ["erstattung", "minderung", "bis zum", "frist", "erwarte", "fordere"]], minWords: 80, maxWords: 150, sample: "Sehr geehrte Damen und Herren, am 14. März habe ich für unsere Jahrestagung den großen Konferenzraum gebucht. Leider entsprach die Leistung nicht der Vereinbarung. Die Präsentationstechnik fiel zweimal für längere Zeit aus, sodass wir den Ablauf ändern mussten. Die zugesagte Verpflegung wurde erst mit einer Stunde Verspätung und unvollständig geliefert. Ich beanstande diese Mängel hiermit ausdrücklich und bitte um eine Minderung des Rechnungsbetrags um 30 Prozent. Für Ihre Rückmeldung habe ich mir den 5. April vorgemerkt. Mit freundlichen Grüßen, K. Renner" },
        { id: "b2w3", title: "E-Mail: Vorschlag an die Abteilungsleitung", scenario: "Sie möchten in Ihrer Abteilung einen festen Homeoffice-Tag einführen. Schreiben Sie eine E-Mail an Ihre Abteilungsleiterin.", points: ["Begründen Sie den Vorschlag", "Gehen Sie auf mögliche Bedenken ein", "Schlagen Sie ein konkretes Vorgehen vor"], pointKeywords: [["vorschlag", "weil", "würde", "vorteil", "konzentriert"], ["bedenken", "erreichbarkeit", "allerdings", "einwand", "sorge"], ["testphase", "drei monate", "pilot", "vorschlage", "auswerten", "danach"]], minWords: 80, maxWords: 140, sample: "Sehr geehrte Frau Kessler, ich möchte anregen, in unserer Abteilung einen festen Homeoffice-Tag einzuführen. Aufgaben, die längere konzentrierte Arbeit erfordern, ließen sich so deutlich störungsärmer erledigen. Mir ist bewusst, dass die Erreichbarkeit im Team dabei nicht leiden darf. Genau deshalb schlage ich vor, den Tag für alle einheitlich auf den Mittwoch zu legen und Besprechungen bewusst auf die übrigen Tage zu verschieben. Sinnvoll wäre eine Testphase von drei Monaten, die wir anschließend gemeinsam auswerten. Über eine kurze Rückmeldung würde ich mich freuen. Mit freundlichen Grüßen, T. Adam" },

          { teil: 1, audioText: "Und nun das Wetter für morgen: Am Vormittag bleibt es im ganzen Land trocken, aber ziemlich kühl. Am Nachmittag ziehen von Westen Wolken auf, und am Abend regnet es fast überall.", question: "Wie wird das Wetter morgen?", options: ["Es regnet den ganzen Tag.", "Es bleibt den ganzen Tag sonnig.", "Vormittags trocken, abends Regen."], c: 2 },
          { teil: 1, audioText: "Sie hören Radio Ostwind. Für unsere Sendung am Freitag suchen wir Hörerinnen und Hörer, die schon einmal im Ausland gearbeitet haben. Rufen Sie uns an und erzählen Sie uns kurz Ihre Geschichte.", question: "Was sollen die Hörerinnen und Hörer tun?", options: ["Ins Studio kommen.", "Im Radio anrufen und erzählen.", "Eine E-Mail schreiben."], c: 1 },

          { teil: 2, audioText: "Frau: Und was machen wir am Dienstag? Mann: Da hat mein Bruder Geburtstag. Wir sind abends bei ihm eingeladen. Frau: Stimmt, das hatte ich fast vergessen.", question: "Was machen die beiden am Dienstag?", options: ["Sie gehen ins Schwimmbad.", "Sie bleiben allein zu Hause.", "Sie feiern bei seinem Bruder."], c: 2 },
          { teil: 2, audioText: "Mann: Am Mittwoch möchte ich endlich wieder Sport machen. Frau: Dann gehen wir joggen, im Park ist es jetzt richtig schön. Mann: Einverstanden, aber bitte erst nach der Arbeit.", question: "Was machen die beiden am Mittwoch?", options: ["Sie gehen ins Kino.", "Sie joggen im Park.", "Sie fahren Rad."], c: 1 },
          { teil: 2, audioText: "Frau: Donnerstag kommt Lea aus Wien. Ich hole sie um sechs vom Flughafen ab. Mann: Gut, dann koche ich zu Hause schon etwas.", question: "Was macht die Frau am Donnerstag?", options: ["Sie kocht das Abendessen.", "Sie holt eine Freundin ab.", "Sie fliegt nach Wien."], c: 1 },
          { teil: 2, audioText: "Mann: Am Freitag ist das Konzert im Park, die Karten habe ich schon gekauft. Frau: Super! Dann essen wir vorher schnell eine Kleinigkeit.", question: "Was machen die beiden am Freitag?", options: ["Sie kaufen Theaterkarten.", "Sie gehen zu einem Konzert.", "Sie bleiben zu Hause."], c: 1 },
          { teil: 2, audioText: "Frau: Und der Samstag? Mann: Da müssen wir zuerst den Keller aufräumen, das schieben wir seit Monaten. Frau: Na gut. Aber danach gehen wir ins Café.", question: "Was machen die beiden am Samstag zuerst?", options: ["Sie machen einen Ausflug.", "Sie räumen den Keller auf.", "Sie gehen ins Café."], c: 1 },

          { teil: 3, audioText: "Junge: Was hast du am Wochenende gemacht? Mädchen: Eigentlich wollte ich am Samstag ins Schwimmbad, aber es hat den ganzen Tag geregnet. Also war ich mit Nina im Museum. Am Sonntag habe ich dann nur gelesen.", question: "Was hat das Mädchen am Samstag gemacht?", options: ["Sie hat gelesen.", "Sie war im Museum.", "Sie war im Schwimmbad."], c: 1 },
          { teil: 3, audioText: "Frau: Ich suche eine Hose für die Arbeit, am liebsten in Schwarz. Mann: Diese hier haben wir leider nur in Blau. In Schwarz hätten wir noch diesen Rock. Frau: Nein danke, einen Rock trage ich nicht. Dann nehme ich die blaue Hose.", question: "Was kauft die Frau?", options: ["Einen schwarzen Rock.", "Eine schwarze Hose.", "Eine blaue Hose."], c: 2 },
          { teil: 3, audioText: "Mann: Guten Tag, ich möchte mich für den Deutschkurs anmelden. Frau: Gern. Das Formular liegt hier, die Kopie von Ihrem Ausweis habe ich auch schon. Es fehlt nur noch Ihre Unterschrift hier unten.", question: "Was fehlt für die Anmeldung?", options: ["Das Formular.", "Die Kopie vom Ausweis.", "Die Unterschrift."], c: 2 },
          { teil: 3, audioText: "Frau: Herr Kern, die Waschmaschine im Keller läuft wieder, vielen Dank. Aber jetzt ist das Licht im Treppenhaus kaputt. Mann: Oh, das sehe ich mir heute Nachmittag an.", question: "Was ist kaputt?", options: ["Die Waschmaschine.", "Der Aufzug.", "Das Licht im Treppenhaus."], c: 2 },
          { teil: 3, audioText: "Frau: Praxis Doktor Wolff, guten Tag. Ihr Termin am Montag um neun Uhr geht leider nicht, der Arzt ist krank. Passt Ihnen Mittwoch um elf Uhr? Mann: Ja, Mittwoch ist gut. Frau: Schön, bitte bringen Sie Ihre Versichertenkarte mit.", question: "Wann kommt der Mann in die Praxis?", options: ["Am Mittwoch um 9 Uhr.", "Am Montag um 9 Uhr.", "Am Mittwoch um 11 Uhr."], c: 2 },

          { teil: 4, audioText: "Moderatorin: Herr Demir, Sie sind Bäcker in dritter Generation. Emre: Ja, meine Großeltern hatten schon eine kleine Bäckerei. Als Kind war ich fast jeden Samstag dort und durfte den Teig kneten.", question: "Emre hat schon als Kind in der Bäckerei geholfen.", options: ["Ja", "Nein"], c: 0 },
          { teil: 4, audioText: "Moderatorin: Und nach der Schule haben Sie sofort in der Bäckerei angefangen? Emre: Nein, zuerst habe ich zwei Jahre als Verkäufer in einem Supermarkt gearbeitet. Erst danach habe ich die Ausbildung als Bäcker gemacht.", question: "Nach der Schule hat er sofort als Bäcker angefangen.", options: ["Ja", "Nein"], c: 1 },
          { teil: 4, audioText: "Moderatorin: Wann beginnt Ihr Arbeitstag? Emre: Um Viertel nach zwei stehe ich auf. Um drei bin ich in der Backstube. Am Anfang war das hart, heute finde ich die ruhigen Stunden am Morgen schön.", question: "Emre steht sehr früh auf.", options: ["Ja", "Nein"], c: 0 },
          { teil: 4, audioText: "Moderatorin: Und Sie haben nur den einen Laden? Emre: Genau. Einen zweiten Laden möchte ich nicht, das wäre zu viel. Aber samstags stehe ich mit einem kleinen Wagen auf dem Wochenmarkt.", question: "Emre verkauft sein Brot auch auf dem Markt.", options: ["Ja", "Nein"], c: 0 },
          { teil: 4, audioText: "Moderatorin: Haben Sie noch andere Pläne? Emre: Ich möchte bald Kurse geben und den Leuten zeigen, wie man selbst Brot backt. Einen anderen Beruf kann ich mir aber nicht vorstellen.", question: "Emre möchte später einen anderen Beruf lernen.", options: ["Ja", "Nein"], c: 1 }
        ],
        lesen: [
          { teil: 1, readingText: "Die Fahrradmechanikerin Nadja Kolb – »Jedes Rad hat eine Geschichte.«\n\nIn der kleinen Werkstatt von Nadja Kolb stehen Fahrräder aus vielen Jahrzehnten. Sie repariert alles, auch sehr alte Räder. »Neue Räder verkaufe ich nicht, das können andere besser«, sagt sie. Wer sein Rad bringen möchte, muss vorher anrufen und einen Termin machen, denn die Werkstatt ist immer voll.\nNadja Kolb wurde 1985 in Rostock geboren. Nach dem Abitur begann sie ein Studium, aber nach zwei Semestern hörte sie wieder auf. Danach arbeitete sie drei Jahre in einem Fahrradgeschäft in Leipzig und lernte dort den Beruf. Vor sechs Jahren eröffnete sie ihre eigene Werkstatt in Bremen.\nAm Samstagvormittag gibt sie außerdem einen Kurs. Dort zeigt sie Anfängerinnen und Anfängern, wie man einen Reifen wechselt und die Bremsen prüft.", question: "Wer sein Fahrrad reparieren lassen möchte, …", options: ["muss lange in der Werkstatt warten.", "soll vorher anrufen und einen Termin machen.", "kann einfach vorbeikommen."], c: 1 },

          { teil: 3, readingText: "Liebe Kerstin,\n\nseit drei Wochen arbeite ich jetzt in Leipzig, und langsam wird alles ruhiger. Die ersten Tage im Büro waren anstrengend, weil ich niemanden kannte. Inzwischen sitze ich mit zwei Kolleginnen in einem Zimmer, und wir verstehen uns richtig gut.\nEine eigene Wohnung habe ich noch nicht gefunden. Bis Ende des Monats wohne ich bei meiner Tante im Süden der Stadt und fahre jeden Morgen 40 Minuten mit der Straßenbahn. Das stört mich schon ein bisschen, aber ich lese dabei jeden Tag ein paar Seiten.\nAm Mittwoch gehe ich nach der Arbeit immer zum Chor. Das ist das Beste an der ganzen Woche! Wir singen Lieder aus vielen Ländern, und danach gehen fast alle noch etwas trinken.\nKommst du wirklich im April? Dann zeige ich dir die Stadt, und am Sonntag fahren wir zum See. Schlafen kannst du im Gästezimmer meiner Tante, sie ist in diesen Tagen bei ihrer Schwester.\n\nSchreib mir bald!\nLiebe Grüße\nAyla", question: "Ayla sagt über den Anfang in Leipzig, dass …", options: ["sie sofort Freunde im Büro hatte.", "sie bis heute niemanden kennt.", "die ersten Tage schwierig waren."], c: 2 },

              instructions: "Sie wollten heute Abend mit Ihrer Freundin Miriam ins Kino gehen. Sie müssen aber länger arbeiten. Schreiben Sie Miriam eine SMS. Schreiben Sie zu allen drei Punkten.",
