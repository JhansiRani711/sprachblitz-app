# Sprachblitz - Complete Single File A1 App

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sprachblitz - A1 Language Arena & Exam Center</title>
  <!-- Tailwind CSS Core Setup -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- External Font Family Tracking -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .flashcard-wrapper { perspective: 1000px; }
    .flashcard-inner {
      position: relative;
      width: 100%;

      height: 100%;
      text-align: center;
      transition: transform 0.5s;
      transform-style: preserve-3d;
    }
    .flashcard-wrapper.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .flashcard-back { transform: rotateY(180deg); }

    .theme-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 2px; }
  </style>
</head>

      <button onclick="switchTab('grammar')" class="flex-1 flex flex-col items-center justify-center navigation-tab-btn transition-colors text-slate-500" id="tab-grammar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="mb-1"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M6 18.8v-4L12 18l6-3.2v4"/></svg>

        <span class="text-[9px] font-bold">Exams</span>
      </button>
    </footer>
  </div>

  <!-- Master Application Logic & Core Datastructure Matrices -->

  <script>
    // Comprehensive A1 Categorized Vocabulary Dataset Matrix
    const a1VocabularyDatabase = {
      "Alphabets Phonics": [
        { id: "a1", german: "A", gender: "letter", english: "Ah (as in father)", hint: "Example word: Apfel" },
        { id: "a2", german: "B", gender: "letter", english: "Beh", hint: "Example word: Brot" },
        { id: "a3", german: "C", gender: "letter", english: "Tseh", hint: "Example word: Cafe" },
        { id: "a4", german: "Ä", gender: "umlaut", english: "Air", hint: "Example word: Äpfel" },
        { id: "a5", german: "Ö", gender: "umlaut", english: "Uh (rounded lips)", hint: "Example word: Österreich" },
        { id: "a6", german: "Ü", gender: "umlaut", english: "Ee (rounded lips)", hint: "Example word: Übung" },
        { id: "a7", german: "ß", gender: "ligature", english: "Eszett (double S sound)", hint: "Example word: heiß" }
      ],
      "Numbers (Zahlen)": [
        { id: "n1", german: "eins", gender: "number", english: "one", hint: "1" },
        { id: "n2", german: "zwei", gender: "number", english: "two", hint: "2" },
        { id: "n3", german: "drei", gender: "number", english: "three", hint: "3" },
        { id: "n4", german: "vier", gender: "number", english: "four", hint: "4" },
        { id: "n5", german: "fünf", gender: "number", english: "five", hint: "5" },
        { id: "n6", german: "zehn", gender: "number", english: "ten", hint: "10" },

        { id: "n7", german: "zwanzig", gender: "number", english: "twenty", hint: "20" },
        { id: "n8", german: "einundzwanzig", gender: "number", english: "twenty-one", hint: "1 + 20 layout order structure" }
      ],
      "Seasons & Weather": [
        { id: "s_e1", german: "der Frühling", gender: "masculine", english: "the spring", hint: "When flowers start to bloom." },
        { id: "s_e2", german: "der Sommer", gender: "masculine", english: "the summer", hint: "The warmest season." },
        { id: "s_e3", german: "der Herbst", gender: "masculine", english: "the autumn / fall", hint: "When leaves turn brown." },
        { id: "s_e4", german: "der Winter", gender: "masculine", english: "the winter", hint: "Coldest time, often brings snow." },
        { id: "s_e5", german: "das Wetter", gender: "neuter", english: "the weather", hint: "Overall climate state descriptor." }
      ],
      "Household (Haushalt)": [
        { id: "h1", german: "das Haus", gender: "neuter", english: "the house", hint: "Residential building layout structure." },
        { id: "h2", german: "das Zimmer", gender: "neuter", english: "the room", hint: "A compartmental partition within a house." },
        { id: "h3", german: "die Küche", gender: "feminine", english: "the kitchen", hint: "Where hot meals are prepared and cooked." },
        { id: "h4", german: "der Tisch", gender: "masculine", english: "the table", hint: "Flat furniture piece used for dining." },
        { id: "h5", german: "der Stuhl", gender: "masculine", english: "the chair", hint: "Something you sit on at the table." },
        { id: "h6", german: "das Bett", gender: "neuter", english: "the bed", hint: "Where you sleep at night." },
        { id: "h7", german: "die Lampe", gender: "feminine", english: "the lamp", hint: "Provides illumination for the room." }
      ],

      "Greetings & Basics": [
        { id: "v1", german: "Hallo", gender: "expression", english: "Hello", hint: "Standard friendly greeting." },
        { id: "v2", german: "Bitte", gender: "expression", english: "Please / You're welcome", hint: "Universal polite response phrase." },
        { id: "v3", german: "Danke", gender: "expression", english: "Thank you", hint: "Expressing gratitude." },
        { id: "v4", german: "Auf Wiedersehen", gender: "expression", english: "Goodbye", hint: "Formal split farewell statement." }
      ]
    };

    // Comprehensive A1 Structural Grammar Matrix Blueprint System
    const a1GrammarDatabase = [
      { id: "g1", title: "Definite Articles & Gender Tracking", rules: "German nouns carry 3 precise grammatical genders: Masculine (der), Feminine (die), Neuter (das). Plural forms uniformly use 'die'.", example: "Der Tisch, die Küche, das Haus, die Kinder." },
      { id: "g2", title: "The Nominative Case System", rules: "Used exclusively for the primary subject of sentences performing an action. Unchanging root foundational structure form.", example: "Der Hund schläft hier. (The dog is sleeping here.)" },
      { id: "g3", title: "The Accusative Direct Object Shifts", rules: "Used for direct actions objects. Only Masculine changes article forms (der becomes den / ein becomes einen). Feminine & Neuter stay unchanged.", example: "Ich habe einen Tisch (Masculine Accusative modification match)." },
      { id: "g4", title: "Present Tense Verb Conjugation rules", rules: "Regular verbs drop their standard root infinitive ending (-en) and apply personal pronoun suffixes: -e, -st, -t, -en, -t, -en.", example: "ich lerne, du lernst, er/sie/es lernt, wir lernen." }
    ];

    // Comprehensive 4-Dimension A1 Immersive Training Laboratory Matrix
    const a1SkillsDatabase = {
      listening: [

        { id: "l1", title: "Train Station Announcement Dialogue", context: "Listen carefully to the audio sample clip and determine which structural track the train departures layout updates from.", transcript: "Achtung am Gleis 4: Der Zug nach Berlin fährt jetzt ab.", question: "Where is the train moving towards?", options: ["München", "Berlin", "Hamburg", "Frankfurt"], correct: 1 }
      ],
      reading: [
        { id: "r1", title: "Supermarket Invitation Email parsing", context: "Read the formal communication text below and verify what timing operational limitations are enforced.", body: "Liebe Grüße! Unser Laden schließt heute bereits um 18:00 Uhr wegen Renovierung. Bitte kommen Sie früher vorbei.", question: "At what time sequence does the shop close today?", options: ["16:00", "18:00", "20:00", "22:00"], correct: 1 }
      ],
      writing: [
        { id: "w1", title: "Goethe A1 Form Completion Challenge", context: "Fill in the correct blank article option missing from this formal notification snippet block.", text: "Ich möchte ___ (neuter) Buch kaufen, aber ich habe kein Geld dabei.", options: ["das", "die", "den", "der"], correct: 0 }
      ],
      speaking: [
        { id: "s1", title: "Pronunciation Phonetics Calibration Engine", context: "Review the phonetic structures statement and practice matching target native cadence patterns out loud.", text: "Wie geht es Ihnen heute Morgen?", guide: "Pronounce: Vee gayt es ee-nen hoy-te mor-gen?" }
      ]
    };

    // Full 5 Mock Exam System Pipeline Core Structure Mapping Matrix
    const mockExamsDatabase = [
      { id: 0, title: "Mock Exam Arena 1: Goethe A1 Simulation Framework", passingScore: 3, questions: [
        { q: "Which core definite article correctly fits: '___ Tisch ist alt'?", o: ["Der", "Die", "Das", "Den"], c: 0, exp: "'Tisch' is masculine nominative." },
        { q: "Translate to accurate English format: 'Ich brauche eine Küche.'", o: ["I have a room.", "I need a kitchen.", "I buy a house.", "I like cooking."], c: 1, exp: "'brauche' translates to need; 'Küche' means kitchen." },
        { q: "Conjugate properly: 'Du ___ (to speak) sehr gut Deutsch.'", o: ["spreche", "spricht", "sprechen", "sprichst"], c: 3, exp: "Irregular vowel-shifting verb match for 'du' form is 'sprichst'." },

        { q: "Identify the odd vocabulary item out from this collection:", o: ["Mutter", "Vater", "Bruder", "Auto"], c: 3, exp: "'Auto' is a vehicle; all others are direct family relation identifiers." }
      ]},
      { id: 1, title: "Mock Exam Arena 2: Telc A1 Competency Assessment Matrix", passingScore: 3, questions: [
        { q: "Complete the statement pattern: 'Wir wohnen ___ Berlin.'", o: ["in", "auf", "aus", "bei"], c: 0, exp: "City localization spatial preposition uses 'in'." },
        { q: "What is the appropriate English transformation for 'das Brot'?", o: ["The cheese", "The milk", "The bread", "The water"], c: 2, exp: "'das Brot' translates directly to 'the bread'." },
        { q: "Select the accurate feminine assignment descriptor pairing:", o: ["der Mann", "die Frau", "das Kind", "den Jungen"], c: 1, exp: "'Frau' is feminine, taking 'die'." },
        { q: "Complete the sentence tracking: 'Ich trinke ein Glas ___.'", o: ["Brot", "Apfel", "Wasser", "Küche"], c: 2, exp: "'Wasser' is the only consumable liquid option listed." }
      ]},
      { id: 2, title: "Mock Exam Arena 3: Structural Navigation Grammar Core", passingScore: 3, questions: [
        { q: "Identify the direct object Accusative shift modification:", o: ["Ich esse der Apfel.", "Ich esse den Apfel.", "Ich esse dem Apfel.", "Ich esse das Apfel."], c: 1, exp: "Masculine object 'der Apfel' changes to 'den Apfel' in accusative." },
        { q: "Which possessive pronoun denotes 'my parent' correctly?", o: ["mein Vater", "meine Vater", "meinen Vater", "meines Vater"], c: 0, exp: "Masculine subject use matches 'mein Vater'." }
      ]},
      { id: 3, title: "Mock Exam Arena 4: Daily Conversational Dialogue Proficiency", passingScore: 3, questions: [
        { q: "Select the standard reply for 'Danke schön':", o: ["Bitte sehr", "Guten Morgen", "Hallo", "Tschüss"], c: 0, exp: "'Bitte sehr' is the conventional matching response for gratitude." }
      ]},
      { id: 4, title: "Mock Exam Arena 5: Advanced Comprehensive Baseline Synthesis", passingScore: 3, questions: [
        { q: "Conjugate root operational verb 'haben': 'Ihr ___ ein Haus.'", o: ["habe", "hast", "hat", "habt"], c: 3, exp: "The plural pronoun form for 'ihr' takes the 'habt' configuration suffix." }
      ]}
    ];


    // Global Core Architecture Reactivity State Cache Layout Engine Variables
    let activeTab = 'dashboard';
    let currentThemeProfile = localStorage.getItem('sb_theme_profile') || 'midnight-slate';
    let totalXPAmount = parseInt(localStorage.getItem('sb_total_xp'), 10) || 0;
    let savedStreakCount = parseInt(localStorage.getItem('sb_streak_count'), 10) || 1;

    // Sub-Navigation Module Frame Index Trackers
    let selectedVocabCategory = "Alphabets Phonics";
    let activeVocabCardIndex = 0;
    let isVocabCardFlipped = false;
    let activeGrammarIndex = 0;

    // Skills Interactive Assessment Tracker Arrays
    let activeSkillSection = 'listening';
    let skillSelectedAnswer = null;

    // Real-Time Testing Engine Operational State Models
    let selectedActiveExamIndex = 0;
    let activeExamRunningMode = false;

    let currentExamQuestionIndex = 0;
    let activeExamUserAnswersCollected = [];
    let processingExamEvaluationFeedbackMode = false;

    // Theme Class Configurations Engine Object Profiles Map
    const systemThemeProfiles = {
      'midnight-slate': {
        shellBg: 'bg-slate-900 border-slate-800',
        headerBg: 'bg-slate-950 border-slate-800 text-white',
        footerBg: 'bg-slate-950 border-slate-800',
        viewSurfaceBg: 'bg-slate-900 text-slate-100',
        cardBg: 'bg-slate-800 border-slate-700 text-slate-100',
        cardBackBg: 'bg-indigo-950 border-indigo-800 text-indigo-200',
        tabActive: 'text-indigo-400',
        tabInactive: 'text-slate-500'
      },
      'cyberpunk-neon': {
        shellBg: 'bg-indigo-950 border-fuchsia-500',
        headerBg: 'bg-slate-950 border-fuchsia-500 text-cyan-400',

        footerBg: 'bg-slate-950 border-fuchsia-500',
        viewSurfaceBg: 'bg-indigo-950 text-cyan-100',
        cardBg: 'bg-slate-900 border-cyan-500 text-cyan-300',
        cardBackBg: 'bg-fuchsia-950 border-fuchsia-500 text-fuchsia-300',
        tabActive: 'text-lime-400',
        tabInactive: 'text-fuchsia-400'
      }
    };

    // Main Startup Setup System Directives
    window.onload = function() {
      applyThemeProfile(currentThemeProfile);
      updateDashboardTelemetry();
      renderActiveTabModule();
    };

    function applyThemeProfile(themeKey) {
      currentThemeProfile = themeKey;
      localStorage.setItem('sb_theme_profile', themeKey);

      const conf = systemThemeProfiles[themeKey] || systemThemeProfiles['midnight-slate'];
      
      document.getElementById('app-shell-container').className = `w-full max-w-md mx-auto min-h-screen shadow-2xl flex flex-col justify-between relative border-x theme-transition ${conf.shellBg}`;
      document.getElementById('app-header-nav').className = `p-4 border-b flex justify-between items-center sticky top-0 z-50 theme-transition ${conf.headerBg}`;
      document.getElementById('main-scroll-view').className = `flex-1 overflow-y-auto p-4 theme-transition ${conf.viewSurfaceBg}`;
      document.getElementById('app-footer-nav').className = `border-t h-16 flex sticky bottom-0 z-50 theme-transition ${conf.footerBg}`;
      
      const tabs = ['dashboard', 'vocabulary', 'grammar', 'skills', 'exams'];
      tabs.forEach(t => {
        const node = document.getElementById(`tab-${t}`);
        if (node) node.className = `flex-1 flex flex-col items-center justify-center transition-colors ${t === activeTab ? conf.tabActive : conf.tabInactive}`;
      });
    }

    function updateDashboardTelemetry() {
      document.getElementById('streak-days-val').innerText = savedStreakCount;
      document.getElementById('xp-amount-val').innerText = totalXPAmount;
      
      const display = document.getElementById('player-rank-display');

      if (totalXPAmount >= 500) display.innerText = "Lv.4 Imperial Language Architect";
      else if (totalXPAmount >= 250) display.innerText = "Lv.3 Master Competitor";
      else if (totalXPAmount >= 100) display.innerText = "Lv.2 Experienced Challenger";
      else display.innerText = "Lv.1 Arena Novice";
    }

    function rewardXP(amt) {
      totalXPAmount += amt;
      localStorage.setItem('sb_total_xp', totalXPAmount);
      updateDashboardTelemetry();
    }

    function switchTab(tabId) {
      activeTab = tabId;
      isVocabCardFlipped = false;
      skillSelectedAnswer = null;
      if (tabId !== 'exams') activeExamRunningMode = false;
      applyThemeProfile(currentThemeProfile);
      renderActiveTabModule();

    }

    // View Route Processing Center Hub
    function renderActiveTabModule() {
      const container = document.getElementById('main-scroll-view');
      const conf = systemThemeProfiles[currentThemeProfile] || systemThemeProfiles['midnight-slate'];
      
      if (activeTab === 'dashboard') {
        container.innerHTML = `
          <div class="space-y-5">
            <div class="p-5 rounded-2xl bg-gradient-to-br from-indigo-600 to-fuchsia-600 text-white shadow-xl">
              <h2 class="text-lg font-extrabold">Welcome to A1 Language Training Ground ⚡</h2>
              <p class="text-xs text-indigo-100 mt-1 leading-relaxed">Master standard Goethe or Telc proficiency variants cleanly using accelerated game interface metrics.</p>
              <div class="mt-4 flex gap-2">
                <button onclick="switchTab('exams')" class="bg-white text-indigo-950 font-black text-[11px] px-3.5 py-2 rounded-xl shadow-md transform active:scale-95 transition-transform">Run Mock Test</button>
                <button onclick="switchTab('vocabulary')" class="bg-indigo-500/30 border border-indigo-400/40 text-white font-bold text-[11px] px-3.5 py-2 rounded-xl">Lexicon Hub</button>
              </div>
            </div>


            <div class="grid grid-cols-2 gap-3">
              <div class="${conf.cardBg} border p-4 rounded-xl flex flex-col justify-between">
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">A1 Framework Core</span>
                <span class="text-base font-black text-emerald-400 mt-1">100% Validated</span>
              </div>
              <div class="${conf.cardBg} border p-4 rounded-xl flex flex-col justify-between">
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Exam Status Modules</span>
                <span class="text-base font-black text-indigo-400 mt-1">5 Simulations</span>
              </div>
            </div>

            <div class="${conf.cardBg} border p-4 rounded-xl">
              <h3 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-2">System Theme Core Profile</h3>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="applyThemeProfile('midnight-slate')" class="p-2.5 rounded-lg border text-[11px] font-bold text-center bg-slate-900 border-slate-700">Slate Mode</button>
                <button onclick="applyThemeProfile('cyberpunk-neon')" class="p-2.5 rounded-lg border text-[11px] font-bold text-center bg-indigo-950 border-fuchsia-800 text-cyan-300">Neon Mode</button>
              </div>
            </div>
          </div>

        `;
      }

      else if (activeTab === 'vocabulary') {
        const categories = Object.keys(a1VocabularyDatabase);
        const activeList = a1VocabularyDatabase[selectedVocabCategory];
        const card = activeList[activeVocabCardIndex];

        let selectOptionsHTML = '';
        categories.forEach(cat => {
          selectOptionsHTML += `<option value="${cat}" ${cat === selectedVocabCategory ? 'selected' : ''}>${cat}</option>`;
        });

        container.innerHTML = `
          <div class="space-y-4 flex flex-col items-center">
            <div class="w-full">
              <label for="lexicon-category-selector" class="text-[10px] uppercase font-black tracking-wider text-slate-400 block mb-1">Lexicon Category Matrix</label>
              <select id="lexicon-category-selector" onchange="selectedVocabCategory=this.value; activeVocabCardIndex=0; isVocabCardFlipped=false; renderActiveTabModule();" class="w-full bg-slate-950 border border-slate-800 p-2.5 text-xs font-bold rounded-xl text-slate-200 outline-none">
                ${selectOptionsHTML}

              </select>
            </div>

            <div class="w-full flex justify-between items-center text-[11px] font-bold text-slate-400 px-1">
              <span>Card ${activeVocabCardIndex + 1} of ${activeList.length}</span>
              <span class="text-indigo-400 font-extrabold uppercase">A1 Lexicon Library</span>
            </div>

            <div class="flashcard-wrapper w-full h-60 cursor-pointer ${isVocabCardFlipped ? 'flipped' : ''}" onclick="this.classList.toggle('flipped'); isVocabCardFlipped=!isVocabCardFlipped;">
              <div class="flashcard-inner">
                <div class="flashcard-front ${conf.cardBg} border shadow-xl">
                  <span class="text-[9px] uppercase tracking-widest font-black px-2 py-0.5 rounded bg-slate-950/50 self-start text-indigo-400">${card.gender}</span>
                  <span class="text-3xl font-black tracking-tight my-auto select-none">${card.german}</span>
                  <span class="text-[10px] text-slate-400 font-medium italic">💡 Tap to reveal English context</span>
                </div>
                <div class="flashcard-back ${conf.cardBackBg} border shadow-xl">
                  <span class="text-[9px] uppercase tracking-widest font-black self-start text-indigo-300">English Translation Mapping</span>
                  <span class="text-2xl font-extrabold tracking-tight my-auto select-none">${card.english}</span>
                  <p class="text-xs text-indigo-200/80 px-4">${card.hint}</p>

                </div>
              </div>
            </div>

            <div class="w-full grid grid-cols-2 gap-2">
              <button onclick="activeVocabCardIndex = (activeVocabCardIndex === 0) ? ${activeList.length - 1} : activeVocabCardIndex - 1; isVocabCardFlipped=false; renderActiveTabModule();" class="p-3 bg-slate-800 border border-slate-700 text-xs font-bold rounded-xl active:scale-95 transition-transform">← Prev</button>
              <button onclick="activeVocabCardIndex = (activeVocabCardIndex === ${activeList.length - 1}) ? 0 : activeVocabCardIndex + 1; isVocabCardFlipped=false; renderActiveTabModule();" class="p-3 bg-slate-800 border border-slate-700 text-xs font-bold rounded-xl active:scale-95 transition-transform">Next →</button>
            </div>
          </div>
        `;
      }

      else if (activeTab === 'grammar') {
        const item = a1GrammarDatabase[activeGrammarIndex];
        container.innerHTML = `
          <div class="space-y-4">
            <span class="text-[11px] font-bold text-slate-400 block px-1">Structural Framework Matrix Blueprint ${activeGrammarIndex + 1} of ${a1GrammarDatabase.length}</span>
            <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-4">
              <div class="flex items-center gap-2">

                <span class="text-xl">💡</span>
                <h3 class="text-base font-black tracking-tight">${item.title}</h3>
              </div>
              <div class="h-px bg-slate-800" />
              <div>
                <span class="text-[9px] uppercase tracking-wider font-extrabold text-indigo-400 block mb-0.5">Core Syntax Rules Directives</span>
                <p class="text-xs font-medium leading-relaxed opacity-95">${item.rules}</p>
              </div>
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800">
                <span class="text-[9px] uppercase tracking-wider font-extrabold text-emerald-400 block mb-0.5">Contextual Usage Template Formulation</span>
                <p class="text-xs font-mono font-bold text-emerald-300 leading-snug">${item.example}</p>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="activeGrammarIndex = (activeGrammarIndex === 0) ? ${a1GrammarDatabase.length - 1} : activeGrammarIndex - 1; renderActiveTabModule();" class="p-3 bg-slate-800 text-xs font-bold rounded-xl border border-slate-700">Previous</button>
              <button onclick="activeGrammarIndex = (activeGrammarIndex === ${a1GrammarDatabase.length - 1}) ? 0 : activeGrammarIndex + 1; renderActiveTabModule();" class="p-3 bg-slate-800 text-xs font-bold rounded-xl border border-slate-700">Next Rule</button>
            </div>
          </div>
        `;

      }

      else if (activeTab === 'skills') {
        let skillsHTML = `<div class="space-y-4">
          <div class="grid grid-cols-4 gap-1.5">
            ${['listening', 'reading', 'writing', 'speaking'].map(s => `
              <button onclick="activeSkillSection='${s}'; skillSelectedAnswer=null; renderActiveTabModule();" class="py-2 px-1 rounded-xl text-[10px] font-black uppercase tracking-tight border text-center transition-all ${activeSkillSection === s ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}" >${s}</button>
            `).join('')}
          </div>
          <div class="${conf.cardBg} border p-4 rounded-2xl space-y-3">
            <h3 class="text-xs font-black uppercase tracking-wider text-indigo-400">${activeSkillSection.toUpperCase()} LAB IMMERSION</h3>`;

        if (activeSkillSection === 'listening') {
          const lData = a1SkillsDatabase.listening[0];
          skillsHTML += `
            <div class="space-y-3">
              <p class="text-xs text-slate-400 font-mono italic">Audio simulation text: "${lData.transcript}"</p>
              <p class="text-xs font-bold">${lData.question}</p>
              <div class="space-y-2">

                ${lData.options.map((o, idx) => `
                  <button onclick="skillSelectedAnswer=${idx}; renderActiveTabModule();" class="w-full text-left p-2.5 border rounded-xl text-xs font-bold ${skillSelectedAnswer === idx ? 'border-indigo-500 bg-indigo-950/40' : 'border-slate-700 bg-slate-900'}" >${o}</button>
                `).join('')}
              </div>
              ${skillSelectedAnswer !== null ? `
                <div class="p-2 text-xs rounded bg-slate-950 text-center font-bold ${skillSelectedAnswer === lData.correct ? 'text-emerald-400' : 'text-rose-400'}" >
                  ${skillSelectedAnswer === lData.correct ? '✓ Correct! (+10 XP)' : '✗ Incorrect! Try listening again.'}
                </div>
              ` : ''}
            </div>`;
        } else if (activeSkillSection === 'reading') {
          const rData = a1SkillsDatabase.reading[0];
          skillsHTML += `
            <div class="space-y-3">
              <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl font-mono text-xs leading-relaxed italic text-slate-300">"${rData.body}"</div>
              <p class="text-xs font-bold">${rData.question}</p>
              <div class="space-y-2">
                ${rData.options.map((o, idx) => `
                  <button onclick="skillSelectedAnswer=${idx}; renderActiveTabModule();" class="w-full text-left p-2.5 border rounded-xl text-xs font-bold ${skillSelectedAnswer === idx ? 'border-indigo-500 bg-indigo-950/40' : 'border-slate-700 bg-slate-900'}" >${o}</button>

                `).join('')}
              </div>
              ${skillSelectedAnswer !== null ? `
                <div class="p-2 text-xs rounded bg-slate-950 text-center font-bold ${skillSelectedAnswer === rData.correct ? 'text-emerald-400' : 'text-rose-400'}" >
                  ${skillSelectedAnswer === rData.correct ? '✓ Correct! (+10 XP)' : '✗ Incorrect. Look for closure timestamps.'}
                </div>
              ` : ''}
            </div>`;
        } else if (activeSkillSection === 'writing') {
          const wData = a1SkillsDatabase.writing[0];
          skillsHTML += `
            <div class="space-y-3">
              <p class="text-xs font-medium leading-relaxed">${wData.context}</p>
              <div class="p-3 bg-slate-950 border border-slate-800 font-mono text-xs rounded-xl">${wData.text}</div>
              <div class="grid grid-cols-2 gap-2">
                ${wData.options.map((o, idx) => `
                  <button onclick="skillSelectedAnswer=${idx}; renderActiveTabModule();" class="p-2.5 border rounded-xl text-xs font-mono font-bold text-center ${skillSelectedAnswer === idx ? 'border-indigo-500 bg-indigo-950/40' : 'border-slate-700 bg-slate-900'}" >${o}</button>
                `).join('')}
              </div>

              ${skillSelectedAnswer !== null ? `
                <div class="p-2 text-xs rounded bg-slate-950 text-center font-bold ${skillSelectedAnswer === wData.correct ? 'text-emerald-400' : 'text-rose-400'}" >
                  ${skillSelectedAnswer === wData.correct ? '✓ Success Matrix Match (+15 XP)' : '✗ Case grammar mismatches identified.'}
                </div>
              ` : ''}
            </div>`;
        } else if (activeSkillSection === 'speaking') {
          const sData = a1SkillsDatabase.speaking[0];
          skillsHTML += `
            <div class="space-y-3 text-center py-2">
              <p class="text-xs font-bold text-slate-300">Target Statement Structure Challenge</p>
              <p class="text-xl font-black text-indigo-300">"${sData.text}"</p>
              <div class="p-2.5 bg-slate-950 text-left border border-slate-800 rounded-lg">
                <span class="text-[9px] uppercase font-black block text-slate-400 tracking-wider">Phonetics Suffix Guide Map</span>
                <p class="text-xs text-amber-400 font-mono font-bold mt-0.5">${sData.guide}</p>
              </div>
              <button onclick="rewardXP(5);" class="w-full mt-2 p-3 bg-indigo-600 font-black text-xs text-white rounded-xl shadow-md active:scale-95 transition-all">🎤 Verify Speaking Pronunciation</button>
            </div>`;
        }


        skillsHTML += `</div></div>`;
        container.innerHTML = skillsHTML;
      }

      else if (activeTab === 'exams') {
        if (!activeExamRunningMode) {
          let selectionRowsHTML = '';
          mockExamsDatabase.forEach((ex, idx) => {
            selectionRowsHTML += `
              <div class="${conf.cardBg} border p-4 rounded-xl flex flex-col justify-between space-y-3">
                <div>
                  <h4 class="text-xs font-black text-white">${ex.title}</h4>
                  <p class="text-[10px] text-slate-400 mt-0.5">Comprehensive Standard Assessment Block • ${ex.questions.length} Questions</p>
                </div>
                <button onclick="startSpecificMockExamSuite(${idx})" class="w-full py-2 bg-slate-950 hover:bg-slate-900 border border-indigo-900 text-indigo-400 font-extrabold text-[11px] rounded-lg transition-transform active:scale-95" >Launch Simulation</button>
              </div>
            `;
          });


          container.innerHTML = `
            <div class="space-y-4">
              <div class="px-1">
                <h3 class="text-sm font-black tracking-tight text-white">Goethe / Telc A1 Mock Exam Arena</h3>
                <p class="text-[11px] text-slate-400 font-medium">Verify your cross-dimension capabilities using full runtime testing models.</p>
              </div>
              <div class="space-y-3">${selectionRowsHTML}</div>
            </div>
          `;
        } else {
          const exam = mockExamsDatabase[selectedActiveExamIndex];
          
          if (currentExamQuestionIndex >= exam.questions.length) {
            let correctCounter = 0;
            exam.questions.forEach((q, idx) => {
              if (activeExamUserAnswersCollected[idx] === q.c) correctCounter++;
            });
            const passed = correctCounter >= exam.passingScore;
            if (passed) setTimeout(() => { rewardXP(50); }, 100);


            container.innerHTML = `
              <div class="text-center p-6 bg-slate-950 border border-slate-800 rounded-2xl space-y-4 shadow-2xl">
                <span class="text-5xl block">${passed ? '🏆' : '⏳'}</span>
                <h3 class="text-lg font-black text-white">${passed ? 'Examination Passed!' : 'Requires Review'}</h3>
                <p class="text-xs text-slate-400 font-semibold leading-relaxed">Performance Output Score metrics tracking evaluated: <br><span class="text-base font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}">${correctCounter} / ${exam.questions.length} Correct</span></p>
                <div class="text-left bg-slate-900 p-3 rounded-lg border border-slate-800 text-[11px] space-y-1 text-slate-300">
                  <p><strong>Passing Constraint Target:</strong> ${exam.passingScore} Correct options</p>
                  <p><strong>Rewards Awarded:</strong> ${passed ? '+50 XP Milestone Achieved!' : '0 XP. Please run remediation rules.'}</p>
                </div>
                <button onclick="activeExamRunningMode=false; renderActiveTabModule();" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl" >Return to Exam Selection Shell</button>
              </div>
            `;
            return;
          }

          const activeQuestion = exam.questions[currentExamQuestionIndex];
          container.innerHTML = `
            <div class="space-y-4">
              <div class="flex justify-between items-center px-1">

                <span class="text-xs font-black text-slate-400">Exam Question ${currentExamQuestionIndex + 1} of ${exam.questions.length}</span>
                <span class="text-[10px] font-mono bg-rose-950 border border-rose-800 px-2 py-0.5 text-rose-400 rounded-md font-bold">LIVE ASSESS MODE</span>
              </div>

              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl">
                <p class="text-xs font-bold leading-relaxed text-slate-200">${activeQuestion.q}</p>
              </div>

              <div class="space-y-2">
                ${activeQuestion.o.map((opt, oIdx) => {
                  let optStyle = "bg-slate-800 border-slate-700 text-slate-300";
                  if (processingExamEvaluationFeedbackMode) {
                    if (oIdx === activeQuestion.c) optStyle = "bg-emerald-950 border-emerald-500 text-emerald-200 font-black";
                    else if (oIdx === activeExamUserAnswersCollected[currentExamQuestionIndex]) optStyle = "bg-rose-950 border-rose-500 text-rose-200";
                    else optStyle = "bg-slate-900 border-slate-800 opacity-40 text-slate-600";
                  }
                  return `
                    <button onclick="submitActiveExamOptionAnswer(${oIdx})" ${processingExamEvaluationFeedbackMode ? 'disabled' : ''} class="w-full text-left p-3.5 border rounded-xl text-xs font-bold transition-all ${optStyle}" >${opt}</button>
                  `;

                }).join('')}
              </div>

              ${processingExamEvaluationFeedbackMode ? `
                <div class="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                  <span class="text-[9px] uppercase font-black text-slate-400 tracking-wider">Grammar Logic Correction Analysis</span>
                  <p class="text-xs text-slate-300 font-medium">${activeQuestion.exp}</p>
                  <button onclick="advanceActiveExamQuestionStep()" class="w-full mt-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl" >Next Question →</button>
                </div>
              ` : ''}
            </div>
          `;
        }
      }
    }

    // Exam State Handler Methods
    function startSpecificMockExamSuite(idx) {
      selectedActiveExamIndex = idx;

      activeExamRunningMode = true;
      currentExamQuestionIndex = 0;
      activeExamUserAnswersCollected = [];
      processingExamEvaluationFeedbackMode = false;
      renderActiveTabModule();
    }

    function submitActiveExamOptionAnswer(ansIdx) {
      if (processingExamEvaluationFeedbackMode) return;
      activeExamUserAnswersCollected[currentExamQuestionIndex] = ansIdx;
      processingExamEvaluationFeedbackMode = true;
      renderActiveTabModule();
    }

    function advanceActiveExamQuestionStep() {
      processingExamEvaluationFeedbackMode = false;
      currentExamQuestionIndex++;
      renderActiveTabModule();
    }

  </script>
</body>
</html>
