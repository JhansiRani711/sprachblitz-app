      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.5s;
      transform-style: preserve-3d;
    }
    .flashcard-wrapper.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .flashcard-back { transform: rotateY(180deg); }
    .theme-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

      { id: "g_art", title: "1. Definite & Indefinite Articles", rules: "German specifies noun sets through Masculine (der/ein), Feminine (die/eine), Neuter (das/ein). Plurals carry 'die' but no baseline indefinite article.", example: "Der Mann, eine Frau, das Kind." },

      { id: "g_sein", title: "3. Irregular Sein (To Be) Forms", rules: "The foundation auxiliary verb 'sein' shifts conjugation fields dynamically: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind.", example: "Wir sind im Arena. Ihr seid klug." },
      { id: "g_conj", title: "4. Regular Verb Conjugation Suffixes", rules: "Drop infinitive tail (-en) and apply standardized pronoun terminations: -e, -st, -t, -en, -t, -en.", example: "Ich spiele, du spielst, er spielt, wir spielen." },
      { id: "g_poss", title: "5. Possessive Articles", rules: "Indicate ownership. Base items follow pronoun structures: mein (my), dein (your), sein (his), ihr (her/their), unser (our), euer (your pl). Appends '-e' if item is feminine/plural.", example: "Das ist mein Tisch. Wo ist meine Jacke?" },

      writing: [
        { id: "w1", title: "E-Mail: Einladung absagen", scenario: "Ihre Freundin Lisa hat Sie zu ihrer Geburtstagsparty am Samstag eingeladen. Sie können leider nicht kommen. Schreiben Sie Lisa eine E-Mail.", points: ["Bedanken Sie sich für die Einladung", "Sagen Sie, dass Sie nicht kommen können, und warum", "Schlagen Sie ein anderes Treffen vor"], pointKeywords: [["danke", "dank für", "vielen dank"], ["kann nicht", "kann leider nicht", "leider nicht kommen", "keine zeit", "muss arbeiten", "bin krank"], ["treffen", "nächste woche", "ein andermal", "besuchen", "vorbeikommen"]], minWords: 20, maxWords: 45, sample: "Liebe Lisa, vielen Dank für die Einladung zu deiner Geburtstagsparty! Ich kann leider nicht kommen, weil ich am Samstag arbeiten muss. Können wir uns nächste Woche treffen? Ich habe ein kleines Geschenk für dich. Liebe Grüße, Sara" },
        { id: "w2", title: "E-Mail: Krankmeldung", scenario: "Sie sind krank und können heute nicht zur Arbeit kommen. Schreiben Sie Ihrem Chef, Herrn Bauer, eine E-Mail.", points: ["Sagen Sie, dass Sie krank sind", "Sagen Sie, dass Sie heute nicht arbeiten können", "Sagen Sie, wann Sie sich wieder melden"], pointKeywords: [["krank", "erkältet", "fieber", "kopfschmerzen"], ["kann nicht arbeiten", "kann heute nicht kommen", "bleibe zu hause", "nicht ins büro"], ["melde mich", "morgen", "wieder da", "nächste woche"]], minWords: 20, maxWords: 40, sample: "Guten Morgen Herr Bauer, ich bin heute leider krank und kann nicht ins Büro kommen. Ich bleibe zu Hause und ruhe mich aus. Ich melde mich morgen wieder bei Ihnen. Vielen Dank für Ihr Verständnis. Freundliche Grüße, Elena" },
        { id: "w3", title: "E-Mail: Umzug mitteilen", scenario: "Sie sind umgezogen. Schreiben Sie Ihrem Freund Max eine E-Mail über Ihre neue Adresse.", points: ["Erzählen Sie, dass Sie umgezogen sind", "Geben Sie Ihre neue Adresse an", "Laden Sie Max zu einem Besuch ein"], pointKeywords: [["umgezogen", "neue wohnung", "neues zuhause"], ["adresse", "straße", "wohne jetzt"], ["besuch", "komm mich besuchen", "vorbeikommen", "einladen"]], minWords: 20, maxWords: 45, sample: "Hallo Max, ich bin letzte Woche umgezogen. Meine neue Adresse ist Blumenstraße 5 in Köln. Die Wohnung ist schön und hell. Komm doch mal vorbei, ich zeige sie dir gern! Liebe Grüße, Tom" },
        { id: "w4", title: "E-Mail: Deutschkurs erfragen", scenario: "Sie möchten mehr Informationen über einen Deutschkurs an einer Sprachschule. Schreiben Sie eine E-Mail an die Sprachschule.", points: ["Sagen Sie, dass Sie Interesse an einem A1-Kurs haben", "Fragen Sie nach den Kurszeiten", "Fragen Sie nach dem Preis"], pointKeywords: [["interesse", "möchte", "deutschkurs", "a1-kurs", "a1 kurs"], ["kurszeiten", "wann beginnt", "uhrzeit", "zeiten"], ["preis", "kosten", "kostet"]], minWords: 20, maxWords: 45, sample: "Sehr geehrte Damen und Herren, ich habe Interesse an einem A1-Deutschkurs bei Ihnen. Können Sie mir bitte die Kurszeiten mitteilen? Außerdem möchte ich wissen, wie viel der Kurs kostet. Vielen Dank im Voraus. Mit freundlichen Grüßen, Youssef" },
        { id: "w5", title: "E-Mail: Geburtstagseinladung", scenario: "Sie machen eine Geburtstagsparty. Laden Sie Ihre Freundin Nora per E-Mail ein.", points: ["Sagen Sie, dass Sie Geburtstag haben", "Nennen Sie Datum und Uhrzeit der Party", "Bitten Sie Nora, etwas mitzubringen"], pointKeywords: [["geburtstag", "party", "feiere"], ["uhr", "samstag", "sonntag", "freitag"], ["mitbringen", "bring bitte", "bring mit"]], minWords: 20, maxWords: 40, sample: "Liebe Nora, ich habe am Samstag Geburtstag und feiere eine kleine Party um 18 Uhr bei mir zu Hause. Kannst du kommen? Bring bitte etwas zu trinken mit. Ich freue mich auf dich! Liebe Grüße, Mia" },
        { id: "w6", title: "E-Mail: Termin verschieben", scenario: "Sie haben einen Termin beim Arzt, können aber nicht kommen. Schreiben Sie der Arztpraxis eine E-Mail.", points: ["Nennen Sie Ihren Termin (Tag und Uhrzeit)", "Sagen Sie, dass Sie nicht kommen können", "Bitten Sie um einen neuen Termin"], pointKeywords: [["termin", "montag", "dienstag", "mittwoch", "uhr"], ["kann nicht kommen", "muss absagen", "leider nicht"], ["neuen termin", "anderen termin", "verschieben"]], minWords: 20, maxWords: 40, sample: "Sehr geehrtes Praxisteam, ich habe am Montag um 10 Uhr einen Termin, kann aber leider nicht kommen. Könnten Sie mir bitte einen neuen Termin geben? Ich entschuldige mich für die kurzfristige Absage. Mit freundlichen Grüßen, Petra" },
        { id: "w7", title: "E-Mail: Dank nach einem Besuch", scenario: "Sie waren am Wochenende bei Ihrer Freundin Julia zu Besuch. Schreiben Sie ihr eine Dankes-E-Mail.", points: ["Bedanken Sie sich für das Wochenende", "Sagen Sie, was Ihnen besonders gefallen hat", "Laden Sie Julia zu sich ein"], pointKeywords: [["danke", "vielen dank", "dankeschön"], ["hat mir gefallen", "war schön", "hat spaß gemacht"], ["besuch mich", "komm zu mir", "lade dich ein", "einladen"]], minWords: 20, maxWords: 40, sample: "Liebe Julia, vielen Dank für das schöne Wochenende bei dir! Das Essen hat mir besonders gut geschmeckt. Nächstes Mal lade ich dich zu mir ein. Bis bald! Liebe Grüße, Hana" },
        { id: "w8", title: "E-Mail: Öffnungszeiten erfragen", scenario: "Sie möchten wissen, wann ein Fitnessstudio geöffnet ist. Schreiben Sie eine E-Mail an das Fitnessstudio.", points: ["Fragen Sie nach den Öffnungszeiten", "Fragen Sie, ob es am Wochenende geöffnet ist", "Fragen Sie nach dem Preis für eine Mitgliedschaft"], pointKeywords: [["öffnungszeiten", "wann geöffnet", "wann offen"], ["wochenende", "samstag", "sonntag"], ["preis", "kosten", "mitgliedschaft"]], minWords: 20, maxWords: 40, sample: "Sehr geehrte Damen und Herren, ich möchte gern wissen, wie die Öffnungszeiten Ihres Fitnessstudios sind. Ist es auch am Wochenende geöffnet? Außerdem interessiert mich der Preis für eine Mitgliedschaft. Vielen Dank für Ihre Antwort. Mit freundlichen Grüßen, David" },
        { id: "w9", title: "E-Mail: Grüße aus dem Urlaub", scenario: "Sie sind im Urlaub in Italien. Schreiben Sie Ihrem Freund Ben eine kurze E-Mail.", points: ["Sagen Sie, wo Sie sind", "Erzählen Sie, wie es Ihnen gefällt", "Sagen Sie, wann Sie zurückkommen"], pointKeywords: [["bin in", "urlaub in", "italien"], ["gefällt mir", "schön hier", "es ist toll"], ["komme zurück", "fliege zurück", "wieder da"]], minWords: 20, maxWords: 40, sample: "Hallo Ben, ich bin gerade im Urlaub in Italien. Es gefällt mir hier sehr gut, das Wetter ist warm und das Essen ist lecker. Ich komme am Freitag zurück. Bis bald! Deine Lea" },
        { id: "w10", title: "E-Mail: Um Hilfe beim Umzug bitten", scenario: "Sie ziehen am Wochenende um und brauchen Hilfe. Schreiben Sie Ihrem Freund Paul eine E-Mail.", points: ["Sagen Sie, dass Sie umziehen", "Bitten Sie Paul um Hilfe", "Nennen Sie Tag und Uhrzeit"], pointKeywords: [["ziehe um", "umzug", "neue wohnung"], ["kannst du helfen", "hilfe", "brauche hilfe"], ["samstag", "sonntag", "uhr"]], minWords: 20, maxWords: 40, sample: "Hallo Paul, ich ziehe am Wochenende in eine neue Wohnung um. Kannst du mir bitte helfen? Wir treffen uns am Samstag um 9 Uhr. Ich würde mich sehr freuen! Danke und liebe Grüße, Jonas" }

      speaking: [
        { id: "s1", title: "Pronunciation Phonetics Calibration Engine", context: "Practice reading the native phrase out loud according to the phonetics breakdown matrix configuration guide.", text: "Wie geht es Ihnen heute Morgen?", guide: "Pronounce: Vee gayt es ee-nen hoy-te mor-gen?" },

        { id: "s3", title: "Self Introduction Phrase Practice", context: "Practice introducing yourself using this template phrase.", text: "Ich heiße Anna und ich komme aus Deutschland.", guide: "Pronounce: Eech hy-seh Anna oont eech kom-meh ows Doytch-lant." },

        { id: "s8", title: "Saying Goodbye Formally", context: "Practice this formal farewell phrase used at the end of a conversation.", text: "Auf Wiedersehen und einen schönen Tag noch!", guide: "Pronounce: Owf vee-der-zayn oont eye-nen shur-nen tahk nokh!" },

        { id: "s11", title: "Ordering Food At A Restaurant", context: "Practice ordering a main dish at a restaurant.", text: "Ich hätte gern das Schnitzel mit Pommes.", guide: "Pronounce: Eech het-teh gairn das shnit-sel mit pom-mes." },

        { id: "s14", title: "Expressing Likes And Dislikes", context: "Practice a simple sentence about a hobby you enjoy.", text: "Ich spiele gern Fußball am Wochenende.", guide: "Pronounce: Eech shpee-leh gairn foos-bal am vokh-en-en-deh." },
        { id: "s15", title: "Talking About Family Members", context: "Practice describing a family member briefly.", text: "Meine Mutter heißt Claudia und wohnt in Hamburg.", guide: "Pronounce: My-neh moo-ter hy-st Cl-ow-dee-a oont voh-nt in Ham-boorg." },
        { id: "s16", title: "Booking A Hotel Room Phrase", context: "Practice reserving a hotel room over the phone.", text: "Ich möchte ein Einzelzimmer für zwei Nächte buchen.", guide: "Pronounce: Eech muerkh-teh eyen eyn-tsel-tsim-mer fuer tsvy nekh-teh boo-khen." },
        { id: "s17", title: "Apologizing Politely Phrase", context: "Practice a polite apology phrase used in daily conversation.", text: "Entschuldigung, das tut mir wirklich leid.", guide: "Pronounce: Ent-shool-dee-goong, das toot meer veerk-leekh lyt." },
        { id: "s18", title: "Talking About Daily Routine", context: "Practice describing part of your daily routine.", text: "Ich stehe jeden Tag um sieben Uhr auf.", guide: "Pronounce: Eech shtay-eh yay-den tahk oom zee-ben oor owf." },
        { id: "s19", title: "Confirming An Appointment Time", context: "Practice confirming a scheduled meeting time politely.", text: "Der Termin ist am Montag um zehn Uhr, richtig?", guide: "Pronounce: Dair ter-meen ist am mohn-tahk oom tsayn oor, reekh-teekh?" },

    // Algorithmic Large-Scale Number Generator Engine Method (0 to 100 Million converter rule matrix)
    function generateGermanNumberStringFormula(num) {
      if (num === 0) return "null";
      
      const units = ["", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun"];
      const teens = ["zehn", "elf", "zwölf", "dreizehn", "vierzehn", "fünfzehn", "sechzehn", "siebzehn", "achtzehn", "neunzehn"];
      const tens = ["", "zehn", "zwanzig", "dreißig", "vierzig", "fünfzig", "sechzig", "siebzig", "achtzig", "neunzig"];

      function convertSubHundreds(val) {
        if (val < 10) return units[val];
        if (val < 20) return teens[val - 10];
        const u = val % 10;
        const t = Math.floor(val / 10);
        if (u === 0) return tens[t];
        return (u === 1 ? "ein" : units[u]) + "und" + tens[t];
      }

      function convertSubThousands(val) {
        const h = Math.floor(val / 100);
        const rem = val % 100;
        let res = "";
        if (h > 0) res += (h === 1 ? "ein" : units[h]) + "hundert";
        if (rem > 0) res += convertSubHundreds(rem);
        return res;
      }

      let outputText = "";
      let remainingValue = num;

      if (remainingValue >= 1000000) {
        const mill = Math.floor(remainingValue / 1000000);
        remainingValue %= 1000000;
        if (mill === 1) outputText += "eine Million";
        else outputText += convertSubThousands(mill) + " Millionen";
      }

      if (remainingValue >= 1000) {
        const thous = Math.floor(remainingValue / 1000);
        remainingValue %= 1000;
        if (thous === 1) outputText += "eintausend";
        else outputText += convertSubThousands(thous) + "tausend";
      }

      if (remainingValue > 0) {
        outputText += convertSubThousands(remainingValue);
      }

      if (outputText.endsWith("eins") && num > 1) {
        outputText = outputText.slice(0, -4) + "eins";
      }
      return outputText;
    }

      let val = parseInt(inputNode.value, 10);
      if (isNaN(val) || val < 0) {

      if (val > 100000000) {
        outputNode.innerText = "Maximum threshold capped safely at 100,000,000 (100 Million).";
        return;
      }
      
      outputNode.innerText = generateGermanNumberStringFormula(val);
    }

    function initWordMatchGame() {

      const shuffled = pool.sort(() => 0.5 - Math.random()).slice(0, 4);
      
      const germans = shuffled.map((x, i) => ({ text: x.german, id: i, matched: false }));
      const english = shuffled.map((x, i) => ({ text: x.english, id: i, matched: false }));

    function handleMatchSelection(type, idx) {
      if (type === 'ger') {
        if (matchGamePairs.germans[idx].matched) return;
        matchSelectedGermanIdx = idx;
      } else {
        if (matchGamePairs.english[idx].matched) return;
        matchSelectedEnglishIdx = idx;
      }

      if (matchSelectedGermanIdx !== null && matchSelectedEnglishIdx !== null) {
        const gerItem = matchGamePairs.germans[matchSelectedGermanIdx];
        const engItem = matchGamePairs.english[matchSelectedEnglishIdx];
        
        if (gerItem.id === engItem.id) {
          gerItem.matched = true;

          matchSuccessCount++;
          rewardXP(5);

        matchSelectedGermanIdx = null;
        matchSelectedEnglishIdx = null;
      }
      renderActiveTabModule();

      synth.speak(utterance);

    // --- A1 E-Mail Writing Auto-Checker (heuristic grammar/content/style feedback) ---
    function checkEmailWriting() {
      const wData = a1SkillsDatabase.writing[activeSkillQuestionIndex % a1SkillsDatabase.writing.length];
      const text = writingUserText.trim();
      const lower = text.toLowerCase();
      const words = text.split(/\s+/).filter(Boolean);
      const wordCount = words.length;

      const salutations = ['liebe ', 'lieber ', 'hallo', 'sehr geehrte', 'sehr geehrter', 'guten morgen', 'guten tag'];
      const first60 = lower.slice(0, 60);
      const hasSalutation = salutations.some(s => first60.includes(s));

      const closings = ['viele grüße', 'liebe grüße', 'beste grüße', 'herzliche grüße', 'freundliche grüße', 'mit freundlichen grüßen', 'lg ', 'bis bald', 'dein ', 'deine '];
      const last80 = lower.slice(-80);
      const hasClosing = closings.some(s => last80.includes(s));

      const pointsCovered = wData.pointKeywords.map(variants => variants.some(v => lower.includes(v)));
      const coveredCount = pointsCovered.filter(Boolean).length;

      const hasEndPunctuation = /[.!?]\s*$/.test(text);
      const doubleSpace = / {2,}/.test(text);
      const missingSpaceAfterPunct = /[.,!?][A-Za-zÄÖÜäöü]/.test(text);

      const grammarRules = [
        { p: /\bich haben\b/i, tip: "Nach 'ich' heißt es 'ich habe', nicht 'ich haben'." },
        { p: /\bich (sind|seid)\b/i, tip: "Nach 'ich' heißt es 'ich bin'." },
        { p: /\bdu (habe|hat|habt|haben)\b/i, tip: "Nach 'du' heißt es 'du hast'." },
        { p: /\bdu (bin|ist|sind|seid)\b/i, tip: "Nach 'du' heißt es 'du bist'." },
        { p: /\ber (habe|hast|habt|haben)\b/i, tip: "Nach 'er/sie/es' heißt es 'er/sie/es hat'." },
        { p: /\bwir (bin|bist|ist|seid)\b/i, tip: "Nach 'wir' heißt es 'wir sind'." },
        { p: /\bwir (habe|hast|hat|habt)\b/i, tip: "Nach 'wir' heißt es 'wir haben'." },
        { p: /\bich kannst\b/i, tip: "Nach 'ich' heißt es 'ich kann', nicht 'ich kannst'." },
        { p: /\bich möchtest\b/i, tip: "Nach 'ich' heißt es 'ich möchte', nicht 'ich möchtest'." },
        { p: /\bich wollen\b/i, tip: "Nach 'ich' heißt es 'ich will', nicht 'ich wollen'." }
      ];
      const grammarIssues = grammarRules.filter(r => r.p.test(text)).map(r => r.tip);

      let score = 0;
      score += coveredCount * 20;
      if (hasSalutation) score += 15;
      if (hasClosing) score += 15;
      if (wordCount >= wData.minWords && wordCount <= wData.maxWords) score += 10;
      else if (wordCount >= Math.max(5, wData.minWords - 5)) score += 5;
      score -= grammarIssues.length * 5;
      if (doubleSpace) score -= 3;
      if (missingSpaceAfterPunct) score -= 3;
      if (!hasEndPunctuation) score -= 5;
      score = Math.max(0, Math.min(100, score));

      writingCheckResult = {
        wordCount, hasSalutation, hasClosing, pointsCovered, coveredCount,
        hasEndPunctuation, doubleSpace, missingSpaceAfterPunct, grammarIssues, score
      };

      if (!writingSubmitted) {
        writingSubmitted = true;
        let xp = 3;
        if (score >= 70) xp = 15;
        else if (score >= 40) xp = 8;
        rewardXP(xp);
        writingCheckResult.xpAwarded = xp;
      }

      renderActiveTabModule();
    }

    // --- Speaking Pronunciation Check via Browser Microphone (Web Speech API) ---
    function normalizeGermanForMatch(str) {
      return String(str).toLowerCase()
        .replace(/[.,!?;:"'„“]/g, '')
        .replace(/ß/g, 'ss')
        .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function computeSpeechMatchScore(target, spoken) {
      const t = normalizeGermanForMatch(target).split(' ').filter(Boolean);
      const s = normalizeGermanForMatch(spoken).split(' ').filter(Boolean);
      if (t.length === 0) return 0;
      const sCopy = s.slice();
      let matched = 0;
      t.forEach(word => {
        const idx = sCopy.indexOf(word);
        if (idx !== -1) { matched++; sCopy.splice(idx, 1); }
      });
      return matched / t.length;
    }

    function getSpeechRecognitionAPI() {
      return window.SpeechRecognition || window.webkitSpeechRecognition || null;
    }

    function isSpeechRecognitionSupported() {
      // iOS/iPadOS browsers (Safari, and every other browser on iOS, since
      // they all run on WebKit under Apple's rules) do not implement the
      // SpeechRecognition Web API at all, regardless of vendor prefix checks.
      const ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Macintosh') && typeof navigator !== 'undefined' && navigator.maxTouchPoints > 1);
      return !!getSpeechRecognitionAPI() && !isIOS;
    }

    function runSpeechRecognitionPass(sData) {
      const SpeechRecognitionAPI = getSpeechRecognitionAPI();
      const recognition = new SpeechRecognitionAPI();
      recognition.lang = 'de-DE';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      let settled = false;

      recognition.onresult = (event) => {
        settled = true;
        const transcript = event.results[0][0].transcript;
        speakingRecognizedText = transcript;
        const score = computeSpeechMatchScore(sData.text, transcript);
        if (score >= 0.75) speakingFeedback = 'correct';
        else if (score >= 0.4) speakingFeedback = 'partial';
        else speakingFeedback = 'incorrect';

        if (speakingFeedback === 'correct' && !speakingXPAwarded) {
          speakingXPAwarded = true;
          rewardXP(10);
        }
        speakingRecognitionActive = false;
        renderActiveTabModule();
      };

      recognition.onerror = (event) => {
        settled = true;
        speakingRecognitionActive = false;
        if (event.error === 'no-speech') {
          speakingErrorMessage = 'Es wurde keine Sprache erkannt. Bitte versuchen Sie es noch einmal und sprechen Sie direkt nach dem Antippen des Knopfes.';
        } else if (event.error === 'not-allowed' || event.error === 'audio-capture' || event.error === 'service-not-allowed') {
          speakingErrorMessage = 'Kein Zugriff auf das Mikrofon. Bitte erlauben Sie den Mikrofonzugriff in den Browser-Einstellungen für diese Seite und laden Sie die Seite neu.';
        } else if (event.error === 'network') {
          speakingErrorMessage = 'Netzwerkfehler bei der Spracherkennung. Bitte prüfen Sie Ihre Internetverbindung.';
        } else {
          speakingErrorMessage = 'Fehler bei der Spracherkennung (' + event.error + '). Bitte versuchen Sie es erneut.';
        }
        renderActiveTabModule();
      };

      recognition.onend = () => {
        if (!settled && speakingRecognitionActive) {
          // Recognition ended without ever firing onresult/onerror
          speakingRecognitionActive = false;
          speakingErrorMessage = 'Es wurde nichts aufgenommen. Bitte versuchen Sie es erneut und sprechen Sie deutlich in das Mikrofon.';
          renderActiveTabModule();
        }
      };

      try {
        recognition.start();
      } catch (e) {
        speakingRecognitionActive = false;
        speakingErrorMessage = 'Spracherkennung konnte nicht gestartet werden: ' + e.message;
        renderActiveTabModule();
      }
    }

    function startSpeakingRecognition() {
      speakingErrorMessage = null;

      if (!isSpeechRecognitionSupported()) {
        speakingErrorMessage = getSpeechRecognitionAPI()
          ? 'Ihr Gerät unterstützt leider keine Spracherkennung im Browser (iOS/iPadOS schränkt diese Funktion für alle Browser ein). Bitte probieren Sie diese Übung auf einem Android-Gerät oder einem Desktop-Computer mit Chrome oder Edge.'
          : 'Ihr Browser unterstützt keine Spracherkennung. Bitte verwenden Sie Chrome oder Edge auf einem Android-Gerät oder Desktop-Computer.';
        renderActiveTabModule();
        return;
      }

      const sData = a1SkillsDatabase.speaking[activeSkillQuestionIndex % a1SkillsDatabase.speaking.length];
      speakingRecognitionActive = true;
      speakingRecognizedText = null;
      speakingFeedback = null;
      renderActiveTabModule();

      // Explicitly request microphone permission first so we get a clear,
      // reliable prompt and error reason, then run the recognition pass.
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then((stream) => {
            stream.getTracks().forEach(t => t.stop());
            runSpeechRecognitionPass(sData);
          })
          .catch((err) => {
            speakingRecognitionActive = false;
            const name = err && err.name;
            if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
              speakingErrorMessage = 'Der Mikrofonzugriff ist für diese Seite blockiert. Tippen Sie auf das Schloss-/Info-Symbol links neben der Adresse, öffnen Sie "Berechtigungen" bzw. "Website-Einstellungen" und stellen Sie Mikrofon auf "Zulassen". Prüfen Sie zusätzlich unter Android-Einstellungen → Apps → Chrome → Berechtigungen, ob Mikrofon dort erlaubt ist. Laden Sie die Seite danach neu.';
            } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
              speakingErrorMessage = 'Es wurde kein Mikrofon gefunden.';
            } else if (name === 'NotReadableError' || name === 'TrackStartError') {
              speakingErrorMessage = 'Das Mikrofon wird gerade von einer anderen App verwendet. Bitte schließen Sie andere Apps, die das Mikrofon nutzen, und versuchen Sie es erneut.';
            } else {
              speakingErrorMessage = 'Kein Zugriff auf das Mikrofon (' + (name || 'unbekannter Fehler') + '). Bitte prüfen Sie die Mikrofon-Berechtigung für diese Seite und laden Sie die Seite neu.';
            }
            renderActiveTabModule();
          });
      } else {
        runSpeechRecognitionPass(sData);
      }
    }

    // --- Fallback: Record & Self-Check (for Safari on iPhone/iPad/Mac and
    // any other browser without SpeechRecognition support). Uses
    // MediaRecorder, which Safari DOES support, unlike SpeechRecognition. ---
    function hasMediaRecorderSupport() {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    }

    function startFallbackRecording() {
      speakingErrorMessage = null;
      if (!hasMediaRecorderSupport()) {
        speakingErrorMessage = 'Aufnahme wird auf diesem Gerät nicht unterstützt.';
        renderActiveTabModule();
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then((stream) => {
          fallbackMediaStreamObj = stream;
          fallbackAudioChunks = [];
          const recorder = new MediaRecorder(stream);
          fallbackMediaRecorderObj = recorder;

          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) fallbackAudioChunks.push(e.data);
          };
          recorder.onstop = () => {
            const blob = new Blob(fallbackAudioChunks, { type: fallbackAudioChunks[0] && fallbackAudioChunks[0].type ? fallbackAudioChunks[0].type : 'audio/webm' });
            if (fallbackAudioUrl) { try { URL.revokeObjectURL(fallbackAudioUrl); } catch (e) {} }
            fallbackAudioUrl = URL.createObjectURL(blob);
            fallbackRecordingActive = false;
            if (fallbackMediaStreamObj) {
              fallbackMediaStreamObj.getTracks().forEach(t => t.stop());
              fallbackMediaStreamObj = null;
            }
            renderActiveTabModule();
          };

          recorder.start();
          fallbackRecordingActive = true;
          fallbackAudioUrl = null;
          fallbackSelfAssessed = false;
          renderActiveTabModule();
        })
        .catch((err) => {
          const name = err && err.name;
          if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
            speakingErrorMessage = 'Der Mikrofonzugriff ist blockiert. Bitte erlauben Sie den Mikrofonzugriff für diese Seite in den Browser-Einstellungen und laden Sie die Seite neu.';
          } else {
            speakingErrorMessage = 'Kein Zugriff auf das Mikrofon (' + (name || 'unbekannter Fehler') + ').';
          }
          renderActiveTabModule();
        });
    }

    function stopFallbackRecording() {
      if (fallbackMediaRecorderObj && fallbackMediaRecorderObj.state !== 'inactive') {
        fallbackMediaRecorderObj.stop();
      }
    }

    function markFallbackSelfAssessed() {
      fallbackSelfAssessed = true;
      if (!fallbackXPAwarded) {
        fallbackXPAwarded = true;
        rewardXP(5);
      }

                      ${res.doubleSpace ? `<p class="text-amber-400">• Bitte nur ein Leerzeichen zwischen Wörtern verwenden.</p>` : ''}
                      ${res.missingSpaceAfterPunct ? `<p class="text-amber-400">• Nach einem Satzzeichen (. , ! ?) folgt ein Leerzeichen.</p>` : ''}
                      ${res.grammarIssues.map(t => `<p class="text-amber-400">• ${t}</p>`).join('')}
                    </div>
                  ` : `<p class="text-emerald-400 pt-1 border-t border-slate-800">✓ Keine offensichtlichen Grammatik- oder Zeichensetzungsfehler gefunden.</p>`}
                  <p class="text-indigo-400 font-black pt-1">${res.xpAwarded !== undefined ? '+' + res.xpAwarded + ' XP' : ''}</p>
                </div>
                <button onclick="toggleSkillWritingSample()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold text-[11px] rounded-lg">${skillWritingShowSample ? 'Musterantwort ausblenden' : 'Musterantwort anzeigen'}</button>
                ${skillWritingShowSample ? `<div class="p-3 bg-indigo-950/40 border border-indigo-900 rounded-lg text-xs text-indigo-200 leading-relaxed">${wData.sample}</div>` : ''}
                <button onclick="advanceSkillQuestion();" class="w-full py-2.5 bg-gradient-to-r from-indigo-500 to-fuchsia-500 text-white font-bold text-xs rounded-xl">Nächste E-Mail →</button>
              ` : ''}
            </div>`;
        } else if (activeSkillSection === 'speaking') {
          const sData = a1SkillsDatabase.speaking[activeSkillQuestionIndex % a1SkillsDatabase.speaking.length];
          const speechSupported = isSpeechRecognitionSupported();
          const recorderSupported = hasMediaRecorderSupport();
          skillsHTML += `
            <div class="space-y-3 text-center py-2">
              <p class="text-xs font-bold text-slate-300">Sprechen Sie diesen Satz laut auf Deutsch:</p>
              <p class="text-xl font-black text-indigo-300">"${sData.text}"</p>
              <div class="p-2.5 bg-slate-950 text-left border border-slate-800 rounded-lg">
                <span class="text-[9px] uppercase font-black block text-slate-400 tracking-wider">Aussprache-Hilfe</span>
                <p class="text-xs text-amber-400 font-mono font-bold mt-0.5">${sData.guide}</p>
              </div>
              ${speechSupported ? `
                <button onclick="startSpeakingRecognition()" ${speakingRecognitionActive ? 'disabled' : ''} class="w-full mt-2 p-3 ${speakingRecognitionActive ? 'bg-slate-700 cursor-wait animate-pulse' : 'bg-indigo-600 hover:bg-indigo-500'} font-black text-xs text-white rounded-xl shadow-md active:scale-95 transition-all">${speakingRecognitionActive ? '🎙️ Höre zu... bitte sprechen' : '🎤 Sprechen & Prüfen'}</button>
                ${speakingErrorMessage ? `
                  <div class="p-2.5 bg-amber-950/40 border border-amber-900 text-amber-300 text-[11px] font-bold rounded-lg text-left">⚠️ ${speakingErrorMessage}</div>
                ` : ''}
                ${speakingRecognizedText !== null ? `
                  <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1.5 text-left">
                    <p class="text-[10px] text-slate-500 uppercase font-black">Erkannt:</p>
                    <p class="text-xs text-slate-300 italic">"${speakingRecognizedText}"</p>
                    <p class="text-xs font-black ${speakingFeedback === 'correct' ? 'text-emerald-400' : (speakingFeedback === 'partial' ? 'text-amber-400' : 'text-rose-400')}">
                      ${speakingFeedback === 'correct' ? '✓ Sehr gut! (+10 XP)' : (speakingFeedback === 'partial' ? '~ Fast richtig, versuchen Sie es noch einmal.' : '✗ Das war nicht richtig. Versuchen Sie es erneut.')}
                    </p>
                  </div>
                ` : ''}
                ${speakingFeedback === 'correct' ? `<button onclick="advanceSkillQuestion();" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl">Nächster Satz →</button>` : (speakingRecognizedText !== null ? `<button onclick="advanceSkillQuestion();" class="w-full py-2 bg-slate-800 border border-slate-700 text-slate-400 font-bold text-[11px] rounded-xl">Überspringen →</button>` : '')}
                <p class="text-[9px] text-slate-600">Automatische Prüfung per Mikrofon (Chrome/Edge auf Android und Desktop).</p>
              ` : (recorderSupported ? `
                <div class="p-2.5 bg-indigo-950/40 border border-indigo-900 text-indigo-300 text-[10px] font-bold rounded-lg text-left leading-relaxed">
                  ℹ️ Automatische Spracherkennung ist auf diesem Gerät/Browser nicht verfügbar (z. B. Safari). Nehmen Sie sich stattdessen auf und vergleichen Sie sich selbst mit der Aussprache-Hilfe.
                </div>
                <button onclick="${fallbackRecordingActive ? 'stopFallbackRecording()' : 'startFallbackRecording()'}" class="w-full mt-1 p-3 ${fallbackRecordingActive ? 'bg-rose-600 hover:bg-rose-500 animate-pulse' : 'bg-indigo-600 hover:bg-indigo-500'} font-black text-xs text-white rounded-xl shadow-md active:scale-95 transition-all">${fallbackRecordingActive ? '⏹️ Aufnahme stoppen' : '🔴 Aufnahme starten'}</button>
                ${speakingErrorMessage ? `
                  <div class="p-2.5 bg-amber-950/40 border border-amber-900 text-amber-300 text-[11px] font-bold rounded-lg text-left">⚠️ ${speakingErrorMessage}</div>
                ` : ''}
                ${fallbackAudioUrl ? `
                  <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2 text-left">
                    <p class="text-[10px] text-slate-500 uppercase font-black">Ihre Aufnahme:</p>
                    <audio controls src="${fallbackAudioUrl}" class="w-full"></audio>
                    ${!fallbackSelfAssessed ? `
                      <button onclick="markFallbackSelfAssessed()" class="w-full py-2 bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-[11px] rounded-lg">✓ Ich habe es geübt (+5 XP)</button>
                    ` : `<p class="text-emerald-400 text-xs font-black">✓ Geübt! (+5 XP)</p>`}
                  </div>
                ` : ''}
                ${fallbackSelfAssessed ? `<button onclick="advanceSkillQuestion();" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl">Nächster Satz →</button>` : `<button onclick="advanceSkillQuestion();" class="w-full py-2 bg-slate-800 border border-slate-700 text-slate-400 font-bold text-[11px] rounded-xl">Überspringen →</button>`}
                <p class="text-[9px] text-slate-600">Diese Übung wird selbst eingeschätzt, nicht automatisch geprüft.</p>
              ` : `
                <div class="w-full mt-2 p-3 bg-rose-950/40 border border-rose-900 text-rose-300 font-bold text-[11px] rounded-xl leading-relaxed">
                  🚫 Weder Spracherkennung noch Audioaufnahme werden auf diesem Gerät unterstützt.
                </div>
                <button onclick="advanceSkillQuestion();" class="w-full py-2 bg-slate-800 border border-slate-700 text-slate-400 font-bold text-[11px] rounded-xl">Überspringen →</button>
              `)}
            </div>`;
        }

        skillsHTML += `</div></div>`;
        container.innerHTML = skillsHTML;
      }

      else if (activeTab === 'exams') {
        renderExamsTab(container, conf);
      }
    }

    // ===================== Goethe/Telc A1 Mock Exam Engine =====================
    function renderExamsTab(container, conf) {
      if (!activeExamRunningMode) {
        let rows = '';
        mockExamsDatabase.forEach((ex, idx) => {
          rows += `
            <div class="${conf.cardBg} border p-4 rounded-xl flex flex-col justify-between space-y-3">
              <div>
                <h4 class="text-xs font-black text-white">${ex.title}</h4>
                <p class="text-[10px] text-slate-400 mt-0.5">Hören • Lesen • Schreiben • Sprechen — ${ex.hoeren.length + ex.lesen.length} Testfragen</p>
              </div>
              <button onclick="startSpecificMockExamSuite(${idx})" class="w-full py-2 bg-slate-950 hover:bg-slate-900 border border-indigo-900 text-indigo-400 font-extrabold text-[11px] rounded-lg transition-transform active:scale-95">Prüfung starten</button>
            </div>
          `;
        });
        container.innerHTML = `
          <div class="space-y-4">
            <div class="px-1">
              <h3 class="text-sm font-black tracking-tight text-white">Goethe / Telc A1 Modellprüfungen</h3>
              <p class="text-[11px] text-slate-400 font-medium">5 vollständige Prüfungen mit allen vier Teilen: Hören, Lesen, Schreiben, Sprechen.</p>
            </div>
            <div class="space-y-3">${rows}</div>
          </div>
        `;
        return;
      }

      const exam = mockExamsDatabase[selectedActiveExamIndex];
      const sectionLabels = ['Hören', 'Lesen', 'Schreiben', 'Sprechen'];

      const progressHTML = `
        <div class="flex justify-between items-center px-1 mb-3">
          <span class="text-[10px] font-black uppercase text-slate-400 tracking-wider">${exam.title}</span>
          <button onclick="exitMockExam()" class="text-[10px] bg-slate-800 px-2 py-1 rounded font-bold border border-slate-700">✕ Verlassen</button>
        </div>
        <div class="flex gap-1 mb-4 px-1">
          ${sectionLabels.map((lbl, i) => `<div class="flex-1 text-center text-[9px] font-black py-1.5 rounded-lg border ${i === activeExamSectionIndex ? 'bg-indigo-600 border-indigo-500 text-white' : (i < activeExamSectionIndex ? 'bg-emerald-950 border-emerald-800 text-emerald-400' : 'bg-slate-900 border-slate-800 text-slate-600')}">${lbl}</div>`).join('')}
        </div>
      `;

      // --- Hören / Lesen (auto-graded multiple choice flow) ---
      if (activeExamSectionIndex === 0 || activeExamSectionIndex === 1) {
        const skillKey = activeExamSectionIndex === 0 ? 'hoeren' : 'lesen';
        const list = exam[skillKey];

        if (currentExamQuestionIndex >= list.length) {
          const correct = list.filter((q, i) => activeExamUserAnswersCollected[skillKey][i] === q.c).length;
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <div class="text-center p-6 ${conf.cardBg} border rounded-2xl shadow-xl space-y-3">
                <span class="text-4xl block">✅</span>
                <h3 class="text-base font-black text-white">${skillKey === 'hoeren' ? 'Hören' : 'Lesen'} abgeschlossen</h3>
                <p class="text-xs text-slate-400 font-semibold">Ergebnis: <span class="text-emerald-400 font-black">${correct} / ${list.length}</span> richtig</p>
                <button onclick="advanceExamSection()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu ${skillKey === 'hoeren' ? 'Lesen' : 'Schreiben'} →</button>
              </div>
            </div>
          `;
          return;
        }

        const q = list[currentExamQuestionIndex];
        container.innerHTML = `
          <div class="space-y-4">${progressHTML}
            <div class="flex justify-between items-center px-1">
              <span class="text-[10px] font-black text-slate-400">Teil ${q.teil} • Frage ${currentExamQuestionIndex + 1} von ${list.length}</span>
            </div>
            ${skillKey === 'hoeren' ? `
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-3">
                <button onclick='triggerSpeechSynthesis(${JSON.stringify(q.audioText)})' class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs rounded-xl flex items-center justify-center gap-2">🔊 Audio abspielen</button>
                <p class="text-xs font-bold leading-relaxed text-slate-200">${q.question}</p>
              </div>
            ` : `
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-2">
                <p class="text-[9px] uppercase font-black text-slate-500 tracking-wider">Lesetext</p>
                <p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed">${q.readingText}</p>
                <p class="text-xs font-bold text-slate-100 mt-2">${q.question}</p>
              </div>
            `}
            <div class="space-y-2">
              ${q.options.map((opt, oIdx) => {
                let optStyle = "bg-slate-800 border-slate-700 text-slate-300";
                if (processingExamEvaluationFeedbackMode) {
                  if (oIdx === q.c) optStyle = "bg-emerald-950 border-emerald-500 text-emerald-200 font-black";
                  else if (oIdx === activeExamUserAnswersCollected[skillKey][currentExamQuestionIndex]) optStyle = "bg-rose-950 border-rose-500 text-rose-200";
                  else optStyle = "bg-slate-900 border-slate-800 opacity-40 text-slate-600";
                }
                return `<button onclick="submitActiveExamOptionAnswer(${oIdx})" ${processingExamEvaluationFeedbackMode ? 'disabled' : ''} class="w-full text-left p-3.5 border rounded-xl text-xs font-bold transition-all ${optStyle}">${opt}</button>`;
              }).join('')}
            </div>
            ${processingExamEvaluationFeedbackMode ? `
              <button onclick="advanceActiveExamQuestionStep()" class="w-full mt-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl">Nächste Frage →</button>
            ` : ''}
          </div>
        `;
        return;
      }

      // --- Schreiben (writing practice with self-check model answers) ---
      if (activeExamSectionIndex === 2) {
        const sw = exam.schreiben;
        if (schreibenTaskIndex === 0) {
          const f = sw.form;
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-3">
                <h4 class="text-xs font-black text-white">${f.title}</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${f.scenario}</p>
                <div class="space-y-2 pt-2">
                  ${f.fields.map(field => `
                    <div>
                      <label class="text-[10px] font-bold text-slate-400">${field}</label>
                      <input type="text" class="w-full mt-1 p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200" placeholder="${field}...">
                    </div>
                  `).join('')}
                </div>
              </div>
              <button onclick="advanceSchreibenTask()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu Teil 2 →</button>
            </div>
          `;
        } else {
          const m = sw.message;
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-3">
                <h4 class="text-xs font-black text-white">${m.title}</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${m.instructions}</p>
                <ul class="text-xs text-slate-400 list-disc list-inside space-y-1">
                  ${m.points.map(p => `<li>${p}</li>`).join('')}
                </ul>
                <textarea rows="4" class="w-full mt-2 p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200" placeholder="Schreiben Sie hier Ihre Nachricht..."></textarea>
                <button onclick="toggleSchreibenSample(1)" class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold text-[11px] rounded-lg">${schreibenShowSample[1] ? 'Musterantwort ausblenden' : 'Musterantwort anzeigen'}</button>
                ${schreibenShowSample[1] ? `<div class="p-3 bg-indigo-950/40 border border-indigo-900 rounded-lg text-xs text-indigo-200 leading-relaxed">${m.sample}</div>` : ''}
              </div>
              <button onclick="advanceExamSection()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu Sprechen →</button>
            </div>
          `;
        }
        return;
      }

      // --- Sprechen (speaking practice with TTS model answers + self-check) ---
      if (activeExamSectionIndex === 3) {
        const sp = exam.sprechen;
        if (sprechenPartIndex === 0) {
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <div class="${conf.cardBg} border p-5 rounded-2xl shadow-xl space-y-3">
                <h4 class="text-xs font-black text-white">${sp.intro.title}</h4>
                <p class="text-[10px] text-slate-400">Sprechen Sie frei über sich selbst. Nutzen Sie diese Stichwörter:</p>
                <div class="flex flex-wrap gap-1.5">
                  ${sp.intro.keywords.map(k => `<span class="text-[10px] font-bold bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-1 rounded-lg">${k}</span>`).join('')}
                </div>
                <button onclick='triggerSpeechSynthesis(${JSON.stringify(sp.intro.sample)})' class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-[11px] rounded-lg">🔊 Beispielantwort anhören</button>
                <p class="text-xs text-slate-300 italic leading-relaxed">"${sp.intro.sample}"</p>
                <label class="flex items-center gap-2 text-[11px] text-slate-300 font-bold pt-1">
                  <input type="checkbox" ${sprechenChecklist.intro ? 'checked' : ''} onchange="toggleSprechenChecklistItem('intro')"> Ich habe das geübt
                </label>
              </div>
              <button onclick="advanceSprechenPart()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu Teil 2 →</button>
            </div>
          `;
        } else if (sprechenPartIndex === 1) {
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <h4 class="text-xs font-black text-white px-1">Teil 2: Fragen und Antworten</h4>
              <div class="space-y-3">
                ${sp.qa.map((item, idx) => `
                  <div class="${conf.cardBg} border p-4 rounded-xl space-y-2">
                    <span class="text-[9px] uppercase font-black text-indigo-400 tracking-wider">${item.keyword}</span>
                    <p class="text-xs font-bold text-slate-200">${item.sampleQ}</p>
                    <button onclick='triggerSpeechSynthesis(${JSON.stringify(item.sampleA)})' class="text-[10px] font-bold text-indigo-400">🔊 Beispielantwort anhören</button>
                    <p class="text-xs text-slate-400 italic">"${item.sampleA}"</p>
                    <label class="flex items-center gap-2 text-[10px] text-slate-300 font-bold pt-1">
                      <input type="checkbox" ${sprechenChecklist.qa[idx] ? 'checked' : ''} onchange="toggleSprechenChecklistItem('qa', ${idx})"> Geübt
                    </label>
                  </div>
                `).join('')}
              </div>
              <button onclick="advanceSprechenPart()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Weiter zu Teil 3 →</button>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="space-y-4">${progressHTML}
              <h4 class="text-xs font-black text-white px-1">Teil 3: Bitten formulieren</h4>
              <div class="space-y-3">
                ${sp.requests.map((item, idx) => `
                  <div class="${conf.cardBg} border p-4 rounded-xl space-y-2">
                    <p class="text-xs font-bold text-slate-200">${item.prompt}</p>
                    <button onclick='triggerSpeechSynthesis(${JSON.stringify(item.sample)})' class="text-[10px] font-bold text-indigo-400">🔊 Beispiel anhören</button>
                    <p class="text-xs text-slate-400 italic">"${item.sample}"</p>
                    <label class="flex items-center gap-2 text-[10px] text-slate-300 font-bold pt-1">
                      <input type="checkbox" ${sprechenChecklist.requests[idx] ? 'checked' : ''} onchange="toggleSprechenChecklistItem('requests', ${idx})"> Geübt
                    </label>
                  </div>
                `).join('')}
              </div>
              <button onclick="finishMockExam()" class="w-full p-3 bg-gradient-to-r from-emerald-500 to-indigo-500 font-black text-xs text-white rounded-xl">Prüfung abschließen ✓</button>
            </div>
          `;
        }
        return;
      }

      // --- Results screen ---
      if (activeExamSectionIndex === 4) {
        const correctHoeren = exam.hoeren.filter((q, i) => activeExamUserAnswersCollected.hoeren[i] === q.c).length;
        const correctLesen = exam.lesen.filter((q, i) => activeExamUserAnswersCollected.lesen[i] === q.c).length;
        const totalRight = correctHoeren + correctLesen;
        const totalQ = exam.hoeren.length + exam.lesen.length;
        const pct = Math.round((totalRight / totalQ) * 100);
        const passed = pct >= 60;
        const sprechenDone = sprechenChecklist.intro && sprechenChecklist.qa.every(x => x) && sprechenChecklist.requests.every(x => x);

        container.innerHTML = `
          <div class="text-center p-6 ${conf.cardBg} border rounded-2xl shadow-2xl space-y-4">
            <span class="text-5xl block">${passed ? '🏆' : '⏳'}</span>
            <h3 class="text-lg font-black text-white">${passed ? 'Prüfung bestanden!' : 'Bitte weiter üben'}</h3>
            <p class="text-xs text-slate-400 font-semibold">${exam.title}</p>
            <div class="text-left bg-slate-950 p-4 rounded-lg border border-slate-800 text-[11px] space-y-2 text-slate-300">
              <div class="flex justify-between"><span>Hören</span><span class="font-black text-white">${correctHoeren} / ${exam.hoeren.length}</span></div>
              <div class="flex justify-between"><span>Lesen</span><span class="font-black text-white">${correctLesen} / ${exam.lesen.length}</span></div>
              <div class="flex justify-between border-t border-slate-800 pt-2"><span>Gesamt (Hören + Lesen)</span><span class="font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}">${pct}%</span></div>
              <div class="flex justify-between"><span>Schreiben</span><span class="font-black text-indigo-400">Übung abgeschlossen</span></div>
              <div class="flex justify-between"><span>Sprechen</span><span class="font-black ${sprechenDone ? 'text-emerald-400' : 'text-amber-400'}">${sprechenDone ? 'Alle Teile geübt' : 'Teilweise geübt'}</span></div>
            </div>
            <p class="text-[10px] text-slate-500 leading-relaxed">Hinweis: Schreiben und Sprechen werden in der echten Prüfung von einem Prüfer bewertet. Vergleichen Sie Ihre Antworten mit den Musterlösungen, um sich selbst einzuschätzen.</p>
            <p class="text-xs text-slate-400">${passed ? '+50 XP Meilenstein erreicht!' : 'Bestehensgrenze: 60% in Hören + Lesen.'}</p>
            <button onclick="exitMockExam()" class="w-full p-3 bg-gradient-to-r from-indigo-500 to-fuchsia-500 font-black text-xs text-white rounded-xl">Zurück zur Prüfungsauswahl</button>
          </div>
        `;
        return;
      }
    }

    // Exam State Handler Methods
    function startSpecificMockExamSuite(idx) {
      selectedActiveExamIndex = idx;
      activeExamRunningMode = true;
      activeExamSectionIndex = 0;
      currentExamQuestionIndex = 0;
      activeExamUserAnswersCollected = { hoeren: [], lesen: [] };
      processingExamEvaluationFeedbackMode = false;
      schreibenTaskIndex = 0;
      schreibenShowSample = [false, false];
      sprechenPartIndex = 0;
      sprechenSubIndex = 0;
      sprechenChecklist = { intro: false, qa: [false, false, false], requests: [false, false, false] };
      renderActiveTabModule();
    }

    function exitMockExam() {
      activeExamRunningMode = false;
      renderActiveTabModule();
    }

    function submitActiveExamOptionAnswer(ansIdx) {
      if (processingExamEvaluationFeedbackMode) return;
      const skillKey = activeExamSectionIndex === 0 ? 'hoeren' : 'lesen';
      activeExamUserAnswersCollected[skillKey][currentExamQuestionIndex] = ansIdx;
      processingExamEvaluationFeedbackMode = true;
      renderActiveTabModule();
    }

    function advanceActiveExamQuestionStep() {
      processingExamEvaluationFeedbackMode = false;
      currentExamQuestionIndex++;
      renderActiveTabModule();
    }

    function advanceExamSection() {
      activeExamSectionIndex++;
      currentExamQuestionIndex = 0;
      processingExamEvaluationFeedbackMode = false;
      renderActiveTabModule();
    }

    function toggleSchreibenSample(idx) {
      schreibenShowSample[idx] = !schreibenShowSample[idx];
      renderActiveTabModule();
    }

    function advanceSchreibenTask() {
      schreibenTaskIndex++;
      renderActiveTabModule();
    }

    function toggleSprechenChecklistItem(part, idx) {
      if (part === 'intro') sprechenChecklist.intro = !sprechenChecklist.intro;
      else if (part === 'qa') sprechenChecklist.qa[idx] = !sprechenChecklist.qa[idx];
      else if (part === 'requests') sprechenChecklist.requests[idx] = !sprechenChecklist.requests[idx];
      renderActiveTabModule();
    }

    function advanceSprechenPart() {
      sprechenPartIndex++;
      renderActiveTabModule();
    }

    function finishMockExam() {
      const exam = mockExamsDatabase[selectedActiveExamIndex];
      const correctHoeren = exam.hoeren.filter((q, i) => activeExamUserAnswersCollected.hoeren[i] === q.c).length;
      const correctLesen = exam.lesen.filter((q, i) => activeExamUserAnswersCollected.lesen[i] === q.c).length;
      const totalRight = correctHoeren + correctLesen;
      const totalQ = exam.hoeren.length + exam.lesen.length;
      const pct = Math.round((totalRight / totalQ) * 100);
      if (pct >= 60) setTimeout(() => { rewardXP(50); }, 100);
      activeExamSectionIndex = 4;
      renderActiveTabModule();
    }

    // Preload speech synthesis voices so German audio is ready on first play
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
